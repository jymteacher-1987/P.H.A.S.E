    const {correct,cheatCount,attempted,points}=session.score();
    const title=cheatCount?'점검을 마쳤어요!':correct===20?'한붓 탐정, 완벽한 발견!':correct>=15?'규칙에 아주 가까워요!':'예측 끝, 이제 발견할 시간!';
    app.innerHTML=`<section class="result-hero"><div><span class="eyebrow">20개의 실험 완료</span><h1 tabindex="-1" id="result-focus">${title}</h1><p>${cheatCount?`직접 푼 ${attempted}문제 중 ${correct}문제 정답 · 치트로 ${cheatCount}문제 해결`:`20문제 중 ${correct}문제를 맞혔어요.`}<br> 이제, 모양 속에 숨어 있던 규칙을 만나 볼까요?</p></div><div class="score"><strong>${cheatCount?correct:points}</strong><span>${cheatCount?`/ 직접 푼 ${attempted}문제`:'/ 100점'}</span></div></section>${cheatCount?'<div class="cheat-banner"><strong>점검 모드 기록</strong> · clear로 해결한 문제는 점수에 포함하지 않았어요. 아래에서 모든 문제의 정답과 해설을 확인할 수 있어요.</div>':''}<div class="section-title"><h2>한붓그리기의 비밀</h2><span>모양보다, 점에 연결된 선을 세어 보세요.</span></div><section class="principle"><p class="lead">먼저, 선들이 <strong>한 덩어리로 연결</strong>되어 있어야 해요.<br> 그다음 연결된 선이 홀수 개인 점, <strong>‘홀수점’을</strong> 세어 보세요.</p><div class="rule-cards"><article class="rule-card"><strong>0개</strong><b>O · 가능해요</b><p>어느 점에서 시작해도<br> 그 점으로 돌아올 수 있어요.</p></article><article class="rule-card"><strong>2개</strong><b>O · 가능해요</b><p>한 홀수점에서 출발해서<br> 다른 홀수점에서 끝나요.</p></article><article class="rule-card impossible"><strong>4개 이상</strong><b>X · 불가능해요</b><p>출발점과 도착점만으로는<br> 남는 홀수점을 해결할 수 없어요.</p></article></div><p class="why"><strong>왜 그런 걸까요?</strong> 중간에 지나는 점에서는 들어오는 선과 나가는 선이 한 쌍을 이뤄요. 그래서 선의 개수가 짝수여야 하죠. 짝이 없어도 되는 곳은 출발점과 도착점, 최대 두 곳뿐이에요. 출발점과 도착점이 같으면 모든 점이 짝수예요. 이것이 <strong>오일러 경로의 원리</strong>예요.</p><p class="mini-note">선이 서로 떨어져 있으면 홀수점이 0개여도 불가능해요. 이 실험에서는 모든 선을 방향 제한 없이 지나갈 수 있어요. 한 번 막혔다고 불가능한 것은 아니에요. 시작점이나 선을 지나는 순서를 바꾸면 성공할 수도 있어요.</p></section><div class="drawing-summary">직접 경로를 완성한 도형 <strong>${drawingRecords.filter(r=>r.completed).length} / ${questions.filter(q=>analyze(q).possible).length}</strong><span>치트키로 넘긴 것과 별도로 기록해요.</span></div><div class="section-title"><h2>내 예측 돌아보기</h2><span>문제를 누르면 정답과 연결된 선의 개수를 볼 수 있어요.</span></div><div class="results-grid" aria-label="문제별 채점 결과">${session.answers.map((a,i)=>`<button class="result-tile ${a.cheated?'cheated':a.correct?'correct':'wrong'}" data-review="${i}" aria-label="${i+1}번 ${a.cheated?'치트 사용':a.correct?'정답':'오답'}, 해설 보기"><small>${pad(i+1)} · ${questions[i].name}</small>${graphSvg(questions[i])}<b>${a.answer?'O':'X'}</b><span>${a.cheated?'CLEAR':a.correct?'정답':'오답'}</span></button>`).join('')}</div><div id="review"></div><div class="end-actions"><button class="primary-button" id="restart">규칙을 알았으니, 다시 도전 →</button></div>`;
    app.querySelectorAll('[data-review]').forEach(button=>button.addEventListener('click',()=>renderReview(Number(button.dataset.review))));
    document.getElementById('restart').addEventListener('click',()=>{session=createSession();reviewIndex=0;drawingRecords=questions.map(()=>({route:[],completed:false}));renderQuiz();window.scrollTo({top:0,behavior:'instant'});document.getElementById('question-focus').focus({preventScroll:true})});
    renderReview(reviewIndex);
  }
  function renderReview(i){
    reviewIndex=i;const graph=questions[i],info=analyze(graph),answer=session.answers[i];
    const reason=info.components!==1?`선들이 ${info.components}덩어리로 떨어져 있어요. 홀수점이 ${info.odd.length}개여도, 다른 덩어리로 가려면 펜을 떼어야 하므로 불가능해요.`:info.odd.length===0?'홀수점이 없어요. 모든 점에서 들어오는 선과 나가는 선이 짝을 이뤄서 출발점으로 돌아올 수 있어요.':info.odd.length===2?'홀수점이 딱 2개예요. 노란 점 하나에서 출발해 다른 노란 점에서 끝내면 모든 선을 한 번씩 지날 수 있어요.':`홀수점이 ${info.odd.length}개예요. 출발점과 도착점 두 곳을 빼도 홀수점이 남아서 모든 선을 한 번씩 지날 수 없어요.`;
    document.getElementById('review').innerHTML=`<div class="review-layout">${board(graph,i,true)}<section class="review-explanation"><span class="eyebrow">${pad(i+1)}번 해설</span><div class="verdict">${info.possible?'O · 가능해요':'X · 불가능해요'}</div><p class="answer-meta">${answer.cheated?'치트키로 해결한 문제예요.':`내 예측: ${answer.answer?'O':'X'} · ${answer.correct?'맞혔어요!':'이유를 살펴봐요.'}`}</p><p>${reason}</p><div class="stat-row"><span>홀수점</span><strong>${info.odd.length}개</strong></div><div class="stat-row"><span>연결된 덩어리</span><strong>${info.components}개</strong></div>${info.possible?'<button class="path-button" id="play-path">한붓 경로 재생하기 ▷</button>':'<div class="mini-note">노란 점의 수와 연결 상태를 다시 확인해 보세요.</div>'}<div class="review-navigation"><button id="review-prev" ${i===0?'disabled':''}>← 이전</button><button id="review-next" ${i===19?'disabled':''}>다음 →</button></div></section></div>`;
    app.querySelectorAll('[data-review]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.review)===i);b.setAttribute('aria-pressed',String(Number(b.dataset.review)===i))});
    document.getElementById('review-prev').addEventListener('click',()=>{renderReview(i-1);document.getElementById('review-prev').focus({preventScroll:true})});
    document.getElementById('review-next').addEventListener('click',()=>{renderReview(i+1);document.getElementById('review-next').focus({preventScroll:true})});
    document.getElementById('play-path')?.addEventListener('click',playPath);
  }
  function playPath(){
    const graph=questions[reviewIndex],route=trail(graph),layer=document.querySelector('#review .trail-layer');
    const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    layer.innerHTML=route.slice(1).map((v,i)=>{const a=graph.points[route[i]],b=graph.points[v];return `<line class="trail-line" pathLength="1" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="animation-delay:${reduced?0:i*.45}s"/>`}).join('');
    const [x,y]=graph.points[route[0]];layer.insertAdjacentHTML('beforeend',`<text class="degree" x="${x-30}" y="${y+28}">출발</text>`);
  }
  function showToast(message){const node=document.getElementById('toast');clearTimeout(toastTimer);node.textContent=message;node.classList.add('show');toastTimer=setTimeout(()=>node.classList.remove('show'),2600)}
  function openCommand(){previousFocus=document.activeElement;document.getElementById('cheat-error').textContent='Enter 실행 · Esc 닫기';command.value='';dialog.showModal();command.focus()}
  document.getElementById('close-cheat').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>{if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true})});
  document.getElementById('cheat-form').addEventListener('submit',event=>{event.preventDefault();if(command.value.trim().toLowerCase()!=='clear'){document.getElementById('cheat-error').textContent='알 수 없는 명령어예요.';return}if(session.complete){document.getElementById('cheat-error').textContent='모든 실험이 이미 끝났어요.';return}const i=session.index;dialog.close();submit(true);showToast(`실험 ${pad(i+1)} CLEAR! ${session.complete?'모든 실험 완료.':'다음 실험으로 이동했어요.'}`)});
  document.addEventListener('keydown',event=>{if(event.isComposing||event.repeat||event.ctrlKey||event.metaKey||event.altKey)return;if(dialog.open)return;const tag=document.activeElement?.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||document.activeElement?.isContentEditable)return;if(event.key==='Enter'&&!session.complete){event.preventDefault();openCommand();return}if(!session.complete&&(event.key.toLowerCase()==='o'||event.key.toLowerCase()==='x')){event.preventDefault();select(event.key.toLowerCase()==='o')}});
  renderQuiz();
  const context=document.modelContext;
  if(context?.registerTool){
    const lifecycle=new AbortController();
    const snapshot=()=>({completed:session.complete,currentQuestion:session.complete?null:session.index+1,question:session.complete?null:questions[session.index],submitted:session.answers.length,...(session.complete?{score:session.score()}:{drawing:{pointNumbers:drawing.route.map(i=>i+1),drawnLines:drawing.count,completed:drawing.complete}})});
    const definitions=[{name:'read_one_stroke_game',title:'한붓 실험 상태 읽기',description:'Read the current puzzle and quiz progress. Correct answers are revealed only after the quiz is complete.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:input=>{if(input&&Object.keys(input).length)throw new Error('No arguments accepted');return snapshot()}},{name:'submit_one_stroke_answers',title:'한붓 실험 O/X 답 제출',description:'Submit one or more O/X predictions in order. Advances the visible quiz and returns the final score if all 20 questions are complete.',inputSchema:{type:'object',properties:{answers:{type:'array',items:{type:'string',enum:['O','X']},minItems:1,maxItems:20}},required:['answers'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(!input||Object.keys(input).some(k=>k!=='answers')||!Array.isArray(input.answers)||!input.answers.length||input.answers.length>20-session.index||input.answers.some(a=>a!=='O'&&a!=='X'))throw new Error('Provide O/X answers within the remaining question count');input.answers.forEach(a=>{select(a==='O');submit()});return snapshot()}}];
    definitions.push({name:'draw_one_stroke_path',title:'한붓 경로 그리기 또는 지우기',description:'Draw through numbered graph points in order, like tapping the points in the visible puzzle. Point numbers start at 1 in the order returned by read_one_stroke_game. Set eraseFirst true to clear the drawing before trying. Pass an empty points array with eraseFirst true to erase only. Invalid paths leave the drawing unchanged.',inputSchema:{type:'object',properties:{points:{type:'array',items:{type:'integer',minimum:1},maxItems:30},eraseFirst:{type:'boolean'}},required:['points'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(session.complete)throw new Error('The quiz is complete');if(!input||Object.keys(input).some(k=>!['points','eraseFirst'].includes(k))||!Array.isArray(input.points)||input.points.length>30||input.points.some(p=>!Number.isInteger(p)||p<1||p>questions[session.index].points.length)||('eraseFirst' in input&&typeof input.eraseFirst!=='boolean'))throw new Error('Provide valid point numbers and optional eraseFirst boolean');const trial=createDrawing(questions[session.index]);if(!input.eraseFirst)drawing.route.forEach(p=>trial.visit(p));for(const p of input.points){const result=trial.visit(p-1);if(!result.ok)throw new Error(result.reason==='reused'?'A line may be used only once':'Points must be connected to the current endpoint')}drawing=trial;updateDrawing();return snapshot()}});
    for(const definition of definitions){try{Promise.resolve(context.registerTool(definition,{signal:lifecycle.signal})).catch(()=>{})}catch{}}
    window.addEventListener('pagehide',event=>{if(!event.persisted)lifecycle.abort()},{once:true});
  }
})();

</script>
</body>
</html>
