<!doctype html>
<html lang="ko">
<head><script defer src="../assets/js/visit-entry.js?v=visits-20260909"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쪼물딱 공장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
</head>
<body>
<style>
:root{
  --ink:#17202B; --ink-soft:#5A6B7C; --ink-faint:#8C9AA8;
  --ground:#E4EAEF; --surface:#FFFFFF; --surface-2:#F1F5F8; --surface-3:#E4ECF2;
  --line:#C9D5DF; --line-2:#B4C4D1;
  --pok:#1494AC; --pok-t:#DEF3F7;
  --man:#E8446E; --man-t:#FFE5EB;
  --jjo:#C98700; --jjo-t:#FFF1D2;
  --lime:#5FAF22;
  --bub1:#9ED9E4; --bub2:#EAFBFD; --film:#E2F1F5;
  --sh:rgba(23,32,43,.16); --veil:rgba(241,245,248,.93);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E7EEF5; --ink-soft:#9BADBE; --ink-faint:#7286A0;
    --ground:#0E141B; --surface:#18212C; --surface-2:#1E2833; --surface-3:#26333F;
    --line:#32404F; --line-2:#3E4E60;
    --pok:#4ED2E5; --pok-t:#123039;
    --man:#FF7C99; --man-t:#3B1A23;
    --jjo:#FFC53D; --jjo-t:#3B2C09;
    --lime:#9AE255;
    --bub1:#3E7F90; --bub2:#8ED4E4; --film:#1A2932;
    --sh:rgba(0,0,0,.45); --veil:rgba(30,40,51,.93);
  }
}
:root[data-theme="dark"]{
  --ink:#E7EEF5; --ink-soft:#9BADBE; --ink-faint:#7286A0;
  --ground:#0E141B; --surface:#18212C; --surface-2:#1E2833; --surface-3:#26333F;
  --line:#32404F; --line-2:#3E4E60;
  --pok:#4ED2E5; --pok-t:#123039;
  --man:#FF7C99; --man-t:#3B1A23;
  --jjo:#FFC53D; --jjo-t:#3B2C09;
  --lime:#9AE255;
  --bub1:#3E7F90; --bub2:#8ED4E4; --film:#1A2932;
  --sh:rgba(0,0,0,.45); --veil:rgba(30,40,51,.93);
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  height:100vh;height:100svh;display:flex;flex-direction:column;overflow:hidden;
}
h1,h2,h3,.jua{font-family:'Jua','Malgun Gothic',system-ui,sans-serif;font-weight:400;letter-spacing:.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pok);outline-offset:2px}

.top{flex:none;z-index:40;background:var(--surface);border-bottom:1.5px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-family:'Jua',sans-serif;font-weight:400;font-size:23px;letter-spacing:.02em}
.brand b i{font-style:normal;color:var(--pok)}
.brand small{font-size:11.5px;color:var(--ink-faint);letter-spacing:.05em}
@media (max-width:520px){.brand small{display:none}}
.tally{display:flex;align-items:baseline;gap:7px;padding:5px 13px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line)}
.tally .n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;display:inline-block;transition:transform .12s ease-out}
.tally .n.bump{transform:scale(1.3)}
.tally .l{font-size:11px;color:var(--ink-faint);letter-spacing:.04em}
.mute{border:1.5px solid var(--line);background:var(--surface-2);border-radius:11px;padding:6px 12px;font-size:13px;cursor:pointer;box-shadow:0 3px 0 var(--line-2)}
.mute:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.mute[aria-pressed="false"]{color:var(--ink-faint)}

.wrap{max-width:1180px;width:100%;margin:0 auto;padding:12px 18px 8px;flex:1;min-height:0;display:flex;flex-direction:column}
.main{display:grid;grid-template-columns:238px 1fr;gap:20px;align-items:stretch;flex:1;min-height:0}
@media (max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:12px}}

.shelf{display:flex;flex-direction:column;gap:clamp(6px,1.4vh,13px);min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px}
.cat-h{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:clamp(2px,.55vh,6px);padding-left:2px;line-height:1.3}
.cat-h .bar{width:16px;height:4px;border-radius:2px;background:var(--c)}
.cat-h strong{font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(13px,1.8vh,15px);color:var(--ink-soft)}
.cat-h em{font-style:normal;font-size:10px;color:var(--ink-faint);letter-spacing:.09em;font-family:'IBM Plex Mono',monospace}
.shelf > div{display:flex;flex-direction:column;min-height:0}
.cat-list{display:flex;flex-direction:column;gap:clamp(4px,.85vh,7px);flex:1;justify-content:space-between}
.toy-btn{flex:none;display:flex;align-items:center;gap:10px;width:100%;padding:clamp(3px,.62vh,9px) 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface);font-family:'Jua',sans-serif;font-size:clamp(13.5px,1.9vh,15.5px);line-height:1.3;cursor:pointer;text-align:left;box-shadow:0 3px 0 var(--line-2);transition:box-shadow .1s,transform .1s,border-color .1s}
.toy-btn .dot{width:13px;height:13px;border-radius:5px;background:var(--c);flex:none}
.toy-btn:hover{border-color:var(--c)}
.toy-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.toy-btn[aria-current="true"]{border-color:var(--c);background:var(--tint);box-shadow:0 3px 0 var(--c);transform:translateY(1px)}
@media (max-width:900px){
  .shelf{gap:6px;overflow:visible;flex:none}
  .shelf > div{flex:none !important}
  .cat-h{margin-bottom:3px}
  .cat-h strong{font-size:13px}
  .cat-list{flex-direction:row;flex-wrap:wrap;overflow:visible;padding-bottom:0;justify-content:flex-start;gap:6px}
  .toy-btn{width:auto;white-space:nowrap;flex:none;padding:7px 12px;font-size:14px;line-height:1.35;gap:8px;box-shadow:0 2px 0 var(--line-2)}
  .toy-btn .dot{width:11px;height:11px}
}

.stage{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:13px 14px 14px;box-shadow:0 5px 0 var(--line-2);display:flex;flex-direction:column;min-height:0}
.stage.shake{animation:shake .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}30%,70%{transform:translate(5px,-2px)}50%{transform:translate(-6px,2px)}}
.stage-head{flex:none;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:1px 5px 9px}
.stage-head h2{margin:0;font-size:24px;line-height:1.12;text-wrap:balance}
.stage-head p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);max-width:50ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.7em}
.stage-head .meta{margin-left:auto;text-align:right}
.stage-head .meta .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;color:var(--c);display:block;line-height:1.2}
.stage-head .meta .k{font-size:10px;letter-spacing:.09em;color:var(--ink-faint)}
.field{position:relative;background:var(--surface-2);border-radius:16px;flex:1;min-height:150px;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;padding:12px 12px 34px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.tools{flex:none;display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;height:40px;margin:9px 5px 0;align-items:center;scrollbar-width:none}
.tools::-webkit-scrollbar{height:0}
.tools > *{flex:none}
.tool{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:6px 13px;font-size:13px;font-family:'Jua',sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line-2)}
.tool:hover{border-color:var(--c)}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.hint{font-size:12px;color:var(--ink-faint);margin-left:auto;text-align:right;white-space:nowrap}
.foot{flex:none;margin:7px 6px 0;font-size:11px;color:var(--ink-faint);text-align:center}
@media (max-width:640px){.hint{display:none}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx{position:absolute;font-family:'Jua',sans-serif;font-size:26px;transform:translate(-50%,-50%);animation:fxup .72s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
@keyframes fxup{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-88%) rotate(var(--r)) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-200%) rotate(var(--r)) scale(.9)}
}
@media (prefers-reduced-motion:reduce){
  .fx{animation-duration:.4s}
  .stage.shake{animation:none}
}

/* ── 뽁뽁이 ─────────────────────────── */
.sheet{display:grid;gap:3px;padding:11px;border-radius:12px;background:var(--film);box-shadow:inset 0 0 0 1.5px var(--line),0 3px 12px var(--sh);max-width:100%}
.bub{aspect-ratio:1;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.95),rgba(255,255,255,.18) 40%,rgba(255,255,255,0) 62%),radial-gradient(circle at 52% 66%,var(--bub2),var(--bub1) 80%);
  box-shadow:inset 0 -2px 5px rgba(0,0,0,.14),0 1px 3px var(--sh);
  transition:transform .09s ease-out}
.bub:hover{transform:scale(1.06)}
.bub.popped{cursor:default;transform:scale(.78);opacity:.92;background:var(--film);box-shadow:inset 0 1px 4px rgba(0,0,0,.2),inset 0 0 0 1px var(--line)}
.bub.popped:hover{transform:scale(.78)}
.bub.refill{animation:refill .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes refill{0%{transform:scale(.78)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.combo{position:absolute;top:11px;right:15px;font-family:'Jua',sans-serif;font-size:20px;color:var(--c);opacity:0;transition:opacity .25s}
.combo.on{opacity:1}
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--veil);font-family:'Jua',sans-serif;font-size:25px;text-align:center;z-index:5}

/* ── 말랑이 ─────────────────────────── */
.doll{width:100%;height:100%;max-width:340px;display:block;cursor:grab;overflow:visible}
.doll:active{cursor:grabbing}
.gauge{position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--surface-3)}
.gauge i{display:block;height:100%;width:0;background:var(--c);transition:width .06s linear}
.gauge i.hot{background:#E8446E}
.puff{position:absolute;border-radius:50%;pointer-events:none}
.label-mid{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:'Jua',sans-serif;font-size:14px;color:var(--ink-faint)}

/* ── 쪼물딱 ─────────────────────────── */
.board{display:grid;gap:8px;padding:14px;border-radius:20px;background:var(--boardc,#f0a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),0 4px 12px var(--sh)}
.pit{aspect-ratio:1;border-radius:50%;cursor:pointer;transition:transform .07s,box-shadow .07s;
  background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--boardc);
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.22),0 2px 3px rgba(0,0,0,.12)}
.pit.in{box-shadow:inset 0 4px 8px rgba(0,0,0,.4);transform:scale(.94);background:var(--boardc)}
.spin-wrap{position:relative;height:100%;max-height:330px;width:auto;aspect-ratio:1;max-width:100%;cursor:grab}
.spin-wrap:active{cursor:grabbing}
.rpm{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ink-faint)}
.pen{height:100%;max-height:280px;width:auto;max-width:100%;cursor:pointer}
.sw-bank{display:flex;gap:24px 10px;padding:16px 14px;border-radius:16px;background:var(--surface-3);box-shadow:inset 0 0 0 1.5px var(--line);flex-wrap:wrap;justify-content:center}
.sw{width:44px;height:78px;border-radius:9px;background:var(--surface);border:1.5px solid var(--line);position:relative;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
.sw i{position:absolute;left:5px;right:5px;height:32px;top:5px;border-radius:6px;background:var(--line-2);transition:top .09s cubic-bezier(.4,1.6,.5,1),background .09s}
.sw.on i{top:39px;background:var(--jjo)}
.sw b{position:absolute;left:0;right:0;bottom:-19px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:500;color:var(--ink-faint)}
.slime-c{border-radius:16px;touch-action:none;max-width:100%}

/* ── 설정 바 ── */
.bar-row{flex:none;display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 11px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-family:'Jua',sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line-2)}
.chip:hover{border-color:var(--pok)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line-2)}
.chip .n{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;color:var(--ink-faint)}
.chip .sw{width:14px;height:14px;border-radius:5px;box-shadow:inset 0 -2px 4px rgba(0,0,0,.25)}
.lv{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;background:var(--pok-t);border:1.5px solid var(--pok);font-family:'Jua',sans-serif;font-size:13.5px}
.lv b{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--pok)}
.lv i{font-style:normal;font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Sans KR',sans-serif}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:0 3px 0 var(--line-2)}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;font-family:'Jua',sans-serif;cursor:pointer;border-right:1.5px solid var(--line);color:var(--ink-soft)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--c)}
.rng{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-faint);font-family:'Jua',sans-serif}
.rng input{width:104px;accent-color:var(--c)}

/* ── 모달 ── */
.mask{position:fixed;inset:0;background:rgba(8,14,20,.58);z-index:70;display:grid;place-items:center;padding:20px;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line-2);max-width:470px;width:100%;max-height:84vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 3px;font-size:23px}
.modal .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.5}
.modal .row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.dex button{border:1.5px solid var(--line);border-radius:13px;background:var(--surface-2);padding:8px 3px;cursor:pointer;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-soft)}
.dex button .sw{width:30px;height:30px;border-radius:10px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.2)}
.dex button.locked{opacity:.45;cursor:default}
.dex button.on{border-color:var(--pok);box-shadow:0 3px 0 var(--pok);color:var(--ink)}
.txt{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface-2);color:var(--ink);font-family:'Jua',sans-serif;font-size:22px;text-align:center;letter-spacing:.08em}
.fort{background:var(--surface-2);border-radius:16px;padding:18px;text-align:center;font-family:'Jua',sans-serif;font-size:19px;line-height:1.5;margin-bottom:14px}
.fort-l{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);font-family:'IBM Plex Sans KR',sans-serif}
.fort-l span{background:var(--surface-2);border-radius:999px;padding:5px 12px}

/* ── 도장판 ── */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(134px,1fr));gap:9px}
.achs div{border:1.5px solid var(--line);border-radius:13px;background:var(--surface-2);padding:9px 11px;font-size:11.5px;color:var(--ink-faint);line-height:1.35}
.achs div.got{border-color:var(--jjo);background:var(--jjo-t);color:var(--ink);box-shadow:0 3px 0 var(--jjo)}
.achs b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:14px;margin-bottom:2px}

/* ── 토스트 ── */
#toasts{position:fixed;left:0;right:0;bottom:24px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--ground);padding:11px 20px;border-radius:999px;font-family:'Jua',sans-serif;font-size:14.5px;box-shadow:0 5px 18px rgba(0,0,0,.32);animation:tin .28s cubic-bezier(.2,.9,.3,1);text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.9)}}

/* ── 각인 · 미스터리 알 ── */
.bub{position:relative}
.bub span{position:absolute;inset:0;display:grid;place-items:center;font-family:'Jua',sans-serif;color:rgba(16,44,54,.5);pointer-events:none;overflow:hidden;line-height:1}
.bub.popped span{opacity:.4}
.bub.myst{animation:myst 1.3s ease-in-out infinite}
@keyframes myst{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.4) saturate(1.9)}}
.bub.myst.popped{animation:none}
@media (prefers-reduced-motion:reduce){.bub.myst{animation:none;outline:2px dashed var(--jjo);outline-offset:-3px}}

/* ══ 좁은 화면(폰) ═══════════════════════════════════════
   가로로 끌 일은 어디에도 없게, 대신 세로로 내려서 본다 */
@media (max-width:900px){
  body{height:auto;min-height:100svh;overflow:visible}
  .top{position:sticky;top:0}
  .top-in{padding:7px 13px;gap:9px}
  .wrap{flex:none;padding:10px 13px 16px}
  .main{flex:none;min-height:0}
  .bar-row{flex-wrap:wrap;overflow:visible;margin-bottom:9px}
  .stage{padding:11px 11px 12px;border-radius:18px;min-height:0}
  .stage-head{margin:1px 4px 7px}
  .stage-head h2{font-size:21px}
  .stage-head .meta{margin-left:auto}
  .field{flex:none;height:min(48vh,340px);min-height:230px}
  .tools{height:auto;min-height:40px;flex-wrap:wrap;overflow:visible}
  .foot{margin-top:11px;font-size:11.5px}
  /* 스위치 여덟 개가 판 안에 들어오도록 */
  .sw{width:36px;height:62px}
  .sw i{left:4px;right:4px;height:24px}
  .sw.on i{top:33px}
  .sw b{bottom:-16px;font-size:10px}
  .sw-bank{gap:22px 8px;padding:12px 11px}
}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <b>쪼물딱 <i>공장</i></b>
      <small>손가락 심심할 때 오는 곳</small>
    </div>
    <div class="tally"><span class="n mono" id="tally">0</span><span class="l">번 쪼물딱</span></div>
    <button class="mute" id="mute" aria-pressed="true">소리 켜짐</button>
  </div>
</div>

<div class="wrap">
  <div class="bar-row" id="bar"></div>
  <div class="main">
    <nav class="shelf" id="shelf" aria-label="장난감 선반"></nav>
    <section class="stage" id="stage">

<script>
/* ══ 소리 공장 ══════════════════════════════════════════ */
const SND = (() => {
  let ctx = null, master = null, nb = null, on = true;
  function ready(){
    if (!on) return null;
    if (!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { on = false; return null; }
      ctx = new AC(); master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function noise(c){
    if (!nb){
      nb = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = c.createBufferSource(); s.buffer = nb; s.loop = true; return s;
  }
  return {
    get on(){ return on; },
    toggle(){ on = !on; if (!on && ctx) ctx.suspend(); else ready(); return on; },
    wake(){ ready(); },
    /* 뽁! */
    pop(p = 1, v = 1){
      const c = ready(); if (!c) return; const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(820 * p, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(60, 140 * p), t + .07);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.32 * v, t + .005);
      g.gain.exponentialRampToValueAtTime(.0001, t + .1);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .11);
      const n = noise(c), bp = c.createBiquadFilter(), ng = c.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 1900 * p; bp.Q.value = 1.2;
      ng.gain.setValueAtTime(.26 * v, t);
      ng.gain.exponentialRampToValueAtTime(.0001, t + .05);
      n.connect(bp); bp.connect(ng); ng.connect(master); n.start(t); n.stop(t + .06);
    },
    /* 딸깍 */
    click(p = 1, v = 1){
      const c = ready(); if (!c) return; const t = c.currentTime;
      [[2400 * p, 0], [1300 * p, .012]].forEach(([f, d]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(.0001, t + d);
        g.gain.exponentialRampToValueAtTime(.12 * v, t + d + .002);
        g.gain.exponentialRampToValueAtTime(.0001, t + d + .03);
        o.connect(g); g.connect(master); o.start(t + d); o.stop(t + d + .04);
      });
    },
    /* 삐- 음 */
    tone(f, dur = .2, type = 'triangle', v = .18){
      const c = ready(); if (!c) return; const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
    },
    /* 뽀요요옹 */
    boing(f = 210, v = .22){
      const c = ready(); if (!c) return; const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(f * 2.1, t);
      o.frequency.exponentialRampToValueAtTime(f * .8, t + .3);
      l.type = 'sine'; l.frequency.value = 15; lg.gain.setValueAtTime(70, t);
      lg.gain.exponentialRampToValueAtTime(1, t + .35);
      l.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + .01);
      g.gain.exponentialRampToValueAtTime(.0001, t + .42);
      o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t + .45); l.stop(t + .45);
    },
    /* 뻥! */
    burst(v = .5){
      const c = ready(); if (!c) return; const t = c.currentTime;
      const n = noise(c), lp = c.createBiquadFilter(), g = c.createGain();
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(4200, t);
      lp.frequency.exponentialRampToValueAtTime(220, t + .4);
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(.0001, t + .45);
      n.connect(lp); lp.connect(g); g.connect(master); n.start(t); n.stop(t + .5);
    },
    /* 딸깍 — 볼펜·스위치용. 위쪽 '딸' 틱과 아래쪽 '깍' 몸통이 겹쳐 난다 */
    clack(p = 1, v = 1){
      const c = ready(); if (!c) return; const t = c.currentTime;
      const n = noise(c), hp = c.createBiquadFilter(), bp = c.createBiquadFilter(), ng = c.createGain();
      hp.type = 'highpass'; hp.frequency.value = 1800 * p;
      bp.type = 'peaking'; bp.frequency.value = 3800 * p; bp.Q.value = 1.4; bp.gain.value = 9;
      ng.gain.setValueAtTime(.0001, t);
      ng.gain.exponentialRampToValueAtTime(.34 * v, t + .0012);
      ng.gain.exponentialRampToValueAtTime(.0001, t + .026);
      n.connect(hp); hp.connect(bp); bp.connect(ng); ng.connect(master);
      n.start(t); n.stop(t + .035);
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(380 * p, t);
      o.frequency.exponentialRampToValueAtTime(105 * p, t + .045);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.19 * v, t + .003);
      g.gain.exponentialRampToValueAtTime(.0001, t + .075);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + .085);
    },
    /* 통 — 실로폰처럼 짧게 튕기는 음 (스위치 음계용) */
    pluck(f, v = .16){
      const c = ready(); if (!c) return; const t = c.currentTime;
      [[1, v, .34], [2.01, v * .34, .17], [3.03, v * .11, .1]].forEach(a => {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f * a[0];
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(a[1], t + .006);
        g.gain.exponentialRampToValueAtTime(.0001, t + a[2]);
        o.connect(g); g.connect(master); o.start(t); o.stop(t + a[2] + .03);
      });
    },
    /* 삐이이익 — 고무 인형 쥐는 소리. lo가 낮을수록 큰 고무 */
    squeak(lo = 240, hi = 900){
      const c = ready(); if (!c) return { set(){}, stop(){} };
      const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = lo;
      lp.type = 'lowpass'; lp.frequency.value = 1400;
      g.gain.value = .0001;
      o.connect(lp); lp.connect(g); g.connect(master); o.start();
      return {
        set(x){
          const t = c.currentTime;
          o.frequency.setTargetAtTime(lo + hi * x, t, .04);
          lp.frequency.setTargetAtTime(900 + 2200 * x, t, .06);
          g.gain.setTargetAtTime(x <= .01 ? .0001 : .05 + .06 * x, t, .05);
        },
        stop(){ const t = c.currentTime; g.gain.setTargetAtTime(.0001, t, .04); setTimeout(() => { try { o.stop(); } catch (e) {} }, 250); }
      };
    },
    /* 스으으— 바람 들어가는 소리 (볼록이) */
    air(){
      const c = ready(); if (!c) return { set(){}, stop(){} };
      const n = noise(c), bp = c.createBiquadFilter(), g = c.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 460; bp.Q.value = 1;
      g.gain.value = .0001;
      n.connect(bp); bp.connect(g); g.connect(master); n.start();
      return {
        set(x){
          const t = c.currentTime;
          bp.frequency.setTargetAtTime(420 + 2400 * x, t, .09);
          bp.Q.setTargetAtTime(1 + 6 * x, t, .12);
          g.gain.setTargetAtTime(x <= .01 ? .0001 : .04 + .15 * x, t, .09);
        },
        stop(){ const t = c.currentTime; g.gain.setTargetAtTime(.0001, t, .06); setTimeout(() => { try { n.stop(); } catch (e) {} }, 320); }
      };
    },
    /* 질척질척 — 슬라임 주무르는 소리 */
    goo(){
      const c = ready(); if (!c) return { set(){}, stop(){} };
      const n = noise(c), bp = c.createBiquadFilter(), lp = c.createBiquadFilter(), g = c.createGain();
      const lfo = c.createOscillator(), lg = c.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 380; bp.Q.value = 7;
      lp.type = 'lowpass'; lp.frequency.value = 1300;
      lfo.type = 'sine'; lfo.frequency.value = 7; lg.gain.value = 240;
      lfo.connect(lg); lg.connect(bp.frequency);
      g.gain.value = .0001;
      n.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
      n.start(); lfo.start();
      return {
        set(x){
          const t = c.currentTime;
          bp.frequency.setTargetAtTime(300 + 620 * x, t, .07);
          lfo.frequency.setTargetAtTime(5 + 15 * x, t, .1);
          g.gain.setTargetAtTime(x <= .01 ? .0001 : .06 + .2 * x, t, .06);
        },
        stop(){ const t = c.currentTime; g.gain.setTargetAtTime(.0001, t, .05); setTimeout(() => { try { n.stop(); lfo.stop(); } catch (e) {} }, 320); }
      };
    },
    /* 위이잉 — 스피너 */
    whir(){
      const c = ready(); if (!c) return { set(){}, stop(){} };
      const n = noise(c), bp = c.createBiquadFilter(), g = c.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 700; bp.Q.value = 4;
      g.gain.value = .0001;
      n.connect(bp); bp.connect(g); g.connect(master); n.start();
      return {
        set(x){
          const t = c.currentTime;
          bp.frequency.setTargetAtTime(320 + 1500 * Math.min(1, x), t, .06);
          g.gain.setTargetAtTime(Math.min(.16, x * .2), t, .08);
        },
        stop(){ const t = c.currentTime; g.gain.setTargetAtTime(.0001, t, .05); setTimeout(() => { try { n.stop(); } catch (e) {} }, 300); }
      };
    },
    /* 뿌직 */
    squelch(v = .3, up = true){
      const c = ready(); if (!c) return; const t = c.currentTime;
      const n = noise(c), bp = c.createBiquadFilter(), g = c.createGain();
      bp.type = 'bandpass'; bp.Q.value = 3;
      bp.frequency.setValueAtTime(up ? 380 : 1500, t);
      bp.frequency.exponentialRampToValueAtTime(up ? 1500 : 380, t + .22);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + .04);
      g.gain.exponentialRampToValueAtTime(.0001, t + .26);
      n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t + .3);
    }
  };
})();

const DB = (() => {
  const K = 'jjomullak.v1';
  let d = { tally: 0, rec: {}, last: 'classic', stamp: '', dex: [], color: null, kit: 1, size: 1, fortuneDay: '', lv: 1,
            ach: [], seen: [], slimeMem: 100, jjukSnap: 1 };
  try { const r = localStorage.getItem(K); if (r) d = Object.assign(d, JSON.parse(r)); } catch (e) {}
  let timer = null;
  const save = () => { clearTimeout(timer); timer = setTimeout(() => { try { localStorage.setItem(K, JSON.stringify(d)); } catch (e) {} }, 400); };
  return {
    get data(){ return d; },
    bump(n){ d.tally += n; save(); return d.tally; },
    rec(id){ return d.rec[id] || 0; },
    setRec(id, v){ if (v > (d.rec[id] || 0)) { d.rec[id] = v; save(); return true; } return false; },
    clear(id){ delete d.rec[id]; save(); },
    set(k, v){ d[k] = v; save(); return v; },
    last(id){ if (id) { d.last = id; save(); } return d.last; }
  };
})();

const fxLayer = document.getElementById('fx');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxAt = 0;
function fx(x, y, text, color, size, force){
  const now = performance.now();
  if (!force && now - fxAt < 60) return;
  fxAt = now;
  const s = document.createElement('span');
  s.className = 'fx'; s.textContent = text;
  s.style.left = x + 'px'; s.style.top = y + 'px';
  s.style.color = color || 'var(--ink)';
  s.style.fontSize = (size || 26) + 'px';
  s.style.setProperty('--r', (Math.random() * 22 - 11).toFixed(1) + 'deg');
  fxLayer.appendChild(s);
  setTimeout(() => s.remove(), 760);
}
function vib(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pickOne = a => a[(Math.random() * a.length) | 0];
function mix(a, b, t){
  const P = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const A = P(a), B = P(b);
  return 'rgb(' + A.map((v,i) => Math.round(v + (B[i]-v)*t)).join(',') + ')';
}
const lighten = (h, t) => mix(h, '#ffffff', t);

/* ══ 토스트 · 모달 ══════════════════════════════════════ */
const toastBox = document.getElementById('toasts');
function toast(msg, ms){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  toastBox.appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, ms || 2200);
}
function modal(build){
  const mask = document.createElement('div');
  mask.className = 'mask';
  const box = document.createElement('div');
  box.className = 'modal';
  mask.appendChild(box);
  const close = () => { mask.remove(); removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  mask.addEventListener('pointerdown', e => { if (e.target === mask) close(); });
  addEventListener('keydown', esc);
  build(box, close);
  document.body.appendChild(mask);
  const f = box.querySelector('input,button');
  if (f) f.focus();
  return close;
}

<script>
const TOYS = [];
const SMALL = () => innerWidth < 640;
/* 세로가 모자라면 판을 그만큼 줄여 한 화면에 담는다 */
function fieldBox(f){
  const cs = getComputedStyle(f);
  return {
    w: f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
    h: f.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
  };
}
function fitToField(field, el, cols, rows, pad){
  const h = fieldBox(field).h;
  if (h > 50) el.style.maxWidth = Math.round((h - pad) * (cols / rows) + pad) + 'px';
}
const pick = (d, m) => SMALL() ? m : d;

/* ══ 뽁뽁이 공용 부품 ═══════════════════════════════════ */
function bubbleSheet(field, api, cfg){
  const cols = cfg.cols, rows = cfg.rows, cell = cfg.cell, gap = cfg.gap == null ? 3 : cfg.gap;
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
  sheet.style.gap = gap + 'px';
  sheet.style.width = 'min(100%,' + (cols * (cell + gap) + 22) + 'px)';
  const N = cols * rows, cells = [], frag = document.createDocumentFragment();
  const stamp = DB.data.stamp;
  for (let i = 0; i < N; i++){
    const b = document.createElement('div');
    b.className = 'bub'; b.dataset.i = i;
    if (stamp && cell >= 20){
      const s = document.createElement('span');
      s.textContent = stamp.length > 2 ? stamp.slice(0, 2) : stamp;
      s.style.fontSize = Math.max(8, cell * (stamp.length > 1 ? .3 : .42)) + 'px';
      b.appendChild(s);
    }
    frag.appendChild(b); cells.push(b);
  }
  sheet.appendChild(frag);
  field.appendChild(sheet);
  /* 알 크기(확대배율)까지 감안해서 판이 필드를 넘지 않게 */
  function refit(){
    const sc = clamp(DB.data.size || 1, .7, 1.15);
    sheet.style.transform = 'scale(' + sc + ')';
    const box = fieldBox(field);
    if (box.h > 50){
      const byH = (box.h / sc - 22) * (cols / rows) + 22;
      sheet.style.maxWidth = Math.round(Math.min(byH, box.w / sc)) + 'px';
    }
  }
  /* 도감에서 고른 색이 있으면 그 색으로 */
  function paint(){
    const c = activeColor();
    if (c){
      sheet.style.setProperty('--bub1', c);
      sheet.style.setProperty('--bub2', lighten(c, .55));
    } else {
      sheet.style.removeProperty('--bub1');
      sheet.style.removeProperty('--bub2');
    }
  }
  paint();
  /* 반짝이는 미스터리 알 몇 개 숨겨두기 */
  const mystN = Math.max(1, Math.round(N * .014));
  const mysts = new Set();
  while (mysts.size < mystN) mysts.add((Math.random() * N) | 0);
  mysts.forEach(i => { cells[i].classList.add('myst'); cells[i].dataset.myst = '1'; });

  const comboEl = document.createElement('div'); comboEl.className = 'combo';
  field.appendChild(comboEl);

  const timers = [];
  const words = cfg.words || ['뽁', '뽁!', '뽁—'];
  let live = N, total = 0, combo = 0, comboT = null, done = null;

  function say(el, txt, size, force){
    const r = el.getBoundingClientRect();
    fx(r.left + r.width / 2, r.top + r.height / 2, txt, cfg.color, size, force);
  }
  function showDone(){
    if (done || cfg.refillMs) return;
    ach('clear');
    done = document.createElement('div');
    done.className = 'done';
    done.innerHTML = '<div>' + (cfg.doneMsg || '다 터뜨렸다!') + '</div>';
    const b = document.createElement('button');
    b.className = 'tool'; b.textContent = '새 비닐 뜯기';
    b.onclick = reset; done.appendChild(b);
    field.appendChild(done);
    SND.tone(660, .12); setTimeout(() => SND.tone(880, .2), 110);
  }
  function reset(){
    if (done){ done.remove(); done = null; }
    cells.forEach(b => b.classList.remove('popped'));
    live = N; SND.squelch(.2, true);
  }
  function popOne(i, depth, noChain){
    const b = cells[i];
    if (!b || b.classList.contains('popped')) return;
    b.classList.add('popped');
    live--; total++;
    if (total === 1) ach('pop1');
    combo++;
    clearTimeout(comboT);
    comboT = setTimeout(() => { combo = 0; comboEl.classList.remove('on'); }, 620);
    if (combo >= 4){ comboEl.textContent = combo + '연속'; comboEl.classList.add('on'); }
    if (combo >= 15) ach('combo15');

    const kit = KITS[DB.data.kit] || KITS[1];
    const pitch = (cfg.pitch || 1) * kit.p * rnd(.93, 1.08) * (1 + (depth || 0) * .05);
    SND.pop(pitch, (cfg.vol || 1) * kit.v);
    if (b.dataset.myst){
      delete b.dataset.myst;
      b.classList.remove('myst');
      say(b, '반짝!', 32, true);
      grantColor();
      paint();
    }
    vib(cfg.big ? 22 : 7);
    api.bump(1);
    api.val(total);
    if (cfg.big){
      say(b, ['뽀오옥!', '퍽!', '뽁!!'][(Math.random() * 3) | 0], 40, true);
      api.shake();
    } else if (!depth){
      say(b, words[(Math.random() * words.length) | 0], cell > 26 ? 26 : 20);
    } else if (depth % 3 === 0){
      say(b, '뽁', 20);
    }
    if (cfg.chain && !noChain) chainFrom(i);
    if (cfg.refillMs){
      timers.push(setTimeout(() => {
        b.classList.remove('popped'); b.classList.add('refill'); live++;
        timers.push(setTimeout(() => b.classList.remove('refill'), 420));
        if (Math.random() < .02){
          const t = cells[(Math.random() * N) | 0];
          if (t && !t.classList.contains('popped')){ t.classList.add('myst'); t.dataset.myst = '1'; }
        }
      }, cfg.refillMs + rnd(0, 500)));
    }
    if (live === 0) showDone();
  }
  function chainFrom(i){
    let ring = [i], depth = 0, cnt = 1;
    const seen = new Set([i]);
    const step = () => {
      const next = [];
      ring.forEach(k => {
        const x = k % cols, y = (k / cols) | 0;
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => {
          const nx = x + d[0], ny = y + d[1];
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) return;
          const ni = ny * cols + nx;
          if (seen.has(ni) || cells[ni].classList.contains('popped')) return;
          seen.add(ni); next.push(ni);
        });
      });
      if (!next.length) return;
      depth++;
      cnt += next.length;
      if (cnt >= 30) ach('chain30');
      next.forEach(ni => popOne(ni, depth, true));
      ring = next;
      if (depth < 40) timers.push(setTimeout(step, 65));
    };
    timers.push(setTimeout(step, 75));
  }

  let down = false;
  const hit = e => {
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el && el.classList.contains('bub') && sheet.contains(el)) popOne(+el.dataset.i, 0);
  };
  const onDown = e => { down = true; try { sheet.setPointerCapture(e.pointerId); } catch (err) {} hit(e); };
  const onMove = e => { if (down) hit(e); };
  const onUp = () => { down = false; };
  sheet.addEventListener('pointerdown', onDown);
  sheet.addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', onUp);

  api.tool(cfg.refillMs ? '싹 터뜨리기' : '새 비닐 뜯기', () => {
    if (cfg.refillMs){
      cells.forEach((b, i) => timers.push(setTimeout(() => popOne(i, 0, true), i * 6)));
    } else reset();
  });
  api.seg('소리', KITS.map(k => k.name), DB.data.kit, i => {
    DB.set('kit', i);
    SND.pop(1.1 * KITS[i].p, KITS[i].v);
  });
  api.range('알 크기', 70, 115, Math.round(clamp(DB.data.size || 1, .7, 1.15) * 100), v => {
    DB.set('size', v / 100);
    refit();
  });
  refit();
  api.val(0); api.key('터뜨린 개수');

  return () => {
    timers.forEach(clearTimeout); clearTimeout(comboT);
    removeEventListener('pointerup', onUp);
    removeEventListener('pointercancel', onUp);
  };
}

<script>
/* ══ 말랑이네 ══════════════════════════════════════════ */
function hold(el, onDown, onUp){
  const d = e => { try { el.setPointerCapture(e.pointerId); } catch (err) {} onDown(e); };
  const u = e => onUp(e);
  el.addEventListener('pointerdown', d);
  addEventListener('pointerup', u);
  addEventListener('pointercancel', u);
  return () => { el.removeEventListener('pointerdown', d); removeEventListener('pointerup', u); removeEventListener('pointercancel', u); };
}
