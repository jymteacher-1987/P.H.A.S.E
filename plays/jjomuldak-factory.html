      const cw = 26 + 18 * p;
      chL.setAttribute('rx', cw); chR.setAttribute('rx', cw);
      mouth.setAttribute('d', p > .5 ? 'M148 202 Q170 ' + (202 - 26 * p) + ' 192 202' : 'M150 200 Q170 214 190 200');
      bar.style.width = Math.min(100, p * 100) + '%';
      bar.classList.toggle('hot', p > .72);
    }
    function pop(){
      burst = true; holding = false;
      if (sq){ sq.stop(); sq = null; }
      ach('burst');
      SND.burst(.55); vib([30, 40, 60]); api.shake();
      const r = svg.getBoundingClientRect();
      fx(r.left + r.width / 2, r.top + r.height / 2, stamp ? stamp + ' 뻥!!!' : '뻥!!!', 'var(--man)', 54, true);
      svg.style.visibility = 'hidden';
      const fr = f.getBoundingClientRect();
      for (let i = 0; i < 16; i++){
        const d = document.createElement('div');
        d.className = 'puff';
        const sz = rnd(10, 26);
        d.style.cssText = 'width:' + sz + 'px;height:' + sz + 'px;background:' + mix(BASE,'#F0537A',.6) +
          ';left:' + (r.left - fr.left + r.width/2) + 'px;top:' + (r.top - fr.top + r.height/2) +
          'px;transition:transform .7s cubic-bezier(.2,.7,.3,1),opacity .7s';
        f.appendChild(d);
        requestAnimationFrame(() => {
          d.style.transform = 'translate(' + rnd(-220,220) + 'px,' + rnd(-190,150) + 'px) rotate(' + rnd(-180,180) + 'deg)';
          d.style.opacity = '0';
        });
        setTimeout(() => d.remove(), 750);
      }
      label.textContent = '다시 만드는 중…';
      api.bump(3);
      setTimeout(() => {
        p = 0; burst = false; draw();
        svg.style.visibility = 'visible';
        label.textContent = '다시 부풀려 볼까요';
        SND.squelch(.25, true);
      }, 1000);
    }
    function loop(){
      const dt = .016;
      if (holding){
        p += dt * .42;
        if (p >= 1){ p = 1; draw(); pop(); raf = 0; return; }
      } else {
        p -= dt * .9;
        if (p <= 0){ p = 0; draw(); raf = 0; if (sq){ sq.stop(); sq = null; } return; }
      }
      if (sq) sq.set(p * .9);
      draw();
      raf = requestAnimationFrame(loop);
    }
    const off = hold(svg,
      () => {
        if (burst) return;
        holding = true; label.textContent = '조금만 더…';
        if (!sq) sq = SND.air();
        if (!raf) raf = requestAnimationFrame(loop);
        vib(10);
      },
      () => {
        if (!holding) return;
        holding = false;
        const pct = Math.round(p * 100);
        api.bump(1);
        SND.squelch(.3, false);
        const r = svg.getBoundingClientRect();
        fx(r.left + r.width / 2, r.top + r.height * .25, '푸슈슈—', 'var(--man)', 30, true);
        if (pct >= 95) ach('bollok95');
        if (DB.setRec('bollok', pct)){ best = pct; label.textContent = '신기록! ' + pct + '%'; }
        else label.textContent = pct + '% 에서 손 뗌 (최고 ' + best + '%)';
        api.val(Math.max(best, pct));
        if (!raf) raf = requestAnimationFrame(loop);
      });
    draw();
    api.tool('기록 지우기', () => { DB.clear('bollok'); best = 0; api.val(0); label.textContent = '처음부터 다시'; SND.tone(330, .12); });
    return () => { off(); cancelAnimationFrame(raf); if (sq) sq.stop(); };
  }
});

/* ── 8. 쭈욱이 ── */
TOYS.push({
  id: 'jjuk', cat: 'man', name: '쭈욱이',
  desc: '당길수록 화면이 뒤로 물러나서 한도 없이 늘어납니다. 너무 당기면 뚝 끊어져요.',
  mount(f, api){
    f.innerHTML =
      '<svg class="doll" viewBox="0 0 340 400" id="jsvg">' +
      '<g id="jzoom">' +
      '<ellipse cx="170" cy="378" rx="74" ry="14" fill="rgba(0,0,0,.13)"/>' +
      '<ellipse cx="170" cy="352" rx="66" ry="26" fill="#5B8DEF"/>' +
      '<path id="jbody" fill="#77A6FF"/>' +
      '<g id="jhead">' +
        '<circle id="jface" r="46" fill="#77A6FF"/>' +
        '<circle cx="-16" cy="-8" r="9" fill="#12203A"/><circle cx="16" cy="-8" r="9" fill="#12203A"/>' +
        '<circle cx="-19" cy="-11" r="3" fill="#fff"/><circle cx="13" cy="-11" r="3" fill="#fff"/>' +
        '<path id="jmouth" d="M-14 16 Q0 26 14 16" stroke="#12203A" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '</g></g></svg>' +
      '<div class="gauge"><i></i></div>' +
      '<div class="label-mid">머리를 잡고 당겨보세요</div>';
    const svg = f.querySelector('#jsvg'), zoomG = f.querySelector('#jzoom');
    const bodyP = f.querySelector('#jbody'), head = f.querySelector('#jhead');
    const face = f.querySelector('#jface'), mouth = f.querySelector('#jmouth');
    const label = f.querySelector('.label-mid'), bar = f.querySelector('.gauge i');

    /* 화면 밖까지 당겨도 되도록, 늘어난 만큼 그림 전체를 뒤로 물린다 */
    const BX = 170, BY = 348, REST = 150, DMAX = 330;
    const SNAPS = [3, 5.5, 1e9], SNAPN = ['잘 끊김', '보통', '안 끊김'];
    let snapIdx = DB.data.jjukSnap == null ? 1 : DB.data.jjukSnap;
    let hx = BX, hy = BY - REST, vx = 0, vy = 0, drag = false, raf = 0, sq = null;
    let broken = false, brokenT = 0, best = DB.rec('jjuk'), peak = REST;
    api.val((best / 100).toFixed(2)); api.key('최고 배율');

    /* 길이 → 축소율. 당길 때 쓰는 식의 역함수라 손끝과 머리가 늘 붙어 있다.
       판 끝(DMAX)까지 당기면 5.8배, 거기서 더 끌어내면 화면이 계속 물러나며 끝없이 늘어난다 */
    const K = .62, LEDGE = DMAX / (1 - K);
    function zoomFor(len){
      if (len <= LEDGE) return 1 - K * clamp((len - REST) / ((DMAX - REST) + K * len), 0, 1);
      return DMAX / len;
    }

    function toSvg(e){
      const r = svg.getBoundingClientRect();
      const sc = Math.min(r.width / 340, r.height / 400);
      const ox = r.left + (r.width - 340 * sc) / 2, oy = r.top + (r.height - 400 * sc) / 2;
      return { x: (e.clientX - ox) / sc, y: (e.clientY - oy) / sc };
    }
    function draw(){
      const dx = hx - BX, dy = hy - BY;
      const len = Math.hypot(dx, dy), ratio = len / REST;
      const z = zoomFor(len);
      zoomG.setAttribute('transform',
        'translate(170,348) scale(' + z.toFixed(4) + ') translate(-170,-348)');
      const t = clamp((ratio - 1) / 4, 0, 1);
      const hw = 46 * (1 - .42 * t);
      if (broken){
        bodyP.setAttribute('d', 'M118 348 C118 296,150 286,170 286 C190 286,222 296,222 348Z');
      } else {
        const bw = 52 * (1 - .55 * t);
        const mx = (BX + hx) / 2, my = (BY + hy) / 2;
        const nx = len ? -dy / len : 0, ny = len ? dx / len : 0;
        bodyP.setAttribute('d',
          'M' + (BX - bw) + ' ' + BY +
          ' C' + (BX - bw) + ' ' + (BY - 60) + ',' + (mx + nx * hw * 1.15) + ' ' + (my + ny * hw * 1.15) + ',' + (hx + nx * hw) + ' ' + (hy + ny * hw) +
          ' A' + hw + ' ' + hw + ' 0 0 0 ' + (hx - nx * hw) + ' ' + (hy - ny * hw) +
          ' C' + (mx - nx * hw * 1.15) + ' ' + (my - ny * hw * 1.15) + ',' + (BX + bw) + ' ' + (BY - 60) + ',' + (BX + bw) + ' ' + BY + 'Z');
      }
      head.setAttribute('transform', 'translate(' + hx.toFixed(1) + ',' + hy.toFixed(1) + ') scale(' + (1 - .3 * t).toFixed(3) + ',' + (1 + .2 * t).toFixed(3) + ')');
      const col = mix('#77A6FF', '#F0537A', clamp(t * 1.05, 0, 1));
      face.setAttribute('fill', col); bodyP.setAttribute('fill', col);
      mouth.setAttribute('d', t > .35 ? 'M-14 20 Q0 ' + (20 - 22 * t) + ' 14 20' : 'M-14 16 Q0 26 14 16');
      const snapAt = SNAPS[snapIdx];
      const tens = snapAt > 90 ? clamp((ratio - 1) / 11, 0, 1) : clamp((ratio - 1) / (snapAt - 1), 0, 1);
      bar.style.width = (tens * 100).toFixed(1) + '%';
      bar.classList.toggle('hot', tens > .72);
      if (sq) sq.set(t * .85);
      return ratio;
    }
    function reform(){
      broken = false; vx = 0; vy = 0;
      hx = BX; hy = BY - REST - 70;
      SND.boing(220, .24); SND.squelch(.22, true);
      label.textContent = '다시 붙였습니다';
    }
    function doSnap(ratio){
      broken = true; drag = false; brokenT = performance.now();
      if (sq){ sq.stop(); sq = null; }
      const dx = hx - BX, dy = hy - BY, l = Math.hypot(dx, dy) || 1;
      vx = dx / l * 24; vy = dy / l * 24;
      SND.burst(.5); SND.tone(150, .2, 'sawtooth', .16);
      vib([40, 30, 70]); api.shake(); api.bump(2);
      const r = svg.getBoundingClientRect();
      fx(r.left + r.width / 2, r.top + r.height * .3, '뚝!!', 'var(--man)', 54, true);
      ach('snap');
      score(ratio, true);
      label.textContent = '아이고… 끊어졌다';
    }
    function score(ratio, quiet){
      const v = Math.round(ratio * 100);
      if (v >= 300) ach('jjuk3');
      const isNew = DB.setRec('jjuk', v);
      if (isNew) best = v;
      api.key('최고 배율');
      api.val((Math.max(best, v) / 100).toFixed(2));
      if (quiet) return;
      label.textContent = isNew
        ? '신기록! ' + (v / 100).toFixed(2) + '배'
        : (v / 100).toFixed(2) + '배 (최고 ' + (best / 100).toFixed(2) + '배)';
    }
    function loop(){
      if (broken){
        hx += vx; hy += vy; vy += 1.4; vx *= .995;
        if (performance.now() - brokenT > 850) reform();
      } else if (!drag){
        const dx = BX - hx, dy = (BY - REST) - hy;
        vx = (vx + dx * .16) * .86; vy = (vy + dy * .16) * .86;
        hx += vx; hy += vy;
        if (Math.abs(vx) < .12 && Math.abs(vy) < .12 && Math.abs(dx) < .6 && Math.abs(dy) < .6){
          hx = BX; hy = BY - REST; draw(); raf = 0; return;
        }
      }
      draw();
      raf = requestAnimationFrame(loop);
    }
    const onMove = e => {
      if (!drag || broken) return;
      const p = toSvg(e);
      let dx = p.x - BX, dy = p.y - BY;
      let d = Math.hypot(dx, dy);
      if (d < 1){ dx = 0; dy = -1; d = 1; }
      const u = clamp((d - REST) / (DMAX - REST), 0, 1);
      const len = d > DMAX
        ? LEDGE + (d - DMAX) * 6
        : Math.max(45, d / (1 - K * u));
      hx = BX + dx / d * len;
      hy = Math.min(BY + dy / d * len, BY - 24);
      const cur = Math.hypot(hx - BX, hy - BY);
      peak = Math.max(peak, cur);
      const ratio = cur / REST;
      api.key('늘어난 배율'); api.val(ratio.toFixed(2));
      if (ratio >= SNAPS[snapIdx]){ doSnap(ratio); return; }
      label.textContent = ratio > 4 ? '위험한데…' : ratio > 2.2 ? '쭈우우욱—' : '쭈우욱—';
    };
    const onDown = e => {
      if (broken) return;
      drag = true; peak = REST;
      try { svg.setPointerCapture(e.pointerId); } catch (err) {}
      if (!sq) sq = SND.squeak(150, 620);
      SND.squelch(.2, true);
      onMove(e);
      if (!raf) raf = requestAnimationFrame(loop);
    };
    const onUp = () => {
      if (!drag) return;
      drag = false;
      if (sq){ sq.stop(); sq = null; }
      SND.boing(200, .26); vib(18); api.bump(1);
      const r = svg.getBoundingClientRect();
      fx(r.left + r.width / 2, r.top + r.height * .2, peak / REST > 3 ? '뽀요요요옹' : '뽀요요옹', 'var(--man)', 34, true);
      score(peak / REST);
      if (!raf) raf = requestAnimationFrame(loop);
    };
    svg.addEventListener('pointerdown', onDown);
    svg.addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
    draw();
    api.seg('고무 강도', SNAPN, snapIdx, i => {
      snapIdx = i; DB.set('jjukSnap', i); SND.click(1, .8);
      label.textContent = i === 2 ? '이제 안 끊어집니다. 끝까지 당겨보세요' : '고무를 ‘' + SNAPN[i] + '’ 걸로 갈았습니다';
      draw();
    });
    api.tool('튕겨보기', () => {
      if (broken) return;
      vx += rnd(-16, 16); vy -= rnd(10, 22);
      SND.boing(260, .2); api.bump(1);
      if (!raf) raf = requestAnimationFrame(loop);
    });
    api.tool('기록 지우기', () => {
      DB.clear('jjuk'); best = 0; api.key('최고 배율'); api.val('0.00');
      label.textContent = '처음부터 다시'; SND.tone(330, .12);
    });
    return () => {
      cancelAnimationFrame(raf); if (sq) sq.stop();
      removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onUp);
    };
  }
});
</script>

<script>
/* ══ 쪼물딱 코너 ═══════════════════════════════════════ */

/* ── 9. 팝잇 ── */
TOYS.push({
  id: 'popit', cat: 'jjo', name: '팝잇',
  desc: '실리콘 판을 손가락으로 눌러 뒤집습니다. 뒤집고 판을 돌려서 또 누르고, 끝이 없죠.',
  mount(f, api){
    const PAL = ['#F0537A', '#4FB3E8', '#7BC950', '#F5A623', '#9B6BE8', '#2FBFA7'];
    const ac = activeColor();
    if (ac) PAL.unshift(ac);
    let pi = 0, n = 0;
    const board = document.createElement('div');
    board.className = 'board';
    const cols = SMALL() ? 5 : 6, N = cols * cols;
    board.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
    board.style.width = 'min(100%,' + (cols * 62) + 'px)';
    board.style.setProperty('--boardc', PAL[0]);
    const pits = [];
    for (let i = 0; i < N; i++){
      const d = document.createElement('div');
      d.className = 'pit'; d.dataset.i = i;
      board.appendChild(d); pits.push(d);
    }
    f.appendChild(board);
    fitToField(f, board, cols, cols, 28);
    api.val(0); api.key('뒤집은 횟수');

    function flip(i, quiet){
      const d = pits[i]; if (!d) return;
      const inNow = d.classList.toggle('in');
      SND.pop(inNow ? .92 : .74, quiet ? .45 : .8);
      if (!quiet){
        n++; api.val(n); api.bump(1); vib(6);
        if (n >= 100) ach('popit100');
        const r = d.getBoundingClientRect();
        fx(r.left + r.width / 2, r.top, inNow ? '뽁' : '똑', 'var(--jjo)', 20);
      }
    }
    let down = false, lastI = -1;
    const hit = e => {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      if (el && el.classList.contains('pit') && board.contains(el)){
        const i = +el.dataset.i;
        if (i !== lastI){ lastI = i; flip(i); }
      }
    };
    const onDown = e => { down = true; lastI = -1; try { board.setPointerCapture(e.pointerId); } catch (err) {} hit(e); };
    const onMove = e => { if (down) hit(e); };
    const onUp = () => { down = false; lastI = -1; };
    board.addEventListener('pointerdown', onDown);
    board.addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);

    const timers = [];
    api.tool('판 뒤집기', () => {
      pits.forEach((d, i) => {
        const x = i % cols, y = (i / cols) | 0;
        timers.push(setTimeout(() => flip(i, true), (x + y) * 45));
      });
      n += N; api.val(n); api.bump(N);
    });
    api.tool('색 바꾸기', () => {
      pi = (pi + 1) % PAL.length;
      board.style.setProperty('--boardc', PAL[pi]);
      SND.tone(520 + pi * 60, .1);
    });
    return () => {
      timers.forEach(clearTimeout);
      removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onUp);
    };
  }
});

/* ── 10. 피젯 스피너 ── */
TOYS.push({
  id: 'spinner', cat: 'jjo', name: '피젯 스피너',
  desc: '한 손가락으로 휙 튕기세요. 잘 돌리면 한참 갑니다.',
  mount(f, api){
    const wrap = document.createElement('div');
    wrap.className = 'spin-wrap';
    wrap.innerHTML =
      '<svg viewBox="0 0 300 300" style="width:100%;height:100%;overflow:visible">' +
      '<g id="sp">' +
        '<circle cx="150" cy="72" r="52" fill="#2FBFA7"/>' +
        '<circle cx="82" cy="188" r="52" fill="#F0537A"/>' +
        '<circle cx="218" cy="188" r="52" fill="#F5A623"/>' +
        '<circle cx="150" cy="150" r="62" fill="#3A4A5C"/>' +
        '<circle cx="150" cy="150" r="34" fill="#E8EEF4"/>' +
        '<circle cx="150" cy="150" r="20" fill="#8C9AA8"/>' +
        '<circle cx="150" cy="72" r="20" fill="#12303A" opacity=".35"/>' +
        '<circle cx="82" cy="188" r="20" fill="#12303A" opacity=".35"/>' +
        '<circle cx="218" cy="188" r="20" fill="#12303A" opacity=".35"/>' +
      '</g></svg>' +
      '<div class="rpm mono">0 RPM</div>';
    f.appendChild(wrap);
    const g = wrap.querySelector('#sp'), rpmEl = wrap.querySelector('.rpm');
    let ang = 0, vel = 0, drag = false, last = 0, raf = 0, whir = null;
    let best = DB.rec('spinner'), spun = 0;
    api.val(best); api.key('최고 RPM');

    const cen = () => { const r = wrap.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
    const at = e => { const c = cen(); return Math.atan2(e.clientY - c.y, e.clientX - c.x) * 180 / Math.PI; };

    function loop(){
      if (!drag){
        ang += vel;
        vel *= .9915;
        if (Math.abs(vel) < .04) vel = 0;
      }
      g.setAttribute('transform', 'rotate(' + ang.toFixed(2) + ' 150 150)');
      const rpm = Math.round(Math.abs(vel) * 60 * 60 / 360);
      rpmEl.textContent = rpm + ' RPM';
      if (whir) whir.set(Math.abs(vel) / 26);
      if (rpm >= 3000) ach('spin3000');
      if (rpm > best){ best = rpm; DB.setRec('spinner', rpm); }
      api.val(Math.max(best, rpm));
      if (vel === 0 && !drag){
        raf = 0; if (whir){ whir.stop(); whir = null; }
        return;
      }
      raf = requestAnimationFrame(loop);
    }
    const onDown = e => {
      drag = true; try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
      last = at(e); vel = 0;
      if (!whir) whir = SND.whir();
      if (!raf) raf = requestAnimationFrame(loop);
      SND.click(1.4, .4);
    };
    const onMove = e => {
      if (!drag) return;
      const a = at(e);
      let d = a - last;
      while (d > 180) d -= 360;
      while (d < -180) d += 360;
      last = a; ang += d;
      vel = vel * .55 + d * .45;
      g.setAttribute('transform', 'rotate(' + ang.toFixed(2) + ' 150 150)');
    };
    const onUp = () => {
      if (!drag) return;
      drag = false;
      vel = clamp(vel, -34, 34);
      spun++; api.bump(1);
      if (Math.abs(vel) > 6){
        const c = cen();
        fx(c.x, c.y - 100, '위이이잉', 'var(--jjo)', 30, true);
        vib(14);
      }
      if (!raf) raf = requestAnimationFrame(loop);
    };
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);
    api.tool('힘껏 튕기기', () => {
      vel = 30 + Math.random() * 6;
      if (!whir) whir = SND.whir();
      if (!raf) raf = requestAnimationFrame(loop);
      const c = cen(); fx(c.x, c.y - 100, '휘리릭!', 'var(--jjo)', 32, true);
      api.bump(1); vib(20);
    });
    api.tool('세워두기', () => { vel = 0; });
    return () => {
      cancelAnimationFrame(raf); if (whir) whir.stop();
      removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onUp);
    };
  }
});

/* ── 11. 슬라임 ── */
TOYS.push({
  id: 'slime', cat: 'jjo', name: '슬라임',
  desc: '주무르는 대로 모양이 그대로 남습니다. 손가락 여러 개로 동시에 잡아당겨도 돼요.',
  mount(f, api){
    const fb = fieldBox(f);
    const W = Math.round(clamp(fb.w, 200, 520));
    const H = Math.round(clamp(fb.h, 150, 400));
    const cv = document.createElement('canvas');
    cv.className = 'slime-c';
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    f.appendChild(cv);
    const lab = document.createElement('div');
    lab.className = 'label-mid';
    lab.textContent = '잡아서 주물러 보세요 · 모양이 그대로 남습니다';
    f.appendChild(lab);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);

    /* ── 점·용수철 준비 ─────────────────────────────
       L[i] : i↔i+1 이웃 거리 (겉면 길이)
       D[i] : i↔i+2 거리 (꺾인 각도를 기억하는 뼈대)
       두 값이 주무르는 동안 조금씩 늘어붙어(소성 변형) 모양이 남는다 */
    const N = 60, PAD = 8;
    const R0 = Math.min(W, H) * .27;
    const CX = W / 2, CY = H / 2;
    const L0 = 2 * R0 * Math.sin(Math.PI / N);
    const D0 = 2 * R0 * Math.sin(2 * Math.PI / N);
    const A00 = Math.PI * R0 * R0;
    const MIND = L0 * 1.1;
    let A0 = A00;
    const pts = [], L = [], D = [];
    for (let i = 0; i < N; i++){
      const a = i / N * Math.PI * 2;
      const x = CX + Math.cos(a) * R0, y = CY + Math.sin(a) * R0;
      pts.push({ x: x, y: y, px: x, py: y });
      L.push(L0); D.push(D0);
    }

    const BASE = activeColor() || '#8FD94A';
    const stamp = DB.data.stamp;
    let mem = clamp((DB.data.slimeMem == null ? 100 : DB.data.slimeMem) / 100, 0, 1);
    let touches = DB.rec('slime'), grabs = new Map(), sq = null, raf = 0, idle = 0, shaped = false;
    api.val(touches); api.key('쪼물딱 횟수');

    const GW = [.14, .34, .66, 1, .66, .34, .14];
    function solve(a, b, rest, k){
      const A = pts[a], B = pts[b];
      let dx = B.x - A.x, dy = B.y - A.y;
      const d = Math.hypot(dx, dy);
      if (d < .0001) return;
      const t = (d - rest) / d * .5 * k;
      dx *= t; dy *= t;
      A.x += dx; A.y += dy; B.x -= dx; B.y -= dy;
    }
    function pin(){
      grabs.forEach(g => {
        for (let k = 0; k < g.off.length; k++){
          const o = g.off[k], q = pts[o.j];
          q.x += (g.x + o.dx - q.x) * o.w;
          q.y += (g.y + o.dy - q.y) * o.w;
        }
      });
    }
    function signedArea(){
      let a = 0;
      for (let i = 0; i < N; i++){ const p = pts[i], q = pts[(i + 1) % N]; a += p.x * q.y - q.x * p.y; }
      return a / 2;
    }
    /* 부피(넓이)는 늘 일정하게 — 길게 뽑으면 그만큼 몸통이 얇아진다 */
    function areaSolve(k){
      const a = signedArea(), sgn = a < 0 ? -1 : 1;
      let per = 0;
      for (let i = 0; i < N; i++){ const p = pts[i], q = pts[(i + 1) % N]; per += Math.hypot(q.x - p.x, q.y - p.y); }
      if (per < 1) return;
      const off = clamp((A0 - Math.abs(a)) / per * k, -2.5, 2.5);
      for (let i = 0; i < N; i++){
        const p = pts[i], u = pts[(i - 1 + N) % N], v = pts[(i + 1) % N];
        const tx = v.x - u.x, ty = v.y - u.y;
        const tl = Math.hypot(tx, ty) || 1;
        p.x += (ty / tl) * sgn * off;
        p.y += (-tx / tl) * sgn * off;
      }
    }
    /* 겉면끼리 파고들지 않게 */
    function repel(){
      for (let i = 0; i < N; i++){
        for (let j = i + 2; j < N; j++){
          if (i === 0 && j === N - 1) continue;
          const A = pts[i], B = pts[j];
          let dx = B.x - A.x, dy = B.y - A.y;
          const d2 = dx * dx + dy * dy;
          if (d2 > MIND * MIND || d2 < .0001) continue;
          const d = Math.sqrt(d2);
          const t = (MIND - d) / d * .3;
          dx *= t; dy *= t;
          A.x -= dx; A.y -= dy; B.x += dx; B.y += dy;
        }
      }
    }
    function bounds(){
      for (let i = 0; i < N; i++){
        const p = pts[i];
        if (p.x < PAD) p.x = PAD; else if (p.x > W - PAD) p.x = W - PAD;
        if (p.y < PAD) p.y = PAD; else if (p.y > H - PAD) p.y = H - PAD;
      }
    }
    function step(){
      for (let i = 0; i < N; i++){
        const p = pts[i];
        let vx = clamp((p.x - p.px) * .92, -20, 20);
        let vy = clamp((p.y - p.py) * .92, -20, 20);
        p.px = p.x; p.py = p.y;
        p.x += vx; p.y += vy;
      }
      for (let it = 0; it < 3; it++){
        pin();
        for (let i = 0; i < N; i++) solve(i, (i + 1) % N, L[i], .95);
        for (let i = 0; i < N; i++) solve(i, (i + 2) % N, D[i], .3);
        areaSolve(.72);
        bounds();
      }
      repel(); pin(); bounds();

      /* 주무르는 동안에만 모양이 눌러붙는다. 되돌아오는 정도는 ‘모양 기억’ 값 */
      const creep = grabs.size ? .16 * mem : 0;
      const back = (1 - mem) * (1 - mem) * .05;
      /* 얇게 뽑아 놓으면 그 넓이가 새 기준이 된다 — 놓아도 다시 부풀지 않게 */
      if (creep){
        A0 += (Math.abs(signedArea()) - A0) * creep * .6;
        A0 = clamp(A0, A00 * .45, A00 * 1.6);
      } else if (back){
        A0 += (A00 - A0) * back;
      }
      if (creep || back){
        let per = 0;
        for (let i = 0; i < N; i++){
          const a = pts[i], b = pts[(i + 1) % N], c = pts[(i + 2) % N];
          if (creep){
            L[i] += (Math.hypot(b.x - a.x, b.y - a.y) - L[i]) * creep;
            D[i] += (Math.hypot(c.x - a.x, c.y - a.y) - D[i]) * creep;
          }
          if (back){
            L[i] += (L0 - L[i]) * back;
            D[i] += (D0 - D[i]) * back;
          }
          L[i] = clamp(L[i], L0 * .3, L0 * 4.5);
          per += L[i];
        }
        for (let i = 0; i < N; i++) D[i] = clamp(D[i], D0 * .12, (L[i] + L[(i + 1) % N]) * .98);
        if (!shaped && per > N * L0 * 1.5){ shaped = true; ach('shape'); }
      }
    }
    function draw(){
      ctx.clearRect(0, 0, W, H);
      let cx = 0, cy = 0, lo = W, hi = 0, bot = 0;
      for (let i = 0; i < N; i++){
        cx += pts[i].x; cy += pts[i].y;
        if (pts[i].x < lo) lo = pts[i].x;
        if (pts[i].x > hi) hi = pts[i].x;
        if (pts[i].y > bot) bot = pts[i].y;
      }
      cx /= N; cy /= N;
      ctx.beginPath();
      ctx.ellipse((lo + hi) / 2, Math.min(H - 4, bot + 7), Math.max(18, (hi - lo) * .42), 8, 0, 0, 7);
      ctx.fillStyle = 'rgba(20,30,40,.11)'; ctx.fill();

      ctx.beginPath();
      ctx.moveTo((pts[N - 1].x + pts[0].x) / 2, (pts[N - 1].y + pts[0].y) / 2);
      for (let i = 0; i < N; i++){
        const p = pts[i], q = pts[(i + 1) % N];
        ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
      }
      ctx.closePath();
      const gr = ctx.createRadialGradient(cx - R0 * .4, cy - R0 * .5, R0 * .1, cx, cy, R0 * 1.7);
      gr.addColorStop(0, lighten(BASE, .48));
      gr.addColorStop(.55, BASE);
      gr.addColorStop(1, mix(BASE, '#000000', .34));
      ctx.fillStyle = gr; ctx.fill();
      ctx.strokeStyle = 'rgba(20,40,10,.3)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.clip();
      ctx.beginPath();
      ctx.ellipse(cx - R0 * .38, cy - R0 * .5, R0 * .3, R0 * .16, -.5, 0, 7);
      ctx.fillStyle = 'rgba(255,255,255,.62)'; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx + R0 * .3, cy + R0 * .45, R0 * .2, R0 * .1, .4, 0, 7);
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fill();
      ctx.restore();
      /* 잡은 자리 표시 */
      grabs.forEach(g => {
        ctx.beginPath();
        ctx.arc(g.x, g.y, 13, 0, 7);
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; ctx.stroke();
      });
      if (stamp){
        ctx.font = Math.round(R0 * .42) + 'px Jua, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(20,30,10,.4)';
        ctx.fillText(stamp, cx, cy);
      }
    }
    function loop(){
      step(); draw();
      let mv = 0;
      for (let i = 0; i < N; i++) mv = Math.max(mv, Math.abs(pts[i].x - pts[i].px) + Math.abs(pts[i].y - pts[i].py));
      if (sq) sq.set(clamp(mv / 6, 0, 1) * .7);
      if (grabs.size || mv > .08) idle = 0; else idle++;
      raf = idle > 24 ? 0 : requestAnimationFrame(loop);
    }
    const wake = () => { idle = 0; if (!raf) raf = requestAnimationFrame(loop); };
    const local = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

    const onDown = e => {
      const p = local(e);
      let bi = 0, bd = 1e9;
      for (let i = 0; i < N; i++){
        const d = (pts[i].x - p.x) * (pts[i].x - p.x) + (pts[i].y - p.y) * (pts[i].y - p.y);
        if (d < bd){ bd = d; bi = i; }
      }
      const off = [];
      for (let k = -3; k <= 3; k++){
        const j = (bi + k + N) % N;
        off.push({ j: j, dx: pts[j].x - p.x, dy: pts[j].y - p.y, w: GW[k + 3] });
      }
      grabs.set(e.pointerId, { x: p.x, y: p.y, off: off });
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      if (!sq) sq = SND.goo();
      SND.squelch(.2, true);
      lab.textContent = grabs.size > 1 ? '양쪽으로 쭈욱—' : '쭈욱—';
      wake();
    };
    const onMove = e => {
      const g = grabs.get(e.pointerId);
      if (!g) return;
      const p = local(e);
      g.x = p.x; g.y = p.y;
    };
    const onUp = e => {
      if (!grabs.has(e.pointerId)) return;
      grabs.delete(e.pointerId);
      if (!grabs.size && sq){ sq.stop(); sq = null; }
      SND.squelch(.28, false); vib(12);
      touches++; api.val(touches); DB.setRec('slime', touches); api.bump(1);
      if (touches >= 100) ach('slime100');
      const r = cv.getBoundingClientRect();
      fx(r.left + r.width / 2, r.top + r.height * .25, ['뿌직', '철퍽', '주물럭', '쫀득'][(Math.random() * 4) | 0], 'var(--lime)', 30, true);
      lab.textContent = '모양은 그대로 남아 있어요';
      wake();
    };
    cv.addEventListener('pointerdown', onDown);
    cv.addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
    addEventListener('pointercancel', onUp);

    api.tool('도로 뭉치기', () => {
      A0 = A00;
      for (let i = 0; i < N; i++){
        L[i] = L0; D[i] = D0;
        const a = i / N * Math.PI * 2;
        const p = pts[i];
        p.x += (CX + Math.cos(a) * R0 - p.x) * .5;
        p.y += (CY + Math.sin(a) * R0 - p.y) * .5;
        p.px = p.x; p.py = p.y;
      }
      shaped = false;
      SND.squelch(.32, true); api.bump(1);
      lab.textContent = '동그랗게 다시 뭉쳤습니다';
      wake();
    });
    api.tool('탁 치기', () => {
      for (let i = 0; i < N; i++){ pts[i].px = pts[i].x - rnd(-9, 9); pts[i].py = pts[i].y - rnd(-9, 9); }
      SND.squelch(.32, true); api.bump(1);
      lab.textContent = '부르르—';
      wake();
    });
    api.range('모양 기억', 0, 100, Math.round(mem * 100), v => {
      mem = v / 100; DB.set('slimeMem', v);
      lab.textContent = v > 85 ? '주무른 모양이 그대로 남습니다' : v > 40 ? '천천히 원래대로 돌아옵니다' : '고무처럼 바로 돌아옵니다';
      wake();
    });
    draw(); wake();
    return () => {
      cancelAnimationFrame(raf); if (sq) sq.stop();
      removeEventListener('pointerup', onUp); removeEventListener('pointercancel', onUp);
    };
  }
});

/* ── 12. 딸깍 볼펜 ── */
TOYS.push({
  id: 'pen', cat: 'jjo', name: '딸깍 볼펜',
  desc: '수업 시간에 뒷자리에서 나던 그 소리. 옆 사람 눈치 안 봐도 됩니다.',
  mount(f, api){
    f.innerHTML =
      '<svg class="pen" viewBox="0 0 160 380" id="pensvg">' +
      '<g id="knock"><rect x="66" y="14" width="28" height="34" rx="8" fill="#E8446E"/></g>' +
      '<rect x="52" y="44" width="56" height="250" rx="16" fill="#3A4A5C"/>' +
      '<rect x="62" y="70" width="14" height="200" rx="7" fill="rgba(255,255,255,.22)"/>' +
      '<rect x="96" y="60" width="10" height="120" rx="5" fill="#C9D5DF"/>' +
      '<path d="M52 294 L80 348 L108 294Z" fill="#5A6B7C"/>' +
      '<rect id="tip" x="75" y="340" width="10" height="0" rx="4" fill="#12203A"/>' +
      '</svg>' +
      '<div class="label-mid">누르세요. 스페이스바도 됩니다</div>';
    const svg = f.querySelector('#pensvg'), knock = f.querySelector('#knock'), tip = f.querySelector('#tip');
    let out = false, n = DB.rec('pen'), times = [];
    api.val(n); api.key('총 딸깍');
    const lab = f.querySelector('.label-mid');
    function clickPen(){
      out = !out;
      knock.setAttribute('transform', out ? 'translate(0,10)' : 'translate(0,0)');
      tip.setAttribute('height', out ? 18 : 0);
      SND.clack(out ? 1.06 : .84, 1.05);
      vib(5);
      n++; api.val(n); DB.setRec('pen', n); api.bump(1);
      if (n >= 200) ach('pen200');
      const r = svg.getBoundingClientRect();
      fx(r.left + r.width / 2, r.top + 20, out ? '딸깍' : '깍', 'var(--jjo)', 24);
      const now = performance.now();
      times.push(now);
      times = times.filter(t => now - t < 4000);
      if (times.length > 3){
        const cpm = Math.round((times.length - 1) / ((now - times[0]) / 60000));
        lab.textContent = '분당 ' + cpm + '번 딸깍 중';
      }
    }
    const onDown = () => clickPen();
    const onKey = e => { if (e.code === 'Space' || e.key === ' '){ e.preventDefault(); clickPen(); } };
    svg.addEventListener('pointerdown', onDown);
    addEventListener('keydown', onKey);
    api.tool('연타', () => {
      let i = 0;
      const t = setInterval(() => { clickPen(); if (++i > 11) clearInterval(t); }, 95);
    });
    return () => { svg.removeEventListener('pointerdown', onDown); removeEventListener('keydown', onKey); };
  }
});

/* ── 13. 딸깍 스위치판 ── */
TOYS.push({
  id: 'switch', cat: 'jjo', name: '딸깍 스위치판',
  desc: '아무 의미 없는 스위치 여덟 개. 하나씩 소리가 다릅니다.',
  mount(f, api){
    const NOTES = [262, 294, 330, 392, 440, 523, 587, 659];
    const bank = document.createElement('div');
    bank.className = 'sw-bank';
    const sws = [];
    NOTES.forEach((hz, i) => {
      const b = document.createElement('button');
      b.className = 'sw'; b.type = 'button';
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<i></i><b>' + (i + 1) + '</b>';
      bank.appendChild(b); sws.push(b);
    });
    f.appendChild(bank);
    let n = 0;
    api.val(0); api.key('올린 횟수');
    function toggle(i, quiet){
      const b = sws[i], on = b.classList.toggle('on');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (sws.every(x => x.classList.contains('on'))) ach('sw8');
      SND.clack(on ? 1 : .78, .85);
      SND.pluck(NOTES[i] * (on ? 1 : .5), on ? .18 : .09);
      if (!quiet){
        n++; api.val(n); api.bump(1); vib(6);
        const r = b.getBoundingClientRect();
        fx(r.left + r.width / 2, r.top, on ? '딸깍' : '탁', 'var(--jjo)', 20);
      }
    }
    const onClick = e => {
      const b = e.target.closest('.sw');
      if (b) toggle(sws.indexOf(b));
    };
    bank.addEventListener('click', onClick);
    const timers = [];
    api.tool('전부 내리기', () => {
      sws.forEach((b, i) => { if (b.classList.contains('on')) timers.push(setTimeout(() => toggle(i, true), i * 70)); });
    });
    api.tool('물결치기', () => {
      sws.forEach((b, i) => timers.push(setTimeout(() => toggle(i, true), i * 90)));
      n += 8; api.val(n); api.bump(8);
    });
    return () => { bank.removeEventListener('click', onClick); timers.forEach(clearTimeout); };
  }
});
</script>

<script>
/* ══ 조립 ══════════════════════════════════════════════ */
const CATS = [
  { id: 'pok', name: '뽁뽁이', en: 'BUBBLE WRAP', c: 'var(--pok)', t: 'var(--pok-t)' },
  { id: 'man', name: '말랑이네', en: 'SQUEEZE', c: 'var(--man)', t: 'var(--man-t)' },
  { id: 'jjo', name: '쪼물딱', en: 'FIDGET', c: 'var(--jjo)', t: 'var(--jjo-t)' }
];
const HINTS = {
  classic: '끌면 주르륵 터집니다',
  infinite: '가만 두면 슬그머니 다시 부풉니다',
  giant: '한 알씩 꾹 밟아보세요',
  tiny: '손가락으로 쓸어버리세요',
  domino: '한 알만 눌러도 번져나갑니다',
  mandeuk: '길게 누를수록 눈이 튀어나옵니다',
  bollok: '100%를 넘기면 뻥 터집니다',
  jjuk: '멀리 당길수록 화면이 뒤로 물러납니다',
  popit: '끌면 여러 개가 한 번에 뒤집힙니다',
  spinner: '빙 돌리듯 튕기세요',
  slime: '손가락 두 개로 잡아당겨도 됩니다',
  pen: '스페이스바로도 눌립니다',
  switch: '여덟 개가 각각 다른 소리입니다'
};
const shelf = document.getElementById('shelf');
const stage = document.getElementById('stage');
const field = document.getElementById('field');
const toolsEl = document.getElementById('tools');
const nameEl = document.getElementById('t-name');
const descEl = document.getElementById('t-desc');
const valEl = document.getElementById('t-val');
const keyEl = document.getElementById('t-key');
const tallyEl = document.getElementById('tally');
const muteEl = document.getElementById('mute');

const btns = {};
CATS.forEach(cat => {
  const box = document.createElement('div');
  box.style.setProperty('--c', cat.c);
  box.style.setProperty('--tint', cat.t);
  const list = TOYS.filter(t => t.cat === cat.id);
  box.innerHTML = '<div class="cat-h"><span class="bar"></span><strong>' + cat.name +
    '</strong><em>' + list.length + '종</em></div>';
  const ul = document.createElement('div');
  ul.className = 'cat-list';
  list.forEach(toy => {
    const b = document.createElement('button');
    b.className = 'toy-btn'; b.type = 'button';
    b.innerHTML = '<span class="dot"></span>' + toy.name;
    b.onclick = () => select(toy.id);
    ul.appendChild(b); btns[toy.id] = b;
  });
  box.style.flex = list.length + ' 1 auto';
  box.appendChild(ul);
  shelf.appendChild(box);
});

let cleanup = null;
function select(id){
  const toy = TOYS.find(t => t.id === id) || TOYS[0];
  if (cleanup){ try { cleanup(); } catch (e) {} cleanup = null; }
  const cat = CATS.find(c => c.id === toy.cat);
  stage.style.setProperty('--c', cat.c);
  stage.style.setProperty('--tint', cat.t);
  Object.keys(btns).forEach(k => btns[k].setAttribute('aria-current', k === id ? 'true' : 'false'));
  nameEl.textContent = toy.name;
  descEl.textContent = toy.desc;
  field.innerHTML = ''; toolsEl.innerHTML = '';
  valEl.textContent = '0'; keyEl.textContent = '';
  const api = {
    bump(n){ tally(n); },
    val(v){ valEl.textContent = typeof v === 'number' ? v.toLocaleString('ko-KR') : v; },
    key(k){ keyEl.textContent = k; },
    tool(label, fn){
      const b = document.createElement('button');
      b.className = 'tool'; b.type = 'button'; b.textContent = label;
      b.onclick = fn; toolsEl.appendChild(b);
      return b;
    },
    seg(label, opts, idx, fn){
      const wrap = document.createElement('div');
      wrap.className = 'seg';
      wrap.setAttribute('aria-label', label);
      opts.forEach((o, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = o;
        b.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
        b.onclick = () => {
          [...wrap.children].forEach((c, k) => c.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
          fn(i);
        };
        wrap.appendChild(b);
      });
      toolsEl.appendChild(wrap);
    },
    range(label, min, max, val, fn){
      const w = document.createElement('label');
      w.className = 'rng';
      const s = document.createElement('span'); s.textContent = label;
      const inp = document.createElement('input');
      inp.type = 'range'; inp.min = min; inp.max = max; inp.value = val;
      inp.oninput = e => fn(+e.target.value);
      w.appendChild(s); w.appendChild(inp);
      toolsEl.appendChild(w);
    },
    shake(){
      if (REDUCED) return;
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
      setTimeout(() => stage.classList.remove('shake'), 360);
    }
  };
  try { cleanup = toy.mount(field, api) || null; }
  catch (err){ field.textContent = '이 장난감이 고장났어요. 다른 걸 골라주세요.'; console.error(err); }
  const hint = document.createElement('span');
  hint.className = 'hint';
  hint.textContent = HINTS[id] || '누르고 끌면 더 재밌어요';
  toolsEl.appendChild(hint);
  DB.last(id);
  if (!DB.data.seen) DB.data.seen = [];
  if (DB.data.seen.indexOf(id) < 0){
    DB.data.seen.push(id); DB.set('seen', DB.data.seen);
    if (DB.data.seen.length >= TOYS.length) ach('alltoys');
    else refreshBar();
  }
}

let tallyN = DB.data.tally;
function tally(n){
  const before = rankOf(tallyN).lv;
  tallyN = DB.bump(n);
  tallyEl.textContent = tallyN.toLocaleString('ko-KR');
  tallyEl.classList.add('bump');
  clearTimeout(tally._t);
  tally._t = setTimeout(() => tallyEl.classList.remove('bump'), 130);
  const now = rankOf(tallyN);
  if (now.lv > before){
    if (now.lv >= 4) ach('lv4');
    refreshBar();
    toast('Lv.' + now.lv + ' 승급 — 이제 ‘' + now.name + '’ 입니다', 3200);
    SND.tone(523, .13); setTimeout(() => SND.tone(659, .13), 120); setTimeout(() => SND.tone(784, .3), 240);
    fx(innerWidth / 2, innerHeight * .42, 'LEVEL UP!', 'var(--jjo)', 44, true);
  } else if (n > 0 && tallyN % 50 === 0) refreshBar();
}
tallyEl.textContent = tallyN.toLocaleString('ko-KR');

/* ══ 설정 바 ═══════════════════════════════════════════ */
const bar = document.getElementById('bar');
function chip(html, fn){
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.innerHTML = html;
  b.onclick = fn; return b;
}
function refreshBar(){
  const r = rankOf(DB.data.tally);
  bar.innerHTML = '';
  const lv = document.createElement('div');
  lv.className = 'lv';
  lv.innerHTML = '<b>Lv.' + r.lv + '</b>' + r.name +
    (r.next ? '<i>다음까지 ' + (r.next - DB.data.tally).toLocaleString('ko-KR') + '번</i>' : '<i>만렙</i>');
  bar.appendChild(lv);
  bar.appendChild(chip('✎ ' + (DB.data.stamp ? '‘' + DB.data.stamp + '’ 새겨짐' : '새길 글자'), openStamp));
  const ac = activeColor();
  bar.appendChild(chip('<span class="sw" style="background:' + (ac || 'var(--bub1)') + '"></span>색 도감<span class="n">' +
    DB.data.dex.length + '/' + DEX.length + '</span>', openDex));
  bar.appendChild(chip('도장판<span class="n">' + (DB.data.ach || []).length + '/' + ACHS.length + '</span>', openAch));
  bar.appendChild(chip('오늘의 운세', () => openFortune(false)));
  bar.appendChild(chip('↺ 처음부터', openReset));
}

/* ── 각인 ── */
function openStamp(){
  modal((box, close) => {
    box.innerHTML = '<h3>무엇을 부숴볼까요</h3>' +
      '<p class="sub">적은 글자가 뽁뽁이 알과 볼록이, 슬라임에 새겨집니다. 최대 5글자.</p>';
    const inp = document.createElement('input');
    inp.className = 'txt'; inp.maxLength = 5; inp.value = DB.data.stamp;
    inp.placeholder = '월요일';
    box.appendChild(inp);
    const row = document.createElement('div');
    row.className = 'row';
    const clr = document.createElement('button');
    clr.className = 'tool'; clr.textContent = '지우기';
    clr.onclick = () => { apply(''); };
    const ok = document.createElement('button');
    ok.className = 'tool'; ok.textContent = '새기기';
    ok.onclick = () => apply(inp.value.trim());
    row.appendChild(clr); row.appendChild(ok);
    box.appendChild(row);
    inp.onkeydown = e => { if (e.key === 'Enter') apply(inp.value.trim()); };
    function apply(v){
      DB.set('stamp', v);
      refreshBar(); select(DB.last()); close();
      toast(v ? '‘' + v + '’ 새겼습니다. 실컷 부수세요' : '각인을 지웠습니다');
      SND.click(1, 1);
    }
  });
}

/* ── 색 도감 ── */
function openDex(){
  modal((box, close) => {
    box.innerHTML = '<h3>숨은 색 도감</h3>' +
      '<p class="sub">뽁뽁이를 터뜨리다 보면 반짝이는 알이 섞여 있습니다. 그걸 터뜨리면 색이 하나씩 열려요. ' +
      '연 색을 고르면 뽁뽁이·볼록이·팝잇·슬라임이 그 색으로 바뀝니다.<br><b>' +
      DB.data.dex.length + ' / ' + DEX.length + '</b> 모음</p>';
    const grid = document.createElement('div');
    grid.className = 'dex';
    DEX.forEach((c, i) => {
      const got = dexHas(i);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = got ? (DB.data.color === i ? 'on' : '') : 'locked';
      b.innerHTML = '<span class="sw" style="background:' + (got ? c[1] : 'var(--line)') + '"></span>' +
        (got ? c[0] : '???');
      if (got) b.onclick = () => {
        DB.set('color', DB.data.color === i ? null : i);
        refreshBar(); select(DB.last()); close();
        SND.tone(700, .16);
        toast(DB.data.color === null ? '기본 색으로 돌아왔어요' : '‘' + c[0] + '’ 색으로 갈아끼웠어요');
      };
      grid.appendChild(b);
    });
    box.appendChild(grid);
    const row = document.createElement('div');
    row.className = 'row';
    const rst = document.createElement('button');
    rst.className = 'tool'; rst.textContent = '기본색으로';
    rst.onclick = () => { DB.set('color', null); refreshBar(); select(DB.last()); close(); };
    const cl = document.createElement('button');
    cl.className = 'tool'; cl.textContent = '닫기'; cl.onclick = close;
    row.appendChild(rst); row.appendChild(cl);
    box.appendChild(row);
  });
}

/* ── 도장판 ── */
function openAch(){
  modal((box, close) => {
    const got = (DB.data.ach || []).length;
    box.innerHTML = '<h3>도장판</h3>' +
      '<p class="sub">장난감을 만지다 보면 하나씩 찍힙니다. 굳이 다 모을 필요는 없어요.<br><b>' +
      got + ' / ' + ACHS.length + '</b> 개</p>';
    const g = document.createElement('div');
    g.className = 'achs';
    ACHS.forEach(a => {
      const d = document.createElement('div');
      const has = achHas(a[0]);
      if (has) d.className = 'got';
      d.innerHTML = '<b>' + (has ? a[1] : '???') + '</b>' + a[2];
      g.appendChild(d);
    });
    box.appendChild(g);
    const row = document.createElement('div');
    row.className = 'row';
    const wipe = document.createElement('button');
    wipe.className = 'tool'; wipe.textContent = '↺ 처음부터';
    wipe.onclick = () => { close(); openReset(); };
    const cl = document.createElement('button');
    cl.className = 'tool'; cl.textContent = '닫기'; cl.onclick = close;
    row.appendChild(wipe); row.appendChild(cl);
    box.appendChild(row);
  });
}

/* ── 전부 초기화 ── */
function openReset(){
  modal((box, close) => {
    const d = DB.data;
    box.innerHTML = '<h3>처음부터 다시</h3>' +
      '<p class="sub">이 브라우저에 쌓아둔 기록을 전부 지웁니다. 되돌릴 수 없어요.</p>';
    const list = document.createElement('div');
    list.className = 'fort';
    list.style.cssText = 'font-size:14px;text-align:left;line-height:1.95';
    list.innerHTML =
      '· 누적 <b>' + d.tally.toLocaleString('ko-KR') + '번</b> 쪼물딱 · Lv.' + rankOf(d.tally).lv + ' ‘' + rankOf(d.tally).name + '’<br>' +
      '· 장난감별 최고 기록 (볼록이 %, 쭈욱이 배율, 스피너 RPM…)<br>' +
      '· 숨은 색 <b>' + (d.dex || []).length + ' / ' + DEX.length + '</b>개<br>' +
      '· 도장판 <b>' + (d.ach || []).length + ' / ' + ACHS.length + '</b>개<br>' +
      '· 새긴 글자' + (d.stamp ? ' ‘' + d.stamp + '’' : ' 없음') + ' · 고른 색 · 소리 설정';
    box.appendChild(list);
    const row = document.createElement('div');
    row.className = 'row';
    const no = document.createElement('button');
    no.className = 'tool'; no.textContent = '그냥 둘래요'; no.onclick = close;
    const yes = document.createElement('button');
    yes.className = 'tool';
    yes.style.cssText = 'border-color:var(--man);box-shadow:0 3px 0 var(--man);color:var(--man)';
    yes.textContent = '전부 지우기';
    let armed = false;
    yes.onclick = () => {
      if (!armed){
        armed = true;
        yes.textContent = '정말요? 한 번 더 누르면 지워집니다';
        SND.tone(300, .14);
        return;
      }
      try { localStorage.removeItem('jjomullak.v1'); } catch (e) {}
      location.reload();
    };
    row.appendChild(no); row.appendChild(yes);
    box.appendChild(row);
  });
}

/* ── 오늘의 운세 ── */
function openFortune(auto){
  const key = todayKey();
  /* 열 때마다 새로 뽑는다 — 사람마다, 볼 때마다 다르게 */
  const f = pickOne(FORTUNES);
  const luckyToy = pickOne(TOYS);
  const luckyColor = pickOne(DEX);
  modal((box, close) => {
    box.innerHTML = '<h3>오늘의 쪼물딱 운세</h3><p class="sub">' + key + '</p>' +
      '<div class="fort">' + f + '</div>' +
      '<div class="fort-l"><span>행운의 장난감 · ' + luckyToy.name + '</span>' +
      '<span>행운의 색 · <b style="color:' + luckyColor[1] + '">' + luckyColor[0] + '</b></span></div>';
    const row = document.createElement('div');
    row.className = 'row';
    const go = document.createElement('button');
    go.className = 'tool'; go.textContent = luckyToy.name + ' 만지러 가기';
    go.onclick = () => { close(); select(luckyToy.id); };
    const cl = document.createElement('button');
    cl.className = 'tool'; cl.textContent = '닫기'; cl.onclick = close;
    row.appendChild(go); row.appendChild(cl);
    box.appendChild(row);
  });
  if (auto) DB.set('fortuneDay', key);
}
refreshBar();
if (DB.data.fortuneDay !== todayKey()) setTimeout(() => openFortune(true), 800);

addEventListener('pointerdown', function wakeSnd(){
  SND.wake();
  removeEventListener('pointerdown', wakeSnd);
}, { passive: true });

muteEl.onclick = () => {
  const on = SND.toggle();
  muteEl.setAttribute('aria-pressed', on ? 'true' : 'false');
  muteEl.textContent = on ? '소리 켜짐' : '소리 꺼짐';
  if (on) SND.tone(660, .12);
};

const foot = document.createElement('p');
foot.className = 'foot';
foot.textContent = '소리를 켜야 제맛입니다 · 기록은 이 브라우저에만 남습니다 · 위 ‘↺ 처음부터’로 전부 지울 수 있어요';
document.querySelector('.wrap').appendChild(foot);

select(TOYS.some(t => t.id === DB.last()) ? DB.last() : TOYS[0].id);

/* 화면 폭이 크게 바뀌면 판을 새로 깐다 (뽁뽁이 칸 수가 달라지므로) */
let wasSmall = SMALL(), rzT = null;
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (SMALL() !== wasSmall){ wasSmall = SMALL(); select(DB.last()); }
  }, 220);
});
</script>
