    label(g, k<0.05?'아직 회색 못':k<0.4?'붉은 기가 돌기 시작':k<0.8?'구리색이 뚜렷해짐':'구리로 덮임',
          W/2, H-16, k<0.05?P.dim:P.cop, 13);
  },
  read:(v)=> v.min===0 ? '담그기 전' : `${v.min}분 경과`,
  tip:(v)=> v.min<5 ? '슬라이더를 천천히 밀어 시간을 흘려 보세요.'
          : '철이 구리보다 전자를 잘 내줍니다. 철은 이온이 되어 녹고, 구리 이온은 전자를 받아 못에 달라붙습니다.'
};

/* ---------- 4. 슬라임 : 가교제 양에 따른 그물 ---------- */
const simSlime = {
  controls:[
    {t:'range', id:'x', label:'렌즈 세정액 양', min:0, max:10, value:0, marks:['안 넣음','많이']},
    {t:'button', id:'pull', label:'✋ 당겨보기'}
  ],
  init:()=>({pull:0}),
  onButton(id,v,st){ if(id==='pull') st.pull=1; },
  draw(g,W,H,v,st,t){
    const k=v.x/10;
    if(st.pull>0) st.pull=Math.max(0, st.pull-0.012);
    const stretch = st.pull * (k<0.15? 1.6 : k<0.75? 1.0 : 0.25);
    const cx=W/2, cy=H*0.46;
    // 사슬
    const N=9;
    for(let i=0;i<N;i++){
      const a=i/N*Math.PI*2, rad=64;
      const ox=cx+Math.cos(a)*rad*(1+stretch*1.6), oy=cy+Math.sin(a)*rad*(1-stretch*0.25);
      g.strokeStyle=k>0.1?'rgba(168,224,95,.85)':'rgba(147,170,187,.75)'; g.lineWidth=4; g.lineCap='round';
      g.beginPath();
      for(let s=0;s<=16;s++){
        const p=s/16, px=lerp(ox-46,ox+46,p), py=oy+Math.sin(p*7+i+t*(k>0.1?0.6:2))*7;
        s?g.lineTo(px,py):g.moveTo(px,py);
      }
      g.stroke();
    }
    // 가교
    const links=Math.round(k*22);
    for(let i=0;i<links;i++){
      const a=i/22*Math.PI*2, rad=64;
      const x1=cx+Math.cos(a)*rad*(1+stretch*1.6), y1=cy+Math.sin(a)*rad*(1-stretch*0.25);
      const b=(i+3)/22*Math.PI*2;
      const x2=cx+Math.cos(b)*rad*(1+stretch*1.6), y2=cy+Math.sin(b)*rad*(1-stretch*0.25);
      g.strokeStyle=`rgba(79,210,240,${0.35+k*0.5})`; g.lineWidth=2;
      g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
      g.fillStyle=P.cyan; g.beginPath(); g.arc((x1+x2)/2,(y1+y2)/2,3,0,7); g.fill();
    }
    label(g,'긴 사슬(물풀)', 14, 22, k>0.1?P.lime:P.mut, 12, 'left');
    label(g,'다리(가교)', W-14, 22, P.cyan, 12, 'right');
    label(g, k<0.1?'사슬이 따로따로 → 흐른다'
            : k<0.75?'적당히 이어짐 → 쭉쭉 늘어난다'
            : '너무 많이 이어짐 → 뻣뻣하고 잘 끊긴다',
          W/2, H-16, k<0.1?P.mut:k<0.75?P.lime:P.pink, 13);
  },
  read:(v)=> v.x===0?'물풀 그대로': v.x<8?'슬라임':'딱딱한 덩어리',
  tip:(v,st)=> v.x===0 ? '세정액을 조금씩 넣으며 당겨보기를 눌러 보세요.'
             : v.x<8 ? '사슬 사이가 다리로 이어져 그물이 됐습니다. 흐르지 않고 늘어납니다.'
             : '다리가 너무 많으면 사슬이 못 움직여서 뚝 끊깁니다.'
};

/* ---------- 5. 과일 전지 : 금속 조합으로 전압이 정해진다 ---------- */
/* [기호, 이름, 표준환원전위 E°(V), 실제 과일전지에서 재지는 유효전위(V)]
   알루미늄은 표면에 산화알루미늄 막이 즉시 생겨 반응이 막히므로, E°(-1.66V)대로는 절대 나오지 않는다.
   실제 레몬전지에서 Al-Cu 는 0.5~0.7V 정도라 유효전위를 그에 맞춰 둔다. */
const METALS = [['zn','아연',-0.76,-0.76],['al','알루미늄',-1.66,-0.40],
                ['fe','철',-0.44,-0.44],['cu','구리',0.34,0.34],['ag','은',0.80,0.75]];
const simCell = {
  controls:[
    {t:'select', id:'a', label:'왼쪽 금속', value:'zn', options:METALS.map(m=>[m[0],m[1]])},
    {t:'select', id:'b', label:'오른쪽 금속', value:'cu', options:METALS.map(m=>[m[0],m[1]])},
    {t:'select', id:'e', label:'담글 것', value:'lemon', options:[['lemon','레몬'],['potato','감자'],['salt','소금물'],['pure','증류수']]},
    {t:'range',  id:'n', label:'몇 개를 이어 붙일까', min:1, max:4, value:1, unit:'개'}
  ],
  /* 아연을 쓴 셀은 산성이 아무리 세도 한 개당 약 1.0V 를 넘지 못한다.
     전류를 안 뽑아도 아연이 산에 저절로 녹아 버리는 반응이 따로 일어나기 때문이다
     (Goodisman, J. Chem. Educ. 78(4) 516, 2001). 이 상한이 없으면 아연-은 조합에서
     레몬 한 개로 1.28V 라는, 실제로는 나올 수 없는 값이 나온다. */
  CAP_ZN: 1.0,
  perCell(v){
    const A=METALS.find(m=>m[0]===v.a)[3], B=METALS.find(m=>m[0]===v.b)[3];
    const eff = v.e==='pure' ? 0 : v.e==='lemon' ? 0.85 : v.e==='potato' ? 0.70 : 0.65;
    const raw = Math.abs(B-A)*eff;
    const usesZn = (v.a==='zn' || v.b==='zn');
    return usesZn ? Math.min(raw, this.CAP_ZN) : raw;
  },
  capped(v){
    const A=METALS.find(m=>m[0]===v.a)[3], B=METALS.find(m=>m[0]===v.b)[3];
    const eff = v.e==='pure' ? 0 : v.e==='lemon' ? 0.85 : v.e==='potato' ? 0.70 : 0.65;
    return (v.a==='zn'||v.b==='zn') && Math.abs(B-A)*eff > this.CAP_ZN + 1e-9;
  },
  volts(v){ return this.perCell(v) * v.n; },
  _oldVolts(v){
    const A=METALS.find(m=>m[0]===v.a)[3], B=METALS.find(m=>m[0]===v.b)[3];
    /* 전압은 전해질의 산성도(pH)에 따라 달라진다. 산성이 셀수록 높다(네른스트 식).
       예전에는 소금물(0.9)이 레몬(0.85)보다 높게 잡혀 있었는데, 소금물은 중성이라
       산성인 레몬즙보다 낮아야 맞다. 볼타의 첫 전지가 소금물로 0.7V대였던 것과도 맞는다. */
    const eff = v.e==='pure' ? 0 : v.e==='lemon' ? 0.85 : v.e==='potato' ? 0.70 : 0.65;
    return Math.abs(B-A)*eff*v.n;
  },
  ideal(v){
    const A=METALS.find(m=>m[0]===v.a)[2], B=METALS.find(m=>m[0]===v.b)[2];
    return Math.abs(B-A);
  },
  /* 전압만 보면 레몬 두 개로도 1.8V 가 넘지만, 실제로는 레몬 하나가 수백~수천 Ω의
     큰 내부 저항을 가지고 있어서 전류가 거의 안 흐른다(여기서는 대표값 900Ω).
     그래서 실제 수업에서도 LED 를 켜려면 서너 개 이상을 직렬로 이어야 한다.
     전압이 아니라 전류로 판정한다. */
  R_INT: 900, VF: 1.8, I_MIN: 0.0005,
  current(v){
    const V=this.volts(v);
    if(V <= this.VF) return 0;
    return (V - this.VF) / (this.R_INT * v.n);
  },
  lit(v){ return this.current(v) >= this.I_MIN; },
  draw(g,W,H,v,st,t){
    const V=this.volts(v), I=this.current(v), lit=this.lit(v);
    const n=v.n, cw=Math.min(96, (W*0.52)/n), y=H*0.52;
    for(let i=0;i<n;i++){
      const x=W*0.10 + i*(cw+10);
      g.fillStyle = v.e==='lemon'?'#d8d24a': v.e==='potato'?'#c9a877': v.e==='salt'?'#7fb6cc':'#9fd0e0';
      g.beginPath(); g.ellipse(x+cw/2, y, cw*0.44, 30, 0,0,7); g.fill();
      g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=2; g.stroke();
      const mc = m => m==='zn'?'#b9c2c7': m==='al'?'#cfd6da': m==='fe'?'#8d949a': m==='cu'?'#c9773f':'#dfe6ea';
      g.fillStyle=mc(v.a); rr(g,x+cw*0.24, y-46, 8, 40, 2); g.fill();
      g.fillStyle=mc(v.b); rr(g,x+cw*0.64, y-46, 8, 40, 2); g.fill();
      if(i<n-1){ g.strokeStyle=P.gold; g.lineWidth=2;
        g.beginPath(); g.moveTo(x+cw*0.68, y-44); g.lineTo(x+cw+10+cw*0.28, y-44); g.stroke(); }
    }
    /* ── 바깥 회로 : 닫힌 한 바퀴 ────────────────────────────────
       전자는 반응성이 큰(전위가 낮은) 금속에서 나와 도선 전체를 한 방향으로 돌아
       반드시 반대쪽 금속으로 들어간다. 나가는 곳만 있고 들어오는 곳이 없으면 회로가 아니다.
       과일 속에서는 이온이 이동해 회로의 나머지 반쪽을 잇는다. */
    /* 극성은 표준전위가 아니라 '실제로 작동하는 전위'로 정해야 한다.
       예를 들어 알루미늄-아연은 표준전위만 보면 알루미늄이 (-)극이지만,
       실제로는 알루미늄이 산화막에 막혀 아연이 (-)극이 된다. 전압 계산과 극성 표시가
       서로 다른 값을 쓰면 화살표 방향과 전압이 어긋난다. */
    const eA=METALS.find(m=>m[0]===v.a)[3], eB=METALS.find(m=>m[0]===v.b)[3];
    const rightIsPlus = eB > eA;                 // 유효 전위가 큰 쪽이 (+)
    const lx0=W*0.10+cw*0.28, rx0=W*0.10+(n-1)*(cw+10)+cw*0.68;
    const ytop=H*0.13, yret=H*0.27, xv=W*0.80, ledY=(ytop+yret)/2;
    const flow = V>0.05;

    // 도선 : 왼쪽 전극 → 위 → 오른쪽(LED 통과) → 되돌아와 → 오른쪽 전극. 끊긴 데가 없다.
    const loop=[[lx0,y-46],[lx0,ytop],[xv,ytop],[xv,yret],[rx0,yret],[rx0,y-46]];
    g.strokeStyle= flow? P.gold : '#3d4f59'; g.lineWidth=2; g.lineJoin='round';
    g.beginPath(); loop.forEach((p,i)=> i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke();

    // 전압계 — LED 양단에 나란히(병렬)
    const gx=W*0.905;
    g.strokeStyle='#3d4f59'; g.lineWidth=1.5;
    g.beginPath(); g.moveTo(xv,ytop); g.lineTo(gx,ytop); g.stroke();
    g.beginPath(); g.moveTo(xv,yret); g.lineTo(gx,yret); g.stroke();
    g.fillStyle='#0d2331'; g.beginPath(); g.arc(gx,ledY,30,0,7); g.fill();
    g.strokeStyle=P.line; g.lineWidth=2.5; g.stroke();
    const ang = Math.PI*0.78 + clamp(V/4,0,1)*Math.PI*1.44*0.62;
    g.strokeStyle=P.pink; g.lineWidth=2.5;
    g.beginPath(); g.moveTo(gx,ledY); g.lineTo(gx+Math.cos(ang)*22, ledY+Math.sin(ang)*22); g.stroke();
    label(g,'전압계', gx, ledY-40, P.dim, 10);
    label(g, V.toFixed(2)+' V', gx, ledY+46, V>0.05?P.ink:P.dim, 15);

    // LED — 회로에 직렬로 끼워져 있다
    g.fillStyle = lit? P.lime : '#20323c';
    g.beginPath(); g.arc(xv,ledY,13,0,7); g.fill();
    g.strokeStyle=P.line; g.lineWidth=2; g.stroke();
    if(lit){ g.fillStyle='rgba(168,224,95,.18)'; g.beginPath(); g.arc(xv,ledY,21+Math.sin(t*6)*3,0,7); g.fill(); }
    label(g, lit?'LED 켜짐':'아직 안 켜짐', xv-20, ledY, lit?P.lime:P.dim, 11, 'right');
    label(g, I>0 ? `${(I*1e6).toFixed(0)} μA` : '0 μA', xv-20, ledY+18, I>0?P.gold:P.dim, 11, 'right');
    if(!lit && V>0.05)
      label(g, V<=this.VF ? `전압이 ${this.VF}V 를 못 넘습니다`
                          : `전압은 넘었지만 전류가 모자랍니다 (${(this.I_MIN*1e6)|0}μA 필요)`,
            xv-20, ledY+36, P.dim, 10, 'right');

    if(flow){
      // 전자 알갱이가 도선 전체를 끊김 없이 한 방향으로 돈다
      const pts = rightIsPlus ? loop : [...loop].reverse();
      const seg=[]; let L=0;
      for(let i=1;i<pts.length;i++){ const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); seg.push(d); L+=d; }
      const at=s=>{ let d=s*L;
        for(let i=0;i<seg.length;i++){
          if(d<=seg[i]) return [lerp(pts[i][0],pts[i+1][0],d/seg[i]), lerp(pts[i][1],pts[i+1][1],d/seg[i])];
          d-=seg[i]; }
        return pts[pts.length-1]; };
      for(let i=0;i<12;i++){
        const p=at((t*0.10+i/12)%1);
        g.fillStyle='rgba(79,210,240,.9)';
        g.beginPath(); g.arc(p[0],p[1],3.4,0,7); g.fill();
      }
      /* ── 이 실험의 핵심 : 어디에 무엇이 모이는가 ───────────────────
         (−)극 : 금속이 이온이 되어 녹아 나가면서 전극에 '전자'가 쌓인다.
                 전자가 남아도는 쪽이므로 (−)극이다.
         (+)극 : 도선으로 돌아온 전자가 계속 소모되어 전자가 모자란다.
                 그래서 (+)극이고, 전해질 속 (+)이온이 이쪽으로 모여든다.
         (−)이온은 반대로 (−)극 쪽으로 모여, 전해질 양쪽의 전하 균형을 맞춘다.
         ⊖⊕ 는 '전극의 극'이지 전자의 부호가 아니다 — 전자는 언제나 (−)전하다. */
      const negSide = rightIsPlus;                    // true 면 왼쪽이 (−)극
      const nx = negSide ? lx0 : rx0, px = negSide ? rx0 : lx0;

      // 전극 위의 전하 뱃지 — 어느 쪽에 전자가 쌓였는지 한눈에 보이게
      const badge=(bx,sign,col)=>{
        g.fillStyle='#08161f'; g.beginPath(); g.arc(bx+4, y-56, 9, 0, 7); g.fill();
        g.strokeStyle=col; g.lineWidth=1.8; g.stroke();
        label(g, sign, bx+4, y-55.5, col, 13);
      };
      badge(nx, '−', P.cyan); badge(px, '+', P.gold);

      // 전자가 쌓인 (−)극 — 전극 표면에 전자 알갱이가 붙어 있다
      for(let j=0;j<4;j++){
        const jy = y-42 + j*9, jx = nx + 4 + (j%2?5:-5);
        g.fillStyle='rgba(79,210,240,.85)';
        g.beginPath(); g.arc(jx, jy, 3, 0, 7); g.fill();
      }

      label(g, negSide?'(−)극':'(+)극', lx0-10, y-74, negSide?P.cyan:P.gold, 12, 'right');
      label(g, negSide?'전자가 쌓임':'전자가 모자람', lx0-10, y-58, P.mut, 10, 'right');
      label(g, negSide?'(+)극':'(−)극', rx0+10, y-74, negSide?P.gold:P.cyan, 12, 'left');
      label(g, negSide?'전자가 모자람':'전자가 쌓임', rx0+10, y-58, P.mut, 10, 'left');

      label(g, '(−)극에 쌓인 전자가 도선을 한 바퀴 돌아 (+)극으로 들어갑니다',
            W*0.42, H*0.055, P.cyan, 12);
      label(g, '전류의 방향은 약속상 그 반대 — (+)극에서 (−)극으로 흐른다고 말합니다',
            W*0.42, H*0.055+18, P.dim, 10.5);

      /* 과일 속 : (+)이온과 (−)이온이 서로 반대 방향으로 함께 움직여 회로를 잇는다.
         한 종류만 그리면 "전해질 속에서는 한 쪽만 움직인다"는 오개념이 된다. */
      for(let i=0;i<n;i++){
        const x=W*0.10 + i*(cw+10);
        const ax=x+cw*0.24+4, bx=x+cw*0.64+4;
        const pTo = rightIsPlus? bx : ax;     // (+)이온이 모이는 곳 = (+)극
        const nTo = rightIsPlus? ax : bx;     // (−)이온이 모이는 곳 = (−)극
        for(let j=0;j<3;j++){
          const ph=(t*0.25 + j/3 + i*0.17)%1;
          // (+)이온 → (+)극 쪽으로
          const ix=lerp(nTo,pTo,ph), iy=y+2+j*6;
          g.fillStyle='rgba(242,198,97,.9)';
          g.beginPath(); g.arc(ix,iy,4.2,0,7); g.fill();
          g.strokeStyle='#3a2c10'; g.lineWidth=1.3;
          g.beginPath(); g.moveTo(ix-2.3,iy); g.lineTo(ix+2.3,iy); g.moveTo(ix,iy-2.3); g.lineTo(ix,iy+2.3); g.stroke();
          // (−)이온 → (−)극 쪽으로 (반대 방향)
          const jx=lerp(pTo,nTo,ph), jy2=y+22+j*6;
          g.fillStyle='rgba(120,190,225,.9)';
          g.beginPath(); g.arc(jx,jy2,4.2,0,7); g.fill();
          g.strokeStyle='#12303f'; g.lineWidth=1.3;
          g.beginPath(); g.moveTo(jx-2.3,jy2); g.lineTo(jx+2.3,jy2); g.stroke();
        }
      }
      label(g,'과일 속에서는 이온이 움직여 회로의 나머지 반쪽을 잇습니다', W*0.36, y+50, P.gold, 11.5);
      label(g,'⊕ (+)이온은 (+)극 쪽으로 · ⊖ (−)이온은 (−)극 쪽으로 모입니다', W*0.36, y+65, P.gold, 10.5);
      label(g,'(+)극에서는 돌아온 전자가 계속 소모되어 전자가 모자라므로 (+)이온이 끌려옵니다', W*0.36, y+79, P.dim, 9.5);
      label(g,'전자는 도선으로만 흐릅니다 — 과일 속을 지나가지 않습니다', W*0.36, y+92, P.dim, 9.5);
    }
    // 알루미늄은 계산값과 실제값이 크게 어긋난다 — 그 이유를 짚어 준다.
    // 아래 이온 설명과 겹치지 않도록 오른쪽 빈 자리에 놓는다.
    if(this.capped(v)){
      label(g, '아연 셀은 한 개당 약 1.0V 가 한계입니다', W*0.79, H*0.44, P.gold, 11.5);
      label(g, '전류를 안 뽑아도 아연이 산에', W*0.79, H*0.44+16, P.mut, 10.5);
      label(g, '저절로 녹아 버리기 때문입니다', W*0.79, H*0.44+30, P.mut, 10.5);
    }
    const usesAl = (v.a==='al' || v.b==='al') && v.a!==v.b && v.e!=='pure';
    if(usesAl){
      label(g, `표준전위로 계산하면 ${(this.ideal(v)*v.n).toFixed(2)}V 지만`, W*0.79, H*0.60, P.mut, 11.5);
      label(g, '알루미늄은 표면 산화막에 막혀', W*0.79, H*0.60+17, P.gold, 11.5);
      label(g, '이만큼밖에 안 나옵니다', W*0.79, H*0.60+33, P.gold, 11.5);
    }
    label(g, v.a===v.b ? '같은 금속끼리는 전압이 생기지 않습니다'
           : v.e==='pure' ? '증류수는 이온이 거의 없어 전류가 흐를 길이 막힙니다'
           : '두 금속이 전자를 내주려는 정도 차이가 전압입니다',
          W/2, H-14, v.a===v.b||v.e==='pure'?P.pink:P.cyan, 13);
  },
  read(v){
    const I=this.current(v);
    return this.volts(v).toFixed(2)+' V · ' + (I>0? (I*1e6).toFixed(0)+' μA' : '0 μA') + (this.lit(v)?' · 점등':'');
  },
  tip(v){
    if(v.a===v.b) return '두 쪽을 다른 금속으로 바꿔 보세요.';
    if(v.e==='pure') return '레몬이나 소금물로 바꿔 보세요. 이온이 오갈 길이 필요합니다.';
    if(v.a==='al'||v.b==='al') return '알루미늄은 전자를 가장 잘 내주는 금속인데도 실제 전압은 낮습니다. 표면에 생긴 얇은 산화막이 반응을 막기 때문입니다.';
    if(this.lit(v)) return '드디어 켜졌습니다. 실제 수업에서도 레몬 서너 개에서 대여섯 개는 이어야 LED 에 불이 들어옵니다.';
    if(v.n<4) return '전압이 1.8V 를 넘어도 LED 가 안 켜집니다. 레몬 하나하나가 수백~수천 Ω이나 되는 큰 저항이라 전류가 모자라기 때문입니다. 개수를 더 늘려 보세요.';
    return '소금물로 바꿔도 전기는 흐릅니다. 다만 소금물은 중성이라, 산성인 레몬즙일 때보다 전압이 조금 낮습니다. 전기를 만드는 주인공은 어디까지나 두 금속입니다.';
  }
};

/* ---------- 6. 전자석 : 감은 수 × 전류 ---------- */
const simMagnet = {
  controls:[
    {t:'range',  id:'turns', label:'감은 횟수', min:0, max:150, value:50, unit:'번'},
    {t:'pair', id:'on', label:'전원 스위치', value:1, options:[[1,'⚡ 전원 켜기'],[0,'⭘ 전원 끄기']]}
  ],
  init:()=>({fall:[]}),
  onToggle(id,v,st){
    if(id==='on' && !v.on){
      st.fall = st.last||[];
      st.fall = st.fall.map(c=>({x:c.x, y:c.y, vy:0, rot:Math.random()*3}));
    }
  },
  draw(g,W,H,v,st,t){
    const on=!!v.on, count = on? Math.round(v.turns/12) : 0;
    const nx=W*0.42, ny=H*0.24, nh=H*0.46;
    // 못
    g.fillStyle='#8d949a'; rr(g,nx-9,ny,18,nh,3); g.fill();
    g.beginPath(); g.moveTo(nx-9,ny+nh); g.lineTo(nx+9,ny+nh); g.lineTo(nx,ny+nh+18); g.closePath(); g.fill();
    /* 코일 — 따로 떨어진 고리 여러 개가 아니라 한 가닥 전선을 나선으로 감은 것이다.
       앞쪽으로 지나가는 반원과 못 뒤로 넘어가는 반원을 나눠 그려서 나선처럼 보이게 한다. */
    const loops=clamp(Math.round(v.turns/6),0,22);
    const gap=(nh-20)/Math.max(1,loops);
    g.lineCap='round';
    for(let i=0;i<loops;i++){ const yy=ny+8+i*gap;
      g.strokeStyle= on? 'rgba(140,95,60,.85)' : '#4a3628'; g.lineWidth=3;   // 못 뒤쪽
      g.beginPath(); g.ellipse(nx, yy, 15, 4.5, 0, Math.PI, 0); g.stroke();
      g.strokeStyle= on? P.cop : '#7a5a44'; g.lineWidth=3.4;                  // 못 앞쪽
      g.beginPath(); g.ellipse(nx, yy+gap*0.5, 15, 4.5, 0, 0, Math.PI); g.stroke();
    }
    /* ── 전지와 회로 ─────────────────────────────────────────
       전지는 양 끝에 단자가 하나씩 있다. 한쪽 끝에서 나간 전선이 코일을 지나
       반대쪽 끝으로 돌아와야 회로가 한 바퀴 닫히고 그제야 전류가 흐른다.
       예전에는 전선 두 가닥이 모두 전지 오른쪽 면에서 나가 있어서
       회로가 되지 않는 그림이었다.
       ★ 극(＋/－)의 방향과 감은 방향이 함께 N극·S극을 정하는데, 그림에서
         감은 방향을 단정할 수 없으므로 여기서는 단자 위치만 정확히 그리고
         극성과 자극의 관계는 tip 에서 설명한다. */
    const bw=66, bh=26, bx=W*0.06, by=H*0.44, bcy=by+bh/2;
    const wireCol = on ? P.gold : '#3d4f59';
    const topY = ny+8, botY = ny+nh-12, joinX = nx-15;
    const upX = bx+bw+30, downX = Math.max(12, bx-18);

    /* 전선 먼저 — 전지 아래로 지나가지 않게 바깥으로 돌린다 */
    g.strokeStyle=wireCol; g.lineWidth=2.4; g.lineJoin='round'; g.lineCap='round';
    g.beginPath();                                  // ＋단자 → 코일 위쪽
    g.moveTo(bx+bw+7, bcy); g.lineTo(upX, bcy); g.lineTo(upX, topY); g.lineTo(joinX, topY);
    g.stroke();
    g.beginPath();                                  // －단자 → 코일 아래쪽
    g.moveTo(bx, bcy); g.lineTo(downX, bcy); g.lineTo(downX, botY); g.lineTo(joinX, botY);
    g.stroke();

    /* 스위치 — 끄면 회로가 실제로 끊어진 것으로 보이게 한다 */
    const swX = (upX + joinX)/2, swW = 22;
    g.fillStyle = P.panel;
    g.fillRect(swX-swW/2-2, topY-9, swW+4, 12);     // 전선을 지워 틈을 만든다
    g.fillStyle = wireCol;
    g.beginPath(); g.arc(swX-swW/2, topY, 2.6, 0, 7); g.fill();
    g.beginPath(); g.arc(swX+swW/2, topY, 2.6, 0, 7); g.fill();
    g.strokeStyle = wireCol; g.lineWidth=2.4;
    g.beginPath(); g.moveTo(swX-swW/2, topY);
    if(on) g.lineTo(swX+swW/2, topY);               // 닫힘
    else   g.lineTo(swX+swW/2-4, topY-11);          // 열림
    g.stroke();

    /* 전지 본체 — 오른쪽 끝의 작은 돌기가 ＋단자다 */
    g.fillStyle= on? '#3c6076':'#223c49';
    rr(g,bx+bw,bcy-5,7,10,2); g.fill();
    g.strokeStyle=P.line; g.lineWidth=1.5; g.stroke();
    g.fillStyle= on? '#2b4a5c':'#1b2f3a'; rr(g,bx,by,bw,bh,4); g.fill();
    g.strokeStyle=P.line; g.lineWidth=2; g.stroke();
    g.fillStyle= on? '#22485c':'#17303c'; rr(g,bx+3,by+3,9,bh-6,2); g.fill();  // －쪽 평평한 끝
    label(g,'－', bx+8,      bcy, on?P.gold:P.dim, 15);
    label(g,'＋', bx+bw-11,  bcy, on?P.gold:P.dim, 13);
    label(g,'건전지', bx+bw/2, by+bh+12, on?P.gold:P.dim, 12);
    /* 자기장 — 솔레노이드의 자기력선은 한쪽 끝(N)에서 나와 바깥을 크게 돌아
       반대쪽 끝(S)으로 들어가는 닫힌 고리다. 가운데를 감싸는 동심원이 아니다. */
    if(on && v.turns>0){
      const strength = clamp(v.turns/150, 0, 1);
      const yN=ny-2, yS=ny+nh+16;                 // 위쪽 N극, 아래쪽 S극
      for(let side of [-1,1]) for(let i=0;i<3;i++){
        const bulge = (34+i*30) * (0.55+strength*0.45);
        g.strokeStyle=`rgba(79,210,240,${(0.40-i*0.10)*(0.35+strength*0.65)})`;
        g.lineWidth=2;
        g.beginPath(); g.moveTo(nx, yN);
        g.bezierCurveTo(nx+side*bulge, yN-14, nx+side*bulge, yS+14, nx, yS);
        g.stroke();
        // 진행 방향 화살촉 (N에서 나와 S로 들어간다)
        const ph=(t*0.35+i*0.3)%1, mt=1-ph;
        const bx2=3*mt*mt*ph*(nx+side*bulge)+3*mt*ph*ph*(nx+side*bulge)+ph*ph*ph*nx+mt*mt*mt*nx;
        const by2=mt*mt*mt*yN+3*mt*mt*ph*(yN-14)+3*mt*ph*ph*(yS+14)+ph*ph*ph*yS;
        g.fillStyle=`rgba(79,210,240,${0.5*(0.35+strength*0.65)})`;
        g.beginPath(); g.arc(bx2,by2,2.6,0,7); g.fill();
      }
      label(g,'N', nx+16, yN-6, P.cyan, 13);
      label(g,'S', nx+16, yS+8, P.pink, 13);
    }
    // 붙은 클립
    const clips=[];
    for(let i=0;i<count;i++){
      const side=i%2?1:-1, row=Math.floor(i/2);
      clips.push({x:nx+side*(16+row*5), y:ny+nh-14-row*13});
    }
    st.last=clips;
    if(on) clips.forEach(c=>drawClip(g,c.x,c.y,0));
    // 떨어지는 클립
    st.fall.forEach(c=>{ c.vy+=0.7; c.y+=c.vy; c.rot+=0.15; if(c.y<H-14) drawClip(g,c.x,c.y,c.rot); });
    if(st.fall.length && st.fall.every(c=>c.y>=H-14)) st.fall=[];
    // 바닥 클립 더미
    g.fillStyle='#152c38'; g.fillRect(W*0.70, H-26, W*0.24, 26);
    for(let i=0;i<7;i++) drawClip(g, W*0.72+i*14, H-16, (i%3)*0.6);
    label(g, on? `클립 ${count}개가 붙었습니다` : '전류를 끊으면 자석이 사라집니다',
          W/2, H-14, on?P.cyan:P.pink, 13);
  },
  read:(v)=> v.on? `${v.turns}번 감음 · 클립 ${Math.round(v.turns/12)}개` : '전원 꺼짐',
  tip:(v)=> !v.on ? '스위치가 열려 회로가 끊겨 있습니다. 전지 양 끝에서 나온 전선이 코일을 지나 한 바퀴 이어져야 전류가 흐릅니다. 전원을 켜고 감은 횟수를 늘려 보세요.'
          : v.turns<40 ? '더 많이 감을수록 자기장이 겹쳐서 세집니다. 위쪽이 N극인 것은 감은 방향 때문이며, 반대로 감거나 건전지를 거꾸로 끼우면 N극과 S극이 바뀝니다.'
          : '이제 전원을 꺼 보세요. 영구자석과의 차이가 여기서 드러납니다.'
};
function drawClip(g,x,y,rot){
  g.save(); g.translate(x,y); g.rotate(rot);
  g.strokeStyle='#b9c6cc'; g.lineWidth=2.2; g.lineCap='round';
  g.beginPath(); g.moveTo(-3,-8); g.lineTo(-3,6); g.moveTo(-3,-8); g.lineTo(3,-8);
  g.lineTo(3,4); g.lineTo(0,4); g.stroke(); g.restore();
}

/* ---------- 7. 기체 추진 ---------- */
const simGas = {
  controls:[
    {t:'range', id:'amt', label:'베이킹소다 양', min:1, max:10, value:5, marks:['조금','많이']},
    {t:'button', id:'go', label:'🔒 뚜껑 닫기'}
  ],
  /* 실제 단위로 계산하고 화면에만 축소해 그린다.
     베이킹소다가 많을수록 이산화탄소가 많이 나와 통을 더 세게 밀어내므로 처음 속도가 커지고,
     올라가는 높이는 v₀²/2g 로 정해진다. 픽셀에 맞춰 대충 튀어 오르게 하지 않는다. */
  G: 9.8, PXPM: 118,                               // 중력가속도(m/s²), 1m 를 몇 px 로 그릴지
  M_CAN: 26, M_CAP: 3,                             // 통(식초 포함) g, 뚜껑 g — 운동량 보존에 쓴다
  launchSpeed(amt){ return 1.1 + amt*0.55; },      // m/s
  peakM(amt){ const v0=this.launchSpeed(amt); return v0*v0/(2*this.G); },
  init:()=>({p:0, fired:0, y:0, vy:0, cap:0, capV:0, peak:0}),
  onButton(id,v,st){ if(id==='go'){ Object.assign(st,{p:0,fired:0,y:0,vy:0,cap:0,capV:0,peak:0}); st.run=1; } },
  draw(g,W,H,v,st,t){
    const floor=H-26, limit=1;
    const gpx = this.G*this.PXPM/3600;              // m/s² → px/프레임² (60fps)
    if(st.run && !st.fired){
      st.p += 0.006*v.amt;
      if(st.p>=limit){
        st.fired=1;
        st.vy = -this.launchSpeed(v.amt)*this.PXPM/60;   // px/프레임
        /* 운동량 보존 : (통 질량)×(통 속도) = (뚜껑+기체 질량)×(뚜껑 속도).
           뚜껑 쪽이 훨씬 가벼우므로 반대 방향으로 그만큼 더 빠르게 튀어 나간다.
           예전에는 0.85배로 '더 느리게' 그리고 있어서 설명과 그림이 어긋났다. */
        st.capV = -st.vy * (this.M_CAN/this.M_CAP);
      }
    }
    if(st.fired){
      /* 등가속도 운동은 y += v·dt + ½·a·dt² 로 적분해야 정확하다.
         v 를 먼저 갱신하고 더하면 프레임마다 ½·a·dt² 씩 손해가 쌓여
         실제 도달 높이가 v²/2g 보다 눈에 띄게 낮게 나온다(약 10%). */
      st.y += st.vy + gpx/2; st.vy += gpx;
      if(st.y>0){ st.y=0; st.vy=0; }
      st.cap += st.capV + gpx/2; st.capV += gpx;     // 뚜껑도 중력을 받아 계속 떨어진다
      st.cap = Math.min(st.cap, 10 - st.y);          // 뚜껑은 바닥에서 멈춘다
      st.peak = Math.max(st.peak, -st.y);
    }
    const bx=W*0.44, by=floor-70+st.y;
    // 통
    g.fillStyle='rgba(190,220,235,.28)'; rr(g,bx,by,54,70,7); g.fill();
    g.strokeStyle='#8fc0d4'; g.lineWidth=3; g.stroke();
    g.fillStyle='rgba(242,198,97,.5)'; g.fillRect(bx+3, by+44, 48, 23);
    // 거품 — 뚜껑이 열리면 압력이 풀리므로 잦아든다
    if(st.run){ const nb = st.fired? 6 : 18;
      for(let i=0;i<nb;i++){ const ph=(t*1.4+i/18)%1;
        g.fillStyle=`rgba(255,255,255,${(0.65-ph*0.5)*(st.fired?0.45:1)})`;
        g.beginPath(); g.arc(bx+8+((i*23)%38), by+66-ph*46, 2+ph*3, 0,7); g.fill(); } }
    // 뚜껑
    g.fillStyle='#e3edf2'; rr(g, bx+4, by+70+st.cap, 46, 11, 4); g.fill();
    // 압력계
    const px=W*0.14, py=H*0.34;
    g.strokeStyle=P.line; g.lineWidth=3; g.beginPath(); g.arc(px,py,40,Math.PI*0.8,Math.PI*2.2); g.stroke();
    g.strokeStyle= st.p>0.8?P.pink:P.cyan; g.lineWidth=6;
    g.beginPath(); g.arc(px,py,40,Math.PI*0.8, Math.PI*0.8+clamp(st.p,0,1)*Math.PI*1.4); g.stroke();
    label(g,'압력', px, py+2, P.mut, 12);
    label(g, st.fired?'터짐!':`${Math.round(clamp(st.p,0,1)*100)}%`, px, py+22, st.fired?P.pink:P.ink, 14);
    // 화살표
    if(st.fired && st.capV>-4){
      arrow(g, bx+27, by+84, bx+27, by+112, P.gold, 3);
      label(g,'기체가 아래로', bx+27, by+128, P.gold, 12);
      arrow(g, bx+90, by+50, bx+90, by+18, P.lime, 3);
      label(g,'통은 위로', bx+128, by+34, P.lime, 12);
    }
    g.fillStyle='#152c38'; g.fillRect(0, floor+10, W, H-floor);
    // 최고 높이 눈금 (실제 미터)
    if(st.fired){
      const hm = st.peak/this.PXPM, ty = floor-70-st.peak;
      g.setLineDash([5,5]); g.strokeStyle='rgba(168,224,95,.55)'; g.lineWidth=1.5;
      g.beginPath(); g.moveTo(bx-70, ty); g.lineTo(W*0.92, ty); g.stroke(); g.setLineDash([]);
      label(g, hm.toFixed(2)+' m', W*0.93, ty, P.lime, 14, 'right');
    }
    label(g, st.fired? `처음 속도 ${this.launchSpeed(v.amt).toFixed(1)}m/s → ${(st.peak/this.PXPM).toFixed(2)}m 올라갔습니다`
           : st.run? '이산화탄소가 쌓이는 중…' : '베이킹소다 양을 정하고 뚜껑을 닫아 보세요',
          W/2, 18, st.fired?P.lime:P.mut, 13);
  },
  read(v,st){ return st.fired? `${(st.peak/this.PXPM).toFixed(2)}m 상승` : st.run? '압력 상승 중' : '대기'; },
  tip(v,st){
    if(!st.run) return '베이킹소다 양을 정하고 뚜껑을 닫아 보세요. 양이 많을수록 압력이 빨리 차오릅니다.';
    if(!st.fired) return '이산화탄소가 통 안에 쌓이면서 압력이 올라갑니다. 뚜껑이 빠지는 압력은 늘 같지만, 베이킹소다가 많을수록 그 압력에 빨리 닿고 뿜어내는 기체도 많아 더 세게 밀립니다.';
    return `기체를 아래로 밀어낸 만큼 통은 위로 밀립니다. 처음 속도 ${this.launchSpeed(v.amt).toFixed(1)}m/s 로 출발하면 v²/2g = ${this.peakM(v.amt).toFixed(2)}m 까지 올라갑니다. 뚜껑은 통보다 훨씬 가벼워서(약 ${this.M_CAN}g 대 ${this.M_CAP}g) 반대 방향으로 그만큼 더 빠르게 튀어 나갑니다.`;
  }
};

/* ---------- 8. 풍선 로켓 ---------- */
const simBalloon = {
  controls:[
    {t:'range', id:'air', label:'불어넣은 공기', min:1, max:10, value:6, marks:['조금','가득']},
    {t:'button', id:'go', label:'✋ 손 놓기'}
  ],
  init:()=>({x:0, v:0, air:0, run:0, dist:0}),
  onButton(id,v,st){ if(id==='go'){ st.x=0; st.v=0; st.air=v.air; st.run=1; st.dist=0; } },
  draw(g,W,H,v,st,t){
    const y=H*0.42, x0=W*0.10, x1=W*0.92, TRACK=x1-x0-140;
    g.strokeStyle='#4a6f80'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x0,y-26); g.lineTo(x1,y-26); g.stroke();
    [x0,x1].forEach(x=>{ g.fillStyle='#2b4a5c'; rr(g,x-10,y-16,20,52,4); g.fill(); });
    /* 남아 있는 공기가 많을수록 안쪽 압력이 높아 세게 밀어낸다(추력 ∝ 남은 공기).
       공기가 빠지면 풍선이 가벼워지고, 속도가 붙으면 공기저항 v²이 커져 곧 멈춘다.
       그래서 불어넣은 양이 실제로 날아간 거리를 바꾼다.
       저항·마찰 계수는 가득 채웠을 때(10) 실 3m 안에서 멈추도록 잡았다.
       트랙 끝에 처박히면 9와 10이 같은 값으로 보여서 비교가 안 되기 때문이다. */
    if(st.run){
      let a=0;
      if(st.air>0){ st.air=Math.max(0, st.air-0.072); a=(0.040*st.air)/(0.9+0.16*st.air); }
      st.v += a - 0.012*st.v*st.v - (st.v>0?0.013:0);
      if(st.v<0) st.v=0;
      st.x = Math.min(TRACK, st.x + st.v);
      if(st.x>=TRACK) st.air=0;
      st.dist=st.x;
    }
    const CM = 300/TRACK;                    // 준비물의 실 3m 를 트랙 길이에 맞춘다
    const size = 16 + (st.run? st.air : v.air)*3.4;
    const bx = x0+70+st.x;
    // 빨대
    g.fillStyle='#c9d6dc'; rr(g,bx-16,y-31,32,10,3); g.fill();
    // 풍선 (입구는 왼쪽 — 공기가 왼쪽으로 나가고 풍선은 오른쪽으로 간다)
    g.fillStyle=P.pink; g.beginPath(); g.ellipse(bx, y+size*0.5, size, size*0.72, 0,0,7); g.fill();
    g.fillStyle='#c85f72'; g.beginPath();
    g.moveTo(bx-size, y+size*0.5); g.lineTo(bx-size-16, y+size*0.5-7); g.lineTo(bx-size-16, y+size*0.5+7); g.closePath(); g.fill();
    // 공기 분출 — 입구가 있는 왼쪽으로
    if(st.run && st.air>0){ for(let i=0;i<9;i++){ const ph=(t*2.2+i/9)%1;
      g.fillStyle=`rgba(180,215,230,${0.6-ph*0.55})`;
      g.beginPath(); g.arc(bx-size-18-ph*46, y+size*0.5+Math.sin(i*2)*7, 3+ph*4, 0,7); g.fill(); }
      arrow(g, bx-size-22, y+size*0.5, bx-size-64, y+size*0.5, P.gold, 2.5);
      label(g,'공기', bx-size-44, y+size*0.5-18, P.gold, 12);
      arrow(g, bx+size+8, y+size*0.5, bx+size+50, y+size*0.5, P.lime, 2.5);
      label(g,'풍선', bx+size+30, y+size*0.5-18, P.lime, 12);
    }
    // 실 눈금 (3m)
    g.strokeStyle='rgba(147,170,187,.45)'; g.lineWidth=1;
    for(let m=0;m<=3;m++){ const mx=x0+70+m*100/CM;
      if(mx>x1) break;
      g.beginPath(); g.moveTo(mx, y-26); g.lineTo(mx, y-36); g.stroke();
      label(g, m+'m', mx, y-46, P.dim, 10); }
    label(g, st.run? `${(st.dist*CM).toFixed(0)}cm 이동${st.air>0?' · 분사 중':' · 멈춤'}`
                   : '공기 양을 정하고 손을 놓아 보세요',
          W/2, H-18, st.run?P.lime:P.mut, 13);
  },
  read:(v,st)=> st.run? `${(st.dist*(300/(720*0.92-720*0.10-140))).toFixed(0)}cm` : '대기',
  tip:(v,st)=> !st.run ? '공기 양을 바꿔 가며 얼마나 가는지 비교해 보세요. 1과 10은 크게 다릅니다.'
             : st.air>0 ? '공기가 나가는 방향과 풍선이 가는 방향이 정반대입니다.'
             : '공기가 다 빠지면 미는 힘이 사라지고, 공기저항과 마찰 때문에 곧 멈춥니다.'
};

/* ---------- 9. 빛의 분산 ----------
   물이 든 둥근 컵을 위에서 내려다본 단면으로 놓고, 스넬 법칙으로 실제 광선을 추적한다.
   색이 갈라지는 것은 파장마다 물의 굴절률이 다르기 때문이며(20°C, 빨강 1.3311 ~ 보라 1.3435),
   그 값을 그대로 넣어 계산한다. 빛이 컵 한가운데를 지나면 꺾이지 않고, 가장자리로 갈수록 크게 꺾인다. */
const SPECTRUM = [
  ['#f2555f', 1.3311, '빨강'], ['#f0913f', 1.3324, ''], ['#efd249', 1.3341, ''],
  ['#7fd45a', 1.3362, ''],     ['#4fc3f0', 1.3390, ''], ['#6f7ff0', 1.3414, ''],
  ['#b06ff0', 1.3435, '보라']
];
/* 굴절 벡터. eta = 들어가는 쪽 굴절률 / 나가는 쪽 굴절률. 전반사면 null */
function refract2(d, n, eta){
  const ci = -(d[0]*n[0] + d[1]*n[1]);
  const k  = 1 - eta*eta*(1 - ci*ci);
  if(k < 0) return null;
  const s = eta*ci - Math.sqrt(k);
  return [eta*d[0] + s*n[0], eta*d[1] + s*n[1]];
}
/* 수평 광선이 반지름 R 인 물기둥의 중심에서 b 만큼 비껴 들어갈 때의 경로 (컵 중심이 원점) */
function cupRay(b, R, nw){
  const s  = Math.sqrt(Math.max(1e-9, R*R - b*b));
  const P1 = [-s, -b];
  let n1 = [P1[0]/R, P1[1]/R];
  const d0 = [1, 0];
  if(d0[0]*n1[0] + d0[1]*n1[1] > 0) n1 = [-n1[0], -n1[1]];
  const d1 = refract2(d0, n1, 1/nw);
  if(!d1) return null;
  const tt = -2*(P1[0]*d1[0] + P1[1]*d1[1]);          // 원과의 두 번째 교점까지
  const P2 = [P1[0] + d1[0]*tt, P1[1] + d1[1]*tt];
  let n2 = [P2[0]/R, P2[1]/R];
  if(d1[0]*n2[0] + d1[1]*n2[1] > 0) n2 = [-n2[0], -n2[1]];
  const d2 = refract2(d1, n2, nw);
  if(!d2) return null;
  return {P1, P2, dev: Math.atan2(d2[1], d2[0])};
}

/* ---------- 10. 거울 반사 : 눈으로 θ와 2θ를 대조할 수 있게 그린다 ---------- */
function arcBetween(g,x,y,r,a1,a2,col,w){
  let d=a2-a1;
  while(d> Math.PI) d-=2*Math.PI;
  while(d<-Math.PI) d+=2*Math.PI;
  g.strokeStyle=col; g.lineWidth=w||2;
  g.beginPath(); g.arc(x,y,r,a1,a1+d,d<0); g.stroke();
  return a1+d/2;
}
const simMirror = {
  controls:[
    {t:'range',  id:'tilt', label:'거울을 돌린 각도', min:0, max:40, value:0, unit:'°'},
    {t:'pair', id:'two', label:'거울 개수', value:0, options:[[0,'거울 한 장'],[1,'거울 두 장 (잠망경)']]}
  ],
  /* 거울을 0°에 두면 입사각이 정확히 45°가 되도록 광원을 배치한다 */
  geom(W,H){
    const mx=W*0.42, my=H*0.52, d=Math.min(W*0.21, H*0.40);
    return {mx, my, sx:mx-d, sy:my-d, d};
  },
  rays(W,H,tilt){
    const q=this.geom(W,H);
    const tr  = tilt*Math.PI/180;
    const inA = Math.atan2(q.my-q.sy, q.mx-q.sx);   // 항상 45°(아래·오른쪽)
    const nrm = tr - Math.PI/2;                     // 거울면에 수직
    const out = 2*nrm - inA + Math.PI;              // 반사 방향
    const out0= 2*(-Math.PI/2) - inA + Math.PI;     // 거울이 0°일 때의 반사 방향
    return {...q, tr, inA, nrm, out, out0};
  },
  angles(r){
    const n=a=>{ let d=Math.abs(a)%(2*Math.PI); if(d>Math.PI) d=2*Math.PI-d; return d*180/Math.PI; };
    const i=n(r.inA-r.nrm), o=n(r.out-r.nrm);
    return {inc:Math.min(i,180-i), ref:Math.min(o,180-o)};
  },
  draw(g,W,H,v,st,t){
    const r=this.rays(W,H,v.tilt), a=this.angles(r);
    const {sx,sy,mx,my,tr,nrm,out,out0}=r;
    const ML=88, RAY=Math.min(W*0.30, H*0.62);

    // ── 0°일 때의 유령 거울과 유령 반사광 (비교 기준) ──
    g.setLineDash([7,6]); g.lineWidth=2;
    g.strokeStyle='rgba(147,170,187,.45)';
    g.beginPath(); g.moveTo(mx-ML/2,my); g.lineTo(mx+ML/2,my); g.stroke();
    g.strokeStyle='rgba(147,170,187,.40)';
    g.beginPath(); g.moveTo(mx,my); g.lineTo(mx+Math.cos(out0)*RAY, my+Math.sin(out0)*RAY); g.stroke();
    g.setLineDash([]);
    label(g,'거울 0°', mx-ML/2-30, my+2, P.dim, 11);

    // ── 입사광 ──
    g.strokeStyle=P.gold; g.lineWidth=3.5;
    g.beginPath(); g.moveTo(sx,sy); g.lineTo(mx,my); g.stroke();
    for(let i=0;i<4;i++){ const ph=(t*0.5+i/4)%1;
      g.fillStyle='rgba(242,198,97,.85)';
      g.beginPath(); g.arc(lerp(sx,mx,ph),lerp(sy,my,ph),3.2,0,7); g.fill(); }
    g.fillStyle='#31556a'; rr(g,sx-30,sy-14,46,28,6); g.fill();
    g.strokeStyle=P.line; g.lineWidth=2; g.stroke();
    label(g,'손전등', sx-7, sy-30, P.gold, 12);

    // ── 반사광 ──
    g.strokeStyle=P.cyan; g.lineWidth=3.5;
    const ex=mx+Math.cos(out)*RAY, ey=my+Math.sin(out)*RAY;
    g.beginPath(); g.moveTo(mx,my); g.lineTo(ex,ey); g.stroke();

    // ── 법선 (거울면에 정확히 수직) ──
    const NL=76;
    g.setLineDash([6,5]); g.strokeStyle='rgba(170,195,210,.8)'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(mx,my); g.lineTo(mx+Math.cos(nrm)*NL, my+Math.sin(nrm)*NL); g.stroke();
    g.setLineDash([]);
    label(g,'법선', mx+Math.cos(nrm)*(NL+15), my+Math.sin(nrm)*(NL+15), P.mut, 11);

    // ── 입사각·반사각 호 ──
    const back=Math.atan2(sy-my,sx-mx);
    let mid=arcBetween(g,mx,my,40,back,nrm,'rgba(242,198,97,.9)',2.4);
    label(g, a.inc.toFixed(0)+'°', mx+Math.cos(mid)*56, my+Math.sin(mid)*56, P.gold, 13);
    mid=arcBetween(g,mx,my,40,nrm,out,'rgba(79,210,240,.9)',2.4);
    label(g, a.ref.toFixed(0)+'°', mx+Math.cos(mid)*56, my+Math.sin(mid)*56, P.cyan, 13);

    // ── 거울 ──
    g.save(); g.translate(mx,my); g.rotate(tr);
    g.fillStyle='#b8dfee'; rr(g,-ML/2,-5,ML,10,3); g.fill();
    g.fillStyle='#4d7d92'; g.fillRect(-ML/2,5,ML,5);
    g.restore();

    // ── θ 와 2θ 를 유령선과 대조해 표시 ──
    if(v.tilt>0){
      let m1=arcBetween(g,mx,my,ML/2+13,0,tr,'rgba(168,224,95,.95)',3);
      label(g, v.tilt+'°', mx+Math.cos(m1)*(ML/2+30), my+Math.sin(m1)*(ML/2+30), P.lime, 14);
      let m2=arcBetween(g,mx,my,RAY*0.82,out0,out,'rgba(240,121,142,.95)',3);
      label(g, (v.tilt*2)+'°', mx+Math.cos(m2)*(RAY*0.82+22), my+Math.sin(m2)*(RAY*0.82+22), P.pink, 15);
    }

    // ── 두 번째 거울 : 첫 거울과 나란하면 잠망경이 된다 ──
    if(v.two){
      g.save(); g.translate(ex,ey); g.rotate(tr);
      g.fillStyle='#b8dfee'; rr(g,-38,-4,76,8,3); g.fill();
      g.fillStyle='#4d7d92'; g.fillRect(-38,4,76,4);
      g.restore();
      const out2=2*nrm-out+Math.PI;
      let L2=Math.min(W,H)*0.30;
      while(L2>30){
        const px=ex+Math.cos(out2)*L2, py=ey+Math.sin(out2)*L2;
        if(px>14 && px<W-14 && py>14 && py<H-40) break;
        L2-=5;
      }
      g.strokeStyle=P.lime; g.lineWidth=3.5;
      g.beginPath(); g.moveTo(ex,ey); g.lineTo(ex+Math.cos(out2)*L2, ey+Math.sin(out2)*L2); g.stroke();
    }

    // ── 수치 ──
    const tx=W*0.80;
    label(g, `입사각 ${a.inc.toFixed(0)}°  =  반사각 ${a.ref.toFixed(0)}°`, tx, H*0.10, P.ink, 15);
    label(g, '초록 = 거울이 돌아간 각', tx, H*0.10+26, P.lime, 12);
    label(g, '분홍 = 반사광이 움직인 각', tx, H*0.10+46, P.pink, 12);
    label(g, `${v.tilt}°  →  ${v.tilt*2}°`, tx, H*0.10+74, v.tilt?P.ink:P.dim, 20);
    label(g, v.two ? '나란한 거울 두 장 → 처음 빛과 평행하게 나갑니다'
                   : '회색 점선은 거울이 0°일 때의 자리입니다. 초록 각과 분홍 각을 비교해 보세요.',
          W/2, H-14, v.two?P.lime:P.mut, 13);
  },
  read(v){ return `거울 ${v.tilt}° → 반사광 ${v.tilt*2}°`; },
  tip(v){
    if(v.two) return '두 거울이 나란하면 두 번 꺾인 빛이 처음 빛과 평행해집니다. 잠수함 잠망경이 이 구조입니다.';
    return v.tilt===0 ? '거울을 돌리면 초록 각(거울)과 분홍 각(반사광)이 같이 생깁니다. 두 각을 비교해 보세요.'
                      : '입사각과 반사각이 함께 변하기 때문에 반사광은 거울이 돈 각의 두 배로 움직입니다.';
  }
};

      if(glow){ g.shadowColor=col; g.shadowBlur=24; }
      g.beginPath();
      const cx=px+pw*0.32, cy=py+ph*0.48, R=44;
      for(let i=0;i<5;i++){ const a=-Math.PI/2 + i*Math.PI*4/5;
        const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R; i?g.lineTo(x,y):g.moveTo(x,y); }
      g.closePath(); g.stroke();
      g.lineWidth=8; g.beginPath();
      const bx=px+pw*0.62, by=py+ph*0.34;
      g.moveTo(bx,by+52); g.lineTo(bx,by); g.lineTo(bx+30,by+16); g.lineTo(bx,by+30);
      g.moveTo(bx+46,by); g.lineTo(bx+46,by+52);
      g.stroke(); g.restore();
    };
    /* 보안 잉크는 일반 빛에서 거의 종이색이라 그려도 보이지 않는다 (색 자체가 종이색에 가깝다).
       불을 끈 상태에서는 3가지 모두 '아무것도' 그리지 않는다.
       형광은 인광(야광)과 달라서, 비추던 빛을 끄면 1억분의 1초 안에 함께 꺼진다.
       여기에 희미하게라도 획을 그려 두면 '형광펜은 어둠 속에서 빛난다'는
       가장 흔한 오개념을 그림으로 가르치는 셈이 된다. */
    if(room){ stroke(ink.room, false); }
    else if(uv){ stroke(ink.uv + (ink.fluor? (0.55+k*0.45) : 0.95) + ')', ink.glow); }

    // 램프
    const lx=W*0.10, ly=H*0.14;
    g.fillStyle= off? '#22303a' : uv? '#6a44d8' : '#e8e3b8';
    rr(g,lx-16,ly-11,34,22,5); g.fill();
    if(!off){ g.fillStyle = uv? `rgba(140,90,240,${0.13*k})` : `rgba(255,250,210,${0.16*k})`;
      g.beginPath(); g.moveTo(lx+18,ly-11); g.lineTo(px+pw, py); g.lineTo(px+pw, py+ph); g.lineTo(lx+18,ly+11); g.closePath(); g.fill(); }
    label(g, uv?'자외선 + 새어 나오는 보라색': room?'일반 빛':'꺼짐', lx+2, ly+30, uv?'#b49bff':P.mut, 12);
    if(uv) label(g, '자외선 자체는 눈에 안 보입니다', lx+2, ly+46, P.mut, 10.5);

    // 파장 설명 — 형광이 무슨 일인지 그림으로
    if(uv){
      const wy=H*0.86;
      label(g,'들어간 빛  자외선 (짧은 파장)', W*0.20, wy, '#b49bff', 11);
      if(ink.fluor) label(g,'나온 빛  보이는 빛 (긴 파장)', W*0.62, wy, ink.glow?P.lime:P.mut, 11);
      else          label(g,'나온 빛  없음 — 흡수만 하고 끝', W*0.62, wy, P.mut, 11);
      if(v.ink!=='pen') label(g,'종이도 형광 증백제 때문에 푸르스름하게 빛납니다', W/2, H*0.155, 'rgba(150,175,235,.9)', 11);
    }

    if(off){
      label(g, '형광은 야광이 아닙니다', W/2, H*0.44, P.gold, 15);
      label(g, '비추던 빛을 끄는 순간 형광도 같이 꺼집니다 (1억분의 1초 안에).', W/2, H*0.44+22, P.mut, 12);
      label(g, '어둠 속에서 혼자 빛나는 것은 형광이 아니라 인광(야광)입니다.', W/2, H*0.44+40, P.mut, 12);
      label(g, '(종이가 있던 자리)', px+pw/2, py+ph+18, 'rgba(120,140,155,.45)', 10.5);
    }
    const msg = off ? '빛을 끄면 형광펜도 예외 없이 안 보입니다'
      : room ? (ink.seenRoom ? `${ink.name}은 일반 빛에서도 제 색으로 잘 보입니다`
                             : `${ink.name}은 일반 빛에서는 거의 안 보입니다`)
      : (ink.fluor ? `자외선을 흡수해 보이는 빛으로 바꿔 내보냅니다 — 종이보다 더 밝습니다`
                   : `${ink.name}은 자외선을 흡수만 하고 되돌려 주지 않아, 빛나는 종이 위에서 오히려 어둡게 보입니다`);
    label(g, msg, W/2, H-14, uv? (ink.fluor?P.lime:P.pink) : P.mut, 13);
  },
  read(v){
    const ink=this.INK[v.ink]||this.INK.hi;
    if(v.lamp==='off') return '아무것도 안 보임 — 형광펜도 마찬가지 (형광 ≠ 야광)';
    if(v.lamp==='room') return ink.seenRoom? `${ink.name} · 제 색으로 보임` : `${ink.name} · 거의 안 보임`;
    return ink.fluor? `${ink.name} · 형광으로 밝게 빛남` : `${ink.name} · 형광 없음, 어둡게 남음`;
  },
  tip(v){
    const ink=this.INK[v.ink]||this.INK.hi;
    if(v.lamp==='off') return '형광 물질은 스스로 빛을 만들지 않습니다. 받은 빛의 파장을 바꿔 되돌려 줄 뿐이라, 받을 빛이 없으면 내보낼 빛도 없습니다. 야광 별 스티커처럼 불을 끄고도 한참 빛나는 것은 형광이 아니라 인광입니다.';
    if(v.lamp!=='uv') return v.ink==='sec'
      ? '무색 보안 잉크는 일반 빛에서 보이지 않습니다. 자외선으로 바꿔 보세요.'
      : '자외선 손전등으로 바꿔 보세요. 무엇이 달라지는지 보세요.';
    if(v.ink==='pen') return '색연필도 자외선을 흡수하지만 되돌려 내보내지는 못합니다. 형광은 단순히 밝은 색이 아니라, 받은 빛의 파장을 바꿔 다시 내보내는 현상입니다.';
    if(v.ink==='sec') return '일반 빛에서 안 보이던 것이 자외선에서만 드러납니다. 지폐와 여권의 위조 방지 무늬가 바로 이것입니다.';
    return '형광펜은 일반 빛에서도 보입니다. 다만 자외선까지 받으면 눈에 안 보이던 에너지까지 보이는 빛으로 바꿔 내보내서, 흰 종이보다 더 밝아 보입니다. 손전등에서 보이는 보라색은 자외선이 아니라 함께 새어 나오는 가시광선입니다.';
  }
};

/* ---------- 12. 그림자 크기 ---------- */
const simShadow = {
  /* 최솟값 10cm — 그보다 가까우면 그림자가 벽(화면)보다 커져서
     그림은 잘리고 숫자만 커지는, 서로 안 맞는 화면이 된다. */
  controls:[{t:'range', id:'d', label:'손전등과 인형 사이 거리', min:10, max:60, value:40, unit:'cm'}],
  draw(g,W,H,v,st,t){
    const wallX=W*0.86, objX=W*0.56, objH=64;
    const lightX = objX - (v.d/60)*(objX-W*0.06);
    const dLO = objX-lightX, dLW = wallX-lightX;
    const ratio = dLW/dLO;
    const shH = objH*ratio;
    const oy=H*0.56;
    // 벽
    g.fillStyle='#dde5e9'; g.fillRect(wallX,H*0.08,12,H*0.84);
    // 그림자
    const sh = Math.min(shH, H*0.80);
    g.fillStyle='rgba(20,35,45,.72)'; g.fillRect(wallX-12, oy-sh/2, 12, sh);
    // 빛 원뿔
    g.fillStyle='rgba(242,224,140,.13)';
    g.beginPath(); g.moveTo(lightX,oy);
    g.lineTo(wallX, oy-(objH/2)*ratio*1.6); g.lineTo(wallX, oy+(objH/2)*ratio*1.6); g.closePath(); g.fill();
    // 광선
    g.strokeStyle='rgba(242,224,140,.85)'; g.lineWidth=2;
    [[-1],[1]].forEach(([s])=>{ g.beginPath(); g.moveTo(lightX,oy);
      g.lineTo(wallX, oy + s*(objH/2)*ratio); g.stroke(); });
    // 손전등
    g.fillStyle='#31556a'; rr(g,lightX-24,oy-12,26,24,5); g.fill();
    g.fillStyle=P.gold; rr(g,lightX-2,oy-9,7,18,2); g.fill();
    label(g,'손전등', lightX-12, oy-28, P.gold, 12);
    // 인형
    g.fillStyle='#8fb4c4';
    g.beginPath(); g.arc(objX, oy-objH/2+11, 11,0,7); g.fill();
    rr(g,objX-9, oy-objH/2+22, 18, objH-24, 5); g.fill();
    label(g,'인형 4cm', objX, oy+objH/2+18, P.mut, 12);
    // 수치
    g.strokeStyle=P.cyan; g.lineWidth=2;
    g.beginPath(); g.moveTo(wallX+22, oy-sh/2); g.lineTo(wallX+22, oy+sh/2); g.stroke();
    label(g, `${(4*ratio).toFixed(1)}cm`, wallX+30, oy, P.cyan, 14, 'left');
    label(g, '가까울수록 빛이 넓은 각도로 막혀 그림자가 커집니다', W/2, H-14, P.mut, 13);
  },
  read:(v)=>{ const objX=0.56, wallX=0.86, lightX=objX-(v.d/60)*(objX-0.06);
    return `그림자 ${(4*(wallX-lightX)/(objX-lightX)).toFixed(1)}cm`; },
  tip:(v)=> v.d>30 ? '손전등을 인형 쪽으로 가까이 밀어 보세요.'
          : '빛이 한 점에서 퍼져 나가기 때문에 가까울수록 크게 막힙니다.'
};

/* ---------- 13. 발수 ---------- */
const simWater = {
  controls:[
    {t:'select', id:'surf', label:'표면', value:'paper',
     options:[['paper','그냥 종이'],['wax','양초 칠한 종이'],['leaf','연잎']]},
    {t:'range', id:'tilt', label:'기울기', min:0, max:45, value:0, unit:'°'}
  ],
  init:()=>({x:0}),
  draw(g,W,H,v,st,t){
    const angle = {paper:25, wax:105, leaf:155}[v.surf];
    const tilt = v.tilt*Math.PI/180;
    const cx=W/2, cy=H*0.56;
    g.save(); g.translate(cx,cy); g.rotate(tilt);   // 오른쪽이 아래로 기운다
    // 표면
    g.fillStyle = v.surf==='leaf'? '#3f7a45' : v.surf==='wax'? '#e6e2d6' : '#f3f1ea';
    rr(g,-W*0.36,0,W*0.72,16,3); g.fill();
    if(v.surf==='leaf'){ for(let i=0;i<40;i++){ g.fillStyle='rgba(90,150,95,.9)';
      g.beginPath(); g.arc(-W*0.35+i*(W*0.7/40), 2, 2.4, 0, 7); g.fill(); } }
    /* 굴러떨어지기 시작하는 기울기(구름각)는 표면마다 다르다.
       접촉각이 클수록, 그리고 앞뒤 접촉각 차이(이력)가 작을수록 작은 기울기에서도 굴러간다.
       연잎은 몇 도만 기울여도 굴러가지만, 양초를 칠한 종이는 훨씬 많이 기울여야 움직인다.
       예전에는 둘 다 8°에서 똑같이 굴러가서, 발수와 초발수의 차이가 사라져 있었다. */
    const ROLL_OFF = {paper:999, wax:28, leaf:5}[v.surf];
    const roll = v.tilt >= ROLL_OFF;
    if(roll){ st.x += (angle/70)*((v.tilt-ROLL_OFF+2)/12); if(st.x > W*0.62) st.x = 0; }
    else st.x = 0;
    const dx = roll? -W*0.30 + st.x : 0;          // 왼쪽 위에서 오른쪽 아래로 굴러 내려간다
    /* 물방울 모양은 접촉각에서 그대로 나온다. 부피가 같은 구면 캡으로 그리면
       25°는 납작하게 퍼지고, 105°는 반구보다 조금 부풀고, 155°는 거의 완전한 공이 된다.
       세 표면이 눈에 띄게 달라야 접촉각이라는 말이 와닿는다. */
    const th = angle*Math.PI/180, co = Math.cos(th);
    const VOL = 26000;                            // 물방울 부피 — 세 표면 모두 같은 양을 떨어뜨린다
    const capF = Math.pow(1-co,2)*(2+co)/3;       // 구면 캡 부피 = π·R³·capF
    const R  = Math.cbrt(VOL/(Math.PI*capF));
    const cy2 = R*co;                             // 구 중심 (θ>90° 면 표면 위로 떠오른다)
    const A  = Math.asin(clamp(-cy2/R,-1,1));     // 표면과 만나는 각
    const contact = R*Math.sin(th);               // 표면에 닿는 반지름
    g.fillStyle='rgba(110,190,235,.85)';
    g.beginPath();
    g.arc(dx, cy2, R, Math.PI-A, 2*Math.PI+A, false);   // 표면 위로 나온 부분만
    g.closePath(); g.fill();
    g.strokeStyle='rgba(150,225,255,.9)'; g.lineWidth=2; g.stroke();
    // 스민 자국 (부착력이 이기는 경우)
    if(angle<90){ g.fillStyle='rgba(110,170,205,.35)';
      rr(g, dx-contact*1.35, 0, contact*2.7, 16, 3); g.fill(); }
    // 접촉각 각도 표시 — 접촉점에서 접선을 그어 실제 각을 보여 준다
    if(!roll){
      const px2=dx+contact, tang=th;
      g.strokeStyle='rgba(79,210,240,.85)'; g.lineWidth=1.6;
      g.beginPath(); g.moveTo(px2,0);
      g.lineTo(px2 - Math.cos(tang)*34, -Math.sin(tang)*34); g.stroke();
      arcBetween(g, px2, 0, 20, Math.PI, Math.PI+tang, 'rgba(79,210,240,.85)', 1.6);
    }
    // 접촉각 표시
    g.strokeStyle=P.cyan; g.lineWidth=1.5; g.setLineDash([4,4]);
    g.beginPath(); g.moveTo(dx-70,0); g.lineTo(dx+70,0); g.stroke(); g.setLineDash([]);
    g.restore();
    label(g, `접촉각 약 ${angle}°`, W*0.14, H*0.16, P.cyan, 15);
    label(g, angle<90? '부착력 > 응집력' : '응집력 > 부착력', W*0.14, H*0.16+22, angle<90?P.pink:P.lime, 12);
    label(g, `같은 양을 떨어뜨렸는데`, W*0.14, H*0.16+48, P.dim, 11);
    label(g, `닿는 지름 ${(2*R*Math.sin(th)).toFixed(0)} · 높이 ${(R-cy2).toFixed(0)}`, W*0.14, H*0.16+66, P.mut, 12);
    label(g, v.surf==='paper' ? '물이 표면과 잘 붙어 퍼지고 스밉니다 — 기울여도 굴러가지 않습니다'
           : v.surf==='wax'   ? `물끼리 더 잘 붙어 구슬이 됩니다 — 약 ${ROLL_OFF}° 는 기울여야 굴러갑니다`
           :                    `미세 돌기까지 있어 거의 닿지 않습니다 — 약 ${ROLL_OFF}° 만 기울여도 굴러갑니다`,
          W/2, H-14, v.surf==='paper'?P.pink:P.lime, 13);
  },
  /* 접촉각만 보여 주면 기울기 슬라이더를 움직여도 숫자가 안 변해서
     '구름각' 이라는 개념이 화면에 안 잡힌다. 굴러가는지 여부와 구름각을 같이 띄운다. */
  read:(v)=>{ const a={paper:25,wax:105,leaf:155}[v.surf];
    const roll={paper:999, wax:28, leaf:5}[v.surf];
    const shape = v.surf==='paper' ? '접촉각 '+a+'°에서 시작 → 곧 0°에 가까워짐 · 퍼지고 스밈'
                : '접촉각 '+a+'° · ' + (v.surf==='wax'? '구슬 모양' : '거의 완전한 공');
    const state2 = v.surf==='paper' ? '스며들어서 아무리 기울여도 안 굴러감'
                 : v.tilt >= roll   ? `기울기 ${v.tilt}° · 구름각 ${roll}° 를 넘어 굴러감`
                                    : `기울기 ${v.tilt}° · 구름각 ${roll}° 아직 안 넘음`;
    return `${shape} · ${state2}`; },
  tip:(v)=> v.surf==='paper' ? '방수 처리를 하지 않은 종이에서는 물방울이 닿자마자 퍼지면서 종이 속으로 스며들어, 접촉각이 재는 사이에도 계속 작아집니다. 여기 보이는 것은 스미기 직전의 모습입니다. 양초 칠한 종이나 연잎으로 바꾸고 기울여 보세요.'
          : v.surf==='wax'   ? (v.tilt<28 ? '아직 굴러가지 않습니다. 접촉각이 105°라도 표면에 어느 정도 붙어 있어서, 28° 쯤은 기울여야 움직입니다.'
                                          : '기울기가 구름각을 넘어서자 굴러 내려갑니다. 접촉각만이 아니라 얼마나 잘 떨어지느냐도 표면마다 다릅니다.')
          : (v.tilt<5 ? '연잎은 5° 만 기울여도 굴러갑니다. 조금만 올려 보세요.'
                      : '접촉각이 150°를 넘으면 물방울이 표면에 거의 닿지 않아, 살짝만 기울여도 먼지까지 쓸며 굴러떨어집니다. 이것이 로터스 효과입니다.')
};

/* ---------- 14. 단열 : 세 컵 온도 비교 ---------- */
const simHeat = {
  controls:[
    {t:'button', id:'go', label:'▶ 20분 돌려보기'},
    {t:'range',  id:'speed', label:'빠르기', min:1, max:5, value:3, unit:'배'}
  ],
  init:()=>({m:0, run:0, log:[[],[],[]]}),
  onButton(id,v,st){ if(id==='go'){ st.m=0; st.run=1; st.log=[[],[],[]]; } },
  draw(g,W,H,v,st,t){
    /* 냉각상수(1/분). 포일은 금속이라 전도로는 오히려 잘 통하고, 복사 손실만 조금 줄여 준다.
       실제 교실 실험에서도 맨컵과 큰 차이가 나지 않으므로 그렇게 잡는다. */
    const K=[0.055, 0.049, 0.017];                 // 맨컵 / 포일 / 뽁뽁이
    const NAMES=['그냥 컵','알루미늄 포일','뽁뽁이'];
    const COLS=[P.pink, P.gold, P.lime];
    if(st.run){ st.m += 0.055*v.speed; if(st.m>=20){ st.m=20; st.run=0; } }
    const temps = K.map(k => 20 + (80-20)*Math.exp(-k*st.m));
    if(st.run) temps.forEach((T,i)=>{ st.log[i].push([st.m,T]); });
    // 컵
    for(let i=0;i<3;i++){
      const x=W*0.06+i*W*0.12, y=H*0.30, w=W*0.085, h=H*0.42;
      const fill=(temps[i]-20)/60;
      g.fillStyle='#0e2531'; rr(g,x,y,w,h,5); g.fill();
      g.fillStyle=`rgba(${lerp(120,240,fill)|0},${lerp(180,120,fill)|0},${lerp(220,90,fill)|0},.85)`;
      rr(g,x+3,y+h*0.18,w-6,h*0.78,4); g.fill();
      g.strokeStyle=COLS[i]; g.lineWidth= i? 4 : 2; g.stroke();
      label(g, `${temps[i].toFixed(0)}°`, x+w/2, y-14, COLS[i], 15);
      label(g, NAMES[i], x+w/2, y+h+16, P.dim, 11);
    }
    // 그래프
    const gx=W*0.46, gy=H*0.16, gw=W*0.48, gh=H*0.62;
    g.strokeStyle=P.line; g.lineWidth=1.5;
    g.strokeRect(gx,gy,gw,gh);
    [20,40,60,80].forEach(T=>{ const y=gy+gh-(T-15)/70*gh;
      g.strokeStyle='rgba(38,83,107,.5)'; g.beginPath(); g.moveTo(gx,y); g.lineTo(gx+gw,y); g.stroke();
      label(g, T+'°', gx-6, y, P.dim, 10, 'right'); });
    label(g,'0분', gx, gy+gh+14, P.dim, 10);
    label(g,'20분', gx+gw, gy+gh+14, P.dim, 10);
    st.log.forEach((L,i)=>{ if(L.length<2) return;
      g.strokeStyle=COLS[i]; g.lineWidth=2.5; g.beginPath();
      L.forEach(([m,T],j)=>{ const x=gx+m/20*gw, y=gy+gh-(T-15)/70*gh; j?g.lineTo(x,y):g.moveTo(x,y); });
      g.stroke(); });
    label(g, st.m>=20 ? `20분 뒤 · 뽁뽁이가 그냥 컵보다 ${(temps[2]-temps[0]).toFixed(0)}도, 포일보다 ${(temps[2]-temps[1]).toFixed(0)}도 더 따뜻합니다`
           : st.run? `${st.m.toFixed(0)}분 경과` : '돌려보기를 눌러 20분을 흘려 보세요',
          W/2, H-12, st.m>=20?P.lime:P.mut, 13);
  },
  read:(v,st)=> st.m>0? `${st.m.toFixed(0)}분 경과` : '시작 전 (모두 80°)',
  tip:(v,st)=> st.m<20 ? '세 컵의 온도가 어떻게 벌어지는지 지켜보세요. 포일 컵은 어느 쪽에 가까울까요?'
             : '뽁뽁이 안의 갇힌 공기가 열이 빠져나갈 길을 막습니다. 포일은 금속이라 열을 잘 전달하고 가둔 공기도 없어서, 반짝이는 표면 덕에 맨컵보다 아주 조금 나을 뿐입니다.'
};

/* ---------- 15. 공명 ---------- */
const simResonance = {
  controls:[
    {t:'range',  id:'f', label:'오른쪽 소리굽쇠 진동수', min:400, max:620, value:440, unit:'Hz'},
    {t:'button', id:'hit', label:'🔨 왼쪽을 쳐보기'}
  ],
  init:()=>({e:0, a2:0}),
  onButton(id,v,st){ if(id==='hit'){ st.e=1; st.a2=0; } },
  draw(g,W,H,v,st,t){
    /* 공명 곡선은 로렌츠 곡선. 반치폭을 9Hz 로 잡았다(Q ≈ 512/18 ≈ 28).
       실제 소리굽쇠는 이보다 훨씬 예민해서 몇 Hz만 어긋나도 거의 울리지 않지만,
       그렇게 그리면 슬라이더를 움직여도 한 칸에서만 반응해 관찰할 것이 없어진다.
       봉우리 자리(512Hz)와 '진동수가 같을 때만 쌓인다'는 결론은 실제와 같다. */
    const F0=512, df=Math.abs(v.f-F0);
    const q = 1/(1+Math.pow(df/9,2));            // 공명 곡선
    if(st.e>0) st.e=Math.max(0, st.e-0.004);
    /* 안 친 쪽은 곧바로 울리는 게 아니라, 공기를 통해 에너지를 받아 조금씩 쌓인다.
       그래서 목표 진폭(q·e)을 향해 서서히 따라붙고, 친 쪽이 잦아들면 함께 잦아든다. */
    st.a2 += ((q*st.e) - st.a2) * 0.022;
    const A1=st.e*13, A2=st.a2*13;
    /* 떨리는 빠르기도 진동수에 맞춘다. 512Hz 를 그대로 그릴 수는 없으니
       512Hz 를 기준 속도로 두고 비례해서 보여 준다 — 620Hz 쪽이 눈에 띄게 빨리 떨린다. */
    const fork=(x,amp,col,txt,hz)=>{
      const y=H*0.30, h=H*0.34, sp=17;
      g.strokeStyle=col; g.lineWidth=8; g.lineCap='round';
      const d=Math.sin(t*18*(hz/F0))*amp;
      g.beginPath(); g.moveTo(x-sp-d, y); g.lineTo(x-sp*0.5, y+h); g.stroke();
      g.beginPath(); g.moveTo(x+sp+d, y); g.lineTo(x+sp*0.5, y+h); g.stroke();
      g.beginPath(); g.moveTo(x-sp*0.5,y+h); g.lineTo(x+sp*0.5,y+h); g.lineTo(x, y+h+26); g.stroke();
      g.fillStyle='#1b3644'; rr(g,x-26,y+h+26,52,12,3); g.fill();
      label(g, txt, x, y-22, col, 13);
      label(g, hz+'Hz', x, y+h+58, P.dim, 12);
      if(amp>0.4){ for(let i=1;i<4;i++){ g.strokeStyle=`rgba(79,210,240,${(amp/13)*(0.4-i*0.09)})`;
        g.lineWidth=2; g.beginPath(); g.arc(x, y+h*0.4, 40+i*20+Math.sin(t*7)*4, -0.9, 0.9); g.stroke();
        g.beginPath(); g.arc(x, y+h*0.4, 40+i*20+Math.sin(t*7)*4, Math.PI-0.9, Math.PI+0.9); g.stroke(); } }
    };
    fork(W*0.28, A1, P.gold, '친 쪽', F0);
    fork(W*0.66, A2, q>0.5?P.lime:P.mut, '안 친 쪽', v.f);
    // 공명 곡선
    const gx=W*0.80, gy=H*0.16, gw=W*0.16, gh=H*0.44;
    g.strokeStyle=P.line; g.lineWidth=1.5; g.strokeRect(gx,gy,gw,gh);
    g.strokeStyle=P.cyan; g.lineWidth=2; g.beginPath();
    for(let i=0;i<=40;i++){ const f=400+i*(220/40), qq=1/(1+Math.pow(Math.abs(f-F0)/9,2));
      const x=gx+i/40*gw, y=gy+gh-qq*gh*0.9; i?g.lineTo(x,y):g.moveTo(x,y); }
    g.stroke();
    const mx=gx+(v.f-400)/220*gw;
    g.fillStyle=q>0.5?P.lime:P.pink; g.beginPath(); g.arc(mx, gy+gh-q*gh*0.9, 5,0,7); g.fill();
    label(g,'울림 세기', gx+gw/2, gy-12, P.dim, 11);
    label(g, df<4 ? '진동수가 같아서 안 친 쪽도 크게 울립니다'
           : df<20 ? '조금 어긋나서 약하게만 울립니다'
           : '진동수가 달라서 거의 울리지 않습니다',
          W/2, H-12, df<4?P.lime:df<20?P.gold:P.mut, 13);
  },
  read:(v)=>{ const q=1/(1+Math.pow(Math.abs(v.f-512)/9,2));
    return `울림 ${Math.round(q*100)}%  (기준 512Hz)`; },
  tip:(v,st)=> !st.e ? '왼쪽을 쳐보고, 오른쪽 진동수를 512Hz에 맞춰 보세요.'
             : Math.abs(v.f-512)<4 ? '오른쪽이 곧바로 크게 울리지는 않습니다. 같은 진동수의 떨림을 계속 받으면서 조금씩 쌓여 커지는 것, 이것이 공명입니다.'
             : '512Hz로 정확히 맞춰 보세요.'
};

/* ---------- 16. 실 전화기 ---------- */
const simString = {
  controls:[
    {t:'range',  id:'ten', label:'실을 당긴 정도', min:0, max:10, value:0, marks:['축 늘어짐','팽팽함']},
    {t:'button', id:'talk', label:'🗣 말해보기'}
  ],
  init:()=>({e:0}),
  onButton(id,v,st){ if(id==='talk') st.e=1; },
  draw(g,W,H,v,st,t){
    const k=v.ten/10;
    if(st.e>0) st.e=Math.max(0, st.e-0.006);
    const x1=W*0.16, x2=W*0.84, y=H*0.46;
    const sag = (1-k)*H*0.22;
    // 실
    g.strokeStyle= k>0.7? '#cfdbe1' : '#7d8f99'; g.lineWidth=2.5;
    g.beginPath();
    for(let i=0;i<=60;i++){
      const p=i/60, x=lerp(x1,x2,p);
      const base = y + Math.sin(p*Math.PI)*sag;
      const wave = st.e * k * 11 * Math.sin(p*22 - t*11) * Math.sin(p*Math.PI);
      i?g.lineTo(x, base+wave):g.moveTo(x, base+wave);
    }
    g.stroke();
    // 컵
    const cup=(x,flip,amp)=>{
      g.save(); g.translate(x,y); g.scale(flip,1); g.translate(amp*Math.sin(t*20),0);
      g.fillStyle='#e6ecef'; g.beginPath();
      g.moveTo(0,-24); g.lineTo(52,-34); g.lineTo(52,34); g.lineTo(0,24); g.closePath(); g.fill();
      g.strokeStyle='#a8b8c0'; g.lineWidth=2; g.stroke(); g.restore();
    };
    cup(x1,-1, st.e*3);
    cup(x2, 1, st.e*3*k*k);
    label(g,'말하는 쪽', x1-14, y-52, P.gold, 12);
    label(g,'듣는 쪽',  x2+14, y-52, k>0.6&&st.e>0.1?P.lime:P.dim, 12);
    /* 실이 아주 느슨해도 '아무 소리도 안 들리는' 것은 아니다.
       말소리는 공기를 타고도 건너가기 때문에 아주 작게는 늘 들린다.
       실 전화기가 하는 일은 그 공기 전달분 위에 '실을 타고 오는 몫'을 얹는 것이다.
       0% 로 그려 버리면 "느슨하면 소리가 사라진다"는 오개념이 된다. */
    const viaAir = 8;                                   // 공기로 전해지는 몫(항상 있다)
    const viaString = Math.round(st.e*k*k*92);
    const heard = Math.round(st.e*viaAir) + viaString;
    g.fillStyle='#0e2531'; rr(g, W/2-58, H*0.10, 116, 30, 8); g.fill();
    g.fillStyle= heard>40? P.lime : heard>10? P.gold : '#2b3f4a';
    rr(g, W/2-54, H*0.10+4, 108*clamp(heard/100,0,1), 22, 6); g.fill();
    label(g, st.e>0.02? `${heard}% 들림` : '말해보기를 눌러 보세요', W/2, H*0.10+15, heard>40?'#0a2016':P.mut, 13);
    if(st.e>0.02) label(g, `실을 타고 ${viaString}% + 공기를 타고 ${Math.round(st.e*viaAir)}%`, W/2, H*0.10+44, P.dim, 11);
    label(g, k<0.4? '실이 느슨하면 실이 통째로 출렁일 뿐, 떨림이 실을 따라 건너가지 못합니다 (공기로만 아주 작게 들림)'
           : '팽팽한 실을 타고 떨림이 그대로 건너갑니다',
          W/2, H-14, k<0.4?P.pink:P.lime, 13);
  },
  read:(v,st)=> v.ten<4? '느슨함' : v.ten<8? '조금 팽팽' : '팽팽함',
  tip:(v,st)=> !st.e ? '실을 팽팽하게 당기고 말해보기를 눌러 보세요.'
             : v.ten<4 ? '느슨한 실은 통째로 출렁이기만 해서 떨림을 실 끝까지 전하지 못합니다. 이때 들리는 아주 작은 소리는 실이 아니라 공기를 타고 온 것입니다. 더 당겨 보세요.'
             : '소리는 무언가가 떨려야 전해집니다. 팽팽할수록 떨림이 실을 따라 잘 건너갑니다.'
};

/* ---------- 실험 id → 시뮬레이션 ---------- */
const SIMS = {
  oobleck:simOobleck, casein:simCasein, copper:simCopper, slime:simSlime,
  fruitcell:simCell, electromagnet:simMagnet, gas:simGas, balloon:simBalloon,
  spectrum:simPrism, rainbow:simPrism, mirror:simMirror,
  fluorescence:simUV, shadow:simShadow,
  hydrophobic:simWater, insulation:simHeat,
  resonance:simResonance, stringphone:simString
};

/* ══════════════════════════════════════════════════════════════
   15. 시뮬레이션 실행기
   ══════════════════════════════════════════════════════════════ */

let simRAF = null, simVals = {}, simSt = {};

function ctlHtml(c){
  if(c.t==='range')  return `<div class="ctl"><label>${esc(c.label)}<b id="out_${c.id}"></b></label>
    <input type="range" id="c_${c.id}" min="${c.min}" max="${c.max}" value="${c.value}" step="1">
    ${c.marks?`<div class="marks"><span>${esc(c.marks[0])}</span><span>${esc(c.marks[1])}</span></div>`:''}</div>`;
  if(c.t==='select') return `<div class="ctl"><label>${esc(c.label)}</label>
    <select id="c_${c.id}">${c.options.map(o=>`<option value="${o[0]}"${o[0]===c.value?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  /* 켜기 / 끄기 처럼 둘 중 하나를 직접 고르는 버튼 두 개.
     버튼 하나로 상태만 보여 주면 '켜짐'이 지금 켜져 있다는 뜻인지
     누르면 켜진다는 뜻인지 헷갈린다. 아예 두 개로 나눈다. */
  if(c.t==='pair') return `<div class="ctl"><label>${esc(c.label)}</label>
    <div class="pair">${c.options.map(o=>
      `<button class="sim-btn${o[0]===c.value?' on':''}" data-pair="${c.id}" data-val="${o[0]}">${esc(o[1])}</button>`
    ).join('')}</div></div>`;
  if(c.t==='button') return `<div class="ctl"><label>&nbsp;</label>
    <button class="sim-btn go" id="c_${c.id}">${esc(c.label)}</button></div>`;
  if(c.t==='steps')  return `<div class="ctl wide"><label>${esc(c.label||'단계')}</label>
    <div class="steps">${c.labels.map((l,i)=>`<button class="sim-btn st" data-step="${i+1}">${i+1}. ${esc(l)}</button>`).join('')}
    <button class="sim-btn st reset" data-step="0">↺ 처음</button></div></div>`;
  return '';
}

function simHtml(exp){
  const s = SIMS[exp.id];
  if(!s) return '';
  return `<div class="sim">
    <div class="sim-top"><h4>직접 해보기</h4><span class="sim-read" id="simRead"></span></div>
    <canvas id="simCv" width="720" height="390"></canvas>
    <div class="sim-ctls">${s.controls.map(ctlHtml).join('')}</div>
    <div class="sim-tip" id="simTip"></div>
  </div>`;
}

function stopSim(){ if(simRAF){ cancelAnimationFrame(simRAF); simRAF = null; } }

function mountSim(exp){
  stopSim();
  const s = SIMS[exp.id], cv = $('#simCv');
  if(!s || !cv) return;
  const g = cv.getContext && cv.getContext('2d');
  if(!g) return;                                   // 캔버스를 못 쓰는 환경에서도 수업은 이어진다

  simVals = {}; simSt = s.init ? s.init() : {};
  s.controls.forEach(c=>{ if(c.value!==undefined) simVals[c.id]=c.value;
                          else if(c.t==='range') simVals[c.id]=c.min;
                          else if(c.t==='steps') simVals[c.id]=0; });

  s.controls.forEach(c=>{
    const el = $('#c_'+c.id);
    if(c.t==='range'){
      const out = $('#out_'+c.id);
      const sync = () => { simVals[c.id] = Number(el.value);
        if(out) out.textContent = ' ' + el.value + (c.unit||''); };
      el.oninput = sync; sync();
    } else if(c.t==='select'){
      el.onchange = () => { simVals[c.id] = el.value; };
    } else if(c.t==='pair'){
      $$(`[data-pair="${c.id}"]`).forEach(b=>b.onclick=()=>{
        const val = Number(b.dataset.val);
        if(simVals[c.id]===val) return;                 // 이미 그 상태면 아무 일도 안 한다
        simVals[c.id] = val;
        $$(`[data-pair="${c.id}"]`).forEach(x=>x.classList.toggle('on', Number(x.dataset.val)===val));
        if(s.onToggle) s.onToggle(c.id, simVals, simSt);
      });
    } else if(c.t==='button'){
      el.onclick = () => { if(s.onButton) s.onButton(c.id, simVals, simSt); };
    } else if(c.t==='steps'){
      $$('[data-step]').forEach(b=>b.onclick=()=>{
        const n = Number(b.dataset.step);
        simVals[c.id] = n;
        if(n===0) simSt = s.init ? s.init() : {};
        $$('[data-step]').forEach(x=>x.classList.toggle('on', Number(x.dataset.step)<=n && Number(x.dataset.step)>0));
      });
    }
  });

  const read = $('#simRead'), tip = $('#simTip');
  const t0 = performance.now();
  const loop = () => {
    const t = (performance.now()-t0)/1000;
    g.clearRect(0,0,cv.width,cv.height);
    try{ s.draw(g, cv.width, cv.height, simVals, simSt, t); }catch(e){}
    if(read) read.textContent = s.read ? s.read(simVals, simSt) : '';
    if(tip)  tip.textContent  = s.tip  ? s.tip(simVals, simSt)  : '';
    simRAF = requestAnimationFrame(loop);
  };
  loop();
}

render();
</script>
</body>
</html>
