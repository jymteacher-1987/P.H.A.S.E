  const shot = shotInfo(), f = fmt(), g = gearList();
  const act = state.shot === 'activate'
    ? ([1,3,2,0].map(i=>g[i]).find(x=>x && ACTION_MOMENT[x.id]) || g.find(x=>ACTION_MOMENT[x.id]) || null) : null;
  /* 발동 장면 원문은 길다. 핵심 두 문장만 쓴다 — 무슨 일이 벌어지는가와 몸이 어떻게 반응하는가. */
  const moment = act ? actionMomentForPrompt(act).split(/(?<=\.)\s+/).slice(0,3).join(' ') : '';
  /* ★ 촬영 컷 원문에는 '로우앵글 광각 3/4 카메라' 같은 문장이 들어 있다.
     사진이 붙어 있으면 그건 얼굴을 새 각도로 다시 그리라는 말이 되어 닮음을 깨뜨린다.
     컷은 그대로 두고, 그 각도가 '몸에만' 적용된다는 것을 바로 옆에서 못박는다. */
  const headHold = state.photo
    ? `
★ THE CAMERA MOVES, THE HEAD DOES NOT. Any low, high, wide or three-quarter framing named here applies to the BODY and the scene. The head keeps the photograph's exact yaw, pitch, roll, gaze and facial perspective, rendered at portrait focal length with no wide-angle stretching. Arrange the shoulders and camera around that locked head; do not lift, lower or turn the chin. A face redrawn at a new angle is a different person.`
    : '';
  return `THE SHOT — "${shot.name}"
${shot.en}${headHold}
Build the place, time of day, weather and light it names. The quality level changes costume workmanship, and in this activation shot only it may change the same device's reliability as explicitly stated below; it never changes the scene, camera precision, lighting clarity or motif identity.
${act ? `WHAT IS HAPPENING: ${moment}
★ NO FLYING HARDWARE, WHATEVER THE EXPERIMENT WAS: no nails, screws, bolts, nuts, washers, paperclips, tools or scrap metal anywhere in the frame, nothing flying and nothing stuck to anything. What the device sends out is light and energy, never small objects.
HOW STRONGLY IT FIRES — THIS DECIDES THE SIZE AND BRIGHTNESS AND IT OVERRIDES THE LINE ABOVE: ${actionScale(n)}
★ THE EFFECT MUST MATCH THE BUILD. A costume made of cardboard, tape and a padded jacket cannot be throwing a world-ending blast — that mismatch is the single most jarring thing this picture can do. If the equipment above is rough and unfinished, the effect is small, sputtering and clearly straining; the gap between what they built and what it does must be believable at a glance.
The effect is in the photograph at every level and the hero is mid-action driving it — twisted, one shoulder forward, weight on one foot, an arm locked out.${state.photo ? ' The photographed head pose, gaze and expression remain exact while all action happens below the neck.' : ' The head turns to watch.'} It lights the face, chest and ground. The other three pieces stay quietly live. Only what a high-speed camera could record: moving parts, sparks, vapour, water, dust, light on a surface, an object in flight — no auras, no beams from the body.
` : ''}${b.camera ? b.camera + ' ' : ''}${b.light || ''}
★ FRAME — CHECK THIS BEFORE ANYTHING ELSE AND AGAIN AT THE END. This is a FULL-LENGTH shot. The top of the head AND the soles of BOTH boots are inside the picture, with clear air above the head and the feet not touching the bottom edge. Composed for a ${f.ar} vertical print with the head in the upper third. Stand the camera back far enough — a wide lens from a distance, not a step closer. A picture cropped at the waist, the chest or the knees has FAILED no matter how good everything else is, and it is the single most common way this image goes wrong. The reference photograph is usually a head-and-shoulders shot; ignore its crop completely. If the effect and the whole figure will not both fit, move the camera BACK — never crop the body to make room for the effect.`;
}

/* ⑨ 문제 결과 = 제작 마감. 촬영 품질과 모티브 존재는 점수와 분리한다. */
/* ★ 등급 상한선의 압축판. 이것이 없어서 문제를 하나만 맞힌 학생에게도
   먋진 옷이 나왔다. 긴 qualityCap() 은 규칙집(텍스트 모델용)에만 있었고,
   정작 그림을 그리는 모델은 부드러운 leanQuality() 한 장만 받았다.
   여기서는 짧게, 대신 구체적으로 말한다 — 무엇으로 만들었고 무엇은 없는가. */
function leanCraftCap(n){
  const K = Math.max(0, Math.min(5, n));
  if(K >= 3) return '';
  const MADE_OF = 'cardboard, craft foam, fabric offcuts, foil, jar lids and other raw classroom material, held together with visible tape, cable ties, hot glue, exposed screws and staples, with hand-cut wavy edges, mismatched pieces, wrinkled fabric and uneven brush-marked paint';
  const BAN = 'NOT ON A ROUGH PIECE, AT ALL: moulded or vacuum-formed plastic armour, machined metal, polished, chromed, gilded or glossy surfaces, crisp panel gaps, flush joins, seamless curves, precision fittings, clean speculars, or anything that looks factory-made or shop-bought. If a surface would photograph like real film-grade armour, it is wrong for this piece.';
  const HEAD = [
`★ HOW WELL IT IS MADE — THIS STUDENT GOT NONE OF THE FOUR QUESTIONS RIGHT, AND THE COSTUME MUST SHOW IT. ALL FOUR PIECES ARE ROUGH.
This is a costume built by hand this week out of ${MADE_OF}. Nothing on this body is professionally made.`,
`★ HOW WELL IT IS MADE — THIS STUDENT GOT ONE OF THE FOUR QUESTIONS RIGHT, AND THE COSTUME MUST SHOW IT. ONE PIECE IS PROPERLY MADE; THE OTHER THREE ARE ROUGH.
Exactly one piece is cleanly built. The other three are made by hand out of ${MADE_OF}, and a stranger must be able to point at the one good piece immediately.`,
`★ HOW WELL IT IS MADE — THIS STUDENT GOT TWO OF THE FOUR QUESTIONS RIGHT, AND THE COSTUME MUST SHOW IT. HALF IS PROPERLY MADE, HALF IS ROUGH.
Two pieces are cleanly built. The other two are made by hand out of ${MADE_OF}. The contrast between the two halves IS the picture, and someone must be able to point at which half is which.`];
  return `${HEAD[K]}
${BAN}
WHAT STAYS COMPLETE ANYWAY: every motif feature and every named piece of equipment is present, full-size, in its assigned place and in its real colours — just crudely made. Rough means BADLY BUILT, never missing, never shrunk and never plain. The photograph itself stays sharp and beautifully composed; it is a meticulous photograph OF a rough prototype.
UNFINISHED, NOT FAILED — but do not quietly upgrade it. A student who got ${K} right must not receive the costume of a student who got 4 right.`;
}
function leanQuality(n){
  const g = gearList();
  const nAce   = g.filter(x=>x.grade==='ace').length;
  const nRough = g.filter(x=>x.ok===false).length;
  const nOk    = g.length - nRough;
  const legend = isLegend();
  /* 0 ~ 1 사이 연속 점수 — 신속 정답은 완성된 구역의 마감만 올린다. */
  const s = legend ? 1 : Math.min(1, (nOk + nAce * 0.5) / 6);
  const SURF = [
    'all four pieces visibly hand-built: tape, hot glue, exposed screws and staples, hand-cut wavy edges, mismatched offcuts and uneven brush-marked paint in the motif\'s real colours',
    'mostly hand-built, with one piece that has a clean even surface; every rough piece keeps its complete motif and equipment shape',
    'the finished pieces tidy and purpose-cut, the unfinished ones still taped, hand-cut and unevenly painted without losing any required feature',
    'clean cut edges and proper fixings on the finished pieces, honest hand-work on the rest; the rank is obvious without anything disappearing',
    'the finished zones have machined edges, crisp panel gaps and real speculars, while every remaining rough prototype stays visibly taped, raw and hand-cut',
    'immaculate throughout: machined hardware, polished trim catching hard speculars, the richest version of the palette',
    'jewellery-grade: gold leaf on the armour, engraved inlay in every seam, cast gold hardware, filigree at every edge'
  ];
  /* rough 가 하나라도 있으면 'immaculate throughout' 이상을 절대 고르지 않는다. */
  const surfaceIndex = Math.min(nRough ? 4 : SURF.length-1, Math.round(s * (SURF.length-1)));
  const EXTRA = [
    'no OPTIONAL emblem, cape, mantle or trailing decoration is added; any one required by the motif or equipment stays full-size and is made roughly from card, foam, offcuts and tape',
    'OPTIONAL ornament is limited to one small clean fitting; required emblem and back structures remain full-size and follow their owning piece\'s grade',
    "OPTIONAL ornament stays small, flat and matte; required motif emblems, capes, wings, tails, mantles and rigs retain their specified size",
    "OPTIONAL ornament may be a flat motif emblem or short mantle; every required structure remains complete and its workmanship follows its zone",
    "OPTIONAL ornament may be dimensional; it never replaces or hides a rough required piece",
    "OPTIONAL ornament may be fully realised and polished only when no rough piece is made to look finished",
    "legendary optional ornament may be gilded, while the motif and four required pieces keep their original identity and placement"
  ];
  /* ★ 어느 등급이든, 문장이 있다면 그 그림은 모티브다. 글자가 아니다.
     이걸 안 적으면 그림 모델이 히어로 이름 첫 글자를 가슴에 찍는다. */
  const EMB_RULE = "ANY EMBLEM SHOWS THE MOTIF — its unmistakable silhouette or one famous physical structure in relief. NEVER a letter, initial, monogram, name or abstract logo. If it cannot be named as the motif, redraw it.";
  const head = legend
    ? 'LEGENDARY — beyond the top of the scale'
    : `${nOk} of the 4 pieces finished${nAce ? `, ${nAce} of them to showcase standard` : ''}${nRough ? `, ${nRough} still a rough prototype` : ''}`;
  return `HOW GOOD THIS ONE IS — ${head}
This student's result is written into the picture as CRAFTSMANSHIP; only an ability-activation shot also shows the matching rough device as weak or unreliable. The photograph remains meticulously composed, sharp and clear at every score, and motif identity never changes.
SURFACES: ${SURF[surfaceIndex]}.
OPTIONAL ORNAMENT: ${EXTRA[Math.min(EXTRA.length-1, Math.round(s * (EXTRA.length-1)))]}. ${EMB_RULE}
${s < 0.5 ? 'These craft limits never delete the equipment effect; its score-aware vapour, dust, sparks, beam or spray remains visible.\n' : ''}★ NONE OF THIS TOUCHES MOTIF IDENTITY OR REQUIRED GEAR: every named feature stays full-size, in its assigned place and in its real colours. Rough means crudely made, never absent.
Unfinished, not failed.`;
}

/* ★ 맨 앞 한 문단 — 그림 모델은 프롬프트의 첫머리를 가장 세게 읽고 뒤로 갈수록 흘린다.
   예전 순서에서는 모티브가 아홉 번째 블록이었다. 얼굴·몸·성별 규칙 1만 자를 지난 뒤라
   '거미를 골랐는데 거미가 1도 안 보인다'가 계속 나왔다. 이 앱이 실제로 지켜야 하는 것은
   결국 세 가지(얼굴 / 모티브 / 안경)뿐이므로, 그 셋만 맨 위에 짧게 못박고 시작한다. */
function leanHeadline(){
  const c = (lastCueList || []).slice(0, 2).map(x => String(x.en || '').trim()).filter(Boolean);
  if(!c.length) return '';
  const two  = c.length >= 2;
  const NM   = two ? `${c[0].toUpperCase()} AND ${c[1].toUpperCase()}` : c[0].toUpperCase();
  const low  = two ? `${c[0].toLowerCase()} and ${c[1].toLowerCase()}` : c[0].toLowerCase();
  const eyes = !state.photo ? ''
    : wearsGlasses() ? ' The eyewear over those eyes is redesigned as hero eyewear for this costume — it sits where the photographed pair sat, its lenses stay clear, and both eyes stay fully visible and unchanged behind them.'
    : noGlasses()    ? ' Nothing new sits over their eyes: both eyes are bare, open and lit; any photographed glasses or goggles already pushed into the hair or crown stay at that exact original position.'
    : '';
  return `READ THIS PARAGRAPH FIRST. IF YOU FOLLOW ONLY ONE THING ON THIS PAGE, FOLLOW THIS.
THIS HERO IS BUILT TO LOOK LIKE ${NM}${motifNameHint(NM)}. A stranger who is told nothing must look at the finished picture for ONE SECOND and say "${low}". ${two
  ? `Both motifs are BUILT at full size on different parts of the body, and both must be nameable — if a viewer can only name one, the picture has failed.`
  : `If the honest answer would be "a hero in a nice suit", the picture has failed. The motif is built into the silhouette, the surface and the colour, not printed on the chest.`}
${state.photo ? `THE FACE IS THE ATTACHED PHOTOGRAPH — the same ${subjectWord()} with the exact facial geometry, expression, gaze, head angle, hairline and face boundary locked. No mask or headgear crosses the face.${eyes}
` : ''}THE WHOLE BODY IS IN THE FRAME: a full-length standing shot with clear air above the head and both boots complete with their soles on the ground. Not a portrait, not head-and-shoulders, not waist-up, not cropped at the knees or the ankles — however the reference photograph is cropped, this one is full-length. Set the camera distance for that first, before anything else.
Everything further down explains HOW to build that. Nothing further down replaces this paragraph.`;
}

function buildLeanPrompt(b){
  const n = isLegend() ? 5 : loadoutScore().ok;
  /* ★ 순서가 곧 우선순위다. 그림 모델은 앞을 세게 읽고 뒤로 갈수록 흘리므로
     지켜야 하는 것부터 놓는다 — 요약 → 얼굴 → 모티브 → 장비 → 나머지.
     ★ 그리고 같은 말을 두 번 하지 않는다. 예전에는 얼굴 규칙이 여섯 블록에 흩어져
     1만 3천 자였고, 그 부피가 모티브와 장비를 뒤로 밀어내 '거미가 거미로 안 보이는'
     결과를 만들었다. 각 규칙은 이제 한 곳에서만 말한다. */
  return [
    openingLine(n),
    leanHeadline(),
    leanFace(),
    leanMotif(b),
    /* ★ motifFaceRule() 은 여기 넣지 않는다 — leanMotif 안의 relocate 문단이 같은 규칙이다.
       둘 다 넣었더니 똑같은 말이 1,600자씩 두 번 들어갔고, 그만큼 뒤의 장비·구도가 밀렸다. */
    /* ★ 모티브를 하나도 안 고른 학생에게는 leanMotif 가 빈 문자열을 돌려준다.
       그러면 엠블럼 규칙까지 통째로 빠져서, 가슴에 스페이드·별·글자가 다시 나온다.
       그 경우에만 최소한의 엠블럼 규칙을 따로 넣는다. */
    leanMotif(b) ? '' : `THE CHEST: if this costume carries an emblem, it is a built three-dimensional object made from the costume's own materials — a sculpted relief of a real thing this hero is about. NOT a card suit (no spade, heart, diamond or club), NOT a star, lightning bolt, shield, hexagon or any abstract geometric badge, and NOT a letter, initial, monogram or name. If none of that can be built convincingly, leave the chest plain.`,
    leanGear(),
    /* ★ 등급 상한선은 장비 바로 뒤에 둔다. 뒤쪽으로 밀릴수록 무시된다. */
    leanCraftCap(n),
    b.picture ? `THE PICTURE: ${b.picture}` : '',
    leanShot(b, n),
    leanQuality(n),
    leanBody(),
    leanGender(n),
    leanMission(),
    leanGarment(b),
    /* ★ 헬멧 규칙도 규칙집에만 있고 그림 프롬프트에는 없었다 — 안경과 똑같은 누락이었다.
       그래서 모델은 늘 맨머리나 작은 크레스트로 갔다. 짧게 여기에 붙인다. */
    `HEADGEAR — LET THE MOTIF DECIDE, AND DO NOT DEFAULT. If the motif has a head worth building — a crested bird, a horned or antlered animal, a shelled or armoured creature, a rider, a diver, a pilot, a machine — then BUILD THE HELMET, because that is where the motif reads best. If the motif lives in the body instead, a crown or back crest, a circlet, a brow band or a bare head is the better answer.
${state.photo ? `WHENEVER A HELMET IS BUILT IT IS OPEN-FACED, WORN THE WAY A CAP IS WORN: on the crown and the back of the head, beginning behind the preserved hairline, with NO faceplate, NO chin bar, NO cheek guards, NO muzzle and nothing hinged down over the eyes. Everything from the eyebrows down is bare face. A closed helmet is the one thing never built here — the helmet is welcome, the faceplate is not.` : 'A helmet may be closed or open, but the mouth and jaw stay readable.'}`,
    `THE HEAD: ${b.head || ''}${state.photo ? (wearsGlasses()
      ? ` Headgear stays on the crown and back behind the preserved hairline. This hero wears the redesigned hero eyewear specified in the FACE section at the photographed eye position — a new frame designed for this costume, never the glasses from the photograph — with clear lenses and both eyes fully visible behind them. No mask, no full-face visor, no second optical object.`
      : ' Headgear stays on the crown and back behind the preserved hairline. The whole face, eyes and eyebrows are bare and lit, with no new glasses, goggles, visor, mask or optical object over them. Any photographed glasses or goggles already pushed into the hair or crown stay at their exact original shape and position and are never moved down.')
      : ' The face stays readable — a mask leaves the mouth and jaw bare; a helmet stops at the brow with the face open below it.'}`,
    `COLOUR: ${state.palette || b.colour || ''}${
      state.gender === 'girl' ? '\nIts lightest, clearest tints become the pink and gold accents, and the field of the suit stays white, ivory, cream or pearl whatever the scheme names.'
    : state.gender === 'boy' ? '\nIts deepest tone becomes the field, its metal becomes hard dark metal, and only its brightest colour survives as the single thin hot accent.'
    : ''}${state.signature ? `\nTHE MEMORABLE DETAIL: ${state.signature} — a complete recognisable physical object whose workmanship follows the exact zone carrying it. ${gearList().some(x=>x.ok===false) ? 'If it sits in a ROUGH zone it has hand-cut edges, visible tape or simple fasteners, uneven motif-colour paint and honest classroom hand-work; only a FINISHED or SHOWCASE zone may give it clean engineered edges, and this line never upgrades a rough zone.' : 'It has clean engineered edges, proper fasteners and honest wear.'}` : ''}`,
    `COVERAGE: one opaque full-coverage bodysuit runs from a closed high neck to the wrists and the ankles, and every plate, harness, strap, cable and pouch is mounted on top of it. The only skin in this picture is the face and the neck above the collar. Nothing sleeveless, nothing cut away, nothing sheer, nothing rolled up.`,
    `A REAL PHOTOGRAPH: fabric with real weight and wrinkles, panels with visible thickness and honest edges, functional seams, used boots and gloves, believable contact shadows, shallow depth of field, faint grain, one light direction and one white balance throughout. The whole figure is in frame, from clear air above the head to the soles of both boots.
NOT IN IT: text, letters, initials, monograms or the hero's name anywhere including on the chest emblem; card suits (spade, heart, diamond, club), stars, lightning bolts, shields or any abstract geometric badge on the chest; logos or watermarks; floating icons, holograms or formulas; plastic airbrushed skin; cartoon, anime or CG-render finish; extra people, duplicated limbs, extra fingers, cropped shoes; bare skin other than the face and neck.${state.shot === 'activate' ? `
THE ACTION EFFECT IS SCORE-AWARE AND THIS LAST LINE MAY NOT OVERRIDE IT: ${actionScale(n)} Keep the event photographic and tied to what the equipment really does. Make the body reaction and camera timing dramatic at every grade, but never enlarge a weak rough-prototype effect into a full-power blast.` : ''}`,
    faceCheckTail()
  ].filter(Boolean).join('\n\n');
}

/* ══════════════════════════════════════════════════════════════
   10. OpenRouter — 모델에 맞춰 호출 규격을 자동으로 맞춤
   ══════════════════════════════════════════════════════════════ */

const OR_URL = 'https://openrouter.ai/api/v1/chat/completions';
/* ★ 그림은 이 전용 주소로 부른다. chat/completions 가 아니다.
   OpenRouter 가 2026-06 에 그림 전용 API 를 따로 냈고, 공지에 이렇게 적었다 —
   "새로 추가되는 그림 모델은 전용 Image API 에만 올라간다."
   그래서 chat/completions 로는 옛날 모델 몇 개(Nano Banana 2·Pro)만 되고
   Seedream·FLUX·GPT Image 는 전부 404 가 났던 것이다. 이름 문제가 아니었다. */
const OR_IMG_URL = 'https://openrouter.ai/api/v1/images';
const OR_HEAD = () => ({
  'Authorization':`Bearer ${state.key}`,
  'Content-Type':'application/json',
  'X-Title':'PHASE Science Hero Lab'
});

async function orFetch(payload, timeoutMs, url){
  const ac = new AbortController();
  const timer = setTimeout(()=>ac.abort(), timeoutMs);
  let res;
  try{
    res = await fetch(url || OR_URL, {method:'POST', headers:OR_HEAD(), body:JSON.stringify(payload), signal:ac.signal});
  }catch(err){
    if(err.name === 'AbortError') throw new Error('시간이 초과됐습니다. 인터넷 연결과 OpenRouter 상태를 확인해 주세요.');
    throw new Error('요청을 보내지 못했습니다: ' + err.message);
  }finally{ clearTimeout(timer); }

  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    /* ★ OpenRouter 가 보내 준 설명을 절대 버리지 않는다.
       예전에는 404 를 무조건 "모델을 찾을 수 없습니다" 로 바꿔 버렸는데,
       404 는 '요청한 modalities·파라미터를 지원하는 제공자가 없다' 일 때도 나온다.
       그래서 이름이 멀쩡한 모델이 이름 틀린 것처럼 보였고, 원인을 찾는 데 한참 걸렸다.
       무슨 일이 났는지는 이 detail 에 적혀 있으므로 화면에 같이 띄운다. */
    const detail = data?.error?.message ? ` — ${data.error.message}` : '';
    let msg;
    if(res.status === 401)      msg = `API 키가 올바르지 않습니다. 키를 다시 확인해 주세요.${detail}`;
    else if(res.status === 402) msg = `OpenRouter 잔액이 부족합니다. 크레딧을 충전해 주세요.${detail}`;
    else if(res.status === 404) msg = `이 모델로는 요청을 처리할 수 없습니다: ${payload.model}${detail}`;
    else if(res.status === 429) msg = `요청이 너무 잦습니다. 잠시 뒤 다시 시도해 주세요.${detail}`;
    else msg = data?.error?.message || `요청 실패 (${res.status})`;
    const e = new Error(msg);
    e.status = res.status;          // 호출한 쪽이 404 인지 보고 다시 시도할 수 있게 한다
    throw e;
  }
  return data;
}

/* 모든 시각 판정과 그림 생성은 확대 얼굴을 첫 번째 참조로 본다.
   원본은 자세·머리·조명 맥락용이고, 정체성의 기준은 얼굴 확대본이다. */
function photoReferenceParts(){
  const out = [];
  if(state.photoFace) out.push({ type:'image_url', image_url:{ url:state.photoFace } });
  if(state.photo) out.push({ type:'image_url', image_url:{ url:state.photo } });
  return out;
}

function exactGlassesValue(value){
  const s = String(value == null ? '' : value).trim().toLowerCase();
  if(s === 'yes' || s === '있음' || s === '썼음') return 'yes';
  if(s === 'no'  || s === '없음' || s === '안 썼음' || s === '안썼음') return 'no';
  return '';
}

function parseGlassesScan(text){
  const src = String(text || '').trim();
  let verdict = '', confidence = 0;
  const m = src.match(/\{[\s\S]*?\}/);
  if(m){
    try{
      const j = JSON.parse(m[0]);
      verdict = exactGlassesValue(j.glasses ?? j.verdict ?? j.answer);
      confidence = Number(j.confidence ?? j.conf ?? 0);
    }catch(_){}
  }
  if(!verdict) verdict = exactGlassesValue(src.replace(/^```(?:json)?\s*|\s*```$/gi, ''));
  if(confidence > 1) confidence /= 100;
  if(!Number.isFinite(confidence)) confidence = 0;
  return { verdict, confidence:Math.max(0, Math.min(1, confidence)), raw:src };
}

async function classifyGlasses(recheck, prior){
  if(!state.photo) return {verdict:'', confidence:1, raw:''};
  const refs = photoReferenceParts();
  const labels = state.photoFace
    ? 'IMAGE 1 is a lossless enlarged crop of the head. IMAGE 2 is the original photograph of the same person.'
    : 'IMAGE 1 is the original photograph.';
  const instruction = `You are a binary eyewear inspector. ${labels}
Inspect the actual pixels around both eyes, the bridge of the nose, both temples and the top of the head.
Answer YES only when prescription glasses, sunglasses, safety glasses or goggles are physically worn ACROSS THE EYES. Rimless glasses still count: look for lenses, a bridge, nose pads, hinges or temple arms. Reflections on bare skin, eyebrows, hair strands, masks and shadows do not count.
Glasses or goggles pushed up onto the hair, forehead or top of the head are NOT over-eye eyewear: answer NO. The image generator will preserve any such photographed head-top object in its exact original position, rather than moving it down over the eyes.
Answer NO when both eyes are bare and no eyewear crosses them.
${recheck ? `This is an automatic adjudication because earlier readings were uncertain or disagreed (${String(prior || 'no reliable prior reading')}). Ignore those readings if the pixels disagree. Re-check the bridge, lens boundaries, nose pads and both temple arms, then force one final binary decision.` : 'Check the close crop and the original independently, then compare them before deciding.'}
Output ONLY strict JSON in this exact shape: {"glasses":"yes","confidence":0.99}
The glasses value must be exactly yes or no. Never output unsure, maybe, unknown or an explanation.`;
  const payload = {
    model:state.textModel,
    messages:[{role:'user', content:[{type:'text', text:instruction}, ...refs]}],
    temperature:0,
    max_tokens:100
  };
  const data = await orFetch(payload, 60000);
  const c = data?.choices?.[0]?.message?.content;
  const text = Array.isArray(c) ? c.map(x=>x?.text||'').join(' ') : String(c||'');
  return parseGlassesScan(text);
}

/* 전용 저온 판정과 연출 모델의 독립 판정을 대조한다. 하나의 낮은 확신값이나
   단순 다수결을 바로 믿지 않는다. 어긋나면 서로 다른 재검사 문구로 두 번 다시 보고,
   확신도까지 가중한 결론만 채택한다. 끝내 애매하면 수동 질문으로 보내지 않고 생성을
   멈춰 더 선명한 사진으로 자동 판정을 다시 하게 한다. */
async function resolveGlasses(scan, directorValue){
  if(!state.photo) return '';
  const a = scan && exactGlassesValue(scan.verdict);
  const b = exactGlassesValue(directorValue);
  const aConf = Math.max(0, Math.min(1, Number(scan && scan.confidence) || 0));
  /* 두 판정이 같아도 확대 픽셀 판정이 충분히 선명할 때만 즉시 확정한다. */
  if(a && b && a === b && aConf >= 0.88) return a;
  if(a && aConf >= 0.96 && !b) return a;
  const prior = `dedicated=${a || 'invalid'} (${Math.round((Number(scan?.confidence)||0)*100)}%), director=${b || 'invalid'}`;
  const safeCheck = async label => {
    try{ return await classifyGlasses(true, `${prior}; independent pass=${label}`); }
    catch(_){ return {verdict:'', confidence:0, raw:''}; }
  };
  const [final, confirm] = await Promise.all([
    safeCheck('A — trace bridge, nose pads and both temple arms'),
    safeCheck('B — compare bare-skin reflections against physical lens boundaries')
  ]);
  const valid = x => x && (x.verdict === 'yes' || x.verdict === 'no');
  const fConf = valid(final) ? Math.max(0, Math.min(1, Number(final.confidence)||0)) : 0;
  const cConf = valid(confirm) ? Math.max(0, Math.min(1, Number(confirm.confidence)||0)) : 0;
  /* 독립 재검사 둘이 같은 결론이고 둘 다 최소 확신선을 넘을 때 가장 안전하다. */
  if(valid(final) && valid(confirm) && final.verdict === confirm.verdict && Math.min(fConf, cConf) >= 0.68)
    return final.verdict;

  const scored = [];
  if(a && aConf >= 0.45) scored.push({v:a, w:aConf, src:'initial'});
  if(b) scored.push({v:b, w:0.72, src:'director'}); /* 연출 모델 판정은 전용 픽셀 검사보다 조금 낮게 친다. */
  if(valid(final) && fConf >= 0.45) scored.push({v:final.verdict, w:fConf, src:'recheck-a'});
  if(valid(confirm) && cConf >= 0.45) scored.push({v:confirm.verdict, w:cConf, src:'recheck-b'});
  const weight = v => scored.filter(x=>x.v===v).reduce((sum,x)=>sum+x.w,0);
  const count = v => scored.filter(x=>x.v===v).length;
  const yesW = weight('yes'), noW = weight('no');
  const winner = yesW === noW ? '' : (yesW > noW ? 'yes' : 'no');
  const margin = Math.abs(yesW - noW);
  /* 적어도 두 판정이 같은 쪽이고 가중치 차이가 충분할 때만 다수 결론을 쓴다. */
  const hasStrongPixelVote = winner && scored.some(x => x.v === winner && x.src !== 'director' && x.w >= 0.62);
  if(winner && count(winner) >= 2 && margin >= 0.55 && hasStrongPixelVote) return winner;
  throw new Error('사진에서 안경 여부를 자동으로 확정하지 못했습니다. 안경 반사가 적고 두 눈과 귀 옆이 선명한 정면 사진으로 다시 찍어 주세요.');
}

/* 텍스트 모델: 사진을 보고 히어로 이름과 연출을 설계 */

  const abilitySeed = gearList()

  const shot = shotInfo();

`너는 실사 히어로 영화의 컨셉 아티스트다. ${state.photo ? '첨부된 사진 속 인물을' : '아래 설정만 보고 만든 가상의 학생을'} 주인공으로 하는 히어로를 설계한다.${state.photo ? '' : `

설정

- 하는 일: ${state.role}${(()=>{const r=ROLE_DATA.find(x=>x.ko===state.role);
  return r?`\n  이 직업이면 옷에 반드시 있어야 할 것: ${r.job}\n  이 직업 때문에 재단이 이렇게 달라진다: ${r.cut}`

- 성격: ${state.traits || '호기심 많고 용감함'}${(()=>{
  const ch=String(state.traits||'').split(',').map(s=>s.trim()).filter(Boolean);

                   : `\n  얼굴 표정은 이렇게: ${hit[0].face}`):'';})()}
  하는 일과 성격은 캡션이 아니라 그림에 보여야 한다. 아무 설명 없이 그림만 봐도
  이 히어로가 무슨 일을 하는 사람인지, 어떤 성격인지 짐작할 수 있어야 한다.

- 직접 한 실험으로 얻은 장비: ${gear}
- 촬영 컷: ${shot.name} (${shot.desc})${(SHOTS.find(x=>x.id===state.shot)||{}).free && String(state.shotFree||'').trim()
  ? `\n  ★ 이 장면은 학생이 직접 적은 것이다. 아래 shotEn 칸에 이것을 실사 영화 촬영 지시(영어 한두 문장)로 옮겨라.` : ''}

- 각 장비가 실제로 하는 일 (확인 문제 결과로 이미 확정된 것이다. 아래 내용을 벗어나지 마라)
${abilitySeed}
  '최상급 완성형'은 원리를 빠르고 정확하게 맞혀 얻은 것이고, '시제품'은 원리를 아직 못 잡은 채 만든 것이다.${isLegend()?`

★ 전설 등급 <${legendInfo().name}> 이다. ${legendInfo().matched?'학년마다 하나뿐인 조합을 맞춘 최강 형태다.':'이 학생이 고른 4가지 실험이 하나로 맞물린 최강 형태다.'}

  능력은 반드시 위에 적힌 '각 장비가 실제로 하는 일'에서만 끌어내라. 고르지 않은 장비를 지어내지 마라.
  heroName 도 이 최강 형태에 어울리게 짓되, 이름 규칙(6자·모티브 포함·성별 어미)은 그대로 지켜라.
  tagline 은 대장·최강·완성이라는 인상이 들도록 짓되 14자 이내를 지켜라.`:''}

gear 규칙 — 학생이 실제로 읽는 글이다. 여기가 어색하면 다 망친다.
- 위 '각 장비가 실제로 하는 일' 에 적힌 1~4번을 **순서 그대로**, 각각 한글 한두 문장으로 다시 써라. 개수는 반드시 4개다.
- **사실을 바꾸지 마라.** 원리, 수치, 조건, 한계는 그대로 두고 문장만 매끄럽게 다듬는다. 거기 없는 능력을 보태거나 빼지 마라.
- 장비가 무엇을 하는지가 첫머리에 오게 하고, 왜 그렇게 되는지를 뒤에 붙여라. 읽는 사람이 한 번에 이해해야 한다.
- '시제품'은 할 수 있는 일을 먼저 말하고 '다만 ~' 으로 한계를 붙여라. 고장 신고처럼 쓰지 마라.
- 번역투('~되어진다', '~에 의해', '~을 가진다')와 어려운 한자어를 쓰지 마라. 조사와 어미를 정확히 맞춰라.
- 각 문장은 90자 이내. 소리 내어 읽어 보고 걸리는 데가 있으면 고쳐라.
- 과학적으로 틀린 말은 절대 금지다. 특히 전지가 저절로 충전된다, 공명이 없던 에너지를 만든다, 반짝이는 금속이 그 자체로 단열이 된다 같은 말은 쓰지 마라.

아래 JSON만 출력해라. 다른 말은 쓰지 마라.

heroName 규칙 — 이게 가장 중요하다.
실제 히어로 영화 주인공 이름처럼 짧고 부르기 쉬워야 한다. 스파이더맨, 배트맨, 슈퍼맨, 아이언맨, 그린랜턴, 블랙팬서, 캡틴 아메리카, 닥터 스트레인지, 플래시 같은 느낌이다.
- 반드시 이 세 형태 중 하나로 만들어라.
  (1) 능력 한 단어 + 맨/우먼/걸/보이   예: 임팩트맨, 마그넷우먼, 코퍼걸, 소닉보이
  (2) 캡틴/닥터/미스터/미스 + 능력 한 단어   예: 캡틴 볼트, 닥터 프리즘, 미스터 써멀
  (3) 색이나 재료 + 명사 한 단어를 붙인 두 단어   예: 그린코일, 실버미러, 블루스파크
- 공백을 빼고 6자 이내. 짧을수록 좋다. 소리 내어 부르기 쉬워야 한다.
- 같은 반 서른 명이 동시에 만든다. 흔한 단어 하나로 때우지 말고, 이 학생이 고른 모티브가 이름에 남게 해라.
- 앞 단어는 **모티브에서 먼저** 따와라. 이 히어로가 무엇을 닮았는지가 이름에서 들려야 한다. 치타면 치타, 늑대면 울프, 문어면 옥토, 거미면 스파이더, 화산이면 마그마, 번개면 볼트, 얼음이면 아이스, 로봇이면 로보. (스파이더맨, 배트맨, 블랙팬서, 앤트맨이 다 이 방식이다.)
- 모티브에서 좋은 단어가 안 나올 때만 장비에서 따와라. 충격 경화면 임팩트, 전자석이면 마그넷, 공명이면 소닉, 구리면 코퍼, 발수면 아쿠아, 단열이면 써멀, 전지면 볼트.
  · ★ 여기서 '볼트'는 **전압 단위 volt** 다. **나사·너트와 짝을 이루는 bolt 가 절대 아니다.** 이름을 볼트로 지었다고 해서 아래 영어 칸에 bolt, nut, screw, fastener, hardware 같은 말이 들어가면 안 된다. 마찬가지로 '미러'는 mirror(거울)이고, '제트'는 jet(분사)이며, '소닉'은 sonic(소리)이다.
- ★ 이름은 그림에 그려지지 않는다. heroName 은 포스터에 글자로만 찍히고, 그림 생성에는 넘어가지 않는다. 그러니 **이름을 먼저 정해 놓고 그 이름의 뜻에 맞춰 아래 영어 칸(motifsEn·motifCues·palette·signature)을 쓰지 마라.** 순서는 반대다 — 학생이 고른 모티브가 영어 칸을 정하고, 이름은 거기서 따라 나온다. 이름의 한글 낱말을 그림 속 사물로 만들지 마라.

  /* 사고력을 최대로 — reasoning_effort 를 받는 모델에만 붙인다.
     Luna Pro 는 reasoning.mode=pro 로 서비스되는 같은 모델이라, 여기에 effort 까지 올리면
     이 히어로 설계처럼 조건이 많은 일에서 눈에 띄게 잘 지킨다.
     직접 입력한 모델은 지원 여부를 알 수 없으므로 붙이지 않는다(모르는 파라미터로 실패할 수 있다). */
  const meta = TEXT_MODELS.find(m => m.id === state.textModel);
  const payload = {
    model: state.textModel,
    messages: [{ role:'user', content:
      state.photo
        /* 확대 얼굴을 먼저, 원본 맥락 사진을 두 번째로 넘긴다. */
        ? [{ type:'text', text:instruction }, ...photoReferenceParts()]
        : [{ type:'text', text:instruction }]
    }],
    temperature: 0.85,
    max_tokens: 1200
  };
  if(meta && meta.effort) payload.reasoning = { effort: meta.effort };
  const data = await orFetch(payload, 90000);

  const c = data?.choices?.[0]?.message?.content;
  const text = Array.isArray(c) ? c.map(x=>x?.text||'').join(' ') : String(c||'');
  return parseDirector(text);
}

function parseDirector(text){
  const out = { heroName:'', tagline:'', roleEn:'', traitsEn:'', motifsEn:'', motifCues:'',
                palette:'', signature:'', artDirection:'', intro:'', shotEn:'', gear:[], glasses:'' };
  const m = text.match(/\{[\s\S]*\}/);
  if(m){
    try{
      const j = JSON.parse(m[0]);
      out.heroName    = String(j.heroName||'').trim();
      out.tagline     = String(j.tagline||'').trim();
      out.roleEn      = String(j.roleEn||'').trim();
      out.traitsEn    = String(j.traitsEn||'').trim();
      out.motifsEn    = String(j.motifsEn || j.creaturesEn || '').trim();
      out.motifCues   = String(j.motifCues||'').trim();
      out.intro       = String(j.intro || j.abilities || '').trim();
      out.gear        = Array.isArray(j.gear) ? j.gear.map(x=>String(x||'').trim()) : [];
      out.palette     = String(j.palette||'').trim();
      out.signature   = String(j.signature||'').trim();
      out.shotEn      = String(j.shotEn||'').trim();
      out.artDirection= String(j.artDirection||'').trim();
      /* 연출 호출의 값은 전용 자동 판정과 대조하는 두 번째 표다. exact match만 받는다. */
      out.glasses = exactGlassesValue(j.glasses);
    }catch{}
  }
  if(!out.artDirection && !state.photo) out.artDirection = text.replace(/[{}"]/g,' ').replace(/\s+/g,' ').trim().slice(0,900);
  if(!heroNameOk(out.heroName) || !nameHasMotif(out.heroName) || !nameGenderOk(out.heroName)) out.heroName = fallbackName();
  if(!out.tagline)  out.tagline  = '실험으로 태어난 히어로';
  return out;
}

/* 실존 히어로 이름은 그대로 쓰지 않는다 */
const REAL_HEROES = /(스파이더맨|배트맨|슈퍼맨|아이언맨|캡틴아메리카|헐크|토르|블랙팬서|블랙위도우|원더우먼|플래시|그린랜턴|데드풀|울버린|앤트맨|호크아이|닥터스트레인지|아쿠아맨|사이보그|퀵실버|비전|로키|그루트|자칼)/;
/* 시적인 이름이 오면 버린다 — 히어로 이름은 짧고 부르기 쉬워야 한다 */
function heroNameOk(n){
  n = String(n||'').trim();
  if(!n) return false;
  const bare = n.replace(/\s/g,'');
  if(bare.length < 2 || bare.length > 8) return false;
  if(/[A-Za-z0-9]/.test(n)) return false;                 // 한글 이름만 받는다
  if(/[.,!?~·]/.test(n)) return false;
  if(/의\s|의$/.test(n)) return false;
  if(REAL_HEROES.test(bare)) return false;
  /* 아래 낱말은 '들어 있으면' 안 된다. 다만 '아이스'의 '아이'처럼
     다른 낱말 속에 우연히 박힌 경우까지 걸러 버리면 멀쩡한 이름이 죽는다.
     그래서 통째로 쓰인 경우와 끝에 붙은 경우만 본다. */
  if(/(수호자|파수꾼|지킴이|전사|기사|용사|영웅|요정|마법사|소년|소녀|사나이)/.test(n)) return false;
  if(/(^|\s)아이($|\s)/.test(n)) return false;
  if(/자$/.test(bare)) return false;
  return true;
}

/* 고른 모티브가 이름에 실제로 들어 있는지 본다.
   '치타'를 골랐는데 '캡틴 볼트'가 나오면 학생 눈에는 자기 것으로 안 보인다.
   모티브를 하나도 안 고른 학생은 이 검사를 건너뛴다. */
/* 성별 어미가 고른 유형과 맞는지. 여자 히어로에게 ~맨이 나오면 버린다. */
/* 어미는 나이로도 갈린다.
   초등(만 12세 이하)은 ~보이 · ~걸 이 어울리고, ~맨 · ~우먼 은 어색하다.
   만 13세부터는 ~맨 · ~우먼 도 되고, 어미 없는 이름도 얼마든지 된다. */
function nameSuffixes(){
  const kid = ageIntl() <= 12;
  if(state.gender === 'boy')  return kid ? ['보이'] : ['맨','보이'];
  if(state.gender === 'girl') return kid ? ['걸']   : ['우먼','걸'];
  return [];
}
function nameGenderOk(n){
  const bare = String(n||'').replace(/\s/g,'');
  const kid = ageIntl() <= 12;
  const ALL = /(맨|보이|우먼|걸)$/;
  if(state.gender === 'girl'){
    if(/(맨|보이)$/.test(bare)) return false;              // 여자에게 남성형 어미
    if(kid && /우먼$/.test(bare)) return false;            // 초등에게 ~우먼은 어색하다
    return true;                                            // ~걸 또는 어미 없는 이름
  }
  if(state.gender === 'boy'){
    if(/(우먼|걸)$/.test(bare)) return false;
    if(kid && /맨$/.test(bare)) return false;              // 초등에게 ~맨은 어색하다
    return true;
  }
  if(!state.gender && ALL.test(bare)) return false;         // 상관없음이면 어미를 쓰지 않는다
  return true;
}
function nameHasMotif(n){
  const words = motifNameWords();
  if(!words.length) return true;
  const bare = String(n||'').replace(/\s/g,'');
  const has = w => bare.includes(w) || bare.includes(w.slice(0,2));
  /* 모티브를 두 개 골랐으면 이름에도 둘이 다 들어 있어야 한다.
     하나만 들어 있으면 학생 눈에는 나머지 하나를 안 쓴 것으로 보인다.
     둘 다 넣은 이름이 애초에 불가능한 경우(합쳐서 7자 이상)에만 하나로 봐준다. */
  if(words.length >= 2){
    const cut = s => s.length > 2 ? s.slice(0,2) : s;
    const fits = (cut(words[0]) + cut(words[1])).length <= 6;
    return fits ? (has(words[0]) && has(words[1])) : words.some(has);
  }
  return words.some(has);
}
/* 이름에 쓸 수 있는 모티브 낱말 — 목록에서 고른 것과 직접 적은 것 모두 */
function motifNameWords(){
  return [...new Set(motifEntries().map(e => MOTIF_WORDS[e.ko] || e.ko).filter(Boolean))];
}

/* 모델이 다듬어 준 능력 문장을 받아들일지 결정한다.
   글을 매끄럽게 하는 건 모델이 잘하지만, 사실을 바꿔 놓으면 과학 수업이 망가진다.
   그래서 개수·길이·금지 표현을 검사해 통과할 때만 쓰고, 하나라도 걸리면 통째로 우리 문장을 쓴다. */
const BAD_SCI = [
  /저절로\s*충전/, /걷는?\s*동안\s*충전/, /스스로\s*충전/,
  /에너지를\s*(새로\s*)?만들/, /무한(정)?\s*(에너지|동력|전력)/,
  /영구(히|적으로)\s*(작동|유지)/,
  /반짝(여|이)서\s*단열/, /포일이\s*가장\s*따뜻/,
  /전자가\s*(과일|레몬|용액|전해질)\s*속을\s*(지나|통과)/,
  /마법/, /초능력/
];
function polishedGear(arr){
  const n = gearList().length;
  if(!Array.isArray(arr) || arr.length !== n) return null;          // 개수가 다르면 버린다
  for(const t of arr){
    if(typeof t !== 'string') return null;
    const x = t.trim();
    if(x.length < 12 || x.length > 200) return null;                // 너무 짧거나 긴 것
    if(!/[가-힣]/.test(x)) return null;                              // 한글이 아닌 것
    if(/[{}\[\]<>]|^\d+\)/.test(x)) return null;                    // 형식이 새어 나온 것
    if(BAD_SCI.some(re => re.test(x))) return null;                 // 오개념이 섞인 것
  }
  return arr.map(t=>t.trim());
}

/* 한글 조사 — 앞말 받침에 맞춰 고른다. 이게 틀리면 문장이 대번에 어색해진다 */
function josa(word, pair){
  const w = String(word||'').replace(/[^가-힣a-zA-Z0-9]/g,'');
  const last = w.charCodeAt(w.length-1);
  const hasJong = last >= 0xAC00 && last <= 0xD7A3 ? ((last - 0xAC00) % 28) !== 0
                : /[13678lmnr]$/i.test(w[w.length-1]);   // 영문·숫자는 소리로 어림한다
  const [a,b] = pair.split('/');
  return hasJong ? a : b;
}

/* ── 히어로 소개 ─────────────────────────────────────────────────
   예전에는 장비 설명 4개를 그냥 이어 붙여서, 히어로 이름은 나오지도 않고
   무슨 말인지 읽히지 않는 덩어리가 나왔다. 세 덩이로 나눠 쓴다.
     ① 한 줄 — 이 히어로가 누구인가
     ② 능력 — 장비별로 한 줄씩, 등급까지
     ③ 한 줄 — 그래서 지금 얼마나 완성됐는가
   ───────────────────────────────────────────────────────────── */
function heroBrief(){
  const got  = gearList();
  const name = String(state.heroName||'').trim() || '이 히어로';
  const mot  = allMotifs();
  const role = String(state.role||'').trim();
  const tr   = TRAIT_DATA.find(t => String(state.traits||'').split(',').map(x=>x.trim()).includes(t.ko));

  /* ① 누구인가 — 짧은 문장 두세 개로 끊는다. 한 문장에 다 밀어 넣으면 안 읽힌다 */
  const lead = [];
  /* '사슴와 벌새' 가 되지 않게, 잇는 낱말마다 받침을 보고 과/와를 고른다 */
  const joined = mot.reduce((acc,m,i)=> i===0 ? m : `${acc}${josa(mot[i-1],'과/와')} ${m}`, '');
  const who = mot.length ? `${joined}${josa(mot[mot.length-1],'을/를')} 닮은 ` : '';
  lead.push(role
    ? `${name}${josa(name,'은/는')} ${who}${role}${josa(role,'이다/다')}.`
    : `${name}${josa(name,'은/는')} ${who}히어로다.`);
  if(tr && TRAIT_LEAD[tr.ko]) lead.push(TRAIT_LEAD[tr.ko]);
  lead.push('입고 있는 장비는 전부 직접 한 실험에서 나왔다.');

  /* ② 능력 — 장비 하나에 한 줄. 등급이 곧 성능이다 */
  const TAG = {ace:'최상급', ok:'완성형', miss:'시제품'};
  const polished = polishedGear(state.gearText);   // 검사를 통과했을 때만 값이 있다
  const items = got.map((g,i) => {
    const grade = g.grade || (g.ok===false ? 'miss' : 'ok');
    const base = grade === 'miss'
      ? abilityOf(g.id, 'miss')
      : ((polished && polished[i]) || g.ability || abilityOf(g.id, grade));
    return {
      icon:g.icon, gear:displayGearName(g), exp:g.exp,
      grade, tag:TAG[grade], text:displayGearAbility(g, grade, base)
    };
  });

  /* ③ 지금 얼마나 완성됐는가 */
  const s = loadoutScore();
  let close;
  if(isLegend()){
    /* 이름과 조합 설명은 바로 아래 전설 상자가 맡는다.
       여기서 또 이름을 부르면 같은 말이 두 번 나와 글이 지저분해진다. */
    close = '장비 4개가 따로 놀지 않고 하나의 기계로 맞물렸다. 지금 나올 수 있는 가장 완성된 모습이다.';
  } else if(s.ace === s.n && s.n > 0){
    close = '문제 4개를 모두 제한시간 절반 안에 맞혀서, 장비 넷이 전부 최상급으로 만들어졌다.';
  } else if(s.ok === s.n && s.n > 0){
    close = s.ace ? `장비 4개가 전부 완성형이고, 그중 ${s.ace}개는 최상급이다.`
                  : '장비 4개가 전부 완성형이다. 다음에는 절반 시간 안에 맞혀 최상급을 노려 볼 만하다.';
  } else {
    close = `장비 ${s.n}개 중 ${s.ok}개가 완성형이다. 나머지 ${s.n-s.ok}개는 원리를 아직 다 잡지 못한 채 만들어서 시제품으로 달려 있고, 그 부분만 채우면 지금보다 확실히 강해진다.`;
  }
  return {lead: lead.filter(Boolean).join(' '), items, close};
}

/* 성격 한 줄 — 소개 문장 뒤에 붙어 '어떤 사람인지'를 마무리한다 */
const TRAIT_LEAD = {
  '침착한 리더':   '급할수록 천천히 말하고, 사람들이 그 목소리를 따라 움직인다.',
  '겁 없는 돌격형':'재는 법이 없어서, 다들 망설이는 사이 이미 앞에 나가 있다.',
  '머리 좋은 전략가':'힘으로 밀지 않는다. 어디를 건드리면 전체가 무너지는지 먼저 찾아낸다.',
  '따뜻한 조력자': '가장 먼저 하는 일이 남을 일으켜 세우는 것이다.',
  '조용하지만 강한':'말수가 적고, 대신 한 번 선 자리에서는 물러나지 않는다.',
  '장난기 많은':   '어떤 상황에서도 농담을 던지는데, 그게 사람들의 긴장을 푼다.',
  '포기를 모르는': '몇 번을 넘어져도 같은 자리에 다시 선다. 그게 이 히어로의 무기다.',
  '호기심 폭발':   '무섭기 전에 궁금해한다. 그래서 아무도 안 들여다본 곳을 먼저 본다.'
};

/* 예전 이름 — 한 덩어리 글이 필요한 자리를 위해 남겨 둔다 */
function fallbackAbilities(){
  const b = heroBrief();
  return [b.lead, ...b.items.map(i=>i.text), b.close].join(' ');
}

function fallbackName(){
  /* 이름의 앞말은 모티브에서 먼저 가져온다. 모티브가 없을 때만 장비에서 가져온다. */
  const words = motifNameWords();
  const got   = gearList();
  const seed  = heroSeed();
  const pick  = (arr, salt) => arr[((Math.imul(seed ^ salt, 2246822519) >>> 0) % arr.length)];
  const word  = words.length ? pick(words, 0x11a7)
              : (HERO_WORDS[(got[0]||{}).id] || HERO_WORDS[(got[1]||{}).id] || '스파크');

  /* 색 + 명사 형태를 만들 때 쓸 색. 고른 모티브의 성향에서 가장 무거운 것을 따른다. */
  const w = heroTags();
  let colour = '', bestScore = 0;
  Object.keys(TAG_COLOR).forEach(tg=>{ if((w[tg]||0) > bestScore){ bestScore = w[tg]; colour = TAG_COLOR[tg]; } });

  let forms = [];
  /* 모티브를 두 개 골랐으면 두 낱말을 붙여 하나의 이름으로 만든다.
     스파이더맨·블랙팬서처럼 이름만 들어도 무엇을 합쳤는지 들려야 한다.
     그대로 붙여 6자가 넘으면 앞쪽 낱말을 두 글자로 줄여서 붙인다. */
  if(words.length >= 2){
    const [a, b] = words;
    const cut = s => s.length > 2 ? s.slice(0,2) : s;
    forms.push(a+b, b+a, cut(a)+b, cut(b)+a, a+cut(b), b+cut(a));
    forms = forms.filter(f => f.length <= 6 && f.length >= 3);
  }
  /* 붙여 만든 이름이 하나도 안 남았을 때만 한 낱말 형태로 내려온다 */
  if(!forms.length){
    forms = NAME_PREFIX.map(pre => pre + word);
    if(colour) forms.push(colour + word);                  // 예: 실버치타, 블랙터틀
    /* 남자/여자 히어로를 고른 학생은 맨·우먼·걸·보이 형태도 쓸 수 있다.
       고르지 않았으면 성별이 드러나는 어미는 아예 만들지 않는다. */
    nameSuffixes().forEach(sfx => forms.push(word + sfx));
  }
  /* 공백을 뺀 길이가 6자를 넘으면 부르기 힘들다. 규칙을 통과하는 것만 남긴다. */
  forms = [...new Set(forms)].filter(f => f.replace(/\s/g,'').length <= 6 && heroNameOk(f));
  if(!forms.length) forms = [word.length<=4 ? ('캡틴 ' + word) : word];
  return pick(forms, 0x63c5);
}

/* 참조 사진을 네이티브 입력으로 받는 Image API 를 먼저 쓰고,
   해당 모델/제공자가 그 경로를 지원하지 않을 때만 chat/completions 로 내려온다. */
/* 얼굴이 자꾸 딴사람이 되는 기술적인 이유 하나 — 참조 사진이 상반신이라
   얼굴이 차지하는 픽셀이 적다. 모델은 적은 픽셀을 '복원'하면서 평균적인 얼굴로 흘러간다.
   그래서 같은 사진에서 머리 부분만 정사각으로 잘라 크게 키운 참조를 한 장 더 만들어
   함께 보낸다. 잘라낸 것이 이상하면 모델이 무시하도록 프롬프트에서 일러 둔다. */
async function faceRef(src){
  try{
    const img = await loadImageElement(src);
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h) return '';

    /* ★ 얼굴을 실제로 찾아서 자른다.
       브라우저가 FaceDetector 를 지원하면 가장 큰 얼굴을 찾아 머리카락·귀·턱
       여유를 둔 4:5 참조를 만든다. 지원하지 않아도 촬영 가이드와 업로드 안내가
       요구한 '정면 상반신'의 위쪽 중앙을 보수적으로 잘라 얼굴 픽셀을 키운다.
       어느 경로든 JPEG 재압축 없이 PNG 로 보내 눈·입·안경 가장자리를 보존한다. */
    let sx = 0, sy = 0, cw = w, ch = h, method = '';
    if(typeof FaceDetector === 'function'){
      try{
        const faces = await new FaceDetector({fastMode:false, maxDetectedFaces:5}).detect(img);
        const f = (faces || []).slice().sort((a,b)=>
          (b.boundingBox.width*b.boundingBox.height) - (a.boundingBox.width*a.boundingBox.height))[0];
        if(f && f.boundingBox){
          const bb = f.boundingBox;
          let x  = bb.x - bb.width  * 0.55;     // 좌우 여유 — 귀와 머리카락
          let y  = bb.y - bb.height * 0.75;     // 위 여유 — 정수리와 머리 모양
          let rw = bb.width  * 2.10;
          let rh = bb.height * 2.50;            // 아래 여유 — 턱과 목
          const target = 0.8;                   // 세로 4:5
          if(rw / rh < target){ const nw = rh * target; x -= (nw - rw) / 2; rw = nw; }
          else                { const nh = rw / target; y -= (nh - rh) / 2; rh = nh; }
          const nx = Math.max(0, x), ny = Math.max(0, y);
          const nw2 = Math.min(w - nx, rw), nh2 = Math.min(h - ny, rh);
          /* 잘라낸 것이 얼굴보다 확실히 넓을 때만 채택한다 — 턱이 잘리면 안 쓴다 */
          if(nw2 > bb.width * 1.25 && nh2 > bb.height * 1.45){
            sx = nx; sy = ny; cw = nw2; ch = nh2; method = 'face';
          }
        }
      }catch(_){}
    }
    if(method !== 'face'){
      /* FaceDetector 가 없는 Safari/iPad에서도 원본을 한 번 더 보내는 것으로 끝내지
         않는다. 인물은 촬영 가이드 중앙, 머리는 위쪽에 있다는 입력 규칙을 이용한다. */
      const portrait = h >= w;
      ch = portrait ? Math.min(h, h * 0.72) : Math.min(h * 0.96, w / 0.8);
      cw = Math.min(w, ch * 0.8);
      ch = Math.min(h, cw / 0.8);
      sx = Math.max(0, (w - cw) / 2);
      sy = Math.max(0, Math.min(h - ch, portrait ? h * 0.025 : (h - ch) / 2));
      method = 'guided';
    }

    const scale = Math.min(1536 / Math.max(cw, ch), 2.5);
    const outW = Math.max(1, Math.round(cw * scale)), outH = Math.max(1, Math.round(ch * scale));
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const g = c.getContext('2d', {alpha:false});
    g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, outW, outH);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    g.drawImage(img, sx, sy, cw, ch, 0, 0, outW, outH);
    return c.toDataURL('image/png');
  }catch(_){ return ''; }
}


async function askImage(prompt){
  const isGemini = /google\/gemini.*image/i.test(state.imageModel);
  const f = fmt();

  /* 정체성 참조가 항상 첫 번째다: 확대 얼굴 → 원본. 텍스트를 먼저 두는 것은
     chat 폴백 형식 때문이고, 두 API 모두 사진 순서는 photoReferenceParts 가 통일한다. */
  const refs = photoReferenceParts();
  const content = [{ type:'text', text: prompt }, ...refs];
  /* 전용 Image API 는 참조 사진을 messages 가 아니라 input_references 로 받는다.
     받는 개수는 모델마다 다르다 — Nano Banana 2 는 14장, GPT Image 2 는 16장까지. 우리는 2장만 쓴다. */
  const base = { model: state.imageModel, prompt };
  if(refs.length) base.input_references = refs;

  /* ① 전용 Image API — input_references 가 '편집할 사진'으로 전달되는 기본 경로다.
     모델마다 받는 파라미터가 달라서(예: GPT Image 는 resolution 을 안 받는다)
     많이 얹은 것부터 보내고 거절당하면 하나씩 덜어낸다. 실패한 생성은 요금이 붙지 않는다. */
  /* ★★ 경로 순서는 '참조 사진이 있느냐' 가 정한다. 이걸 반대로 둔 대가가 컸다.
     전용 Image API 는 모르는 필드를 받으면 조용히 무시하고도 200 과 함께 예쁜 그림을 돌려준다.
     그러면 input_references 가 버려졌어도 '성공' 이라 폴백이 영영 안 돌고,
     사진을 한 번도 보지 않고 글만 읽고 그린 낯선 사람이 포스터가 된다.
     교실에서 '갑자기 모르는 사람이 나왔다' 가 이 모양이었다.
     chat/completions 는 사진을 messages.content 안에 넣어 보내므로 무시될 여지가 없다.
     따라서 사진이 있으면 chat 먼저, 없으면 전용 API 먼저. */
  const chatFirst = refs.length > 0;

  const ladder = [
    { ...base, aspect_ratio:f.ar, resolution:'2K' },
    { ...base, aspect_ratio:f.ar, quality:'high' },
    { ...base, aspect_ratio:f.ar },
    base
  ];
  let imgErr, chatErr;

  const tryImageApi = async () => {
    for(const p of ladder){
      try{
        const d = await orFetch(p, 240000, OR_IMG_URL);
        const it = d?.data?.[0];
        if(it?.b64_json) return `data:${it.media_type || 'image/png'};base64,${it.b64_json}`;
        if(it?.url) return it.url;
        if(it?.image_url?.url) return it.image_url.url;
        imgErr = imgErr || new Error('그림이 응답에 들어 있지 않았습니다.');
      }catch(err){
        imgErr = imgErr || err;               // ★ 첫 오류를 남긴다. 뒤엣것이 덮어쓰면 원인이 사라진다
        if(err.status === 401 || err.status === 402) throw err;
      }
    }
    return '';
  };

  /* chat/completions 경로 — 사진이 messages.content 안에 그대로 들어간다.
     image_config 는 Gemini 전용이라 다른 모델에는 붙이지 않는다. */
  const tryChat = async () => {
    try{
      const d = await orFetch({
        model: state.imageModel,
        messages: [{ role:'user', content }],
        modalities: ['image','text'],
        ...(isGemini ? { image_config:{ aspect_ratio:f.ar, image_size:'2K' } } : {})
      }, 240000);
      const msg = d?.choices?.[0]?.message;
      let url = msg?.images?.[0]?.image_url?.url || msg?.images?.[0]?.url || '';
      if(!url && Array.isArray(msg?.content)){
        const img = msg.content.find(p => p?.type==='image_url' || p?.type==='output_image');
        url = img?.image_url?.url || img?.url || '';
      }
      if(url) return url;
      chatErr = new Error('그림이 응답에 들어 있지 않았습니다.');
    }catch(err){
      chatErr = err;
      if(err.status === 401 || err.status === 402) throw err;
    }
    return '';
  };

  /* ★ 사진이 있으면 chat 먼저 — 위 주석 참고. 사진이 없으면 전용 API 먼저. */
  for(const run of (chatFirst ? [tryChat, tryImageApi] : [tryImageApi, tryChat])){
    const url = await run();
    if(url) return url;
  }

  /* ★ 두 경로의 오류를 모두 보여 준다. 예전에는 뒤엣것이 앞엣것을 덮어써서
     정작 어디서 왜 죽었는지 화면에 안 나왔고, 원인을 찾는 데 한참 걸렸다. */
  throw new Error(
    `그림을 받지 못했습니다\n· 전용 이미지 API: ${imgErr?.message || '알 수 없음'}\n· 호환 경로: ${chatErr?.message || '알 수 없음'}`
  );
}

function setStatus(t, isErr){
  const e = $('#status');
  if(!e) return;
  e.className = 'status' + (isErr?' err':'');
  e.textContent = t;
}
function setStage(t){ const e = $('#stage'); if(e) e.textContent = t; }

async function generate(){
  state.raw = ''; state.poster = ''; state.prompt = '';
  go('generating');
  try{
    /* 얼굴 참조를 먼저 만들어 둔다. 실패해도 그냥 원본 한 장으로 진행한다. */
    state.photoFace = state.photo ? await faceRef(state.photo) : '';
    let glassesScan = null;
    if(state.photo){
      setStage('사진에서 얼굴과 안경 여부를 자동으로 확인하는 중…');
      try{ glassesScan = await classifyGlasses(false, ''); }catch(_){ glassesScan = null; }
    }
    setStage(state.photo ? '사진을 보고 히어로를 설계하는 중…' : '히어로를 처음부터 설계하는 중…');
    const d = await askDirector();
    state.heroName = d.heroName;
    state.tagline  = d.tagline;
    state.roleEn      = d.roleEn;
    state.traitsEn    = d.traitsEn;
    state.motifsEn = d.motifsEn;
    state.motifCues = d.motifCues;
    state.intro = d.intro;
    state.gearText = polishedGear(d.gear);
    state.palette     = d.palette;
    state.signature   = d.signature;
    state.shotEn      = d.shotEn;
    /* 전용 판정과 연출 모델의 교차 판정을 자동 대조한다. 사진이 있으면 이 줄 뒤의 값은
       반드시 yes/no 중 하나이며, 애매한 조건문 상태로 그림 프롬프트를 만들지 않는다. */
    if(state.photo) setStage('안경 여부를 자동으로 교차 검증하는 중…');
    state.glasses = state.photo ? await resolveGlasses(glassesScan, d.glasses) : '';

    /* 규칙집은 항상 먼저 만든다. 압축을 켜 두었으면 텍스트 모델이 이걸 읽고
       짧은 촬영 지시서로 바꿔 준다. 실패하면 조용히 규칙집 그대로 그린다. */
    const full = buildPrompt(d.artDirection);
    state.prompt = full;
    state.promptMode = 'full';
    if(state.leanPrompt){
      setStage(`"${d.heroName}" · 촬영 지시서를 정리하는 중…`);
      try{
        const lean = buildLeanPrompt(await askCinematographer(full));
        state.prompt = lean;
        state.promptMode = 'lean';
        /* 얼굴·안경·모티브·등급 문장을 다시 AI로 고쳐 쓰면 정확한 잠금이 약해진다.
           촬영감독이 만든 지시서에 코드의 필수 블록을 원문 그대로 붙인 이 버전을 최종본으로 쓴다. */
      }catch(e){
        state.prompt = full;
        state.promptMode = 'full';
      }
    }

    setStage(`"${d.heroName}" · 장면을 촬영하는 중…`);
    state.raw = await askImage(state.prompt);

    setStage('포스터로 다듬는 중…');
    state.genAr  = fmt().ar;
    state.poster = await composePoster(state.raw);
    /* 이 포스터에만 붙는 고유번호. 메일을 다시 눌러도 같은 번호를 쓰기 때문에
       서버가 알아보고 같은 사람에게 두 번 보내지 않는다. */
    state.posterJob = newJobId();

    go('result');
  }catch(err){
    state.page = 'result';
    render();
    setStatus('만들지 못했습니다 — ' + err.message, true);
  }
}

/* ══════════════════════════════════════════════════════════════
   12. 포스터 합성 — 히어로 이름 + QR + P.H.A.S.E 문구
   ══════════════════════════════════════════════════════════════ */

function loadImg(src){
  return new Promise((res, rej)=>{
    const i = new Image();
    i.crossOrigin = 'anonymous';
    i.onload = ()=>res(i);
    i.onerror = ()=>rej(new Error('이미지를 불러오지 못했습니다.'));
    i.src = src;
  });
}

function fitText(g, text, maxWidth, weight, startPx, family){
  let px = startPx;
  g.font = `${weight} ${px}px ${family}`;
  while(g.measureText(text).width > maxWidth && px > 12){
    px -= 2;
    g.font = `${weight} ${px}px ${family}`;
  }
  return px;
}

async function composePoster(src){
  const f = fmt();
  const W = f.w, H = f.h;
  const [hero, qr] = await Promise.all([loadImg(src), loadImg(QR_SRC)]);

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');

  g.fillStyle = '#05111a'; g.fillRect(0,0,W,H);

  /* 캔버스를 꽉 채우되, 세로로 잘릴 때는 위쪽을 더 많이 잘라낸다.
     인물 머리 위 여백부터 없어지므로 신발이 잘리지 않는다. */
  const iw = hero.naturalWidth, ih = hero.naturalHeight;
  const scale = Math.max(W/iw, H/ih);
  const dw = iw*scale, dh = ih*scale;
  g.drawImage(hero, (W-dw)/2, (H-dh)*0.82, dw, dh);

  const cx = W/2;
  const KO = '"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';

  /* 글자 블록은 아래에서 위로 쌓는다 —
     인화 규격이 정사각이든 세로로 길든 항상 같은 간격이 유지된다 */
  const M   = Math.round(W*0.048);
  const gap = n => Math.round(W*n);

  const phrase   = 'P.H.A.S.E 가상 물리 실험실';
  const phrasePx = Math.round(W*0.026);
  const phraseY  = H - M;

  const qs  = qrSize(f);                      // 실물 최소 15mm 를 보장한다
  const pad = Math.round(qs*0.11);
  const qy  = Math.round(phraseY - phrasePx - gap(0.024) - qs);
  const qx  = Math.round(cx - qs/2);

  const sub = cleanName(state.name);
  const subPx  = fitText(g, sub, W*0.86, 700, Math.round(W*0.026), KO);
  const subY   = qy - pad - gap(0.032);

  const tag   = state.tagline || '실험으로 태어난 히어로';
  const tagPx = fitText(g, tag, W*0.78, 700, Math.round(W*0.030), KO);
  const tagY  = subY - subPx - gap(0.022);

  const lineY = Math.round(tagY - tagPx - gap(0.026));

  const heroName = state.heroName || '과학 히어로';
  const namePx = fitText(g, heroName, W*0.84, 900, Math.round(W*0.088), KO);
  const nameY  = lineY - gap(0.030);

  // 하단 그라데이션 — 이름 블록 위쪽부터 자연스럽게 어두워지게
  const gTop = Math.max(0, Math.min(H*0.46, nameY - namePx*1.9));
  const grad = g.createLinearGradient(0, gTop, 0, H);
  grad.addColorStop(0,    'rgba(3,12,20,0)');
  grad.addColorStop(0.42, 'rgba(3,12,20,0.70)');
  grad.addColorStop(1,    'rgba(3,12,20,0.97)');
  g.fillStyle = grad; g.fillRect(0, gTop, W, H-gTop);

  // 히어로 이름
  g.font = `900 ${namePx}px ${KO}`;
  g.shadowColor = 'rgba(0,0,0,.78)'; g.shadowBlur = gap(0.022); g.shadowOffsetY = gap(0.004);
  g.fillStyle = '#f4fbff';
  g.fillText(heroName, cx, nameY);
  g.shadowBlur = 0; g.shadowOffsetY = 0;

  // 구분선
  const lw = W*0.30;
  const lg = g.createLinearGradient(cx-lw/2, 0, cx+lw/2, 0);
  lg.addColorStop(0,  'rgba(79,210,240,0)');
  lg.addColorStop(0.5,'rgba(79,210,240,.85)');
  lg.addColorStop(1,  'rgba(79,210,240,0)');
  g.fillStyle = lg; g.fillRect(cx-lw/2, lineY, lw, Math.max(2, Math.round(W*0.002)));

  // 태그라인
  g.font = `700 ${tagPx}px ${KO}`;
  g.fillStyle = 'rgba(192,218,234,.94)';
  g.fillText(tag, cx, tagY);

  // 학생 이름 + 사용한 실험
  g.font = `700 ${subPx}px ${KO}`;
  g.fillStyle = 'rgba(142,172,192,.9)';
  g.fillText(sub, cx, subY);

  // QR (흰 판 위에 올려 인식률 확보)
  g.fillStyle = '#ffffff';
  roundRect(g, qx-pad, qy-pad, qs+pad*2, qs+pad*2, Math.round(qs*0.09));
  g.fill();
  g.imageSmoothingEnabled = false;
  g.drawImage(qr, qx, qy, qs, qs);
  g.imageSmoothingEnabled = true;

  // QR 바로 아래 문구
  g.font = `800 ${phrasePx}px ${KO}`;
  g.fillStyle = 'rgba(214,234,246,.95)';
  g.fillText(phrase, cx, phraseY);

  return cv.toDataURL('image/png');
}

function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y,   x+w, y+h, r);
  g.arcTo(x+w, y+h, x,   y+h, r);
  g.arcTo(x,   y+h, x,   y,   r);
  g.arcTo(x,   y,   x+w, y,   r);
  g.closePath();
}

  /* ── 공개 순간의 색종이 — 정답이 많을수록 화려하다 ──
     2개: 짧게 / 3개: 제대로 / 4개: 금색 대폭발. 0~1개는 조용히(아쉬움도 연출의 일부). */
  (function confetti(){
    /* 전설 등급은 별도 단계(5)로 친다 — 4개 정답보다 확실히 한 눈금 위여야 한다 */
    const k = isLegend() ? 5 : loadoutScore().ok;
    if(k < 2 || state.confettiDone) return;
    state.confettiDone = true;                     // 인화 규격 바꿀 때마다 다시 터지지 않게
    const cv = document.createElement('canvas');
    cv.id='confetti'; document.body.appendChild(cv);
    const g = cv.getContext('2d');
    const W2 = cv.width = innerWidth, H2 = cv.height = innerHeight;
    const COLS = k>=5 ? ['#ffd764','#fff0b8','#ffffff','#ffb347','#ffd764','#fff']
               : k===4 ? ['#f2c661','#ffe9a8','#ffffff','#4fd2f0','#f2c661']
               : k===3 ? ['#4fd2f0','#a8e05f','#ffffff','#f0798e']
                       : ['#4fd2f0','#93aabb','#ffffff'];
    const N = k>=5 ? 420 : k===4 ? 220 : k===3 ? 130 : 60;
    const DUR = k>=5 ? 6000 : k===4 ? 4200 : k===3 ? 3200 : 2200;
    const ps=[];
    for(let i=0;i<N;i++){
      const burst = k>=4 && i<(k>=5?180:70);       // 금색은 가운데서 폭발도 한다
      ps.push({
        x: burst ? W2/2 : Math.random()*W2,
        y: burst ? H2*0.42 : -20-Math.random()*H2*0.5,
        vx: burst ? (Math.random()-0.5)*13 : (Math.random()-0.5)*1.6,
        vy: burst ? -(3+Math.random()*9) : 2+Math.random()*3.2,
        w: 5+Math.random()*6, h: 8+Math.random()*7,
        rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.28,
        col: COLS[i%COLS.length], sway: Math.random()*Math.PI*2
      });
    }
    const t0 = performance.now();
    (function tick(){
      const el = performance.now()-t0;
      g.clearRect(0,0,W2,H2);
      const fade = el>DUR-600 ? Math.max(0,(DUR-el)/600) : 1;
      ps.forEach(pp=>{
        pp.vy += 0.10; pp.vy = Math.min(pp.vy, 4.4);
        pp.x += pp.vx + Math.sin(pp.sway + el/300)*0.9;
        pp.y += pp.vy; pp.rot += pp.vr;
        g.save(); g.translate(pp.x,pp.y); g.rotate(pp.rot);
        g.globalAlpha = fade;
        g.fillStyle = pp.col;
        g.fillRect(-pp.w/2, -pp.h/2, pp.w, pp.h*Math.abs(Math.sin(pp.rot)));
        g.restore();
      });
      if(el < DUR) requestAnimationFrame(tick);
      else cv.remove();
    })();
  })();
  showCropWarning();
  applyPageSize();

  $('#download').onclick = downloadPoster;

/* 처음 그린 비율과 고른 용지의 실제 비율이 다르면 잘려나가는 양을 알려준다.
   비교 기준은 이미지 모델에 넘긴 비율(ar)이 아니라 '종이의 실제 가로세로비'다.
   셀피 포스트카드는 100:148 이라 흔히 말하는 4×6(2:3)과 1.3% 다르다. */
const AR_VALUE = {'1:1':1, '2:3':2/3, '3:4':.75, '4:5':.8, '9:16':.5625, '3:2':1.5, '4:3':4/3};
function showCropWarning(){
  const box = $('#cropWarn');
  if(!box) return;
  const f = fmt();
  const gen = AR_VALUE[state.genAr], want = f.w / f.h;
  if(!gen || !want){ box.innerHTML=''; return; }
  const loss = 1 - Math.min(gen, want) / Math.max(gen, want);
  if(loss < 0.08){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="safety" style="margin-top:10px">
    처음 그린 비율과 달라서 가장자리가 약 ${Math.round(loss*100)}% 잘립니다.
    아래 <b>같은 설정으로 다시 뽑기</b>를 누르면 이 규격에 딱 맞게 새로 그립니다.</div>`;
}

/* 셀피 CP1500 으로 곧바로 인쇄되도록 용지 크기를 브라우저에 알려 준다.
   @page 로 실물 mm 를 지정하고 여백을 0 으로 두어야 테두리 없이 꽉 찬다.
   인쇄 대화상자에서는 배율을 '실제 크기(100%)'로 두어야 한다. */
function applyPageSize(){
  const f = fmt();
  let el = document.getElementById('pageStyle');
  if(!el){ el = document.createElement('style'); el.id = 'pageStyle'; document.head.appendChild(el); }
  el.textContent =
    `@page{size:${f.mm}mm ${f.mmH}mm;margin:0}
     @media print{
       html,body{width:${f.mm}mm;height:${f.mmH}mm}
       .result-photo img{width:${f.mm}mm!important;height:${f.mmH}mm!important;
         max-width:none!important;max-height:none!important;object-fit:cover;display:block;margin:0!important}
     }`;
}

/* 완성된 포스터를 메일로 보낸다.
   화질을 지키기 위해 포스터를 다시 그리거나 줄이지 않고, 화면에 띄운 것과
   같은 PNG(무손실) 원본을 그대로 첨부해서 보낸다. */
function posterFileName(){
  return `${(state.heroName||'science-hero')}_${cleanName(state.name)}`
    .replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().replace(/^\.+|\.+$/g,'') + '.png';
}
/* 보내고 나면 오늘 몇 통 남았는지 알려 준다.
   구글이 하루 한도를 걸어 두기 때문에(개인 지메일 100통 · 학교 계정 1500통)
   수업 중에 몇 명까지 더 되는지 바로 보이는 편이 관리하기 좋다.
   남은 수가 적어질수록 색과 문구가 세진다. */
function quotaLine(left){
  if(left == null) return '';
  const n = Number(left);
  if(!Number.isFinite(n)) return '';
  if(n <= 0)
    return `<br><span class="q crit">오늘 보낼 수 있는 메일을 모두 썼습니다. 남은 학생은 <b>⬇ 이미지 저장</b>으로 받아 가세요. 한도는 내일 다시 채워집니다.</span>`;
  if(n <= 5)
    return `<br><span class="q crit">오늘 <b>${n}명</b>에게만 더 보낼 수 있습니다. 곧 한도가 끝납니다.</span>`;
  if(n <= 20)
    return `<br><span class="q warn">오늘 남은 발송 <b>${n}명</b>분</span>`;
  return `<br><span class="q">오늘 남은 발송 <b>${n}명</b>분</span>`;
}

function bindMailSend(){
  const btn = $('#mailSend'), input = $('#mailTo'), box = $('#mailMsg');
  if(!btn || !input || !box) return;
  const show = (cls, txt) => { box.className = 'mail-msg on ' + cls; box.innerHTML = txt; };
  const send = async () => {
    const to = String(input.value||'').trim();
    if(!emailOk(to)){ show('err','메일 주소를 다시 확인해 주세요. 예) hong@example.com'); input.focus(); return; }
    if(!state.poster){ show('err','아직 포스터가 완성되지 않았습니다.'); return; }
    const b64 = String(state.poster).split(',')[1] || '';
    const mb = (b64.length * 0.75) / 1048576;
    if(mb > 24){ show('err', `사진이 너무 큽니다 (약 ${mb.toFixed(1)}MB). 메일로는 25MB까지만 보낼 수 있어요. 아래 <b>이미지 저장</b>을 쓰세요.`); return; }
    btn.disabled = true; input.disabled = true;
    show('wait', `보내는 중… 사진이 약 ${mb.toFixed(1)}MB라 조금 걸립니다. 이 화면을 닫지 마세요.`);
    /* ★ 고유번호는 '이 포스터 + 이 주소' 로 만든다. 매번 새로 만들면,
       통신이 끊겨 실패한 뒤 학생이 「보내기」를 다시 눌렀을 때 서버가 다른 요청으로 보고
       같은 메일을 한 번 더 보낸다. 같은 번호를 쓰면 서버가 알아보고 걸러 낸다.
       주소를 고쳐 다시 보내면 번호가 달라지므로 그때는 정상적으로 나간다. */
    const jobId = `${state.posterJob || 'p'}|${to.toLowerCase()}`;
    try{
      const r = await mailPostRetry({
        action:'send',
        jobId,
        to,
        heroName:  state.heroName || '',
        tagline:   state.tagline  || '',
        student:   cleanName(state.name) || '',
        filename:  posterFileName(),
        mime:      'image/png',
        data:      b64
      }, (n, sec) => show('wait', `연결이 잠깐 막혔습니다. ${sec}초 뒤 다시 보냅니다… (${n}/3)`));
      if(r && r.ok){
        show('ok', `<b>${esc(to)}</b> 로 보냈습니다. 메일함에 없으면 스팸함도 확인해 주세요.`
          + quotaLine(r.quotaLeft));
        input.value = '';
      } else {
        show('err', '보내지 못했습니다 — ' + esc((r && r.error) || '알 수 없는 오류'));
      }
    }catch(err){
      show('err', esc(mailErrorText(err)) + '<br>다시 눌러 보세요. 같은 메일이 두 번 가지는 않습니다.');
    }
    btn.disabled = false; input.disabled = false;
  };
  btn.onclick = send;
  input.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); send(); } };
}

function downloadPoster(){
  if(!state.poster) return;
  const a = document.createElement('a');
  a.href = state.poster;
  a.download = `${(state.heroName||'science-hero')}_${cleanName(state.name)}`
    .replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().replace(/^\.+|\.+$/g,'') + '.png';
  document.body.append(a); a.click(); a.remove();
}

/* ══════════════════════════════════════════════════════════════
   14. 실험 시뮬레이션 — 화면에서 직접 조작해 보는 부분
   각 실험 id마다 controls / draw / read / tip 을 정의한다.
   ══════════════════════════════════════════════════════════════ */

const P = {ink:'#e4eef7', mut:'#93aabb', dim:'#6d8698', cyan:'#4fd2f0', lime:'#a8e05f',
           gold:'#f2c661', pink:'#f0798e', cop:'#c9773f', panel:'#0a1e2b', line:'#26536b'};

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp  = (a,b,t) => a + (b-a)*t;

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function label(g,t,x,y,col,size,align){
  g.fillStyle = col||P.mut; g.font = `700 ${size||13}px Pretendard,"Malgun Gothic",sans-serif`;
  g.textAlign = align||'center'; g.textBaseline='middle';
  /* 캔버스 밖으로 삐져나가면 글자가 잘려 읽을 수 없게 된다.
     실제 폭을 재서 좌우 여백 안쪽으로 밀어 넣는다. 모든 시뮬레이션에 함께 적용된다. */
  const t2 = String(t), W = g.canvas.width, pad = 5;
  const w = g.measureText(t2).width, al = g.textAlign;
  let left = al==='right' ? x - w : al==='left' ? x : x - w/2;
  if(left + w > W - pad) left = W - pad - w;
  if(left < pad) left = pad;
  x = al==='right' ? left + w : al==='left' ? left : left + w/2;
  g.fillText(t2,x,y);
}
function arrow(g,x1,y1,x2,y2,col,w){
  g.strokeStyle=col; g.lineWidth=w||2; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  const a=Math.atan2(y2-y1,x2-x1), s=(w||2)*3.4;
  g.fillStyle=col; g.beginPath(); g.moveTo(x2,y2);
  g.lineTo(x2-s*Math.cos(a-.4), y2-s*Math.sin(a-.4));
  g.lineTo(x2-s*Math.cos(a+.4), y2-s*Math.sin(a+.4));
  g.closePath(); g.fill();
}
function beaker(g,x,y,w,h,fill,level){
  g.strokeStyle='#5f93a8'; g.lineWidth=3;
  if(level>0){ g.fillStyle=fill; g.fillRect(x+3, y+h-h*level+2, w-6, h*level-4); }
  g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+h); g.lineTo(x+w,y+h); g.lineTo(x+w,y); g.stroke();
}

/* ---------- 1. 우블렉 : 힘의 빠르기에 따라 액체↔고체 ---------- */
const simOobleck = {
  controls:[
    {t:'range',  id:'speed', label:'누르는 빠르기', min:1, max:10, value:2, marks:['아주 천천히','아주 빠르게']},
    {t:'button', id:'press', label:'👊 눌러보기'},
    {t:'button', id:'reset', label:'↺ 손 빼기'}
  ],
  init:()=>({ph:'idle', y:0, depth:0, imp:0, bounce:0, peak:0, pxcm:13.6}),
  MAXCM: 5,                                        // 그릇 깊이 눈금 : maxD(px) = 5cm
  onButton(id,v,st){
    if(id==='reset'){ st.ph='idle'; st.y=0; st.depth=0; st.imp=0; st.bounce=0; st.peak=0; return; }
    if(id==='press' && st.ph==='idle'){ st.ph='down'; st.y=0; st.depth=0; st.imp=0; st.bounce=0; st.peak=0; }
  },
  geom(W,H){
    const bx=W*0.28, bw=W*0.40, by=H*0.42, bh=H*0.40;
    const surf=by+bh*0.20;
    return {bx,bw,by,bh,surf, cx:bx+bw/2, hover:surf-70, maxD:bh*0.50};
  },
  /* 전단 농화는 켜고 끄는 스위치가 아니라 연속적인 성질이다.
     누르는 속도가 빨라질수록 겉보기 점도가 급격히 커져 들어가는 깊이가 매끄럽게 줄어든다.
     아주 빠를 때(들어갈 깊이가 거의 0)에만 표면에서 튕기는 것으로 본다. */
  penetration(speed){ return 1/(1 + Math.pow(speed/3.2, 3)); },
  step(v,st,q){
    const pen  = this.penetration(v.speed);
    const maxD = q.maxD * pen;
    st.pxcm = q.maxD / this.MAXCM;                 // 되튄 높이도 같은 자로 재야 한다
    const fast = pen < 0.12;                       // 사실상 안 들어감 → 튕김
    if(st.ph==='down'){
      st.y += 1.3 + v.speed*1.9;
      if(q.hover + st.y >= q.surf){ st.y = q.surf - q.hover; st.ph = fast? 'hard' : 'sink'; st.imp = 0; }
    } else if(st.ph==='sink'){
      st.depth += 0.7 + v.speed*0.28;
      if(st.depth >= maxD){ st.depth = maxD; st.ph='sunk'; }
    }
    if(st.ph==='hard'){
      st.imp++;
      /* 안 들어가는 대신 되튄다. 세게 칠수록 더 높이 튄다 — 여기서도 빠르기가 그대로 드러난다. */
      const amp = 8 + v.speed*5;
      st.bounce = amp * Math.exp(-st.imp/18) * Math.abs(Math.sin(st.imp/5.5));
      st.peak = Math.max(st.peak, st.bounce);
    }
    return fast;
  },
  fingerY(st,q){ return q.hover + st.y + st.depth - (st.bounce||0); },
  draw(g,W,H,v,st,t){
    const q = this.geom(W,H), fast = this.step(v,st,q);
    const fy = this.fingerY(st,q), cx = q.cx;
    const squash = st.ph==='hard' ? Math.max(0, 1 - st.imp/20) : 0;

    // 그릇
    g.fillStyle='#123244'; rr(g,q.bx,q.by,q.bw,q.bh,14); g.fill();
    g.strokeStyle=P.line; g.lineWidth=3; g.stroke();

    // 반죽 (같은 그림을 두 번 쓴다 — 두 번째는 잠긴 손 위를 덮는 용도)
    const fluid = a => {
      g.save(); rr(g,q.bx+4,q.by+4,q.bw-8,q.bh-8,11); g.clip();
      g.globalAlpha=a;
      g.fillStyle='#c6d4dc'; g.fillRect(q.bx, q.surf, q.bw, q.bh);
      for(let i=0;i<80;i++){
        const px=q.bx+((i*97)%q.bw), py=q.surf+16+((i*53)%(q.bh*0.64));
        g.fillStyle='rgba(112,146,170,.55)'; g.beginPath(); g.arc(px,py,2.2,0,7); g.fill();
      }
      g.globalAlpha=1; g.restore();
    };
    fluid(1);

    // 손 — 절대 잘라내지 않는다. 어떤 상태에서도 화면에 보인다.
    const fw = 54*(1+squash*0.18), fh = 38*(1-squash*0.32);
    g.fillStyle='#e8bd99'; rr(g, cx-16, fy-fh-58, 32, 62, 11); g.fill();
    g.fillStyle='#f7d6b6'; rr(g, cx-fw/2, fy-fh, fw, fh, 13); g.fill();
    g.strokeStyle='rgba(178,128,92,.5)'; g.lineWidth=1.6;
    for(let i=1;i<4;i++){
      const kx = cx-fw/2 + i*fw/4;
      g.beginPath(); g.moveTo(kx, fy-fh+8); g.lineTo(kx, fy-6); g.stroke();
    }

    // 잠긴 부분만 반죽으로 덮는다
    if(st.depth > 0) fluid(0.74);

    if(fast && (st.ph==='hard')){
      // 눌린 자리가 하얗게 단단해진다
      g.save(); rr(g,q.bx+4,q.by+4,q.bw-8,q.bh-8,11); g.clip();
      const hr = 32 + Math.min(st.imp,18)*1.4;
      g.fillStyle='rgba(233,243,249,.92)';
      g.beginPath(); g.ellipse(cx, q.surf+5, hr, 12, 0,0,7); g.fill();
      g.restore();
      // 충격파
      for(let i=0;i<3;i++){
        const R = 30 + st.imp*2.6 + i*22, a = Math.max(0, .5 - st.imp*.011 - i*.11);
        if(a<=0) continue;
        g.strokeStyle=`rgba(168,224,95,${a})`; g.lineWidth=3;
        g.beginPath(); g.ellipse(cx, q.surf+2, R, R*0.26, 0, Math.PI, 0); g.stroke();
      }
      // 튀어 오른 알갱이
      for(let i=0;i<7;i++){
        const p = Math.min(1, st.imp/26), sx=cx+(i-3)*15;
        if(p>=1) break;
        g.fillStyle=`rgba(198,212,220,${1-p})`;
        g.beginPath(); g.arc(sx, q.surf - Math.sin(p*Math.PI)*34 - 4, 3.4, 0, 7); g.fill();
      }
      label(g,'딱!', cx, q.surf-96, P.lime, 26);
      label(g,'손이 안 들어감', W*0.845, H*0.30, P.lime, 17);
      label(g,'표면이 고체처럼 버팁니다', W*0.845, H*0.30+26, P.mut, 13);
    }

    if(st.ph==='sink' || st.ph==='sunk'){
      g.strokeStyle='rgba(88,128,150,.55)'; g.lineWidth=2;
      for(let i=0;i<3;i++){
        g.beginPath(); g.ellipse(cx, q.surf+3, 28+i*17, 6+i*2, 0,0,7); g.stroke();
      }
      if(st.ph==='sunk'){
        label(g,'쑥 —', cx, q.surf-52, P.cyan, 22);
        label(g,'손이 쑥 들어감', W*0.845, H*0.30, P.cyan, 17);
        label(g,'액체처럼 흐릅니다', W*0.845, H*0.30+26, P.mut, 13);
      }
    }

    // 들어간 깊이 (실제로 들어간 만큼)
    const cm  = (st.depth/q.maxD)*this.MAXCM;
    const pen = this.penetration(v.speed);
    label(g,'들어간 깊이', W*0.115, H*0.30, P.dim, 13);
    label(g, cm.toFixed(1)+' cm', W*0.115, H*0.30+28,
          st.ph==='hard'? P.lime : cm>0? P.cyan : P.dim, 22);
    label(g,'이 빠르기에서 최대', W*0.115, H*0.30+56, P.dim, 11);
    label(g, (pen*this.MAXCM).toFixed(1)+' cm', W*0.115, H*0.30+74, P.mut, 14);
    // 겉보기 되기(속도가 오를수록 급격히 뻑뻑해진다)
    const bw=92, bx=W*0.115-bw/2, by=H*0.30+92;
    g.fillStyle='#12303f'; rr(g,bx,by,bw,9,4); g.fill();
    g.fillStyle= pen<0.12? P.lime : P.cyan;
    rr(g,bx,by,bw*clamp(1-pen,0,1),9,4); g.fill();
    label(g,'겉보기 되기', W*0.115, by+24, P.dim, 11);

    label(g, fast? '빠르게 = 물이 비켜날 틈이 없어 알갱이끼리 맞물린다'
                 : '천천히 = 알갱이 사이의 물이 윤활유가 되어 미끄러진다',
          W/2, H-14, fast?P.lime:P.cyan, 13);
  },
  read(v,st){
    const pen=this.penetration(v.speed), M=this.MAXCM;
    if(st.ph==='hard') return `거의 안 들어감(최대 ${(pen*M).toFixed(1)}cm) · ${(st.peak/(st.pxcm||13.6)).toFixed(1)}cm 되튐`;
    if(st.ph==='sunk') return (pen*M).toFixed(1)+'cm 에서 멈춤';
    if(st.ph==='sink') return '가라앉는 중';
    if(st.ph==='down') return '내려가는 중';
    return `빠르기 ${v.speed} · 최대 ${(pen*M).toFixed(1)}cm 예상`;
  },
  tip(v,st){
    if(st.ph==='hard') return '빠르게 힘을 주면 알갱이끼리 맞물려 버팁니다. 손 빼기를 누르고 빠르기를 한 칸씩 낮춰 보세요.';
    if(st.ph==='sunk') return '이 빠르기에서는 여기까지만 들어갑니다. 빠르기를 바꾸면 깊이도 조금씩 달라집니다.';
    if(st.ph!=='idle') return '지켜보세요.';
    return '빠르기를 1부터 10까지 한 칸씩 바꿔 가며 눌러 보세요. 어느 한 지점에서 갑자기 바뀌는 게 아니라, 빠를수록 조금씩 덜 들어갑니다.';
  }
};

/* ---------- 2. 카세인 : 단계별로 단백질이 뭉친다 ---------- */
const simCasein = {

      g.strokeStyle='rgba(242,198,97,.5)'; g.lineWidth=2; g.beginPath();
      g.moveTo(bx+bw*(0.3+i*0.2), yy); g.quadraticCurveTo(bx+bw*(0.36+i*0.2), yy-12, bx+bw*(0.3+i*0.2), yy-24); g.stroke(); } }
    // 덩어리 생성
    if(st.blobs.length===0) for(let i=0;i<34;i++)

    if(s>=2){
      st.blobs.forEach(b=>{
        const cx = bx+8+b.x*(bw-16);
        const cy = by+bh*0.32 + b.y*(bh*0.6) + (s>=4? -bh*0.05 : Math.sin(t*2+b.p*6)*4);
        g.fillStyle = '#f6f2e4'; g.beginPath(); g.arc(cx,cy,b.r*(s>=3?1:0.55),0,7); g.fill();
        g.strokeStyle='rgba(200,190,160,.9)'; g.lineWidth=1; g.stroke();
      });
    } else if(s>=1){
      st.blobs.slice(0,14).forEach(b=>{ const cx=bx+8+b.x*(bw-16), cy=by+bh*0.4+b.y*bh*0.4;
        g.fillStyle='rgba(246,242,228,.5)'; g.beginPath(); g.arc(cx,cy,2,0,7); g.fill(); });
    }
    // 식초 방울
    if(s===2){ const dy = by-30 + ((t*90)%60);
      g.fillStyle=P.gold; g.beginPath(); g.ellipse(bx+bw/2, dy, 5,7,0,0,7); g.fill();
      label(g,'식초', bx+bw/2, by-46, P.gold, 12); }
    // 체
    if(s>=4){
      const sx=W*0.56, sy=H*0.30;
      g.strokeStyle='#7fa8bb'; g.lineWidth=3;
      g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+120,sy); g.lineTo(sx+96,sy+52); g.lineTo(sx+24,sy+52); g.closePath(); g.stroke();
      for(let i=1;i<7;i++){ g.strokeStyle='rgba(127,168,187,.5)'; g.lineWidth=1;
        g.beginPath(); g.moveTo(sx+i*17, sy); g.lineTo(sx+24+i*10, sy+52); g.stroke(); }
      for(let i=0;i<11;i++){ g.fillStyle='#f6f2e4';
        g.beginPath(); g.arc(sx+30+((i*29)%80), sy+16+((i*13)%26), 5,0,7); g.fill(); }
      label(g,'걸러낸 덩어리', sx+60, sy-16, P.ink, 12);
    }
    // 굳은 조각
    if(s>=5){
      const px=W*0.80, py=H*0.42;
      g.fillStyle='#efe7d4'; rr(g,px-34,py-22,68,44,8); g.fill();
      g.strokeStyle='#c9bfa6'; g.lineWidth=2; g.stroke();
      g.fillStyle='#d9cfb6'; g.beginPath(); g.arc(px,py,9,0,7); g.fill();
      label(g,'이틀 말린 카세인', px, py+40, P.lime, 12);
    }
  },
  read:(v)=>['시작 전','우유가 따뜻해짐','식초 투입 · 덩어리 생기기 시작','몽글몽글하게 뭉침','물과 덩어리 분리','이틀 말려 단단해짐'][clamp(v.step|0,0,5)],
  tip:(v)=>['1번부터 차례로 눌러 보세요.','끓이지는 않습니다. 따뜻하기만 하면 됩니다.','산이 들어가면 단백질 표면의 전기적 균형이 깨집니다.','단백질끼리 달라붙어 눈에 보이는 크기가 됐습니다.','덩어리만 남기고 물은 버립니다.','말리면 굳습니다. 옛날 단추가 이렇게 만들어졌습니다.'][clamp(v.step|0,0,5)]
};
