/* 사진 한 장에 딸린 파생 상태는 항상 한 묶음으로 바꾼다.
   이전 학생의 좌우반전 캐시가 다음 학생 사진에 섞이면 얼굴도 안경 판정도 전부 틀어진다. */
function clearPhotoState(){
  state.photoEpoch++;
  state.photo = ''; state.photoFace = ''; state.glasses = '';
  state.photoBase = ''; state.photoMirror = ''; state.photoFlip = false;
}
function beginPhotoJob(){
  state.photoFace = ''; state.glasses = '';
  return ++state.photoEpoch;
}
function photoJobActive(job){ return state.photoEpoch === job; }
function installPhoto(src, expectedJob){
  if(expectedJob != null && !photoJobActive(expectedJob)) return false;
  state.photoEpoch++;
  state.photo = src || ''; state.photoFace = ''; state.glasses = '';
  state.photoBase = state.photo; state.photoMirror = ''; state.photoFlip = false;
  return true;
}

const PROGRESS = {intro:0, camera:12, identity:26, lab:40, shot:82, generating:92, result:100};
function render(){
  stopSim();
  stopQuizTimer();
  let p = PROGRESS[state.page] || 0;
  if(state.page==='lab') p = 40 + (state.station/labs().length)*40;
  progressBar.style.width = p + '%';
  ({intro:viewIntro, camera:viewCamera, identity:viewIdentity, lab:viewLab,
    shot:viewShot, generating:viewGenerating, result:viewResult}[state.page])();
}
function go(page){
  /* 카메라 화면을 떠난 순간 진행 중이던 파일 읽기·촬영·뒤집기는 무효다. */
  if(state.page === 'camera' && page !== 'camera') state.photoEpoch++;
  state.page = page; window.scrollTo(0,0); render();
}

function modelOptions(list, current){
  const known = list.some(m=>m.id===current);
  return list.map(m=>{
    const sel = (m.id===current || (m.id==='__custom__' && !known)) ? ' selected' : '';
    return `<option value="${esc(m.id)}"${sel}>${esc(m.name)}${m.note?' · 장당 '+esc(m.note):''}</option>`;
  }).join('');
}

/* 아이패드·아이폰에서 파일을 더블클릭해 열면 주소가 file:// 이 된다.
   iOS 는 이 경우 화면 안에서 카메라를 여는 것(getUserMedia)을 막는다.
   크롬이든 사파리든 iOS 브라우저는 전부 같은 엔진을 쓰므로 브라우저를 바꿔도 소용없다.
   대신 <input type="file" capture="user"> 는 기기 카메라 앱을 직접 열어 주므로,
   막힌 것이 확인되면 처음부터 그 길로 안내한다. 억지로 시도해서 겁나는 오류를 띄우지 않는다. */
function liveCamBlocked(){
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
           || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);  // 아이패드는 맥으로 위장한다
  const noApi = !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia;
  const insecure = (typeof isSecureContext !== 'undefined') && !isSecureContext;
  return noApi || insecure || (iOS && location.protocol === 'file:');
}

/* 카메라를 한 번만 연다.
   getUserMedia 를 부를 때마다 브라우저가 허용 창을 띄울 수 있으므로,
   이미 살아 있는 스트림이 있으면 그것을 그대로 다시 붙이기만 한다. */
async function startCamera(force){
  const st = $('#camStatus');
  const say = (t, err) => { if(st){ st.className = err? 'status err' : 'status'; st.textContent = t; } };
  try{
    if(force) stopCamera();
    const live = stream && stream.getVideoTracks().some(t=>t.readyState==='live');
    if(!live){
      stopCamera();
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
        throw Object.assign(new Error('no api'), {name:'NotSupportedError'});
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'user', width:{ideal:1440}, height:{ideal:1920} }, audio:false });
    }
    const v = $('#video');
    if(!v) return;
    if(v.srcObject !== stream) v.srcObject = stream;
    try{ await v.play(); }catch(_){}
    v.classList.remove('hidden');
    $('#shot').classList.add('hidden');
    $('#placeholder').classList.add('hidden');
    $('#capture').disabled = false;
    say('준비 완료! 촬영 버튼을 누르세요.');
  }catch(e){
    const n = (e && e.name) || '';
    say(
      n==='NotAllowedError'  ? '카메라 사용이 차단되어 있습니다. 주소창 오른쪽의 카메라 아이콘에서 "허용"을 고르거나, 아래 "사진 파일에서 불러오기"를 쓰세요.' :
      n==='NotFoundError'    ? '카메라를 찾지 못했습니다. 연결을 확인하거나 아래 "사진 파일에서 불러오기"를 쓰세요.' :
      n==='NotReadableError' ? '카메라를 열 수 없습니다. ① 노트북 카메라의 물리 덮개(셔터)가 닫혀 있는지, ② 카메라 켜고 끄는 Fn 키(F8·F10 등)가 꺼짐인지, ③ 윈도우 설정 → 개인 정보 보호 → 카메라가 켜져 있는지, ④ 화상회의·카메라 앱이 켜져 있는지 차례로 확인한 뒤 "카메라 다시 연결"을 눌러 주세요.' :
      n==='NotSupportedError'? '이 브라우저에서는 화면 안에 카메라를 열 수 없습니다. 아래 촬영 버튼을 누르면 기기 카메라가 바로 열립니다.' :
                               '카메라를 열지 못했습니다. "카메라 다시 연결"을 누르거나 사진 파일을 불러오세요.', true);
    const ph = $('#placeholder'); if(ph){ ph.classList.remove('hidden');
      ph.innerHTML = '<strong>📱</strong>괜찮습니다 — <b>직접 찍어서 올리기</b>를 쓰면 됩니다'; }
    /* 카메라가 안 열리면 촬영 버튼은 의미가 없다. 업로드를 주 버튼으로 올린다. */
    const cap = $('#capture'); if(cap){ cap.disabled = true; cap.classList.add('hidden'); }
    const up = document.querySelector('label[for="photoFile"]');
    if(up){ up.className = 'btn primary'; up.textContent = '📱 휴대폰·패드로 직접 찍어서 올리기'; }
  }
}
/* 미리보기에서 떼기만 한다 — 트랙은 살려 둬서 다시 들어와도 허용 창이 안 뜬다 */
function detachVideo(){ const v=$('#video'); if(v){ try{ v.pause(); }catch(_){} v.srcObject=null; } }
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; } }
window.addEventListener('pagehide', stopCamera);

/* 사진을 캔버스로 한 번 정규화해서 들여온다.
   ★ 예전에는 FileReader 로 원본 데이터URL 을 그대로 썼다. 그래서
     ① 휴대폰 사진의 EXIF 회전이 그대로 남아 얼굴이 눕거나 뒤집힌 채 참조로 들어갔고,
     ② 1200만 화소 원본이 그대로 API 로 올라가 느리고 서버가 제멋대로 줄였다.
   createImageBitmap(imageOrientation:'from-image') 로 회전을 먼저 적용하고,
   긴 변 2048 로 맞춰 화질 0.98 로 다시 굽는다. 얼굴 참조가 안정된다. */
function loadImageElement(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload  = () => resolve(img);
    img.onerror = () => reject(new Error('사진을 읽지 못했습니다.'));
    img.src = src;
  });
}

function canvasPhoto(source, sourceW, sourceH, maxSide, quality, flip){
  const scale = Math.min(1, maxSide / Math.max(sourceW, sourceH));
  const w = Math.max(1, Math.round(sourceW * scale));
  const h = Math.max(1, Math.round(sourceH * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', {alpha:false});
  g.fillStyle = '#f4f4f4'; g.fillRect(0,0,w,h);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  if(flip){ g.translate(w,0); g.scale(-1,1); }
  g.drawImage(source, 0, 0, sourceW, sourceH, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}

async function normalizePhotoFile(file){
  if(!file) throw new Error('사진 파일이 없습니다.');
  const looksImage = /^image\//i.test(file.type || '') || /\.(jpe?g|png|webp|heic|heif|avif)$/i.test(file.name || '');
  if(!looksImage) throw new Error('사진 파일만 불러올 수 있습니다.');
  if(file.size > 40 * 1024 * 1024) throw new Error('사진이 40MB보다 큽니다. 기기에서 조금 줄여 다시 골라 주세요.');
  let source = null, url = '';
  try{
    if(typeof createImageBitmap === 'function'){
      try{ source = await createImageBitmap(file, {imageOrientation:'from-image'}); }
      catch(_){ source = await createImageBitmap(file); }
    }
    if(!source){ url = URL.createObjectURL(file); source = await loadImageElement(url); }
    const w = source.width || source.naturalWidth, h = source.height || source.naturalHeight;
    if(!w || !h) throw new Error('사진 크기를 읽지 못했습니다.');
    return canvasPhoto(source, w, h, 2048, 0.98, false);
  }catch(err){
    throw new Error(/heic|heif/i.test((file.type||'') + ' ' + (file.name||''))
      ? '이 브라우저가 HEIC 사진을 읽지 못했습니다. 사진 앱에서 JPEG 로 저장해 다시 골라 주세요.'
      : (err && err.message) || '사진을 읽지 못했습니다. JPEG 또는 PNG 사진을 골라 주세요.');
  }finally{
    if(source && typeof source.close === 'function'){ try{ source.close(); }catch(_){} }
    if(url) URL.revokeObjectURL(url);
  }
}

async function mirroredPhoto(src){
  const img = await loadImageElement(src);
  return canvasPhoto(img, img.naturalWidth || img.width, img.naturalHeight || img.height, 2048, 0.98, true);
}

/* 카메라를 못 쓰는 환경에서도 끝까지 진행할 수 있게 하는 예비 경로 */
async function usePhotoFile(file){
  if(!file) return;
  const photoJob = beginPhotoJob();
  { const st0 = $('#camStatus'); if(st0){ st0.className='status'; st0.textContent='사진을 불러오는 중…'; } }
  let dataUrl;
  try{ dataUrl = await normalizePhotoFile(file); }
  catch(err){
    if(!photoJobActive(photoJob)) return;
    const st=$('#camStatus'); if(st){ st.className='status err'; st.textContent = err.message; }
    return;
  }
  {
    if(!installPhoto(dataUrl, photoJob)) return;
    detachVideo();
    const v=$('#video'); if(v) v.classList.add('hidden');
    const ph=$('#placeholder'); if(ph) ph.classList.add('hidden');
    const sh=$('#shot'); if(sh){ sh.src = state.photo; sh.classList.remove('hidden'); }
    const cap=$('#capture');
    if(cap){ cap.classList.remove('hidden'); cap.disabled=false; cap.textContent='↺ 다시 찍기';
             cap.onclick=()=>{ clearPhotoState(); render(); }; }
    addUseShotButton();
    addFlipButton();
    const st=$('#camStatus'); if(st){ st.className='status'; st.textContent='사진을 불러왔습니다. 좌우가 반대면 아래 뒤집기를 누르세요.'; }
  }
}
function addUseShotButton(){
  if($('#useShot')) return;
  const next = document.createElement('button');
  next.id = 'useShot'; next.className = 'btn primary';
  next.textContent = '이 사진으로 하기 →';
  next.style.cssText = 'width:100%;margin-top:9px';
  $('.help').insertBefore(next, $('#retry'));
  next.onclick = () => go('identity');
}

/* 혹시 좌우가 마음에 안 들 때를 위한 뒤집기.
   기본값은 화면에서 본 그대로(거울)이고, 이 버튼으로 언제든 반대로 바꿀 수 있다. */
function addFlipButton(){
  if($('#flipShot')) return;
  const b = document.createElement('button');
  b.id = 'flipShot'; b.className = 'btn ghost';
  b.textContent = '↔ 좌우 뒤집기';
  b.style.cssText = 'width:100%;margin-top:9px';
  $('.help').insertBefore(b, $('#retry'));
  b.onclick = () => flipPhoto();
}
/* ★ 예전에는 누를 때마다 JPEG 0.95 로 다시 구웠다. 세 번 뒤집으면 손실이 세 번 쌓여
   얼굴이 뭉개졌다. 이제 원본과 사본을 한 번만 만들어 두고 그 둘을 교대한다. */
async function flipPhoto(){
  if(!state.photo) return;
  const photoJob = beginPhotoJob();
  const b = $('#flipShot'); if(b) b.disabled = true;
  try{
    const base = state.photoBase || state.photo;
    const mirror = state.photoMirror || await mirroredPhoto(base);
    if(!photoJobActive(photoJob)) return;
    state.photoBase = base;
    state.photoMirror = mirror;
    state.photoFlip = !state.photoFlip;
    state.photo = state.photoFlip ? state.photoMirror : state.photoBase;
    state.photoFace = ''; state.glasses = '';
    const sh = $('#shot'); if(sh) sh.src = state.photo;
    const st = $('#camStatus');
    if(st){ st.className='status'; st.textContent='좌우 방향만 바꿨습니다. 원본에서 한 번만 만든 사본을 교대하므로 반복해도 화질이 떨어지지 않습니다.'; }
  }catch(_){
    if(!photoJobActive(photoJob)) return;
    const st=$('#camStatus'); if(st){ st.className='status err'; st.textContent='사진을 뒤집지 못했습니다. 원본 사진은 그대로입니다.'; }
  }finally{ if(b) b.disabled = false; }
}

async function capture(){
  if(!stream || busy) return;
  busy = true;
  const photoJob = beginPhotoJob();
  const box = $('#count'), ring = $('#ring'), flash = $('#flash'), cap = $('#capture');
  cap.disabled = true;
  try{
    box.classList.remove('hidden');
    ring.classList.add('on');
    const says = ['어깨를 펴고 정면을 보세요','렌즈를 그대로 보세요','좋습니다. 그대로!'];
    for(let i=0;i<3;i++){
      box.innerHTML = `<div class="num">${3-i}</div><div class="say">${says[i]}</div>`;
      await wait(900);
    }
    if(!photoJobActive(photoJob)) return;
    box.classList.add('hidden'); box.innerHTML = '';
    ring.classList.remove('on');

    const v = $('#video');
    /* 미리보기는 object-fit:cover 라서 화면에 보이는 것보다 넓게 찍힌다.
       학생이 타원 안에 맞춰 놓은 그대로를 저장해야 하므로,
       미리보기 상자와 같은 비율로 가운데를 잘라 낸다. */
    const pv = $('.preview');
    const vw = v.videoWidth || 1280, vh = v.videoHeight || 720;
    const ar = (pv && pv.clientHeight) ? (pv.clientWidth / pv.clientHeight) : (vw/vh);
    let sw = vw, sh = vh;
    if(vw/vh > ar) sw = vh*ar; else sh = vw/ar;
    const sx = (vw-sw)/2, sy = (vh-sh)/2;

    const c = document.createElement('canvas');
    c.width = Math.round(sw); c.height = Math.round(sh);
    const ctx = c.getContext('2d');
    /* 미리보기는 거울처럼 좌우를 뒤집어 보여 준다(그래야 자세를 맞추기 쉽다).
       저장도 똑같이 뒤집어서, 학생이 화면에서 본 그 모습 그대로 남게 한다.
       예전에는 카메라가 실제로 본 방향(뒤집지 않은 것)으로 저장해서,
       찍고 나면 방금 보던 화면과 좌우가 반대로 나왔다. */
    ctx.translate(c.width, 0); ctx.scale(-1, 1);
    ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
    if(!installPhoto(c.toDataURL('image/jpeg', .98), photoJob)) return;

    flash.classList.add('go');
    setTimeout(()=>flash.classList.remove('go'), 520);

    /* 트랙은 끄지 않는다. 다시 찍기를 눌러도 허용 창이 다시 뜨지 않게 하기 위해서다. */
    detachVideo();
    $('#shot').src = state.photo;
    $('#shot').classList.remove('hidden');
    v.classList.add('hidden');

    cap.disabled = false;
    cap.textContent = '↺ 다시 찍기';
    cap.onclick = () => { clearPhotoState(); render(); };
    addUseShotButton();
    addFlipButton();
    $('#camStatus').className = 'status';
    $('#camStatus').textContent = '좋습니다. 방금 화면에서 본 그대로 저장했습니다.';
  } catch(err) {
    if(photoJobActive(photoJob)){
      const st = $('#camStatus');
      if(st){ st.className = 'status err'; st.textContent = '촬영 중 문제가 생겼습니다. 다시 한 번 눌러 주세요.'; }
      if(cap) cap.disabled = false;
    }
  } finally {
    box.classList.add('hidden'); box.innerHTML=''; ring.classList.remove('on'); busy = false;
  }
}

     결국 어느 것도 드러나지 않는 밋밋한 옷이 나오므로 두 개로 막는다. */
  const MOTIF_MAX = MOTIF_LIMIT;
  const readMotifs = () => String($('#motifsFree').value||'')
    .split(/[,·/]/).map(x=>x.trim()).filter(Boolean).slice(0, MOTIF_MAX);
  const writeMotifs = list => {
    const v = list.slice(0, MOTIF_MAX).join(', ');
    $('#motifsFree').value = v;
    state.motifsFree = v;
    syncMotifs();
  };
  const syncMotifs = () => {
    const cur = readMotifs(), n = cur.length, full = n >= MOTIF_MAX;
    state.motifsFree = $('#motifsFree').value;
    $$('[data-motif]').forEach(x=>{
      const word = stripEmoji(x.dataset.motif);
      const on = cur.some(c => stripEmoji(c) === word);
      x.classList.toggle('on', on);
      x.disabled = !on && full;
      x.style.opacity = (!on && full) ? '.32' : '';
      x.style.cursor  = (!on && full) ? 'not-allowed' : '';
    });
    const el = $('#motifCount');
    if(el) el.innerHTML = n===0
      ? '아직 고르지 않았습니다. 아래 목록에서 1~2개를 누르거나 직접 적으세요.'
      : `<b style="color:var(--lime)">${n}개</b> — ${cur.map((c,i)=>
          `<b style="color:${i?'#f2c661':'#4fd2f0'}">${esc(c)}</b>${i?'(보조)':'(주)'}`).join(' · ')}` + (full
          ? ' · 다 골랐습니다. 바꾸려면 고른 것을 다시 누르세요.'
          : ' · 하나 더 고를 수 있습니다.');
  };
  $$('[data-motif]').forEach(b=>b.onclick=()=>{
    const word = stripEmoji(b.dataset.motif);
    const cur = readMotifs();
    const at = cur.findIndex(c => stripEmoji(c) === word);
    if(at >= 0) return writeMotifs(cur.filter((_,i)=>i!==at));   // 다시 누르면 해제
    if(cur.length >= MOTIF_MAX) return;
    writeMotifs([...cur, word]);
  });
  $('#motifsFree').addEventListener('input', syncMotifs);
  syncMotifs();

  /* 성격은 하나만 고른다. 둘을 섞으면 자세 지시가 서로 부딪혀서
     결국 어느 쪽도 아닌 밋밋한 포즈가 나온다. 하는 일과 같은 방식이다. */
  const syncTraitChips = () => {
    const cur = state.traits.trim();
    $$('[data-trait]').forEach(b=>b.classList.toggle('on', b.dataset.trait === cur));
  };
  $$('[data-trait]').forEach(b=>b.onclick=()=>{
    state.traits = (state.traits.trim() === b.dataset.trait) ? '' : b.dataset.trait;
    $('#traits').value = state.traits;
    syncTraitChips();
  });
  $('#traits').addEventListener('input', syncTraitChips);
  syncTraitChips();

  $('#back').onclick = () => go('camera');
  $('#next').onclick = () => {
    const st = $('#idStatus');
    if(!state.level){
      if(st){ st.className='status err'; st.textContent='먼저 학년을 골라 주세요. 학년에 따라 실험 세트가 통째로 달라집니다.'; }
      window.scrollTo(0,0); return;
    }
    if(!allMotifs().length){
      if(st){ st.className='status err'; st.textContent='히어로 모티브를 하나는 골라 주세요. 이것이 슈트의 생김새를 정합니다.'; }
      return;
    }
    if(!state.name.trim()) state.name = '이름 없는 연구원';
    if(!state.role.trim()) state.role = '친구와 학교를 지키는 사람';
    state.station = 0; state.picked = null; state.answered = false; state.loadout = [];
    go('lab');
  };
}

/* ── 확인 문제 : 제한시간 ────────────────────────────────────────
   문제를 여는 순간부터 시간이 흐른다. 준비물·순서·시뮬레이션·원리를
   읽는 동안에는 재촉하지 않는다. 시간의 절반이 남아 있을 때 맞히면
   한 등급 위(신속 정답)로 쳐서, 잘 맞힐수록 복장이 더 화려해진다.
   ───────────────────────────────────────────────────────────── */
let quizRAF = null;
function stopQuizTimer(){ if(quizRAF){ cancelAnimationFrame(quizRAF); quizRAF = null; } }
function resetQuiz(){
  stopQuizTimer();
  state.answered = false; state.quiz = 'idle'; state.quizOrder = null;
  state.quizEnd = 0; state.quizResult = null;
}
/* 보기 순서를 학생·실험마다 다르게 섞는다.
   섞지 않으면 정답이 늘 첫 번째 자리에 있어서, 몇 문제만 풀어도 눈치챈다.
   같은 학생이 같은 실험을 다시 열면 같은 순서가 나오도록 씨앗을 고정한다. */
function shuffledOrder(n, seedStr){
  let h = 2166136261;
  for(const ch of String(seedStr)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const idx = [...Array(n).keys()];
  for(let i=n-1; i>0; i--){
    h = Math.imul(h ^ (h>>>15), 2246822519); h = (h ^ (h>>>13)) >>> 0;
    const j = h % (i+1);
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

/* 문제 영역. 아직 안 열었으면 시작 버튼만, 열었으면 타이머와 보기를 그린다 */
function quizHtml(e){
  const sec = quizSec();
  if(state.quiz === 'idle'){
    return `<div class="quiz-gate">
      <h4>확인 문제</h4>
      <p>위 실험과 원리를 충분히 살펴본 뒤에 누르세요. 누르는 순간부터 <b class="sec">${sec}초</b>가 흐릅니다.<br>
      <b>${Math.round(sec/2)}초</b> 안에 맞히면 이 장비가 <b>최상급 완성형</b>, 그 뒤부터 <b>${sec}초</b>까지 맞히면 <b>완성형</b>으로 만들어집니다.</p>
      <button class="quiz-start" id="quizStart">⏱ 문제 열기 · ${sec}초</button>
    </div>`;
  }
  const order = state.quizOrder || e.check.options.map((_,i)=>i);
  const r = state.quizResult;
  const done = state.quiz === 'done' && r;
  return `
    <div class="timer">
      <div class="timer-top"><span>남은 시간</span><span class="timer-num" id="tNum">${done?r.leftSec.toFixed(1):sec.toFixed(1)}</span></div>
      <div class="timer-rail"><div class="timer-fill" id="tFill"${done?` style="width:${(r.leftSec/sec*100).toFixed(1)}%"`:''}></div><div class="timer-mark"></div></div>
      <div class="timer-legend"><span id="tHint">${
        done ? (r.timeout ? '시간이 지났습니다 — <b class="dn">시제품</b>'
              : !r.ok    ? '아쉽습니다 — <b class="dn">시제품</b>'
              : r.grade === 'ace' ? '<b>최상급 완성형</b>으로 만들어집니다'
                                  : '<b class="dn">완성형</b>으로 만들어집니다')
             : '지금 맞히면 <b>최상급 완성형</b>'
      }</span><span>0초</span></div>
    </div>
    <div class="question">${esc(e.check.q)}</div>
    <div class="answers">
      ${order.map(i=>{
        const cls = !done ? '' : (i===e.check.answer ? ' correct' : (i===r.idx ? ' wrong' : ''));
        return `<button class="answer${cls}" data-a="${i}"${done?' disabled':''}>${esc(e.check.options[i])}</button>`;
      }).join('')}
    </div>`;
}

function bindQuiz(e){
  const s = $('#quizStart');
  if(s) s.onclick = () => startQuiz(e);
  $$('[data-a]:not([disabled])').forEach(b=>b.onclick=()=>answerCheck(Number(b.dataset.a)));
  if(state.quiz === 'run') runQuizTimer();
  if(state.quiz === 'done' && state.quizResult) paintResult(e);
}

function startQuiz(e){
  state.quiz = 'run';
  state.quizOrder = shuffledOrder(e.check.options.length, `${state.name}|${state.level}|${state.station}|${e.id}`);
  state.quizEnd = performance.now() + quizSec()*1000;
  $('#quizBox').innerHTML = quizHtml(e);
  bindQuiz(e);
  $('#quizBox').scrollIntoView({behavior:'smooth', block:'center'});
}

function runQuizTimer(){
  stopQuizTimer();
  const total = quizSec()*1000;
  const step = () => {
    if(state.quiz !== 'run'){ quizRAF = null; return; }
    const left = Math.max(0, state.quizEnd - performance.now());
    const num = $('#tNum'), fill = $('#tFill');
    if(!num || !fill){ quizRAF = null; return; }   // 화면이 바뀌었으면 조용히 멈춘다
    const r = left/total;
    num.textContent = (left/1000).toFixed(1);
    fill.style.width = (r*100) + '%';
    const cls = r > .5 ? '' : (r > .2 ? 'warn' : 'crit');
    num.className = 'timer-num ' + cls;
    fill.className = 'timer-fill ' + cls;
    /* 눈금을 지나는 순간 안내를 바꾼다 — 지금 맞히면 무엇이 되는지 실시간으로 보여 준다.
       예전에는 "이 눈금 왼쪽에서 맞히면 최상급" 이라는 고정 문구였는데,
       막대가 남은 시간이라 왼쪽/오른쪽이 거꾸로 읽혀서 학생들이 헷갈렸다. */
    const hint = $('#tHint');
    if(hint) hint.innerHTML = r >= .5
      ? '지금 맞히면 <b>최상급 완성형</b>'
      : '지금 맞히면 <b class="dn">완성형</b>';
    if(left <= 0){ quizRAF = null; answerCheck(-1); return; }
    quizRAF = requestAnimationFrame(step);
  };
  quizRAF = requestAnimationFrame(step);
}

/* idx = -1 이면 시간 초과 */
function answerCheck(idx){
  if(state.answered || state.quiz !== 'run') return;
  const e = state.picked, st = labs()[state.station];
  state.answered = true;
  state.quiz = 'done';
  stopQuizTimer();

  const total   = quizSec()*1000;
  const left    = Math.max(0, state.quizEnd - performance.now());
  const timeout = idx < 0;
  const ok      = !timeout && idx === e.check.answer;
  /* 시간이 절반 넘게 남았을 때 맞히면 신속 정답 */
  const grade   = !ok ? 'miss' : (left >= total/2 ? 'ace' : 'ok');

  state.quizResult = { idx, timeout, ok, grade,
                       leftSec: left/1000, usedSec: (total-left)/1000 };

  $$('.answer').forEach(b=>{
    const i = Number(b.dataset.a);
    b.disabled = true;
    if(i === e.check.answer) b.classList.add('correct');
    else if(i === idx) b.classList.add('wrong');
  });
  const fill = $('#tFill'); if(fill) fill.style.width = timeout ? '0%' : (left/total*100)+'%';

  paintResult(e);

  const nx = $('#next');
  nx.classList.remove('hidden');
  nx.textContent = (state.station < labs().length-1) ? '다음 실험실로 →' : '히어로 컷 고르기 →';
  nx.onclick = () => {
    if(state.station < labs().length-1){
      state.station++; state.picked = null; resetQuiz(); render();
    } else go('shot');
  };
  nx.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* 채점 결과 · 얻은 장비 · 그 장비가 주는 능력을 그린다.
   화면을 다시 그려도 같은 결과가 그대로 복원되도록 따로 떼어 놓았다. */
function paintResult(e){
  const st = labs()[state.station];
  const r = state.quizResult;
  const {grade, ok, timeout} = r;
  const used = r.usedSec.toFixed(1);

  const HEAD = {
    ace :`<b>정확하고 빠릅니다.</b> ${used}초 만에 맞혔습니다. `,
    ok  :`<b>맞았습니다.</b> ${used}초 걸렸습니다. `,
    miss: timeout ? '<b>시간이 다 됐습니다.</b> 해설을 읽고 다음 실험에서 만회하세요. '
                  : '<b>여기가 헷갈리는 지점입니다.</b> '
  };
  $('#verdict').innerHTML =
    `${timeout?`<div class="timeup">⏱ 제한시간 ${quizSec()}초를 넘겼습니다. 이 장비는 시제품으로 올라갑니다.</div>`:''}
     <div class="verdict ${ok?'ok':''}">${HEAD[grade]}${esc(e.check.explain)}</div>`;

  const TAG  = {ace:'최상급 완성형', ok:'완성형', miss:'시제품'};
  const NOTE = {
    ace :'⬆⬆ 복장 2단계 업그레이드! 원리를 정확히, 그것도 빠르게 짚었습니다. 이 장비는 광이 나는 최상급 마감으로 슈트에 올라가고, 조명까지 따로 받습니다.',
    ok  :'⬆ 복장 업그레이드! 원리를 정확히 짚어서 이 장비는 완성형으로 만들어집니다. 다음 문제는 절반 시간 안에 맞혀 최상급을 노려 보세요.',
    miss:'장비는 그대로 얻습니다. 다만 원리를 아직 다 잡지 못한 채로 만들어서 마무리가 거친 시제품으로 슈트에 올라갑니다. 조금 아쉽지만 히어로는 당당합니다. 위 해설을 한 번 더 읽어 보세요.'
  };
  const ability = abilityOf(e.id, grade);
  $('#gearBox').innerHTML =
    `<div class="gear-get ${grade==='ace'?'ace':grade==='miss'?'rough':''}"><span class="g-ico">${esc(e.icon)}</span>
      <span class="g-txt">
        <b>${esc(st.slot)} 확보 — ${TAG[grade]}</b>
        <span>${esc(e.gear)}</span>
        <span class="g-note">${NOTE[grade]}</span>
      </span></div>
     ${ability?`<div class="ability ${grade==='ace'?'ace':grade==='miss'?'rough':''}">
        <h5>이 장비가 주는 능력</h5><p>${esc(ability)}</p></div>`:''}`;

  state.loadout[state.station] = {
    id: e.id, station: st.title, slot: st.slot, slotEn: st.slotEn, icon: e.icon,
    gear: e.gear, en: e.en, exp: e.name, ok: ok, grade: grade, sec: Number(used),
    ability: ability
  };
}

/* ══════════════════════════════════════════════════════════════

  balloon:`THE THRUSTER HAS JUST FIRED. A hard jet of air is blasting from the nozzle behind the hero, the bladder in its shell visibly collapsing as it empties, dust streaming away along the ground behind them. The hero is being pushed forward and slightly up, leaning into it, one hand on the release at the chest, everything loose on the costume streaming backward.`,

  rainbow:`THE OPTIC BAND IS FIRING A RAINBOW LANCE. A shaft of white leaves the water-filled band and unfolds as it goes into one ribbon of pure spectrum, red through violet in order with clean edges, laying an arc of real colour across whatever it reaches. The emitter housing runs hot at its aperture, whatever light it makes falls on the hero's suit and face, the visor or eyes catch it, and the cape and hair move with the discharge. Braced against the recoil, other arm out for balance. NO small objects, debris, tools or scrap anywhere in the frame. ★ HOW BIG AND HOW BRIGHT THIS IS, IS NOT DECIDED HERE — the quality level below decides it, and it overrides every size and brightness word above.`,
  mirror:`THE SHIELD IS TURNING A BEAM. The forearm shield has snapped open and a searchlight-bright beam is striking its mirror facets and leaving at a hard angle, both the incoming and the outgoing beam blazing visibly through the haze in the air, running the full width of the frame and out past the edge, so the change of direction is unmistakable and you could measure the two angles off the picture. The reflection lands on a far wall as a burning spot and the hero's own face and shoulder are lit by the bounce coming back off it. Side-on, shield arm locked out and angled with real precision, the other arm tucked, head turned to watch where the beam landed.`,
  fluorescence:`THE ULTRAVIOLET BEAM IS SWEEPING AND THE WHOLE ROOM IS ANSWERING. Everything else is near black — the lamp itself gives out almost no visible light — and the only things in the picture are the things that fluoresce, burning out of the dark in vivid cyan-green and violet-white. The beam has already crossed half the hero: those seam lines, that shoulder, that chest emblem are blazing, the lines ahead of the sweep are still dead matte paint, and the hard boundary between lit and unlit is caught mid-crossing over the arm. Beyond them the wall is covered in glowing hand-prints and a long spatter trail leading away, a footprint chain glows across the floor, and their own glove is lit like a lantern where the beam rests on it. Aiming arm locked out along the beam, head turned to read what has appeared, the glow from their own suit lighting the underside of the chin.`,
  shadow:`THE SEARCHLIGHT IS FIRING. The lamp's beam — from the chest emitter if this piece is showcase grade, otherwise from the shoulder mount — is a visible column of light with hard edges and dust burning inside it. What it misses falls dark, so the hero is cut out against their own shadow thrown up the wall behind. The emitter housing runs hot at its aperture, whatever light it makes falls on the hero's suit and face, the visor or eyes catch it, and the cape and hair move with the discharge. Braced against the recoil, other arm out for balance. NO small objects, debris, tools or scrap anywhere in the frame. ★ HOW BIG AND HOW BRIGHT THIS IS, IS NOT DECIDED HERE — the quality level below decides it, and it overrides every size and brightness word above.`,
  hydrophobic:`A WALL OF WATER IS BEING THROWN OFF. A full sheet of water has just slammed into the hero and the cape has refused all of it — thousands of separate beads standing up almost spherical on the fabric and blasting off the edge in a wide fan of droplets, every one of them frozen sharp and lit from behind so the whole spray glitters, and a hard dry line where the coated surface ends. Behind the cape the hero is completely dry; a metre away the ground is soaked and running. The cape is swung across the body as a shield, held out by one fist at the shoulder clasp, head turned away from the impact and then back to camera.`,
  insulation:`THE COLD LANCE IS FIRING. A beam of freezing energy leaves the emitter — a pale cyan-white column with vapour boiling off its length, frost racing outward where it lands and ice crystals flashing into existence along its edges. The emitter housing runs hot at its aperture, whatever light it makes falls on the hero's suit and face, the visor or eyes catch it, and the cape and hair move with the discharge. Braced against the recoil, other arm out for balance. NO small objects, debris, tools or scrap anywhere in the frame. ★ HOW BIG AND HOW BRIGHT THIS IS, IS NOT DECIDED HERE — the quality level below decides it, and it overrides every size and brightness word above.`,
  resonance:`THE SONIC LANCE IS FIRING. A visible beam of compressed sound leaves the chest grille — rings of shocked white air stacked along its length, the view warping inside it, glass shattering into a glittering cloud where it strikes. The emitter housing runs hot at its aperture, whatever light it makes falls on the hero's suit and face, the visor or eyes catch it, and the cape and hair move with the discharge. Braced against the recoil, other arm out for balance. NO small objects, debris, tools or scrap anywhere in the frame. ★ HOW BIG AND HOW BRIGHT THIS IS, IS NOT DECIDED HERE — the quality level below decides it, and it overrides every size and brightness word above.`,
  stringphone:`THE SIGNAL LANCE IS FIRING. A taut line of humming white energy leaves the shoulder emitter — a straight beam with standing waves running along it in bright nodes, snapping and shivering under tension. The emitter housing runs hot at its aperture, whatever light it makes falls on the hero's suit and face, the visor or eyes catch it, and the cape and hair move with the discharge. Braced against the recoil, other arm out for balance. NO small objects, debris, tools or scrap anywhere in the frame. ★ HOW BIG AND HOW BRIGHT THIS IS, IS NOT DECIDED HERE — the quality level below decides it, and it overrides every size and brightness word above.`

/* 액션 원문 일부에는 머리를 충격 쪽으로 돌리라는 연출이 있다. 사진 인물이면 그 한
   절만 제거하고 몸의 반응은 그대로 둔다. 뒤에서 '무시하라'고 싸우게 하는 것보다
   얼굴을 바꾸는 문장을 애초에 이미지 프롬프트로 보내지 않는 편이 안전하다. */
function actionMomentForPrompt(x){
  let text = String(x && ACTION_MOMENT[x.id] || '');
  if(!state.photo) return text;
  if(x && x.id === 'spectrum') text = text.replace(
    'leaves the visor band',
    noGlasses() ? 'leaves the hand-aimed forearm prism module, entirely clear of the face' : 'leaves the temple housing of the redesigned hero eyewear, projecting outward and away from the face without crossing or clouding either clear lens'
  );
  if(x && x.id === 'rainbow') text = text.replace(
    'leaves the water-filled band',
    noGlasses() ? 'leaves the hand-aimed water-channel module on the forearm, entirely clear of the face' : 'leaves the temple housing of the redesigned hero eyewear, projecting outward and away from the face without crossing or clouding either clear lens'
  );
  return text
    .replace(/,\s*head turned[^.]*\./gi, '.')
    .replace(/the visor or eyes catch it/gi, 'nearby equipment surfaces catch it while the lenses stay clear and both photographed eyes remain fully visible and unchanged');
}

/* 4가지 실험이 옷의 서로 다른 부분을 정한다는 것을 한 덩어리로 만들어 넘긴다 */
function garmentPlan(){
  const g = gearList();
  const at = i => (g[i] || {}).id;
  const headGear = g[2];
  const headPlan = headGear && state.photo
    ? ((headGear.id === 'spectrum' || headGear.id === 'rainbow')
        ? gearHome(headGear)
        : `PHOTO-SAFE HEAD PLAN: the photographed face, hairline, head angle and eye area stay completely unchanged and no mask, brow device or aiming cue is added. The crown and back remain open behind the preserved hairline; this light experiment's actual object stays at its face-safe working location: ${gearHome(headGear) || 'on the arm, shoulder, chest or collar'}`)
    : GARMENT_HEAD[at(2)];
  const parts = [
    GARMENT_LOWER[at(1)],
    headPlan,
    GARMENT_OUTER[at(3)]
  ].filter(Boolean);
  /* 실험 넷이 실제로 만들어 낸 물질 — 옷의 표면은 이 넷에서만 나온다 */
  /* 등급이 높은 장비는 같은 물질이라도 '제대로 만든 부품' 꼴로 나와야 한다.
     여기서 원재료만 넘기면 최상급 장비에도 교실 재료가 그대로 그려진다. */
  const mats = g.filter(x => MATERIAL_FROM[x.id]).map(x =>
    gearMaterial(x)
    + (x.grade === 'ace' && gearAceMaterial(x)
        ? ` — BUT THIS ONE WAS BUILT TO SHOWCASE STANDARD, so on this piece it is ${gearAceMaterial(x)}, never the raw classroom object`
        : x.ok === false
        ? ' — and this one was NOT finished, so here it stays the raw classroom object, hand-cut and taped or strapped on'
        : ''));
  const family = axisPick(SUIT_FAMILIES, 0x4a71, heroTags());
  return `WHAT KIND OF SUIT THIS IS — pick this shape and commit to it
${family}
This is the FAMILY of costume. It is not decided by "what superheroes usually wear" — a hundred students must not all end up in the same armour. Build this family, then make it out of the materials below, then shape it with the MOTIF.

THE FOUR MATERIALS THIS STUDENT ACTUALLY MADE WITH THEIR OWN HANDS
Every surface, panel, fitting and texture on this costume comes from this list and nothing else. If a surface cannot be traced to one of these four, replace it with one that can.
${mats.map((m,i)=>`- ${i+1}. They produced ${m}.`).join('\n')}
Do not default to generic steel, generic carbon fibre or generic black tactical nylon. If none of the four is a metal, THERE IS NO STEEL ON THIS COSTUME. Mix them: one material can be the field of the garment, another the panels, another the fittings, another one small vivid detail.
On at least two pieces the raw substance is visibly on show — a clear window, a translucent edge, an unpainted section, a cutaway.
THE SUBSTANCE IS FIXED; HOW WELL IT IS MADE IS NOT. Each line above says which grade its piece was built to. A showcase-grade piece shows that substance ENGINEERED — moulded, sealed, machined, evenly finished — and must never be drawn as the household object the experiment used. An unfinished piece shows the household object itself, and that is exactly right for it. This difference between the pieces is the whole point: it is how the student's own result is written into the picture.

GARMENT PLAN — the four experiments also decide where the mass sits
Each experiment changes a different part of the garment, and together they must produce a costume that could not have come from any other combination.

${parts.map((v,i)=>`${i+1}. ${v}`).join('\n\n')}

Read all of this together with SUIT CONSTRUCTION, which decides what the base garment is made of, and with MOTIF, which decides what shape everything takes. If the result still looks like a generic armoured superhero, you have ignored this section.`;
}

/* 확인 문제를 맞힐수록 그 장비가 옷에 '녹아든다'.
   틀리면 겉에 덧댄 임시 장치, 맞히면 제대로 만든 물건, 빨리 맞히면 슈트의 일부. */
function itemIntegration(grade, isOk){
  if(grade === 'ace')
    return 'INTEGRATED, NOT ATTACHED — because this one was built perfectly. The housing is not bolted onto the costume, it IS the costume: an armour panel opens to become it, its edges continue the suit\'s own seam lines, its material and finish are the same as the plate around it, and at rest you could not point to where the suit ends and the device begins. Give it the jewel treatment — the crispest edges on the whole build, a flush inlaid window, fine engraved markings, one perfect highlight — and let it deploy OUT of the garment rather than sit on top of it. This is the piece a viewer will remember.';
  if(isOk === false)
    return 'AN EXTERNAL LASH-UP — because this one did not come out right, and it shows. It sits on top of the costume in a different material and a different colour to everything around it, held on with webbing straps, tape or zip ties, its wires taken the long way round and cable-tied down, one edge visibly cut by hand and filed flat. It works. But anyone can see it was added afterwards and does not belong to the suit.';
  return 'PROPERLY MADE AND PROPERLY MOUNTED — a purpose-built object with its own clean housing, fixed where it belongs with real fittings, designed alongside the costume and matching its colours. It still reads as a separate piece attached to the suit rather than something the suit grew.';
}

/* 가슴 문장 — 히어로를 히어로로 만드는 표식. 어떤 형태로 붙는지가 인상을 크게 바꾼다.
   ★ 여기서 'single-glyph'(글자 하나) 라고 써 뒀더니 그림 모델이 진짜로 알파벳을 그렸다.
     여우를 고른 학생 가슴에 'G' 가 찍혀 나온 것이 그 때문이다.
     문장의 '그림'은 언제나 모티브 생물이어야 한다. 아래 EMBLEM_RULE 이 그것을 못박는다. */
const EMBLEMS = [

  {t:['precise','clean'],   v:'a small enamelled badge over the heart and nothing else marking the suit'},

/* ★ 문장에 무엇이 그려지는가. 형태(어디에 어떻게 붙는가)는 EMBLEMS 가 정하고,
   그림은 언제나 모티브다. 이것을 안 적어 두면 그림 모델은 히어로 이름의 첫 글자를 그린다. */

}
/* 씨앗에는 붙임표를 뺀 이름을 쓴다. 그래야 히든 코드를 켜도 '같은 학생의 같은 캐릭터'가
   등급만 올라간 모습으로 나온다. 붙임표까지 씨앗에 넣으면 아예 다른 히어로가 돼 버린다. */
function heroSeed(){
  const src = [cleanName(state.name), state.role, state.traits, state.motifsFree,
               state.loadout.filter(Boolean).map(l=>l.id).join(','), state.shot, state.level].join('|');
  let h = 2166136261;
  for(let i=0;i<src.length;i++){ h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
/* 점수가 가장 높은 하나로 못을 박아 버리면, 치타를 고른 학생 30명이 전부 같은 체형이 된다.
   그렇다고 무작위로 뽑으면 고른 것과 상관없는 결과가 나온다.
   그래서 '충분히 잘 맞는 후보들'만 남기고(최고점의 55% 이상) 그 안에서 학생 고유 해시로 고른다.
   납득은 가면서, 같은 걸 고른 학생끼리도 갈린다. */
function axisPick(arr, salt, w){
  /* 여자 히어로를 골랐으면 어두운 후보를 아예 후보에서 뺀다.
     '화사하게' 라고 뒤에서 아무리 적어도, 조명 축이 '거의 암흑'으로 뽑히면 그쪽이 이긴다. */
  if(state.gender === 'girl'){
    const lit = arr.filter(o => !o.dark);
    if(lit.length >= 2) arr = lit;
  }
  const scored = arr.map(o=>({o, sc:o.t.reduce((n,tg)=>n + (w[tg]||0), 0)}));
  const best = Math.max(...scored.map(x=>x.sc));
  let pool = best <= 0 ? arr
           : scored.filter(x=>x.sc >= Math.max(1, best*0.55)).map(x=>x.o);
  if(pool.length < 2){                              // 후보가 하나뿐이면 차점자까지 넣어 준다
    const rest = scored.filter(x=>x.sc>0 && !pool.includes(x.o)).sort((a,b)=>b.sc-a.sc);
    pool = pool.concat(rest.slice(0,2).map(x=>x.o));
  }
  if(!pool.length) pool = arr;
  const s = heroSeed();
  return pool[((Math.imul(s ^ salt, 2246822519) >>> 0) % pool.length)].v;
}

Absolutely never: hiking hats, bush hats, wide-brim field hats, backpacks with camping straps, cargo utility vests, safari or expedition clothing, plain military fatigues, hi-vis workwear, or a generic black tactical bodysuit.
Give it drama through silhouette, colour and light — not through neon, holograms or glowing particles.`,

`COSTUME ARCHITECTURE — the single biggest reason these come out looking cheap
The default failure is a plain skin-tight one-piece: one material, one unbroken surface from collar to ankle, a shape printed on the chest. That is a gym leotard, not a hero costume. It is banned. Even where the SUIT CONSTRUCTION section below calls for a seamless stretch material, every rule here still applies.
Real film costumes look expensive because they are BUILT — cut, moulded, strapped and mounted — not printed. All seven of the following must be true of this image.

1. FOUR VISIBLE LAYERS, MINIMUM. A viewer must be able to count them.
   ① A base layer that reads unmistakably as textile — visible weave, knit or quilting, with real fabric wrinkles gathering at the elbows, the backs of the knees and the waist.
   ② A structural layer strapped or bonded over it — harness webbing, a corselet, rib banding, a segmented spine, a shoulder yoke.
   ③ A protective layer standing proud of the base with a real air gap and casting its own shadow onto it. IT DOES NOT HAVE TO BE ARMOUR PLATE, and usually it should not be. Use whatever the SUIT CONSTRUCTION section calls for: thick quilted padding with real loft, stiffened cloth panels, sculpted cast pieces, layered scales, heavy woven ribbing, banded leather — or moulded plates. What matters is that it is a separate raised layer, not that it is armour.
   ④ An outer statement layer that changes the outline — a cape, mantle, coat, tabard, sash or mounted equipment rig.
   Wherever two layers overlap, show the overlap: a raised edge, a shadow line, a visible fastening.

2. THREE DIFFERENT MATERIALS meeting on the body, with visible boundaries where one hands over to the next. Not one material in three colours — three materials with different hardness, different sheen and a different response to light. Metal against matte cloth against rubberised polymer.

3. THE OUTLINE IS BROKEN in at least two places by something that projects out from the body — a pauldron, a raised collar, a mantle, a back rig, a crest, a folded panel, a shoulder mount. A silhouette that is a smooth human outline from head to toe is a failure.

4. A HORIZONTAL INTERRUPTION AT THE WAIST, and another at the chest or collar. Real costumes break the torso up: a belt with real depth and fittings whose workmanship follows that zone's quiz grade, a harness strap, a rigid banded midsection, a yoke seam. It is a separate object mounted ON the garment — it interrupts the torso visually, it does not narrow it or shape it. Without this the costume reads as one featureless tube. This single rule fixes most cheap-looking suits.

5. THE NECK DOES SOMETHING. A standing collar, a gorget, an armoured neck ring, a cowl base, or a mantle rising behind the head. Never a plain round crew neckline.

6. GLOVES AND BOOTS ARE SEPARATE OBJECTS, each with its own cuff, its own material and a visible line where it meets the limb. Never painted-on extensions of the same surface.

7. ONE FOCAL ELEMENT carries the picture and everything else is quieter so that it can. Decide which it is — the emblem, ${state.photo ? 'a crown/back-of-head crest or collar structure clear of the photographed face' : 'the mask'}, the cape, or the signature item — and give it the strongest contrast and the best light in the frame.

HOW GOOD THIS HAS TO BE — the benchmark
Judge the STRUCTURE of the result against real film costume departments, never against fan art or stock superhero imagery. But how well MADE it is — how polished, how finished, how lit — is decided entirely by the FINISH LEVEL section further down, and that section wins over everything here. At a low finish level this is a school workshop build of these same structures, not a film costume: same number of layers, same broken outline, same belt and collar, but hand-cut, taped, unpainted and flatly lit.
- Batman: separate armour sections mounted over a ballistic underlayer, a distinct cape on visible shoulder hardware, gauntlets with their own cuffs, a chest emblem that is itself an armour plate. Every piece could be removed and set on a stand by itself.
- Black Panther: one continuous woven texture — and it still works because the neck ring, the raised shoulder ridges and the silver claw lines break it up. Even the "smooth" suit is never a plain surface.
- Doctor Strange: almost no armour at all, and it still reads as powerful, entirely through layering — tunic over robe, a wrapped sash, a heavy belt, and a separate weighty cloak with a high standing collar.
- Thor: sculpted pauldrons, chest discs, forearm bracers, a cape hung from real sculpted clasps. The metal is not the suit — it is mounted onto the suit.
- Iron Man and Mandalorian armour: a segmented hard shell with visible gaps between the plates and soft flight-suit material showing at every joint. You can see exactly how it articulates.
${state.photo ? '- For a photo-based seamless suit, raised structural filaments cross every BODY panel and the colour blocking is hard-edged, while the photographed face stays fully open and unchanged with no mask or added lens object. Never a flat printed surface.' : '- Spider-Man is the one genuine skin-tight case, and even there raised webbing filaments cross every panel, the lenses are a separate physical object, and the colour blocking is hard-edged. If a seamless suit is called for, THIS is the standard — never a flat printed surface.'}
NON-ARMOURED BENCHMARKS — use these whenever SUIT CONSTRUCTION does not call for metal. Not one of them wears a breastplate, and every one of them still reads instantly as a hero:
- A long structured coat worn open over a shirt and a heavy working belt, with a standing collar and deep cuffs. All the weight is in the tailoring and the drape.
- A quilted cold-weather parka with a lined hood, chest pockets, a storm flap and a webbing harness over the top.
- A wrapped robe with a wide sash, layered sleeves and a shoulder mantle, with cast ornament at the collar and nothing else hard on the body.
- A pilot's flight suit with a chest harness, leg pockets, arm patches, a survival rig on one thigh and a scarf at the neck.
- A padded gambeson — thick, stitched, entirely cloth — with only bracers and a belt on top.
Each of these has four layers, three materials, a broken outline, a waist break, something at the neck, separate gloves and boots and one focal element. Aim across this whole range, not at armour every time.

NOT EVERY HERO WEARS ARMOUR — THIS IS THE SECOND BIGGEST FAILURE AFTER THE SKIN-TIGHT ONE-PIECE.
The seven rules above are about LAYERS AND STRUCTURE, not about plate. If every student in the class comes back as a person in moulded chest-and-shoulder armour, this section has been read wrongly and thirty posters look the same. A costume can satisfy all seven rules and contain no armour at all.
Real garments that pass every rule: a long structured coat over a shirt and a heavy belt; a quilted parka with a deep hood; a wrapped robe with a wide sash and layered sleeves; a flight suit with a chest harness and a thigh rig; a tabard over a knitted underlayer; a workwear jacket and trousers with a tool belt; a ceremonial robe with cast ornament at the shoulders; a hooded poncho over close-cut leggings; a padded gambeson with no plate on it whatsoever.
ARMOUR IS NOT BANNED — far from it. Armour looks great and plenty of these heroes should have it. Bracers, pauldrons, greaves, a chest plate, a gorget, knee caps and armoured gloves can be mounted onto ANY of the garments above, and one of the four material experiments produces a full suit of riveted metal plate on purpose.
The thing to avoid is only this: EVERY student coming back in the same head-to-toe moulded plate. Let SUIT CONSTRUCTION and GARMENT PLAN decide what the base garment is, and then add as much or as little armour on top as that garment and that student's motif call for. A quilted parka with heavy bracers and one shoulder plate is a great answer. A robe with a gorget and greaves is a great answer. Full plate is a great answer for the student who ran the metal experiment.

BANNED OUTRIGHT: a plain unbroken skin-tight one-piece; a painted-on muscle suit; ${state.gender === 'girl' ? 'armour with sculpted abdominal or chest musculature (no six-pack plates, no anatomical cuirass — the torso plate is a plain geometric volume); ' : ''}a stretch-fabric surface with muscles printed, quilted or shaded onto it; a wetsuit or zentai with a shape on the chest; a plain black tactical bodysuit; any costume whose only design is a colour pattern applied to a smooth surface.`,

These axes are decoration hung on the motif, not the design itself. If any of them would make the motif harder to recognise, bend it or drop it — the motif always wins.

THE THREE THINGS EVERYONE ALREADY KNOWS — DO THIS FIRST, BEFORE ANYTHING ELSE ON THIS PAGE
This is where these posters go wrong most often. The suit ends up "sort of animal-shaped, in the right colours", and the student looks at it and says "this could be anyone's". The fix is not more detail. It is building the specific famous things.
Before drawing, name to yourself THE THREE THINGS a child would say if you asked them what they know about this motif. Not what it is classified as — what everybody knows about it. Then give each one its OWN NAMED PART OF THE COSTUME, big enough to see in a thumbnail. Three separate features, three separate parts of the body, all three visible in the finished picture.
Worked examples of the level required — match this, and do it for whatever this student actually chose:
- CHEETAH → (1) the black tear-stripes: cut them as sunken channels into the temples of the open headpiece and continue them down the collar, never onto a photographed face. (2) fastest thing on land but only for thirty seconds: a burst actuator in each calf with a heat gauge on the wrist that visibly runs down. (3) the long tail it steers with at speed: a weighted counterbalance sash trailing from the belt, clearly a rudder and not decoration.
- OWL → (1) the flat facial disc that funnels sound: build twin dish-like acoustic forms around the collar and shoulders, framing but never covering a photographed face. (2) a head that turns almost all the way round: a visible geared collar ring while the photographed head angle itself stays fixed. (3) silent flight from fringed feathers: serrated soft trailing edges on every cape and panel edge.
- PUFFERFISH → (1) inflating to a ball: overlapping plates that visibly stand off on struts. (2) spines: deployable moulded studs, flush when down. (3) it is famously poisonous: hazard-marked ports at the wrists.
- TYPHOON → (1) the spiral seen from a satellite: the suit's entire seam layout spirals from a single point on the chest. (2) the calm eye at the centre: one clear, still, perfectly circular void at that point, the only quiet thing on the whole garment. (3) it drives rain sideways: every hem, sash and trailing edge is swept hard in one direction as if permanently in a crosswind.
- MAGNET → (1) two ends that do opposite things: the suit is split into two colours down the middle, red one side and blue the other, meeting at a hard line. (2) the horseshoe shape everyone draws: that arch is the shoulder yoke. (3) iron sticks to it: filings gathered in fine standing lines along the gauntlet and boot edges.
- OLD BOOK → (1) stacked page block: the layered hem and cuffs are a fanned block of thin leaves. (2) the sewn spine: a corded, stitched ridge running up the centre of the back. (3) gold leaf on the cover: fine gilt tooling worked into the chest plate border.
RULES FOR THIS SECTION: every one of the three must be a thing you could point at and name. None of them may be a badge, a logo, a printed picture or a small charm hung on the suit — they are built, structural, and made of the costume's own materials. And they must be spread across the body (head, torso, limbs, back), never all three clustered on the chest.
IF THE MOTIF IS NOT AN ANIMAL, the rule does not change: a force of nature, a machine, a plant, an object or a place all have three famous things about them too. Find them and build them the same way. What is banned is the lazy version — a picture of the thing printed on the chest, or a small model of it hung off the belt.

THE TEST THIS COSTUME MUST PASS
Show the finished picture to someone who was told nothing. Within two seconds they must say the name of the primary motif out loud. Then ask them WHY they said it — they must be able to point at three separate specific things on the costume. If they can only point at the colours, the three famous features have not been built and the design has failed.
If the honest answer is "some hero in a suit", the design has failed and must be pushed much further.
This is the single most common failure and the one this student cares about most. Do not produce a good-looking generic hero suit. Produce a suit that could only belong to THIS motif.

HOW FAR TO PUSH IT — copy the real films
Spider-Man: raised web filaments cross every panel of the suit and the palette carries the spider's red and blue. Black Panther: one continuous textured weave and silver claw lines carry the cat language to the boots. Batman: the scalloped cape edge and ear-line make the silhouette read bat from a hundred metres in the dark. ${state.photo ? 'For this poster, borrow that strength from the garment, crown, collar and silhouette — never by adding any of their masks over the student\'s locked face.' : 'Their masks also carry the motif because no reference face needs to remain uncovered.'}
None of them is a plain suit with an animal badge on the chest. Aim at that level and no lower.

CARRY IT ACROSS THE WHOLE GARMENT — all six of these, not one or two
1. SILHOUETTE — the outline itself must echo the motif: where it is bulky, where it tapers, how the shoulders and hips are shaped, what trails or projects from it.
2. ${state.photo ? 'OPEN HEADPIECE — the motif shapes the crown, back of the head, hair accessories and collar outside the preserved hairline and face boundary; it never becomes a mask. Detected eyewear is redesigned as hero eyewear and may take the motif into its whole frame shape, while its lenses stay clear and the photographed eyes stay unchanged beneath it.' : 'MASK / HEAD — the shape of the mask is taken from the motif\'s head, eyes or front end (abstracted into armour, never a costume animal head).'}
3. SURFACE — the motif's real texture, worked into the fabric and plating across the entire body: segmentation, scales, ridges, chambers, bands, translucency, grain. This is what makes the web seams work on Spider-Man.
4. PANEL LINES AND SEAMS — the motif's actual body divisions become the seam layout of the garment, everywhere, not just the chest.
5. PALETTE — the creature's or object's real colours and markings, used as the suit's colour blocking.
6. EQUIPMENT — the POWER line above, built as one real physical object whose workmanship follows its assigned quiz grade: hand-cut classroom prototype when ROUGH, clean only when FINISHED, machined only when SHOWCASE.

Take the LOOK as far as a real film costume designer would. Carry the motif across the whole garment — ${state.photo ? 'the open crown and collar silhouette' : 'the mask shape'}, the shoulder line, the surface texture, the palette, the boots — not into one small badge on the chest and never across a photographed face.
Make the POWER a real operable object: a canister, launcher, emitter, ratcheting plate, folded blade or sensor array. Preserve the complete function and silhouette at every score, but match its construction to the assigned zone — rough card/foam/offcut/tape for a miss, proper hardware for a correct answer, precision manufacture only for showcase. Place it where a person could actually reach it, and light it so the viewer notices it.
SIGNATURE BODY PARTS — build them as machines, never as costume parts.
If the motif is famous for a body part, that part MUST appear on the suit — but engineered, the way a film props department would build it:
- a scorpion's tail → an articulated, segmented armoured tail boom arching over the shoulder, with a visible injector tip and real joints
- a monkey's tail → a prehensile grappling cable coiled at the hip, with a weighted hook end, clearly built to swing and grab
- a pufferfish's spikes → short moulded spike studs rising from the armour segments, deployable-looking, not glued on
- wings → folded engineered wing panels stowed against the back; a stag's antlers → a swept antenna array on the helm
The part must look manufactured — metal, polymer, cable, hinges — and mounted where it works. What is BANNED is the costume-shop version: plush fabric tails, fake fur ears, cartoon animal heads worn as hats, glued-on feather wings, snout masks. The difference is engineering. A robotic scorpion tail is required; a stuffed toy tail is forbidden.
Also banned: a miniature volcano, lightning bolt, train or planet stuck onto the chest as a literal ornament. Forces of nature arrive as tailoring, texture, colour and working equipment instead.
THE HERO'S NAME IS NOT IN THIS PICTURE AND MUST NOT BE ILLUSTRATED. This hero has a short Korean name, and it is printed as text on the poster afterwards — it is not part of the image and it is not described anywhere on this page. Do not invent objects to match a name. In particular, never put screws, bolts, nuts, washers or hardware fasteners on a costume as a decorative motif unless the student's actual motif above is a machine or a tool: an electrical hero is about current, voltage, coils and sparks, and has nothing to do with nuts and bolts even though the two words sound the same in Korean.` : '',

${A.adult || A.mAge > 9 ? '' : `

- THE POSE IS PLAYFUL AND ENERGETIC — bouncing on the toes, one arm thrown up and the torso leaning eagerly into the scene.${state.photo ? ' The photographed face, gaze and head angle stay exact; all playfulness is below the neck.' : ' The child may be caught mid-laugh.'} Not a menacing braced combat stance.
- THE LIGHT LEANS BRIGHT, WARM AND CLEAN, with open shadows rather than moody darkness — as a default only. ★ THE CHOSEN SHOT ALWAYS BEATS THIS. Whatever scene, weather, time of day and lighting the shot section names is what gets built, at full strength. If they chose the power-activating shot, the blast is blindingly bright and throws hard coloured light and hard shadows, and that is correct. This line only tips the balance when nothing else has decided it.`}

${state.gender === 'girl'
? `THE CHEST AND STOMACH ARE ONE FLAT PLAIN PANEL. This is the thing this particular poster gets wrong most often, so build it first and build it literally: across the chest and the whole abdomen there is ONE smooth, flat or very gently domed surface, unbroken by any body shape. Think of a piece of equipment — a hard case, an aircraft fuselage panel, a shield face, a beetle's shell segment, a plain armoured breastplate. Its only detail is hardware: straight or angled seams, horizontal banding, a shoulder yoke across the top, a deep belt across the bottom, and fixings.
THE SURFACE OF THAT PANEL IS SMOOTH AND EMPTY. No ridge, groove, bulge or shading anywhere on it follows a human muscle. No blocks of abdominal muscle, no six-pack division, no central line down the stomach, no navel, no ribcage moulding, no chest muscle domes, no diagonal obliques. A Greek or Roman muscle cuirass is the wrong object for this hero — build the plain case instead. Any line on the torso that traces a muscle becomes a straight seam or goes.`

COVERAGE: torso, chest, midriff, shoulders, arms and legs to the boot, all covered, closed high neckline, opaque throughout. Nothing clinging, nothing bare, no waist taper, no hip shaping, no heels. The camera stays level with the face or on the equipment, never travelling along the body.`;

function leanGear(){
  const g = gearList();

  const gr = x => x.grade === 'ace' ? 'ace' : (x.ok === false ? 'miss' : 'ok');
  const lines = g.map(x=>{
    const k = gr(x);
    const material = `\n   MADE OF: ${gearMaterial(x)}.`;
    const tool = SIGNATURE_ITEM[x.id] ? `\n   WHAT IT DOES: it ${SIGNATURE_ITEM[x.id]}.` : '';
    const craft = k === 'ace'
      ? `\n   SHOWCASE CRAFT: ${gearAce(x)}${gearAceMaterial(x) ? ` AT THIS GRADE THE SUBSTANCE IS ${gearAceMaterial(x)} — never the raw classroom object.` : ''}`
      : k === 'miss'
      ? `\n   ROUGH CRAFT: ${gearRough(x)} THE MATERIAL STAYS ${MATERIAL_ROUGH_NOTE}`
      : '\n   FINISHED CRAFT: clean, purpose-cut and functional, with even thickness, straight edges and proper fittings but no showcase polish.';
    /* gearHome() 의 첫 문장은 '어디인지', 나머지는 '어떻게 붙는지'. 둘 다 살린다. */
    const home = gearHome(x) || x.slotEn || 'equipment';
    const dot = home.indexOf('.');
    const rest = dot > -1 ? home.slice(dot + 1).trim() : '';
    return `▸ ${home.split('.')[0]} · ${TAG[k]}\n   WHAT IT IS: ${gearVisual(x)}${rest ? '\n   ' + rest : ''}${material}${tool}${craft}`;
  }).join('\n');
  const key = [...new Set(g.map(gr))].map(k=>T[k]).join('\n');
  const rank = g.map(x=>({x, r: x.grade==='ace'?0 : x.ok===false?2 : 1})).sort((a,b)=>a.r-b.r)
                .map(o=>(gearHome(o.x)||o.x.slotEn||'').split('.')[0].replace(/^THE /,'').toLowerCase());
  return `THE FOUR THINGS THIS STUDENT BUILT — ALL FOUR ARE IN THE PICTURE, EACH AT THE PLACE ITS OWN ▸ LINE NAMES AND NOWHERE ELSE. If a description below names a different spot, the ▸ line wins.
