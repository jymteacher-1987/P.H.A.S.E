<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Science Hero Lab · P.H.A.S.E 가상 물리 실험실</title>
<style>
:root{
  --bg0:#070f18; --panel:#102636f2;
  --line:#26536b; --line2:#1c3d50;
  --ink:#e4eef7; --muted:#93aabb; --dim:#6d8698;
  --cyan:#4fd2f0; --lime:#a8e05f; --gold:#f2c661; --pink:#f0798e;
  font-family:Pretendard,"Noto Sans KR","Malgun Gothic",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
/* ── 한글 줄바꿈 ──────────────────────────────────────────────
   기본값(word-break:normal)은 한글을 글자 단위로 아무 데서나 자른다.
   '전자석이' 가 '전자' / '석이' 로 갈라지는 게 그것이다.
   keep-all 로 어절을 통째로 유지하고, 어절 하나가 화면보다 길 때만
   overflow-wrap 이 마지막 수단으로 끊게 한다.
   text-wrap:pretty/balance 는 마지막 줄에 한 어절만 남는 것을 막는다. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body,button,input,textarea,select{word-break:keep-all;overflow-wrap:anywhere;line-break:normal}
h1,h2,h3,h4,h5,.question,.brand,.exp-card .nm,.gear-get .g-txt span{text-wrap:balance}
p,li,.lead,.hint,.pick-note,.sim-tip,.verdict,.ability p,.brief-item p{text-wrap:pretty}
button,a,.chip,.answer,.exp-card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100vh;color:var(--ink);
  overflow-x:hidden;
  background:
    radial-gradient(ellipse at 10% -5%,#1b4560 0,transparent 45%),
    radial-gradient(ellipse at 95% 10%,#2a4034 0,transparent 38%),
    radial-gradient(ellipse at 50% 110%,#1a2f47 0,transparent 50%),
    linear-gradient(160deg,#060d15,#0c1e2c 55%,#0a1a16);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
  background-image:radial-gradient(circle,#5ab6d8 1px,transparent 1.4px);background-size:54px 54px}
.app{position:relative;max-width:1020px;width:100%;min-height:calc(100vh - 32px);margin:16px auto;
  border:1px solid #24505f;border-radius:28px;overflow:hidden;
  background:linear-gradient(180deg,#0e2433f2,#081722f7);box-shadow:0 30px 90px #01080ecc}
.top{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px clamp(14px,3vw,24px);
  border-bottom:1px solid var(--line2);background:#0a1c28ee;backdrop-filter:blur(14px)}
.brand{font-size:clamp(15px,3.4vw,18px);font-weight:900;letter-spacing:-.03em;
  display:flex;align-items:center;gap:10px;min-width:0}
.brand i{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border-radius:12px;font-style:normal;
  background:linear-gradient(135deg,var(--cyan),var(--lime));color:#052030;box-shadow:0 0 22px #4fd2f055}
.mode{font-size:12px;font-weight:800;color:#8fb3c6;border:1px solid var(--line2);border-radius:999px;
  padding:7px 12px;flex:0 0 auto;white-space:nowrap}
.progress{height:4px;background:#12303f}
.progress b{display:block;width:0;height:100%;transition:width .45s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,var(--cyan),var(--lime))}
.screen{padding:clamp(22px,4.5vw,46px);min-height:700px}

.kicker{color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(34px,6.4vw,62px);line-height:1;letter-spacing:-.055em;margin:14px 0 16px}
h2{font-size:clamp(25px,4.4vw,38px);letter-spacing:-.045em;margin:10px 0}
h3{font-size:19px;margin:0 0 10px;letter-spacing:-.02em}
.lead{max-width:740px;color:var(--muted);font-size:16px;line-height:1.72}
.panel{border:1px solid var(--line2);border-radius:22px;background:var(--panel);padding:22px;
  box-shadow:0 16px 44px #01080e3d}
.panel + .panel{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.field{margin:14px 0}
.field label{display:block;font-weight:800;margin-bottom:7px;font-size:14px}
.field input,.field textarea,.field select{width:100%;border:1px solid #2a5f78;border-radius:13px;
  padding:12px 13px;font:inherit;color:var(--ink);background:#081a26;outline:none;transition:.15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #4fd2f025}
.field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%234fd2f0' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.hint{color:var(--dim);font-size:12px;line-height:1.55;margin-top:6px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.motif-group{margin:12px 0 4px}
.motif-label{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;
  color:var(--cyan);background:#0d2a39;border:1px solid var(--line2);
  border-radius:6px;padding:3px 9px}
.motif-group .chips{margin:8px 0 0}
.chip{border:1px solid var(--line2);border-radius:999px;padding:9px 13px;background:#0f2836;color:var(--ink);
  font:inherit;font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--cyan);transform:translateY(-1px)}
.chip.on{border-color:var(--cyan);background:#16455c;color:#eafaff;box-shadow:0 0 0 3px #4fd2f01f}

.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.actions .spacer{flex:1}
.btn{border:0;min-height:50px;border-radius:15px;padding:12px 22px;font:inherit;font-weight:900;
  cursor:pointer;transition:.15s;font-size:15px}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.primary{color:#04202e;background:linear-gradient(135deg,var(--cyan),var(--lime));box-shadow:0 12px 30px #4fd2f036}
.secondary{color:var(--ink);background:#12303f;border:1px solid var(--line2)}
.ghost{color:var(--muted);background:transparent;border:1px solid var(--line2)}

/* ---- 카메라 ---- */
.camera{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:18px}
.preview{position:relative;min-height:440px;display:grid;place-items:center;overflow:hidden;
  border:2px solid #33768f;border-radius:22px;background:linear-gradient(150deg,#123243,#152a1f)}
.preview video,.preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preview video{transform:scaleX(-1)}
.placeholder{text-align:center;color:#6f8ea3;font-weight:700;line-height:1.7;z-index:1}
.placeholder strong{display:block;font-size:46px;margin-bottom:6px}
/* ★ inset 으로 잡으면 미리보기 상자의 가로세로비를 그대로 물려받는다.
   화면이 좁아져 .camera 가 1단이 되면(820px 이하) 타원이 홀쭉하게 길어져서
   사람 머리 모양이 아니게 된다 — 폭 360px 에서 가로:세로가 0.64 까지 갔다.
   그러면 아이들이 저 안에 맞추려고 뒤로 물러서서 얼굴이 작게 찍히고,
   얼굴 픽셀이 줄어드는 만큼 닮음도 줄어든다.
   높이만 정하고 aspect-ratio 가 가로를 계산하게 해서, 어느 화면에서도
   실제 머리 비율(머리카락 포함 가로:세로 ≒ 0.78)을 유지한다. */
.guide{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);
  height:78%;aspect-ratio:.78;
  border:2px dashed #ffffff59;border-radius:50% 50% 44% 44%;pointer-events:none}
.guide:after{content:"머리가 이 안에 꽉 차게";position:absolute;left:-70px;right:-70px;bottom:-28px;
  text-align:center;font-size:12.5px;font-weight:700;color:#ffffffc7;letter-spacing:-.02em;
  text-shadow:0 1px 3px #000a}
.hidden{display:none!important}

/* 카운트다운: 화면을 덮지 않고 아래쪽에만 표시 */
.count{position:absolute;left:0;right:0;bottom:20px;display:flex;flex-direction:column;
  align-items:center;gap:9px;pointer-events:none;z-index:3}
.count .num{display:grid;place-items:center;width:92px;height:92px;border-radius:50%;
  background:rgba(5,24,34,.42);border:3px solid rgba(255,255,255,.78);color:#fff;
  font-size:48px;font-weight:900;text-shadow:0 3px 16px #000a;animation:pop .68s ease-out}
.count .say{padding:7px 14px;border-radius:999px;background:rgba(5,24,34,.55);
  color:#eaf6ff;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
@keyframes pop{from{transform:scale(1.3);opacity:.25}to{transform:scale(1);opacity:1}}
.ring{position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 0 0 #4fd2f0;transition:box-shadow .25s}
.ring.on{box-shadow:inset 0 0 0 5px #4fd2f0, inset 0 0 46px #4fd2f02e}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flashOut .5s ease-out}
@keyframes flashOut{from{opacity:.9}to{opacity:0}}
.help li{margin:9px 0;color:var(--muted);line-height:1.5;font-size:14px}

/* ---- 실험실 ---- */
.station-nav{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0 4px}
.station-dot{flex:1;min-width:64px;height:5px;border-radius:99px;background:#173747;transition:.3s}
.station-dot.done{background:linear-gradient(90deg,var(--cyan),var(--lime))}
.station-dot.now{background:#2f6f8c}
.exp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:16px}
.exp-card{position:relative;text-align:left;border:1px solid var(--line2);border-radius:18px;padding:18px;
  background:linear-gradient(165deg,#102838,#0b1e2b);color:var(--ink);font:inherit;cursor:pointer;transition:.18s}
.exp-card:hover{border-color:var(--cyan);transform:translateY(-3px);box-shadow:0 14px 32px #4fd2f01f}
.exp-card.on{border-color:var(--cyan);box-shadow:0 0 0 3px #4fd2f01f}
.exp-card .ico{font-size:34px;display:block;margin-bottom:9px}
.exp-card .nm{font-weight:900;font-size:17px;letter-spacing:-.02em;margin-bottom:6px}
.exp-card .gt{color:var(--cyan);font-size:13px;font-weight:800;line-height:1.45}
.exp-card .ab{color:#bcd4e2;font-size:12.5px;margin-top:8px;line-height:1.55;
  padding-top:8px;border-top:1px dashed #1f4557}
.exp-card .mt{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.5}
/* '직접 정하기'는 다른 카드보다 글이 길어 혼자 튀어나온다. 한 줄을 통째로 써서 좌우 끝을 맞춘다. */
.exp-card.wide{grid-column:1 / -1}
.exp-card.wide .ico{display:inline-block;font-size:28px;margin:0 10px 0 0;vertical-align:-4px}
.exp-card.wide .nm{display:inline-block;margin-bottom:0}
.exp-card.wide .mt{margin-top:6px}
.pick-note{margin:14px 0 0;font-size:13.5px;line-height:1.65;color:var(--muted)}
.pick-note b{color:var(--gold)}
.pick-note.secret{margin-top:10px;border:1px dashed #7a6636;border-radius:14px;padding:12px 14px;
  background:#1c1809;color:#e0c469;font-size:13px}
.pick-note.secret b{color:#ffd764}

.proc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.matbox{border:1px solid var(--line2);border-radius:16px;background:#0a1e2b;padding:16px}
.matbox h4{margin:0 0 10px;font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.matbox ul,.matbox ol{margin:0;padding-left:19px}
.matbox li{margin:7px 0;color:var(--muted);font-size:14px;line-height:1.55}
.why{margin-top:14px;border:1px solid #2c5a3a;border-radius:16px;background:#0d2418;padding:16px}
.why h4{margin:0 0 8px;font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--lime);text-transform:uppercase}
.why p{margin:0;color:#c2ddc6;line-height:1.68;font-size:14.5px}
.safety{margin-top:10px;border:1px solid #6d4a24;border-radius:14px;background:#241a0d;padding:12px 14px;
  color:var(--gold);font-size:13px;line-height:1.55;font-weight:700}
/* ---- 확인 문제 : 제한시간 ---- */
.quiz-gate{margin-top:18px;border:1px solid #37687f;border-radius:18px;padding:18px 20px;
  background:linear-gradient(140deg,#0e2b3d,#0b2029)}
.quiz-gate h4{margin:0 0 8px;font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.quiz-gate p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.65}
.quiz-gate b{color:var(--ink)}
.quiz-gate .sec{color:var(--gold);font-weight:900}
.quiz-start{width:100%;border:none;border-radius:14px;padding:15px;cursor:pointer;font:inherit;
  font-weight:900;font-size:16px;color:#04151d;background:linear-gradient(135deg,var(--cyan),var(--lime))}
.quiz-start:hover{filter:brightness(1.08)}
.timer{margin:18px 0 12px}
.timer-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.timer-top span{font-size:12.5px;font-weight:800;color:var(--dim);letter-spacing:.04em}
.timer-num{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--lime);letter-spacing:-.03em}
.timer-num.warn{color:var(--gold)}
.timer-num.crit{color:var(--pink);animation:pulse .55s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.timer-rail{position:relative;height:11px;border-radius:99px;background:#12303f;overflow:hidden;border:1px solid #1d4557}
.timer-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--lime),var(--cyan));
  transition:width .1s linear}
.timer-fill.warn{background:linear-gradient(90deg,#f2c661,#f0a34f)}
.timer-fill.crit{background:linear-gradient(90deg,#f0607f,#f2544f)}
.timer-mark{position:absolute;top:-4px;left:50%;width:2px;height:19px;background:#eafaff8c;border-radius:2px}
.timer-legend{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--dim)}
.timer-legend b{color:var(--lime)}
.timer-legend b.dn{color:var(--gold)}
.timeup{margin-top:14px;border:1px solid #7a3a48;background:#2b141b;color:#ffd8e0;
  border-radius:15px;padding:13px 16px;font-size:14px;font-weight:800;line-height:1.6}
.question{font-size:clamp(19px,3vw,25px);line-height:1.4;letter-spacing:-.03em;font-weight:900;margin:20px 0 14px}
.answers{display:grid;gap:9px}
.answer{border:1px solid var(--line2);border-radius:15px;background:#0f2735;text-align:left;padding:15px;
  font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;transition:.15s}
.answer:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}
.answer.correct{border-color:var(--lime);background:#16351f;color:#e6ffd9}
.answer.wrong{border-color:var(--pink);background:#361a22;color:#ffdde3}
.answer:disabled{cursor:default}
.verdict{margin-top:14px;border-radius:15px;padding:15px 17px;line-height:1.65;font-size:14.5px;
  border:1px solid var(--line2);background:#0a1e2b;color:var(--muted)}
.verdict.ok{border-color:#3d7a4a;background:#0f2718;color:#cbe9cf}
.verdict b{color:var(--lime)}
.score{margin:2px 0 12px;padding:11px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;
  border:1px solid #7a6636;background:#241f10;color:#e7dcbc}
.score.full{border-color:#4a7a3a;background:#16240f;color:#cfe9bd}
.tag-fin{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:999px;
  font-size:11px;font-weight:800;vertical-align:middle;border:1px solid #4a7a3a;background:#16240f;color:#a8e05f}
.tag-fin.rough{border-color:#7a6636;background:#241f10;color:#e0c469}
.tag-fin.ace{border-color:#c9a227;background:#2a2208;color:#ffd764;box-shadow:0 0 0 1px #c9a2273d}
.gear-get.rough{border-color:#7a6636;background:#2a2413}
.gear-get.ace{border-color:#c9a227;background:linear-gradient(120deg,#2b2409,#123a30);box-shadow:0 0 22px #c9a2271f}
.gear-get.ace .g-txt b{color:#ffd764}
/* 실험이 곧 능력이 된다 — 얻은 장비가 무엇을 할 수 있는지 그 자리에서 보여 준다 */
.ability{margin-top:12px;border:1px solid #2f6076;border-radius:15px;background:#0a1e2b;padding:14px 16px}
.ability h5{margin:0 0 7px;font-size:11.5px;font-weight:900;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
.ability p{margin:0;font-size:14.5px;line-height:1.7;color:#d7e7f2}
.ability.ace{border-color:#c9a227;background:#1c1a09}
.ability.ace h5{color:#ffd764}
.ability.rough{border-color:#7a6636;background:#1f1a0c}
.ability.rough h5{color:#e0c469}
.g-note{display:block;margin-top:6px;font-size:12px;line-height:1.6;color:var(--mut)}
.gear-get{display:flex;align-items:center;gap:12px;margin-top:14px;padding:15px 17px;border-radius:15px;
  border:1px solid #37687f;background:linear-gradient(120deg,#0e2f42,#102a26)}
.gear-get .g-ico{font-size:28px}
.gear-get .g-txt b{display:block;color:var(--cyan);font-size:12px;letter-spacing:.12em;margin-bottom:3px}
.gear-get .g-txt span{font-weight:900;font-size:16px}

/* ---- 시뮬레이션 ---- */
.sim{margin-top:16px;border:1px solid var(--line2);border-radius:18px;background:#0a1e2b;padding:16px}
.sim-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sim-top h4{margin:0;font-size:13px;font-weight:900;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
.sim-read{font-size:14px;font-weight:900;color:var(--ink);text-align:right}
.sim canvas{width:100%;height:auto;display:block;border-radius:12px;background:#071620;border:1px solid #163445}
.sim-ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-top:12px}
.ctl.wide{grid-column:1/-1}
.ctl label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
.ctl label b{color:var(--cyan)}
.ctl input[type=range]{width:100%;accent-color:var(--cyan);background:transparent;cursor:pointer}
.ctl select{width:100%;border:1px solid #2a5f78;border-radius:11px;padding:9px 11px;font:inherit;
  font-size:14px;color:var(--ink);background:#081a26;outline:none}
.marks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:2px}
.sim-btn{width:100%;border:1px solid #2a6077;border-radius:11px;background:#12303f;color:var(--ink);
  font:inherit;font-weight:800;font-size:13.5px;padding:10px;cursor:pointer;transition:.15s}
.sim-btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.sim-btn.go{background:linear-gradient(135deg,#1d5b74,#2a6b52);color:#eafaff}
.sim-btn.tg.on{background:#16455c;border-color:var(--cyan);color:#eafaff}
.steps{display:flex;flex-wrap:wrap;gap:7px}
.steps .sim-btn{width:auto;flex:1 1 116px;font-size:12.5px;padding:9px 8px}
.steps .sim-btn.on{background:#16455c;border-color:var(--lime);color:#eafaff}
.steps .reset{flex:0 0 72px;color:var(--dim)}
/* 켜기/끄기처럼 둘 중 하나를 고르는 버튼. 지금 어느 쪽인지 한눈에 보이게 한다 */
.pair{display:flex;gap:7px}
.pair .sim-btn{width:auto;flex:1 1 0;font-size:13px;opacity:.55}
.pair .sim-btn.on{opacity:1;background:#16455c;border-color:var(--cyan);color:#eafaff;font-weight:800}
.pair .sim-btn.on::after{content:' ●';color:var(--lime);font-size:10px;vertical-align:middle}
.sim-tip{margin-top:11px;font-size:13.5px;line-height:1.6;color:var(--muted);min-height:22px}

.loadout{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.loadout .lo{border:1px solid #2f6076;border-radius:11px;background:#0d2331;padding:9px 12px;font-size:13px;font-weight:800}
.loadout .lo i{font-style:normal;color:var(--cyan);margin-right:6px}

/* ---- 결과 ---- */
.busy{display:grid;place-items:center;text-align:center;min-height:520px}
.loader{width:74px;height:74px;border:7px solid #143343;border-top-color:var(--cyan);border-right-color:var(--lime);
  border-radius:50%;animation:spin 1s linear infinite;margin-bottom:22px}
@keyframes spin{to{transform:rotate(360deg)}}
.result-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:18px}
.result-photo{border-radius:20px;overflow:hidden;border:1px solid var(--line2);background:#0a1e2b;
  min-height:300px;display:grid;place-items:center}
.result-photo img{width:100%;display:block}
/* ── 포스터 공개 연출 : 정답이 많을수록 화려하게 ── */
.reveal-wrap{position:relative}
.reveal-wrap .result-photo{animation:posterIn 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes posterIn{
  0%{transform:scale(.62) rotate(-2.5deg);opacity:0;filter:brightness(2.2) blur(10px)}
  55%{transform:scale(1.04) rotate(.6deg);opacity:1;filter:brightness(1.25) blur(0)}
  100%{transform:scale(1) rotate(0);filter:brightness(1)}}
.reveal-wrap.t3 .result-photo{box-shadow:0 0 0 2px #4fd2f066, 0 14px 60px #4fd2f033}
.reveal-wrap.t4 .result-photo{box-shadow:0 0 0 2px #f2c66199, 0 0 42px #f2c66155, 0 18px 80px #f2c66133;
  animation:posterIn 1.1s cubic-bezier(.16,1,.3,1) both, goldPulse 2.6s ease-in-out 1.2s infinite}
@keyframes goldPulse{0%,100%{box-shadow:0 0 0 2px #f2c66199,0 0 42px #f2c66155,0 18px 80px #f2c66133}
  50%{box-shadow:0 0 0 3px #f2c661cc,0 0 68px #f2c66188,0 18px 90px #f2c66144}}
/* 별·등급명·설명 세 가지를 한 줄에 욱여넣으면 좁은 칸에서 별이 두 줄로 갈라진다.
   그래서 세 줄로 나눠 쓰고, 별은 어떤 폭에서도 절대 줄바꿈되지 않게 못박는다. */
.tier-badge{display:block;margin:0 0 12px;padding:13px 16px;border-radius:14px;
  background:#12303f;border:1px solid var(--line2);animation:badgeIn .7s .5s cubic-bezier(.16,1,.3,1) both}
@keyframes badgeIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.tier-badge .stars{display:block;font-size:20px;letter-spacing:3px;line-height:1.15;
  white-space:nowrap;word-break:keep-all}
.tier-badge .stars .on{color:#f2c661;text-shadow:0 0 12px #f2c66188}
.tier-badge .stars .off{color:#2b4a5c}
.tier-badge .t-name{display:block;margin-top:7px;font-size:15px;line-height:1.35;letter-spacing:-.02em}
.tier-badge .t-note{display:block;margin-top:4px;font-size:12.5px;line-height:1.55;color:#f2c661}
.tier-badge.t5 .t-note{color:#ffd764}
.tier-badge.t4{background:linear-gradient(135deg,#2a2410,#1d3040);border-color:#f2c66166}
/* ── 전설 등급 ★5 ── */
.tier-badge.t5{background:linear-gradient(120deg,#3a2c07,#1a2f3d 55%,#3a2c07);border-color:#ffd76499;
  box-shadow:0 0 26px #ffd76433, inset 0 0 22px #ffd7641a}
.tier-badge.t5 .t-name{color:#ffe08a;font-size:16px}
.tier-badge.t5 .stars .on{color:#ffd764;text-shadow:0 0 16px #ffd764,0 0 30px #ffd76488}
.reveal-wrap.t5 .result-photo{box-shadow:0 0 0 3px #ffd764cc, 0 0 60px #ffd76477, 0 22px 110px #ffd76444;
  animation:posterIn 1.3s cubic-bezier(.16,1,.3,1) both, legendPulse 2.2s ease-in-out 1.3s infinite}
@keyframes legendPulse{0%,100%{box-shadow:0 0 0 3px #ffd764cc,0 0 60px #ffd76477,0 22px 110px #ffd76444}
  50%{box-shadow:0 0 0 4px #fff0b8,0 0 96px #ffd764bb,0 22px 130px #ffd76466}}
.score.legend{border-color:#c9a227;background:linear-gradient(120deg,#2b2208,#16240f);color:#ffe08a;
  font-size:14px;line-height:1.75}
.score.legend b{color:#fff0b8}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
@media print{.tier-badge,#confetti{display:none!important}.reveal-wrap .result-photo{animation:none;box-shadow:none}}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;
  padding:9px 14px;background:#12303f;color:var(--muted);font:inherit;font-weight:800;font-size:13px;cursor:pointer}
.prompt-box{display:none;margin-top:12px;border:1px dashed #34697f;border-radius:15px;padding:14px;
  background:#081a26;white-space:pre-wrap;color:#8fa9b9;line-height:1.6;font-size:12px;max-height:340px;overflow:auto}
.prompt-box.open{display:block}
.status{min-height:22px;margin-top:10px;color:var(--muted);line-height:1.6;font-size:14px}
.status.err{color:var(--pink)}
/* ---- 히어로 소개 ---- */
.brief-lead{margin:10px 0 14px;font-size:15.5px;line-height:1.75;color:var(--ink);font-weight:700;
  letter-spacing:-.01em}
.brief-list{display:grid;gap:8px}
.brief-item{border:1px solid var(--line2);border-left:3px solid #2f6076;border-radius:12px;
  background:#0a1e2b;padding:11px 14px}
.brief-item.ace{border-left-color:#c9a227;background:#191707}
.brief-item.miss{border-left-color:#7a6636;background:#1a1609}
.bi-head{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bi-ico{font-size:16px}
.bi-head b{font-size:14px;font-weight:900;color:var(--cyan);letter-spacing:-.02em}
.bi-tag{margin-left:auto;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;
  border:1px solid #3d7a4a;background:#0f2718;color:#a8e05f}
.bi-tag.ace{border-color:#c9a227;background:#2a2208;color:#ffd764}
.bi-tag.miss{border-color:#7a6636;background:#241f10;color:#e0c469}
.brief-item p{margin:0;font-size:13.8px;line-height:1.72;color:#c6dbe8}
.brief-close{margin:12px 0 0;font-size:14px;line-height:1.75;color:var(--muted)}
.ipad-note{margin-top:10px;border:1px solid #37687f;border-radius:14px;background:#0d2331;
  padding:12px 14px;font-size:13px;line-height:1.65;color:var(--muted)}
.ipad-note b{color:var(--cyan)}
.fixed-fmt{border:1px solid #37687f;border-radius:13px;padding:12px 14px;background:#0d2331;
  font-size:14px;font-weight:800;line-height:1.6;color:var(--ink)}
.fixed-fmt b{color:var(--cyan)}
.fixed-fmt span{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--dim)}
.export-tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.export-tools .btn{width:100%}
/* ---- 메일로 받기 ---- */
.mailbox{margin-top:14px;border:1px solid #37687f;border-radius:16px;background:#0d2331;padding:15px 16px}
.mailbox h4{margin:0 0 7px;font-size:14px;font-weight:900;letter-spacing:-.02em;color:var(--cyan)}
.mailbox p{margin:0 0 11px;font-size:13.5px;line-height:1.65;color:var(--muted)}
.mailbox p b{color:var(--ink)}
.mail-row{display:flex;gap:9px;align-items:stretch}
.mail-row input{flex:1 1 auto;min-width:0;border:1px solid #2a5f78;border-radius:13px;
  padding:12px 13px;font:inherit;color:var(--ink);background:#081a26;outline:none;transition:.15s}
.mail-row input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #4fd2f025}
.mail-row .btn{flex:0 0 auto;min-height:0;padding:12px 20px}
.mail-msg{min-height:0;margin-top:0;font-size:13.5px;line-height:1.6}
.mail-msg.on{margin-top:10px}
.mail-msg.ok{color:var(--lime)}
.mail-msg.err{color:var(--pink)}
.mail-msg.wait{color:var(--gold)}
.mail-msg b{color:inherit}
.opt{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:999px;vertical-align:middle;
  font-size:11px;font-weight:800;border:1px solid var(--line2);background:#12303f;color:var(--dim)}
.mail-msg .q{display:inline-block;margin-top:5px;font-size:12.5px;line-height:1.6;color:var(--dim)}
.mail-msg .q b{color:var(--muted)}
.mail-msg .q.warn{color:var(--gold)} .mail-msg .q.warn b{color:var(--gold)}
.mail-msg .q.crit{color:var(--pink)} .mail-msg .q.crit b{color:var(--pink)}
/* ---- 켜고 끄는 스위치 ---- */
.sw-head{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sw-sub{margin:5px 0 0;font-size:13px;line-height:1.6;color:var(--dim)}
.switch{flex:0 0 auto;width:56px;height:32px;border-radius:999px;border:1px solid var(--line2);
  background:#12303f;padding:0;cursor:pointer;position:relative;transition:.2s}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#5b7d90;transition:.2s cubic-bezier(.4,0,.2,1);display:block}
.switch.on{background:#16556f;border-color:var(--cyan);box-shadow:0 0 0 3px #4fd2f01f}
.switch.on i{left:29px;background:linear-gradient(135deg,var(--cyan),var(--lime))}
.sw-body{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
/* ---- 설치 안내 ----------------------------------------------
   ★ 클래스 이름은 반드시 su- 로 시작한다.
     예전에 .guide 로 지었다가 카메라 화면의 얼굴 가이드 원(.guide)과
     이름이 겹쳐서, 안내 전체가 position:absolute 로 떠 화면을 덮어 버렸다.
     짧고 흔한 이름(.k .tm .code)도 같은 이유로 쓰지 않는다.
   ★ 안에 따로 스크롤되는 상자를 만들지 않는다. 그냥 아래로 쭉 이어진다. */
.su{margin-top:16px;padding-top:16px;border-top:1px solid var(--line2)}
.su-title{font-size:15px;font-weight:900;letter-spacing:-.02em;color:var(--cyan);
  display:flex;align-items:center;gap:9px}
.su-time{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line2);background:#12303f;color:var(--dim)}
.su-lead{margin:9px 0 16px;font-size:13.5px;line-height:1.7;color:var(--muted)}
.su-step{display:flex;gap:12px;margin:0 0 18px}
.su-num{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-weight:900;color:#04202e;background:linear-gradient(135deg,var(--cyan),var(--lime))}
.su-body{flex:1 1 auto;min-width:0}
.su-body>b{display:block;font-size:14.5px;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
.su-body p{margin:5px 0 0;font-size:13.5px;line-height:1.7;color:var(--muted)}
.su-body p.su-warn{margin-top:8px;padding:9px 11px;border-radius:11px;
  border:1px solid #6d4a24;background:#241a0d;color:var(--gold);font-size:12.5px;font-weight:700}
.su-body a{color:var(--cyan)}
.su-code-inline{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  padding:1px 6px;border-radius:6px;background:#12303f;color:#9fd8ea}
.su-tbl{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:13px}
.su-tbl td{padding:8px 10px;border:1px solid var(--line2);color:var(--muted);line-height:1.6;vertical-align:top}
.su-tbl td:first-child{width:40%;color:var(--dim)}
.su-tbl b{color:var(--ink)}
/* 붙여 넣을 코드 — 세로 스크롤 없이 아래로 그대로 이어진다 */
.su-file{margin-top:10px;border:1px solid #2f6076;border-radius:14px;background:#081a26;overflow:hidden}
.su-file-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;background:#0d2331;border-bottom:1px solid var(--line2)}
.su-file-name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;
  font-weight:800;color:var(--cyan);min-width:0}
.su-file-name span{display:block;margin-top:2px;font-family:inherit;font-size:11.5px;
  font-weight:600;color:var(--dim);letter-spacing:0}
.su-file .btn{flex:0 0 auto;min-height:0;padding:9px 14px;font-size:13px}
.su-copied{font-size:12.5px;line-height:1.5}
.su-copied:not(:empty){padding:9px 13px 0}
.su-copied.ok{color:var(--lime)} .su-copied.err{color:var(--pink)}
.su-src{margin:0;padding:12px 13px;white-space:pre;overflow-x:auto;overflow-y:visible;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.55;
  color:#9db8c8;background:#061420;word-break:normal;overflow-wrap:normal;
  -webkit-overflow-scrolling:touch}
/* 참고 박스 */
.su-note{margin-top:12px;border:1px solid var(--line2);border-radius:14px;background:#0a1e2b;padding:14px 16px}
.su-note h5{margin:0 0 8px;font-size:13px;font-weight:900;letter-spacing:-.01em;color:var(--cyan)}
.su-note p{margin:7px 0 0;font-size:13px;line-height:1.75;color:var(--muted)}
.su-note ul{margin:8px 0 0;padding-left:19px}
.su-note li{margin:6px 0;font-size:13px;line-height:1.7;color:var(--muted)}
.su-note b{color:var(--ink)}
@media(max-width:600px){
  .sw-head{gap:10px}
  .su-step{gap:10px}
  .su-tbl td:first-child{width:44%}
  .su-file-top{flex-direction:column;align-items:stretch}
  .su-file .btn{width:100%}
  .su-src{font-size:11px}
}
@media(max-width:600px){
  .mail-row{flex-direction:column}
  .mail-row .btn{width:100%;min-height:50px}
}

/* ══ 화면 크기 ══════════════════════════════════════════════
   1080↓ 태블릿 세로 · 820↓ 좁은 태블릿/큰 폰 · 600↓ 폰 · 400↓ 작은 폰
   폰에서는 2열을 모두 1열로 내리고, 버튼은 줄바꿈 대신 꽉 찬 한 줄로 쌓는다.
   (줄바꿈으로 버튼 하나만 아래로 떨어지는 게 가장 지저분해 보이는 지점) */
@media(max-width:1080px){
  .app{max-width:none;margin:0;border-radius:0;border-left:0;border-right:0;min-height:100vh;
    min-height:100dvh}
  .screen{min-height:0}
}
@media(max-width:820px){
  .screen{padding:22px 16px}
  .grid2,.camera,.result-grid,.proc{grid-template-columns:1fr}
  .preview{min-height:min(62vh,380px)}
  .exp-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .busy{min-height:60vh}
  .result-photo{min-height:200px}
}
@media(max-width:600px){
  .screen{padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
  .panel{padding:16px;border-radius:18px}
  .lead{font-size:15px;line-height:1.68}
  /* 실험 카드·장면 카드는 폰에서 한 줄에 하나. 두 개씩 넣으면 글자가 잘게 접힌다 */
  .exp-grid{grid-template-columns:1fr}
  .exp-card{padding:15px;border-radius:15px}
  .exp-card.wide{grid-column:auto}
  /* 버튼: 가로로 흘려 보내지 말고 세로로 쌓는다 */
  .actions{flex-direction:column-reverse;align-items:stretch;gap:9px}
  .actions .spacer{display:none}
  .actions .btn{width:100%}
  .export-tools{grid-template-columns:1fr}
  .chip{padding:10px 14px;font-size:14.5px;min-height:42px;display:inline-flex;align-items:center}
  .btn{min-height:52px}
  .answer{padding:14px;font-size:15px}
  .answer:hover:not(:disabled){transform:none}
  .exp-card:hover,.chip:hover,.btn:hover,.sim-btn:hover{transform:none}
  .count .num{width:74px;height:74px;font-size:38px}
  .count{bottom:14px}
  .matbox,.why,.quiz-gate{padding:14px}
  .sim,.ability,.gear-get{padding:13px 14px}
  .sim-top,.timer-top{flex-wrap:wrap}
  .sim-read{text-align:left;width:100%}
  /* iOS 는 글자 16px 미만인 입력칸을 탭하면 화면을 확대해 버린다 */
  .field input,.field textarea,.field select,.ctl select{font-size:16px}
  .prompt-box{font-size:11.5px;max-height:260px}
  .brief-lead{font-size:15px}
  .steps .sim-btn{flex:1 1 100px}
  .steps .reset{flex:1 1 100%}
}
@media(max-width:400px){
  .screen{padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
  .chips{gap:6px}
  .chip{padding:9px 12px;font-size:14px}
  .sim-ctls{grid-template-columns:1fr}
  .station-dot{min-width:34px}
  .tier-badge{padding:11px 13px}
  .tier-badge .stars{font-size:18px;letter-spacing:2px}
}
/* 폰 가로 모드 — 세로 여백이 없으므로 위아래를 줄인다 */
@media(max-height:520px) and (orientation:landscape){
  .screen{padding-top:14px;padding-bottom:14px}
  .preview{min-height:74vh}
  .busy{min-height:auto}
  h1{margin:8px 0 10px}
}
@media print{
  body{background:#fff!important}
  .app{max-width:none;margin:0;border:0;box-shadow:none;background:#fff!important}
  .top,.progress,.result-grid>.panel,.kicker,.lead,h2{display:none!important}
  .screen{padding:0!important;min-height:0}
  .result-grid{display:block!important}
  .result-photo{border:0!important;background:#fff!important;min-height:0!important}
  .result-photo img{width:auto!important;max-width:100%!important;max-height:98vh!important;margin:auto!important}
}
</style>

<body>
<div class="app">
  <header class="top">
    <div class="brand"><i>⚛</i>Science Hero Lab</div>
    <div class="mode">P.H.A.S.E 가상 물리 실험실</div>
  </header>
  <div class="progress"><b id="progress"></b></div>
  <main id="screen" class="screen"></main>
</div>

<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   1. 설정
   ══════════════════════════════════════════════════════════════ */

/* 아래 모델 이름은 전부 OpenRouter 모델 목록에서 실제로 확인한 것이다.
   (예전 목록의 openai/gpt-image-2 는 OpenRouter에 없는 이름이라 뺐다 — 그대로 두면 404 로 실패한다.)
   effort:true 는 reasoning_effort 를 받는 모델 — 사고력을 최대로 올려서 호출한다.
   두 모델 모두 학생 사진을 읽어야 하므로, 이미지 입력을 받는 것만 넣었다. */
/* name 은 짧게 — 드롭다운 한 줄에 들어가야 한다.
   예전에는 name 에 설명까지 넣고 뒤에 가격을 또 붙여서
   "GPT-5.6 Luna — 가성비 (기본) · 장당 약 4원" 이 되는 바람에
   칸을 넘쳐 잘렸고, 정작 모델 이름이 안 보였다. 설명은 아래 hint 에 적는다. */
/* 가격은 히어로 1명당 어림값이다 — 프롬프트 4천 토큰 + 출력 1천5백 토큰, 1450원/$ 기준으로
   OpenRouter 의 실제 단가에 넣어 계산했다. 사고력을 높인 Pro 계열은 속으로 생각을 더 하므로

/* ar = 생성 비율, w/h = 최종 합성 캔버스 픽셀 */
/* w:h 는 실제 인화 규격의 가로세로비와 정확히 맞춘다.
   ar 은 이미지 모델에 넘길 생성 비율이라 정해진 값 중에서만 고를 수 있으므로,
   실물비에 가장 가까운 것을 쓰고 차이가 크면 결과 화면에서 몇 % 잘리는지 알려 준다. */
/* 인화는 캐논 셀피 CP1500 으로만 한다. 그래서 이 기기가 실제로 먹는 용지만 남긴다.
   CP1500 은 300×300dpi 승화형이므로, 픽셀은 전부 '실물 mm × 300dpi ÷ 25.4' 로 잡는다.
   (규격 출처: 캐논 CP1500 사용설명서 사양 — 절취선을 뗀 뒤 크기 기준) */
/* ══════════════════════════════════════════════════════════════
   메일로 받기 — 구글 Apps Script 웹앱 주소
   ──────────────────────────────────────────────────────────────
   ★ 선생님이 딱 한 줄만 고치면 됩니다.
   Apps Script 에서 '배포 > 새 배포 > 웹 앱' 으로 얻은 /exec 로 끝나는 주소를
   아래 따옴표 안에 붙여 넣으세요. 비워 두면 '메일로 받기' 칸이 아예 안 보입니다.
   예) const MAIL_ENDPOINT = 'https://script.google.com/macros/s/AKfy.....gW/exec';
   ══════════════════════════════════════════════════════════════ */
const MAIL_ENDPOINT = '';

/* 주소를 정하는 순서: 주소창(?mail=) > 이 브라우저에 저장된 값 > 파일에 박아 둔 값.
   파일을 못 고치는 선생님도 입장 화면에서 넣고 쓸 수 있게 하기 위함이다.
   웹앱 주소는 비밀이 아니라서 localStorage 에 남겨도 된다 (API 키와 다르다). */
const MAIL_KEY = 'shl_mail_endpoint';
const MAIL_ON_KEY = 'shl_mail_on';
/* 기능 자체를 켜고 끄는 스위치. 꺼 두면 입장 화면에도, 결과 화면에도 아무것도 안 나온다. */
function mailOn(){
  try{
    const v = localStorage.getItem(MAIL_ON_KEY);
    if(v !== null) return v === '1';
  }catch(_){}
  return !!String(MAIL_ENDPOINT||'').trim();   // 파일에 주소를 박아 두었으면 기본으로 켠다
}
function setMailOn(on){
  try{ localStorage.setItem(MAIL_ON_KEY, on ? '1' : '0'); }catch(_){}
}
/* 결과 화면에 메일 칸을 띄울지 — 켜져 있고 주소도 있어야 한다 */
const mailReady = () => mailOn() && !!mailEndpoint();

function mailEndpoint(){
  try{
    const q = new URLSearchParams(location.search).get('mail');
    if(q && /^https:\/\/script\.google\.com\//.test(q)) return q.trim();
  }catch(_){}
  try{
    const v = sessionStorage.getItem(MAIL_KEY);
    if(v) return String(v).trim();
  }catch(_){}
  return String(MAIL_ENDPOINT||'').trim();
}
/* ★ 앱을 닫았다 다시 열면 지워진다(sessionStorage). API 키와 같은 방식이다.
   교실 공용 컴퓨터에 주소가 계속 남아 있으면 곤란하고,
   "다시 켜면 처음 상태" 가 예상과 맞기 때문이다.
   반 전체에 미리 심어 두고 싶으면 파일 위쪽 MAIL_ENDPOINT 에 박아 두면 되고,
   그것은 파일에 들어 있으므로 다시 켜도 그대로 남는다. */
function setMailEndpoint(url){
  try{
    if(url) sessionStorage.setItem(MAIL_KEY, String(url).trim());
    else sessionStorage.removeItem(MAIL_KEY);
  }catch(_){}
  /* 예전 판에서 localStorage 에 저장해 두었던 것이 남아 있으면 지운다.
     안 지우면 브라우저를 닫아도 계속 되살아난다. */
  try{ localStorage.removeItem(MAIL_KEY); }catch(_){}
}
/* 앱이 뜰 때 예전 방식으로 남아 있던 주소를 한 번 청소한다 */
try{ localStorage.removeItem(MAIL_KEY); }catch(_){}

/* Apps Script 웹앱으로 보내기.
   ★ Content-Type 을 text/plain 으로 둔다. application/json 으로 두면 브라우저가
     먼저 OPTIONS(사전 요청)를 보내는데 Apps Script 는 그것을 처리하지 못해 전부 막힌다.
     text/plain 은 사전 요청이 없는 형식이라 파일(file://)에서 열어도 그대로 통과한다.
     서버에서는 e.postData.contents 를 JSON.parse 하면 된다. */
async function mailPost(payload, ms){
  const url = mailEndpoint();
  if(!url) throw new Error('NO_ENDPOINT');
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), ms || 120000);
  try{
    const res = await fetch(url, {
      method:'POST', redirect:'follow', signal:ctl.signal,
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const txt = await res.text();
    try{ return JSON.parse(txt); }
    catch(_){
      /* 권한 설정이 잘못되면 JSON 대신 구글 로그인 페이지가 돌아온다 */
      if(/accounts\.google\.com|로그인|Sign in/i.test(txt))
        throw new Error('NEEDS_LOGIN');
      throw new Error('BAD_REPLY');
    }
  } finally { clearTimeout(timer); }
}
/* 여러 대에서 동시에 눌러도 확실히 가게 만드는 부분.
   ① 요청마다 고유번호(jobId)를 붙인다. 통신이 끊겨 다시 보내더라도 서버가
      같은 번호를 알아보고 메일을 두 번 보내지 않는다.
   ② 실패하면 조금씩 더 기다렸다가 세 번까지 자동으로 다시 보낸다.
      기다리는 시간에 임의값을 섞어 네 대가 동시에 재시도하는 것을 흩어 준다. */
function newJobId(){
  try{ if(crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(_){}
  return 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
async function mailPostRetry(payload, onTry){
  let last;
  for(let i = 0; i < 3; i++){
    if(i > 0){
      const wait = [0, 2500, 6000][i] + Math.floor(Math.random() * 1500);
      if(onTry) onTry(i + 1, Math.round(wait / 1000));
      await new Promise(r => setTimeout(r, wait));
    }
    try{
      const r = await mailPost(payload);
      /* 서버가 '다시 해 보라'고 한 경우에만 재시도한다.
         주소가 틀렸다거나 할당량이 끝난 경우는 다시 해도 소용없으므로 그대로 돌려준다. */
      if(r && r.ok) return r;
      if(r && r.retry){ last = new Error(r.error || 'RETRY'); continue; }
      return r;
    }catch(err){
      last = err;
      const m = String(err && err.message || err);
      if(m === 'NO_ENDPOINT' || m === 'NEEDS_LOGIN') throw err;   // 다시 해도 같다
    }
  }
  throw last || new Error('BAD_REPLY');
}

function mailErrorText(err){
  const m = String((err && err.message) || err);
  if(m === 'NO_ENDPOINT') return '메일 서버 주소가 설정되지 않았습니다.';
  if(m === 'NEEDS_LOGIN')
    return '구글이 로그인을 요구했습니다. Apps Script 배포 설정에서 "액세스 권한"을 「모든 사용자」로 바꾸고 다시 배포하세요.';
  if(m === 'BAD_REPLY') return '서버가 이상한 응답을 보냈습니다. 주소가 /exec 로 끝나는지, 새로 배포했는지 확인하세요.';
  if(/abort/i.test(m)) return '시간이 너무 오래 걸려 중단했습니다. 인터넷 상태를 확인하고 다시 시도해 주세요.';
  return '연결하지 못했습니다. 인터넷 연결과 웹앱 주소를 확인해 주세요. (' + m + ')';
}
const emailOk = s => /^[^\s@,]+@[^\s@,]+\.[^\s@,]{2,}$/.test(String(s||'').trim());

/* ══════════════════════════════════════════════════════════════
   메일 보내기 설치 안내 — 앱 안에서 접었다 폈다 하는 부분.
   Apps Script 에 붙여 넣을 파일 두 개를 통째로 품고 있어서,
   따로 폴더를 열지 않고 여기서 복사만 하면 된다.
   ══════════════════════════════════════════════════════════════ */
const GAS_CODE  = "/**\n * P.H.A.S.E 가상 물리 실험실 — 히어로 포스터 메일 보내기\n * ============================================================\n * 하는 일 세 가지뿐입니다.\n *   1) 학생이 적은 메일 주소를 구글 시트에 한 줄 기록\n *   2) 완성된 포스터 PNG 를 원본 그대로 첨부해서 그 주소로 발송\n *   3) (선택) 포스터를 구글 드라이브 특정 폴더에 저장\n *\n * 학생은 구글 로그인을 하지 않습니다. 메일은 이 스크립트를 배포한\n * 선생님 계정에서 나갑니다. 선생님도 처음 한 번만 권한을 허용하면 끝입니다.\n *\n * 설치 순서는 히어로 앱 첫 화면의 「처음 한 번만 하는 설정」 을 펼치면\n * 복사 버튼과 함께 단계별로 나옵니다. 그대로 따라 하면 됩니다.\n */\n\n\n/* ══════════════════════════════════════════════════════════════\n   ① 설정 — 여기만 보면 됩니다\n   ══════════════════════════════════════════════════════════════ */\nvar CFG = {\n\n  /* 기록을 남길 시트. 비워 두면 이 스크립트가 붙어 있는 스프레드시트를 쓰고,\n     붙어 있는 것이 없으면 새로 하나 만들어 씁니다(주소는 실행 기록에 남습니다). */\n  SHEET_ID:   '',\n  SHEET_NAME: '메일기록',\n\n  /* 포스터를 구글 드라이브에도 남길지.\n     false 면 아무것도 저장하지 않고 메일로만 보냅니다(일회성).\n     true 로 바꾸려면 아래 폴더 ID 도 함께 채우세요. */\n  SAVE_TO_DRIVE:   false,\n  DRIVE_FOLDER_ID: '',          // 드라이브 폴더 주소 끝의 긴 문자열\n\n  /* 메일 제목·본문. {heroName} {student} {tagline} 자리에 값이 들어갑니다. */\n  SUBJECT: '{heroName} · 나의 과학 히어로 포스터',\n  FROM_NAME: 'P.H.A.S.E 가상 물리 실험실',\n\n  /* 첨부 최대 크기(MB). Gmail 한도가 25MB 입니다. */\n  MAX_MB: 24,\n\n  /* 아무나 호출하지 못하게 막고 싶을 때만 씁니다.\n     여기에 아무 문자열이나 넣고, HTML 쪽 MAIL_KEY_SHARED 에 같은 값을 넣으면 됩니다.\n     비워 두면 검사하지 않습니다(수업용으로는 비워 두어도 괜찮습니다). */\n  SHARED_KEY: ''\n};\n\n\n/* ══════════════════════════════════════════════════════════════\n   ② 웹앱 입구\n   ══════════════════════════════════════════════════════════════ */\n\n/** 브라우저로 주소를 열었을 때 — 상태 확인 / 시험 발송 화면 */\nfunction doGet() {\n  return HtmlService.createTemplateFromFile('index')\n    .evaluate()\n    .setTitle('히어로 포스터 메일 보내기 · 상태 확인')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/**\n * 히어로 앱이 부르는 곳.\n * 앱은 Content-Type 을 text/plain 으로 보냅니다. 그래야 브라우저가 사전 요청\n * (OPTIONS) 을 만들지 않습니다 — Apps Script 는 OPTIONS 를 처리하지 못해서,\n * application/json 으로 보내면 파일에서 연 페이지는 전부 막힙니다.\n */\nfunction doPost(e) {\n  try {\n    if (!e || !e.postData || !e.postData.contents) return reply({ ok: false, error: '보낸 내용이 비어 있습니다.' });\n\n    var req = JSON.parse(e.postData.contents);\n\n    if (CFG.SHARED_KEY && String(req.key || '') !== CFG.SHARED_KEY)\n      return reply({ ok: false, error: '열쇠가 맞지 않습니다.' });\n\n    if (req.action === 'ping') return reply(ping_());\n    if (req.action === 'send') return reply(handleSend_(req));\n\n    return reply({ ok: false, error: '알 수 없는 요청입니다: ' + req.action });\n\n  } catch (err) {\n    return reply({ ok: false, error: String(err && err.message || err) });\n  }\n}\n\n/** 응답. Apps Script 의 ContentService 응답에는 CORS 허용 헤더가 붙어 있어서\n *  file:// 로 연 페이지에서도 그대로 읽을 수 있습니다. */\nfunction reply(obj) {\n  return ContentService\n    .createTextOutput(JSON.stringify(obj))\n    .setMimeType(ContentService.MimeType.JSON);\n}\n\n\n/* ══════════════════════════════════════════════════════════════\n   ③ 연결 확인\n   ══════════════════════════════════════════════════════════════ */\nfunction ping_() {\n  var quota = null;\n  try { quota = MailApp.getRemainingDailyQuota(); } catch (err) {}\n\n  var sheetOk = false, sheetErr = '';\n  try { getSheet_(); sheetOk = true; } catch (err) { sheetErr = String(err && err.message || err); }\n\n  var driveOk = !CFG.SAVE_TO_DRIVE, driveErr = '';\n  if (CFG.SAVE_TO_DRIVE) {\n    try { getFolder_(); driveOk = true; } catch (err) { driveErr = String(err && err.message || err); }\n  }\n\n  var sweeper = false;\n  try {\n    var ts = ScriptApp.getProjectTriggers();\n    for (var i = 0; i < ts.length; i++)\n      if (ts[i].getHandlerFunction() === '대기줄_비우기') { sweeper = true; break; }\n  } catch (err) {}\n\n  return {\n    ok: true,\n    sender: Session.getEffectiveUser().getEmail(),\n    quota: quota,\n    sheet: sheetOk,\n    sheetError: sheetErr,\n    saveToDrive: CFG.SAVE_TO_DRIVE,\n    drive: driveOk,\n    driveError: driveErr,\n    pending: pendingCount_(),\n    sweeper: sweeper,\n    version: 'v1.1'\n  };\n}\n\n\n/* ══════════════════════════════════════════════════════════════\n   ④ 메일 보내기\n   ══════════════════════════════════════════════════════════════ */\nfunction handleSend_(req) {\n  var to = String(req.to || '').trim();\n  if (!isEmail_(to)) return { ok: false, error: '메일 주소 형태가 아닙니다: ' + to };\n\n  /* ── 같은 요청이 두 번 오는 것을 막는다 ────────────────────────\n     여러 대에서 동시에 눌러도 서로 부딪히지 않지만, 한 대에서 통신이\n     끊겨 자동으로 다시 보낼 때는 같은 메일이 두 번 갈 수 있다.\n     그래서 앱이 요청마다 붙여 보내는 jobId 를 캐시에 적어 두고,\n     이미 처리한 것이면 메일을 다시 보내지 않고 결과만 돌려준다.\n     캐시는 잠금이 필요 없고 아주 빨라서 동시 접속에 강하다. */\n  var jobKey = req.jobId ? 'job:' + String(req.jobId).slice(0, 80) : '';\n  if (jobKey) {\n    var prev = jobGet_(jobKey);\n    if (prev === 'sending')\n      return { ok: false, retry: true, error: '같은 요청을 처리하는 중입니다. 잠시 뒤 다시 눌러 주세요.' };\n    if (prev) {\n      try {\n        var done = JSON.parse(prev);\n        done.duplicate = true;\n        return done;                       // 이미 보냈다 — 두 번 보내지 않는다\n      } catch (e) {}\n    }\n    jobPut_(jobKey, 'sending', 300);       // 5분 동안 같은 요청을 막는다\n  }\n\n  var out = sendOnce_(req, to);\n\n  if (jobKey) {\n    if (out.ok) jobPut_(jobKey, JSON.stringify(out), 21600);      // 6시간 기억\n    else jobDel_(jobKey);                                          // 실패면 다시 시도할 수 있게 푼다\n  }\n  return out;\n}\n\n/* 중복 발송을 막는 기억 장치.\n   캐시가 빠르고 알아서 지워져서 기본으로 쓰지만, 어떤 이유로든 캐시를 못 쓰면\n   중복 방지가 통째로 풀려 같은 메일이 두 번 나갈 수 있다. 그래서 저장소를 예비로 둔다. */\nfunction jobGet_(k) {\n  try { var v = CacheService.getScriptCache().get(k); if (v) return v; } catch (e) {}\n  try {\n    var raw = PropertiesService.getScriptProperties().getProperty(k);\n    if (!raw) return null;\n    var o = JSON.parse(raw);\n    if (o.exp && o.exp < Date.now()) { jobDel_(k); return null; }\n    return o.v;\n  } catch (e) { return null; }\n}\nfunction jobPut_(k, v, sec) {\n  try { CacheService.getScriptCache().put(k, v, sec); } catch (e) {}\n  try {\n    PropertiesService.getScriptProperties()\n      .setProperty(k, JSON.stringify({ v: v, exp: Date.now() + sec * 1000 }));\n  } catch (e) {}\n}\nfunction jobDel_(k) {\n  try { CacheService.getScriptCache().remove(k); } catch (e) {}\n  try { PropertiesService.getScriptProperties().deleteProperty(k); } catch (e) {}\n}\n\nfunction sendOnce_(req, to) {\n  var b64 = String(req.data || '');\n  if (!b64) return { ok: false, error: '첨부할 사진이 비어 있습니다.' };\n\n  /* 앞에 data:image/png;base64, 가 붙어 와도 받아 준다 */\n  var m = /^data:([^;]+);base64,(.*)$/.exec(b64);\n  var mime = String(req.mime || 'image/png');\n  if (m) { mime = m[1]; b64 = m[2]; }\n  b64 = b64.replace(/\\s/g, '');\n\n  var mb = (b64.length * 0.75) / 1048576;\n  if (mb > CFG.MAX_MB)\n    return { ok: false, error: '사진이 너무 큽니다 (약 ' + mb.toFixed(1) + 'MB). 최대 ' + CFG.MAX_MB + 'MB.' };\n\n  var quota = MailApp.getRemainingDailyQuota();\n  if (quota <= 0)\n    return { ok: false, quotaLeft: 0,\n             error: '오늘 보낼 수 있는 메일을 모두 썼습니다. 아래 「⬇ 이미지 저장」으로 받아 가세요. 한도는 내일 다시 채워집니다.' };\n\n  var filename = sanitize_(req.filename || 'hero-poster.png');\n  var heroName = String(req.heroName || '').trim() || '과학 히어로';\n  var student  = String(req.student  || '').trim();\n  var tagline  = String(req.tagline  || '').trim();\n\n  /* ① 첨부 만들기 — 다시 압축하거나 크기를 줄이지 않는다. 받은 바이트 그대로. */\n  var blob;\n  try {\n    blob = Utilities.newBlob(Utilities.base64Decode(b64), mime, filename);\n  } catch (err) {\n    return { ok: false, error: '사진을 읽지 못했습니다. 다시 시도해 주세요.' };\n  }\n\n  /* ② 시트에 메일 주소 기록 — 자세한 것은 logEmail_ 를 보세요.\n        기록에 실패해도 메일은 그냥 보냅니다. 학생이 결과를 못 받는 쪽이 훨씬 나쁩니다. */\n  var log = logEmail_(to);\n  var logged = log.logged, logErr = log.error;\n\n  /* ③ (선택) 드라이브 저장 */\n  var driveUrl = '';\n  if (CFG.SAVE_TO_DRIVE) {\n    try { driveUrl = getFolder_().createFile(blob).getUrl(); }\n    catch (err) { logErr = (logErr ? logErr + ' / ' : '') + '드라이브 저장 실패: ' + String(err && err.message || err); }\n  }\n\n  /* ④ 발송 */\n  var subject = CFG.SUBJECT\n    .replace('{heroName}', heroName)\n    .replace('{student}',  student)\n    .replace('{tagline}',  tagline);\n\n  /* 여러 대가 몰리면 구글 쪽이 일시적으로 밀어낼 때가 있다.\n     그럴 때 한 번 실패했다고 포기하면 학생이 결과를 못 받으므로 두 번까지 다시 해 본다.\n     정말 안 되는 오류(주소 오류 등)는 두 번째에도 같은 오류가 나므로 손해가 없다. */\n  /* 할당량을 발송 직전·직후에 재 둔다.\n     \"1통 보냈는데 15통이 줄었다\" 같은 일이 생겼을 때, 우리 코드가 여러 번 보낸 것인지\n     구글이 그렇게 세는 것인지를 숫자로 가릴 수 있어야 한다. */\n  var qBefore = MailApp.getRemainingDailyQuota();\n  var attempts = 0;\n\n  var mailErr = '';\n  for (var a = 0; a < 2; a++) {\n    attempts++;\n    try {\n      MailApp.sendEmail({\n        to: to,\n        subject: subject,\n        name: CFG.FROM_NAME,\n        body: textBody_(heroName, tagline, student, filename),\n        htmlBody: htmlBody_(heroName, tagline, student, filename),\n        attachments: [blob]\n      });\n      mailErr = '';\n      break;\n    } catch (err) {\n      mailErr = String(err && err.message || err);\n      if (a === 0) Utilities.sleep(1200);\n    }\n  }\n  if (mailErr) return { ok: false, retry: true, error: '메일 발송 실패: ' + mailErr };\n\n  var qAfter = MailApp.getRemainingDailyQuota();\n\n  return {\n    ok: true,\n    to: to,\n    sizeMB: Number(mb.toFixed(2)),\n    logged: logged,\n    note: logErr,\n    driveUrl: driveUrl,\n    quotaLeft: qAfter,\n    /* 진단용 — 이 한 번의 발송이 할당량을 실제로 얼마나 먹었는가 */\n    quotaBefore: qBefore,\n    quotaUsed: qBefore - qAfter,\n    attempts: attempts\n  };\n}\n\n\n/* ══════════════════════════════════════════════════════════════\n   ⑤ 메일 본문\n   ══════════════════════════════════════════════════════════════ */\nfunction textBody_(heroName, tagline, student, filename) {\n  return [\n    heroName + ' 포스터가 도착했습니다.',\n    '',\n    tagline ? '“' + tagline + '”' : '',\n    student ? '만든 사람: ' + student : '',\n    '',\n    '첨부된 ' + filename + ' 파일이 원본입니다. 줄이지 않고 그대로 보냈으니',\n    '인쇄해도 화질이 떨어지지 않습니다. (100×148mm 포스트카드, 300dpi 기준)',\n    '',\n    '— P.H.A.S.E 가상 물리 실험실'\n  ].filter(function (s) { return s !== ''; }).join('\\n');\n}\n\nfunction htmlBody_(heroName, tagline, student, filename) {\n  var esc = function (s) {\n    return String(s == null ? '' : s).replace(/[&<>\"]/g, function (c) {\n      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' })[c];\n    });\n  };\n  return '' +\n  '<div style=\"font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;max-width:520px;' +\n  'margin:0 auto;padding:26px 22px;color:#12222c;line-height:1.7\">' +\n    '<div style=\"font-size:12px;font-weight:800;letter-spacing:.14em;color:#2b7fa0\">SCIENCE HERO LAB<\/div>' +\n    '<h1 style=\"font-size:26px;margin:8px 0 4px;letter-spacing:-.03em\">' + esc(heroName) + '<\/h1>' +\n    (tagline ? '<p style=\"margin:0 0 14px;color:#5b7180;font-size:15px\">' + esc(tagline) + '<\/p>' : '') +\n    (student ? '<p style=\"margin:0 0 18px;color:#5b7180;font-size:14px\">만든 사람 · ' + esc(student) + '<\/p>' : '') +\n    '<div style=\"border:1px solid #d7e3ea;border-radius:14px;background:#f4f9fc;padding:15px 17px;font-size:14px\">' +\n      '첨부된 <b>' + esc(filename) + '<\/b> 이 원본 파일입니다.<br>' +\n      '줄이지 않고 그대로 보냈으니 인쇄해도 화질이 떨어지지 않습니다.<br>' +\n      '<span style=\"color:#6b818f\">100×148mm 포스트카드 · 300dpi 기준<\/span>' +\n    '<\/div>' +\n    '<p style=\"margin:20px 0 0;font-size:12.5px;color:#8798a3\">P.H.A.S.E 가상 물리 실험실<\/p>' +\n  '<\/div>';\n}\n\n\n/* ══════════════════════════════════════════════════════════════\n   ⑥ 시트 · 드라이브 · 잡일\n   ══════════════════════════════════════════════════════════════ */\n/* ══════════════════════════════════════════════════════════════\n   시트에 한 줄 적기 — 여러 대가 동시에 눌러도 줄이 겹치지 않게\n   ──────────────────────────────────────────────────────────────\n   왜 이렇게까지 하는가\n\n   컴퓨터 네 대에서 동시에 「보내기」를 누르면, 네 개의 실행이 같은 시트의\n   '첫 번째 빈 줄'을 동시에 찾습니다. 아무 장치가 없으면 넷이 모두 같은 줄을\n   가리켜서 서로 덮어쓰고, 결과적으로 한 줄만 남습니다.\n\n   그래서 두 겹으로 막습니다.\n\n   ① 잠금(LockService)\n      시트에 쓰는 그 순간만 잠급니다. 잠금을 쥔 실행 하나만 줄을 찾고 적으므로\n      덮어쓰기가 원천적으로 불가능합니다. 한 줄 적는 데 0.3초쯤이라, 네 대가\n      몰려도 마지막 사람이 1초 남짓 기다리는 정도입니다.\n      ★ 잠금은 '시트에 쓰는 동안'에만 겁니다. 메일 발송(2~5초)까지 묶으면\n        네 대가 순서를 기다리다 전부 시간 초과가 납니다.\n\n   ② 대기줄(그래도 잠금을 못 잡았을 때)\n      10초를 기다려도 잠금을 못 잡으면 — 거의 없는 일이지만 — 포기하지 않고\n      스크립트 저장소에 'pend:<고유번호>' 라는 자기만의 칸을 하나 만들어\n      거기에 적어 둡니다. 칸 이름이 매번 다르므로 이건 절대 부딪히지 않습니다.\n      그리고 다음 사람이 보낼 때, 또는 5분마다 도는 자동 정리가\n      대기줄을 시트로 옮깁니다. 결국 한 줄도 사라지지 않습니다.\n   ══════════════════════════════════════════════════════════════ */\nfunction logEmail_(to) {\n  var lock = LockService.getScriptLock();\n  var got = false;\n  try { got = lock.tryLock(10000); } catch (err) {}\n\n  if (got) {\n    try {\n      var sh = getSheet_();\n      var moved = flushPending_(sh);          // 밀린 것이 있으면 같이 옮긴다\n      sh.appendRow([new Date(), to]);\n      return { logged: true, error: moved ? ('밀려 있던 ' + moved + '건도 함께 기록했습니다.') : '' };\n    } catch (err) {\n      /* 시트 자체에 문제가 있으면 대기줄로 보낸다 */\n      queuePush_(to);\n      return { logged: false, error: '시트 오류로 대기줄에 넣었습니다: ' + String(err && err.message || err) };\n    } finally {\n      try { lock.releaseLock(); } catch (e) {}\n    }\n  }\n\n  queuePush_(to);\n  return { logged: false, error: '다른 기기가 시트를 쓰는 중이라 대기줄에 넣었습니다. 잠시 뒤 자동으로 기록됩니다.' };\n}\n\n/** 자기만의 칸에 적어 둔다. 칸 이름이 매번 달라서 동시에 해도 부딪히지 않는다. */\nfunction queuePush_(to) {\n  try {\n    PropertiesService.getScriptProperties().setProperty(\n      'pend:' + Utilities.getUuid(),\n      JSON.stringify({ t: new Date().toISOString(), to: to })\n    );\n  } catch (err) {}\n}\n\n/** 대기줄을 시트로 옮긴다. 반드시 잠금을 쥔 상태에서만 부를 것. */\nfunction flushPending_(sh) {\n  var props, all;\n  try {\n    props = PropertiesService.getScriptProperties();\n    all = props.getProperties();\n  } catch (err) { return 0; }\n\n  var keys = [];\n  for (var k in all) if (k.indexOf('pend:') === 0) keys.push(k);\n  if (!keys.length) return 0;\n\n  var rows = [];\n  for (var i = 0; i < keys.length; i++) {\n    try {\n      var v = JSON.parse(all[keys[i]]);\n      rows.push([new Date(v.t), v.to, keys[i]]);\n    } catch (err) { props.deleteProperty(keys[i]); }     // 깨진 것은 버린다\n  }\n  if (!rows.length) return 0;\n\n  rows.sort(function (a, b) { return a[0] - b[0]; });     // 들어온 순서대로\n\n  /* 한 번에 붙여 넣는다 — 줄마다 appendRow 하면 느리다 */\n  var start = sh.getLastRow() + 1;\n  sh.getRange(start, 1, rows.length, 2).setValues(rows.map(function (r) { return [r[0], r[1]]; }));\n\n  for (var j = 0; j < rows.length; j++) {\n    try { props.deleteProperty(rows[j][2]); } catch (err) {}\n  }\n  return rows.length;\n}\n\nfunction getSheet_() {\n  var ss;\n  if (CFG.SHEET_ID) {\n    ss = SpreadsheetApp.openById(CFG.SHEET_ID);\n  } else {\n    ss = SpreadsheetApp.getActiveSpreadsheet();\n    if (!ss) {\n      /* 붙어 있는 스프레드시트가 없으면 하나 만들어 두고 그 뒤로 계속 쓴다 */\n      var p = PropertiesService.getScriptProperties();\n      var id = p.getProperty('sheetId');\n      if (id) {\n        ss = SpreadsheetApp.openById(id);\n      } else {\n        ss = SpreadsheetApp.create('히어로 포스터 메일기록');\n        p.setProperty('sheetId', ss.getId());\n      }\n    }\n  }\n  var sh = ss.getSheetByName(CFG.SHEET_NAME);\n  if (!sh) {\n    sh = ss.insertSheet(CFG.SHEET_NAME);\n    sh.appendRow(['보낸 시각', '메일 주소']);\n    sh.getRange('A1:B1').setFontWeight('bold');\n    sh.setFrozenRows(1);\n    sh.setColumnWidth(1, 165);\n    sh.setColumnWidth(2, 280);\n  }\n  return sh;\n}\n\nfunction getFolder_() {\n  if (!CFG.DRIVE_FOLDER_ID) throw new Error('DRIVE_FOLDER_ID 가 비어 있습니다.');\n  return DriveApp.getFolderById(CFG.DRIVE_FOLDER_ID);\n}\n\nfunction isEmail_(s) {\n  return /^[^\\s@,]+@[^\\s@,]+\\.[^\\s@,]{2,}$/.test(String(s || '').trim());\n}\n\nfunction sanitize_(name) {\n  var n = String(name || '').replace(/[\\\\/:*?\"<>|\\r\\n]/g, '-').trim();\n  if (!n) n = 'hero-poster.png';\n  if (!/\\.png$/i.test(n)) n += '.png';\n  return n.slice(-120);\n}\n\n\n/* ══════════════════════════════════════════════════════════════\n   ⑦ 상태 확인 화면(index.html)이 부르는 함수들\n   ══════════════════════════════════════════════════════════════ */\nfunction uiPing() { return ping_(); }\n\n/** 대기줄에 남은 것을 시트로 옮긴다. 5분마다 자동으로 돌고, 화면에서 눌러도 돈다. */\nfunction 대기줄_비우기() {\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(30000)) return { ok: false, error: '시트가 사용 중입니다. 잠시 뒤 다시 시도됩니다.' };\n  try {\n    var n = flushPending_(getSheet_());\n    return { ok: true, moved: n };\n  } catch (err) {\n    return { ok: false, error: String(err && err.message || err) };\n  } finally {\n    try { lock.releaseLock(); } catch (e) {}\n  }\n}\nfunction uiFlush() { return 대기줄_비우기(); }\n\n/** 대기줄에 몇 건이 남아 있는지 */\nfunction pendingCount_() {\n  try {\n    var all = PropertiesService.getScriptProperties().getProperties(), n = 0;\n    for (var k in all) if (k.indexOf('pend:') === 0) n++;\n    return n;\n  } catch (err) { return -1; }\n}\n\n/** 히어로 앱에 넣을 /exec 주소를 그대로 돌려준다 */\nfunction uiWebAppUrl() {\n  try { return ScriptApp.getService().getUrl() || ''; }\n  catch (err) { return ''; }\n}\n\n/** 시험 발송 — 작은 그림 한 장을 만들어 첨부해서 보냅니다. */\nfunction uiTestSend(to) {\n  if (!isEmail_(to)) return { ok: false, error: '메일 주소 형태가 아닙니다.' };\n  /* 1×1 짜리가 아니라 눈에 보이는 파란 사각형 PNG */\n  var png = 'iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAYAAABw4pVUAAAAXklEQVR4nO3QMQEAAAjAILV/' +\n            'aM3g4QcS0EmuNQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' +\n            'AAAAAAAAAAAAAAAAAAAAAAAAAAAAcBpvBgAB/RJfSQAAAABJRU5ErkJggg==';\n  return handleSend_({\n    to: to,\n    heroName: '시험 발송',\n    tagline: '이 메일이 왔다면 설정이 끝난 것입니다',\n    student: '설정 확인',\n    filename: '시험발송.png',\n    mime: 'image/png',\n    data: png\n  });\n}\n\n/** 스크립트 편집기에서 딱 한 번 실행해 권한을 미리 허용해 두는 용도.\n *  실행하면 구글이 권한 창을 띄웁니다. 허용하고 나면 그 뒤로는 묻지 않습니다. */\nfunction 권한_미리_허용하기() {\n  var me = Session.getEffectiveUser().getEmail();\n  getSheet_();                                   // 시트 권한\n  if (CFG.SAVE_TO_DRIVE) getFolder_();           // 드라이브 권한\n  설치_자동정리_예약();                            // 5분마다 대기줄 비우기 예약\n\n  MailApp.sendEmail({                            // 메일 권한\n    to: me,\n    subject: '[설정 완료] 히어로 포스터 메일 보내기',\n    name: CFG.FROM_NAME,\n    body: '권한 허용이 끝났습니다.\\n오늘 남은 발송 가능 수: ' + MailApp.getRemainingDailyQuota()\n        + '통\\n\\n여러 대에서 동시에 눌러도 기록이 겹치지 않도록 5분마다 도는 자동 정리도 함께 예약했습니다.'\n        + '\\n\\n이제 배포한 웹앱 주소를 히어로 앱에 넣으면 됩니다.'\n  });\n  Logger.log('보내는 계정: ' + me);\n  Logger.log('남은 발송 가능 수: ' + MailApp.getRemainingDailyQuota());\n  Logger.log('기록 시트: ' + getSheet_().getParent().getUrl());\n  return '완료 — 본인 메일함을 확인하세요.';\n}\n\n/**\n * 할당량이 한 통에 얼마나 줄어드는지 딱 잘라 확인하는 도구.\n * 편집기에서 이 함수를 골라 ▶ 실행하고, 아래 「실행 로그」를 보세요.\n *\n * 이 함수는 첨부도 없고, 재시도도 없고, 웹앱도 거치지 않습니다.\n * 순수하게 MailApp.sendEmail 을 딱 한 번만 부릅니다. 그래서\n *   · 차이가 1 이면  → 정상. 15가 줄었다면 다른 곳(다른 스크립트·다른 기기·이전 발송)에서 쓴 것입니다.\n *   · 차이가 15 면  → 이 계정에서 구글이 그렇게 세고 있는 것이며, 우리 코드 문제가 아닙니다.\n * 둘 중 어느 쪽인지가 로그 한 줄로 갈립니다.\n */\nfunction 할당량_한통_측정() {\n  var me = Session.getEffectiveUser().getEmail();\n  var before = MailApp.getRemainingDailyQuota();\n  MailApp.sendEmail({\n    to: me,\n    subject: '[할당량 측정] 이 메일은 지워도 됩니다',\n    name: CFG.FROM_NAME,\n    body: '할당량이 한 통에 얼마나 줄어드는지 재기 위해 보낸 메일입니다.'\n  });\n  Utilities.sleep(1500);                       // 구글 쪽 반영을 잠깐 기다린다\n  var after = MailApp.getRemainingDailyQuota();\n\n  var msg = '보내기 전: ' + before + '  /  보낸 후: ' + after + '  /  줄어든 양: ' + (before - after);\n  Logger.log(msg);\n  Logger.log(before - after === 1\n    ? '→ 정상입니다. 한 통에 1씩 줄어듭니다. 15가 빠졌다면 같은 계정의 다른 스크립트나 이전 발송이 함께 세어진 것입니다.'\n    : '→ 한 통에 ' + (before - after) + ' 이 줄었습니다. 이 계정에서 구글이 그렇게 세고 있는 것이며, 히어로 앱 코드와는 무관합니다.');\n  Logger.log('보내는 계정: ' + me);\n  return msg;\n}\n\n/**\n * 지금 남은 할당량만 읽는다. 메일을 보내지 않는다.\n * 발송 직후에 한 번, 5분 뒤에 또 한 번 실행해서 숫자가 어떻게 변하는지 보세요.\n */\nfunction 할당량_지금() {\n  var n = MailApp.getRemainingDailyQuota();\n  var msg = new Date().toLocaleString('ko-KR') + '  —  남은 할당량 ' + n;\n  Logger.log(msg);\n  return msg;\n}\n\n/**\n * 최근 24시간 동안 이 계정에서 '실제로' 나간 메일을 세어 본다.\n * 할당량이 15 줄었는데 여기에 1통만 나오면, 메일이 15통 나간 것이 아니라\n * 구글이 그렇게 센 것입니다. 15통이 나온다면 정말 15통이 나간 것이고,\n * 목록에 찍힌 제목을 보면 어느 스크립트가 보냈는지 바로 알 수 있습니다.\n *\n * ※ 이 함수는 메일을 '읽는' 권한을 처음 한 번 더 요청합니다. 보내지는 않습니다.\n */\nfunction 최근24시간_발송_확인() {\n  var threads = GmailApp.search('in:sent newer_than:1d', 0, 100);\n  var rows = [], total = 0;\n  for (var i = 0; i < threads.length; i++) {\n    var msgs = threads[i].getMessages();\n    for (var j = 0; j < msgs.length; j++) {\n      var m = msgs[j];\n      if (m.getFrom().indexOf(Session.getEffectiveUser().getEmail()) < 0) continue;\n      total++;\n      rows.push(Utilities.formatDate(m.getDate(), Session.getScriptTimeZone(), 'MM-dd HH:mm')\n                + '  →  ' + m.getTo() + '   [' + m.getSubject() + ']');\n    }\n  }\n  rows.sort();\n  Logger.log('최근 24시간 동안 실제로 나간 메일: ' + total + '통');\n  Logger.log('─────────────────────────────────────────');\n  for (var k = 0; k < rows.length; k++) Logger.log(rows[k]);\n  Logger.log('─────────────────────────────────────────');\n  Logger.log('지금 남은 할당량: ' + MailApp.getRemainingDailyQuota());\n  Logger.log(total <= 2\n    ? '→ 실제로 나간 메일은 몇 통뿐입니다. 할당량이 그보다 많이 줄었다면 구글의 계산 방식이지, 메일이 더 나간 것이 아닙니다.'\n    : '→ 위 목록의 제목을 보세요. 히어로 포스터가 아닌 것이 섞여 있으면 같은 계정의 다른 스크립트가 쓰고 있는 것입니다.');\n  return total + '통 (실행 로그를 보세요)';\n}\n\n/** 5분마다 대기줄을 비우는 예약을 건다. 이미 있으면 다시 만들지 않는다. */\nfunction 설치_자동정리_예약() {\n  try {\n    var ts = ScriptApp.getProjectTriggers();\n    for (var i = 0; i < ts.length; i++)\n      if (ts[i].getHandlerFunction() === '대기줄_비우기') return '이미 예약돼 있습니다.';\n    ScriptApp.newTrigger('대기줄_비우기').timeBased().everyMinutes(5).create();\n    return '5분마다 자동 정리를 예약했습니다.';\n  } catch (err) {\n    return '예약하지 못했습니다: ' + String(err && err.message || err);\n  }\n}\n";
const GAS_INDEX = "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\"_top\">\n<meta charset=\"utf-8\">\n<style>\n  :root{ --line:#d7e3ea; --ink:#12222c; --mut:#5b7180; --dim:#8798a3;\n         --ok:#1f7a4d; --err:#b3283c; --wait:#8a6b12; --key:#2b7fa0; }\n  *{box-sizing:border-box}\n  body{margin:0;padding:26px 18px 60px;background:#f4f9fc;color:var(--ink);\n       font-family:\"Apple SD Gothic Neo\",\"Malgun Gothic\",system-ui,sans-serif;\n       line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}\n  .wrap{max-width:640px;margin:0 auto}\n  .kicker{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--key)}\n  h1{font-size:26px;letter-spacing:-.03em;margin:6px 0 4px}\n  .lead{color:var(--mut);font-size:14.5px;margin:0 0 22px}\n  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}\n  .card h2{font-size:15px;margin:0 0 12px;letter-spacing:-.02em}\n  table{width:100%;border-collapse:collapse;font-size:14px}\n  td{padding:7px 0;border-bottom:1px solid #eef4f8;vertical-align:top}\n  td:first-child{color:var(--mut);width:44%;white-space:nowrap}\n  td:last-child{font-weight:700;text-align:right}\n  .ok{color:var(--ok)} .err{color:var(--err)} .wait{color:var(--wait)}\n  .row{display:flex;gap:9px;margin-top:4px}\n  input{flex:1 1 auto;min-width:0;border:1px solid #c6d7e1;border-radius:11px;padding:11px 12px;\n        font:inherit;font-size:16px;background:#fbfdfe;outline:none}\n  input:focus{border-color:var(--key);box-shadow:0 0 0 3px #2b7fa022}\n  button{flex:0 0 auto;border:0;border-radius:11px;padding:11px 18px;font:inherit;font-weight:800;\n         font-size:15px;background:var(--key);color:#fff;cursor:pointer}\n  button:disabled{opacity:.45;cursor:not-allowed}\n  .msg{margin-top:11px;font-size:14px;min-height:1px}\n  .url{margin-top:10px;padding:11px 12px;border:1px dashed #b9d2df;border-radius:11px;\n       background:#f0f7fb;font-size:12.5px;color:var(--mut);word-break:break-all}\n  .url b{color:var(--ink)}\n  .note{font-size:13px;color:var(--dim);margin-top:10px}\n  @media(max-width:520px){ .row{flex-direction:column} button{width:100%} }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <div class=\"kicker\">SCIENCE HERO LAB<\/div>\n  <h1>메일 보내기 · 상태 확인<\/h1>\n  <p class=\"lead\">이 화면이 보인다면 배포는 끝난 것입니다. 아래 두 가지만 확인하고 창을 닫으세요.<\/p>\n\n  <div class=\"card\">\n    <h2>1. 지금 상태<\/h2>\n    <table>\n      <tr><td>보내는 계정<\/td><td id=\"sender\" class=\"wait\">확인 중…<\/td><\/tr>\n      <tr><td>오늘 남은 발송<\/td><td id=\"quota\" class=\"wait\">확인 중…<\/td><\/tr>\n      <tr><td>기록 시트<\/td><td id=\"sheet\" class=\"wait\">확인 중…<\/td><\/tr>\n      <tr><td>드라이브 저장<\/td><td id=\"drive\" class=\"wait\">확인 중…<\/td><\/tr>\n      <tr><td>자동 정리 예약<\/td><td id=\"sweeper\" class=\"wait\">확인 중…<\/td><\/tr>\n      <tr><td>대기줄<\/td><td id=\"pending\" class=\"wait\">확인 중…<\/td><\/tr>\n    <\/table>\n    <div class=\"note\" id=\"detail\"><\/div>\n    <div class=\"row\" style=\"margin-top:12px\">\n      <button id=\"flush\" style=\"background:#5b7180\">대기줄 지금 비우기<\/button>\n    <\/div>\n    <div class=\"msg\" id=\"flushMsg\"><\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>2. 시험 발송<\/h2>\n    <p class=\"lead\" style=\"margin:0 0 10px;font-size:14px\">본인 주소를 넣고 눌러 보세요. 작은 그림 한 장이 첨부되어 갑니다.<\/p>\n    <div class=\"row\">\n      <input id=\"to\" type=\"email\" inputmode=\"email\" spellcheck=\"false\" placeholder=\"받을 메일 주소\">\n      <button id=\"go\">보내기<\/button>\n    <\/div>\n    <div class=\"msg\" id=\"msg\"><\/div>\n  <\/div>\n\n  <div class=\"card\">\n    <h2>3. 히어로 앱에 넣을 주소<\/h2>\n    <p class=\"lead\" style=\"margin:0 0 4px;font-size:14px\">지금 이 페이지의 주소에서 <b>끝의 <code>/exec<\/code> 까지<\/b>를 복사해서,\n    히어로 앱 첫 화면의 <b>Apps Script 웹앱 주소<\/b> 칸에 붙여 넣으면 됩니다.<\/p>\n    <div class=\"url\" id=\"url\"><b>주소를 읽는 중…<\/b><\/div>\n    <div class=\"note\">주소가 <code>/dev<\/code> 로 끝나면 안 됩니다. 반드시 <b>배포<\/b>해서 나온 <code>/exec<\/code> 주소를 쓰세요.<\/div>\n  <\/div>\n<\/div>\n\n<script>\n  var $ = function (id) { return document.getElementById(id); };\n\n  function set(id, cls, text) {\n    var el = $(id); el.className = cls; el.textContent = text;\n  }\n\n  function refresh() {\n    google.script.run.withSuccessHandler(function (r) {\n      set('sender', 'ok', r.sender || '(확인 불가)');\n      set('quota', r.quota > 0 ? 'ok' : 'err', r.quota == null ? '확인 불가' : r.quota + '통');\n      set('sheet', r.sheet ? 'ok' : 'err', r.sheet ? '준비됨' : '오류');\n      set('drive', !r.saveToDrive ? 'ok' : (r.drive ? 'ok' : 'err'),\n          !r.saveToDrive ? '사용 안 함' : (r.drive ? '폴더 확인됨' : '폴더 오류'));\n      set('sweeper', r.sweeper ? 'ok' : 'err', r.sweeper ? '5분마다 켜짐' : '꺼짐');\n      set('pending', !r.pending ? 'ok' : 'wait', r.pending > 0 ? r.pending + '건 밀림' : '비어 있음');\n      var d = [];\n      if (r.sheetError) d.push('시트: ' + r.sheetError);\n      if (r.driveError) d.push('드라이브: ' + r.driveError);\n      if (!r.sweeper) d.push('자동 정리가 꺼져 있습니다. 편집기에서 「설치_자동정리_예약」 을 한 번 실행하세요.');\n      if (!r.saveToDrive) d.push('포스터는 어디에도 저장하지 않고 메일로만 보냅니다. 저장하려면 Code.gs 의 SAVE_TO_DRIVE 를 true 로 바꾸고 DRIVE_FOLDER_ID 를 채우세요.');\n      $('detail').textContent = d.join(' · ');\n    }).withFailureHandler(function (e) {\n      set('sender', 'err', '오류');\n      $('detail').textContent = String(e && e.message || e);\n    }).uiPing();\n  }\n  refresh();\n\n  $('flush').onclick = function () {\n    var m = $('flushMsg'), b = $('flush');\n    b.disabled = true; m.className = 'msg wait'; m.textContent = '옮기는 중…';\n    google.script.run.withSuccessHandler(function (r) {\n      b.disabled = false;\n      m.className = 'msg ' + (r.ok ? 'ok' : 'err');\n      m.textContent = r.ok ? (r.moved ? r.moved + '건을 시트로 옮겼습니다.' : '옮길 것이 없습니다.')\n                           : '실패 — ' + r.error;\n      refresh();\n    }).withFailureHandler(function (e) {\n      b.disabled = false; m.className = 'msg err'; m.textContent = '실패 — ' + String(e && e.message || e);\n    }).uiFlush();\n  };\n\n  google.script.run.withSuccessHandler(function (u) {\n    $('url').innerHTML = u\n      ? '<b>' + u + '<\/b>'\n      : '<b>이 페이지의 주소창에 보이는 https://script.google.com/macros/s/…/exec 주소를 쓰세요.<\/b>';\n  }).withFailureHandler(function () {\n    $('url').innerHTML = '<b>이 페이지의 주소창에 보이는 https://script.google.com/macros/s/…/exec 주소를 쓰세요.<\/b>';\n  }).uiWebAppUrl();\n\n  $('go').onclick = function () {\n    var to = ($('to').value || '').trim();\n    var msg = $('msg'), btn = $('go');\n    if (!/^[^\\s@,]+@[^\\s@,]+\\.[^\\s@,]{2,}$/.test(to)) {\n      msg.className = 'msg err'; msg.textContent = '메일 주소를 다시 확인해 주세요.'; return;\n    }\n    btn.disabled = true;\n    msg.className = 'msg wait'; msg.textContent = '보내는 중…';\n    google.script.run\n      .withSuccessHandler(function (r) {\n        btn.disabled = false;\n        if (r.ok) {\n          msg.className = 'msg ok';\n          msg.textContent = '보냈습니다. ' + to + ' 메일함(스팸함 포함)을 확인하세요.'\n            + (r.logged ? ' 시트에도 기록됐습니다.' : ' (시트 기록은 건너뛰었습니다: ' + (r.note || '') + ')');\n        } else {\n          msg.className = 'msg err'; msg.textContent = '실패 — ' + r.error;\n        }\n      })\n      .withFailureHandler(function (e) {\n        btn.disabled = false;\n        msg.className = 'msg err'; msg.textContent = '실패 — ' + String(e && e.message || e);\n      })\n      .uiTestSend(to);\n  };\n<\/script>\n<\/body>\n<\/html>\n";

function guideHtml(){

    <div class="su-step">

        왼쪽 위 <b>새 프로젝트</b>를 누릅니다. 이름은 아무거나 좋습니다.</p>

    </div>

    <div class="su-step">

/* 복사 버튼 — file:// 에서도 되도록 예전 방식까지 준비해 둔다 */
function bindCopyButtons(){
  $$('.copy').forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.copy;
      const src = document.getElementById('code-' + id);
      const msg = document.getElementById('msg-' + id);
      if(!src) return;
      const text = src.textContent;
      let done = false;
      try{ await navigator.clipboard.writeText(text); done = true; }catch(_){
        try{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;left:-9999px;top:0';
          document.body.appendChild(ta); ta.select();
          done = document.execCommand('copy');
          ta.remove();
        }catch(__){}
      }
      if(msg){
        msg.className = 'su-copied ' + (done ? 'ok' : 'err');
        msg.textContent = done ? '복사했습니다. Apps Script 에 붙여 넣으세요.'
                               : '복사가 막혔습니다. 아래 코드를 직접 끌어서 선택해 복사하세요.';
      }
    };
  });
}

/* QR 크기. 가로의 17.5% 로만 정하면 셀피 카드(가로 54mm)에서는 9mm 밖에 안 나와
   휴대폰으로 읽히지 않는다. 실물 최소 15mm 를 보장하되, 작은 규격에서 포스터를
   다 잡아먹지 않도록 가로의 30% 를 넘지 않게 한다. */
function qrSize(f){
  const pxPerMm = f.w / f.mm;
  return Math.round(Math.min(f.w*0.30, Math.max(f.w*0.175, pxPerMm*15)));
}

/* 나이 — 우리나라에서 흔히 쓰는 '세는 나이'로 받는다 (13살 = 초등 6학년).
   실험 세트는 학년이 정하고, 나이는 오직 '그림 속 사람이 몇 살로 보이는가'만 정한다.

/* ── 나이 ──────────────────────────────────────────────────────
   우리나라에서 흔히 쓰는 '세는 나이'로 받는다. 13살 = 초등 6학년이다.
   만 나이 = 세는 나이 − 1 로 보고, 아래 표에서 그 나이의 실제 평균 키를 찾는다.
   키는 질병관리청·대한소아청소년과학회 「2017 소아청소년 성장도표」의
   연령별 신장 50 백분위수(중앙값)이고, 성인은 국민건강영양조사 성인 평균이다.
   그림 모델에게 '초등학생'이라고만 말하면 늘 중학생만 하게 그린다.
   실제 센티미터를 숫자로 줘야 크기가 맞는다.
   ────────────────────────────────────────────────────────────── */
const HEIGHT_CM = {                      // 만 나이 → 신장(cm) 중앙값
  /* ★ 2026-08 추가 — 만 0~2세. 예전에는 표가 만 3세부터라 1~3살이라고 적으면
     ageKorean() 이 그 값을 통째로 버리고 학년 기본값(15살)으로 빠졌다.
     "1살"이라고 적었는데 14살로 그려진 것이 그 때문이다. */
  boy:  {0:67.6, 1:75.7, 2:87.1, 3:96.5, 4:103.1, 5:110.3, 6:115.9, 7:122.1, 8:127.9, 9:133.4, 10:138.8, 11:144.7,
         12:151.4, 13:158.6, 14:165.0, 15:169.2, 16:171.4, 17:172.6, 18:173.3},
  girl: {0:65.7, 1:74.0, 2:85.7, 3:95.4, 4:101.9, 5:109.4, 6:114.7, 7:120.8, 8:126.7, 9:132.6, 10:139.1, 11:145.8,
         12:151.7, 13:155.9, 14:157.9, 15:158.9, 16:159.5, 17:160.0, 18:160.6}
};
const ADULT_CM = {boy:173.5, girl:160.5};
/* 두신비 — 나이가 한눈에 읽히는 건 키가 아니라 머리와 몸의 비율이다.
   실측 두장(頭長)으로 계산한 값이라 만화적으로 부풀린 숫자가 아니다. */
/* ★ 2026-08 수정 — 어린 나이 값이 너무 컸다. 만 5세를 6.0등신으로 잡고 있었는데
   실제로는 5.5등신쯤이다. 0.4등신 차이가 그림에서는 '어른 같다' 로 나타난다.
   유아 구간을 실제 계측값에 맞춰 낮추고 3·4세를 추가했다. 다시 올리지 마라. */
const HEADS_BY_AGE = {0:4.0, 1:4.3, 2:4.6, 3:5.0, 4:5.3, 5:5.6, 6:5.9, 7:6.1, 8:6.3, 9:6.4, 10:6.6, 11:6.7,
                      12:6.9, 13:7.1, 14:7.2, 15:7.3, 16:7.4, 17:7.4, 18:7.5};
const ADULT_HEADS = 7.5;

/* 세는 나이. 안 적었으면 학년으로 대신한다 (초등 12살 · 중등 15살) */
function ageKorean(){
  const n = parseInt(state.age, 10);
  /* ★ 하한이 4였던 탓에 1·2·3 을 적으면 그 값이 조용히 버려지고
     학년 기본값으로 빠졌다 — 학년이 초등이 아니면 15살, 즉 만 14살이 됐다.
     "1살"이 "14살"로 그려진 것이 이것이다. 이제 1살부터 그대로 받는다.
     다시 올리지 마라. 적은 숫자를 말없이 바꾸는 것이 가장 나쁘다. */
  if(Number.isFinite(n) && n >= 1 && n <= 99) return n;
  return state.level === 'elementary' ? 12 : 15;
}
const ageIntl  = () => Math.max(0, ageKorean() - 1);      // 만 나이
const isAdult  = () => ageIntl() >= 19;

/* 학교 단계 이름 — 화면에 무엇으로 그려지는지 알려 줄 때 쓴다 */
function ageStage(){
  const m = ageIntl();
  if(m <= 1)  return {ko:'아기', en:'a baby',
    body:'a baby: a head enormous for the body, a rounded belly, very short arms and legs with deep creases at the joints, tiny hands and feet, no neck to speak of' + (state.photo ? '' : ', round full cheeks and no chin definition')};

  if(m <= 5)  return {ko:'유치원생', en:'a preschool child',
    body:'a preschool child: a large head for the body, a soft rounded torso with no waist, short arms and legs, small chubby hands, no muscle definition anywhere' + (state.photo ? '' : ', round cheeks and a small chin')};
  if(m <= 8)  return {ko:'초등 저학년', en:'a young primary-school child',
    body:'a young child: a noticeably large head for the body, a short rounded torso with no waist definition at all, short arms and legs, chubby hands, no muscle definition anywhere' + (state.photo ? '' : ', soft round cheeks and a small chin, a milk-teeth smile')};
  if(m <= 12) return {ko:'초등 고학년', en:'an older primary-school child',
    body:'a pre-teen child: a head that reads large against the body (a matter of SIZE only, never of shape), a straight flat torso with no waist taper and no chest or hip shaping, narrow flat shoulders, thin limbs, small hands and feet, no adult musculature' + (state.photo ? '' : ', a rounded cheek line and a small undeveloped jaw')};
  if(m <= 15) return {ko:'중학생', en:'a middle-school teenager',
    body:'an early teenager: a slim straight lightly built frame, shoulders only just starting to widen, long thin limbs, no heavy adult musculature' + (state.photo ? '' : ', a face that has lengthened but is still soft with a light jawline')};
  if(m <= 18) return {ko:'고등학생', en:'a high-school teenager',
    body:'a late teenager: close to adult height but still lean and lightly built, a slim frame without bulk' + (state.photo ? '' : ', a young face that has not yet fully squared off')};
  return {ko:'어른', en:'an adult',
    body:'a fully grown adult: adult proportions, a real athletic-but-normal build. Not a bodybuilder, not a fashion model — an ordinary capable adult' + (state.photo ? '' : ' with adult facial structure')};
}

/* 이 학생이 몇 cm 로, 몇 등신으로 그려져야 하는가 */
/* ★ 사진 속 인물을 무언가로 부를 때 쓰는 말. 예전에는 어디서나 'child' 로 고정되어 있었다.
   그런데 어른 사진을 올리면 그 말이 그대로 나가서, 프롬프트 안에서
   '얼굴을 사진 그대로' 와 '이 사람은 아이다' 가 정면으로 부딪혔다.
   그림 모델은 그 모순을 얼굴을 어리게 만드는 쪽으로 푸는다 — 얼굴이 바뀌는 가장 큰 이유였다.
   이제 나이에 맞춰 부른다. */
function subjectWord(){
  const m = ageIntl();
  if(m >= 19) return 'person';
  if(m >= 13) return 'teenager';
  return 'child';
}
function ageSpec(){
  const m = ageIntl(), st = ageStage(), adult = isAdult();
  const pick = g => adult ? ADULT_CM[g] : (HEIGHT_CM[g][Math.min(18, Math.max(0, m))] || ADULT_CM[g]);
  const b = pick('boy'), g2 = pick('girl');
  let cm, cmKo;
  if(state.gender === 'boy'){       cm = Math.round(b);  cmKo = `약 ${Math.round(b)}cm`; }
  else if(state.gender === 'girl'){ cm = Math.round(g2); cmKo = `약 ${Math.round(g2)}cm`; }
  else {                            cm = Math.round((b+g2)/2);
                                    const lo = Math.round(Math.min(b,g2)), hi = Math.round(Math.max(b,g2));
                                    cmKo = lo === hi ? `약 ${lo}cm` : `약 ${lo}~${hi}cm`; }
  const heads = adult ? ADULT_HEADS : (HEADS_BY_AGE[Math.min(18, Math.max(0, m))] || ADULT_HEADS);
  /* 다리 길이 — 어른처럼 보이느냐를 가르는 가장 강한 단서다.
     등신수만 적어 주면 그림 모델이 머리만 키우고 다리는 어른 길이로 그려 버린다.
     바닥에서 고관절까지가 전신에서 차지하는 비율은 아이가 어른보다 뚜렷하게 작다
     (만 9세 약 46%, 어른 약 52%). 그것을 머리 개수로 바꿔서 넘긴다. */
  const legPct  = adult ? 0.52 : (m <= 12 ? 0.46 : 0.49);
  const legHeads = Math.round(heads * legPct * 10) / 10;
  const upperHeads = Math.round((heads - legHeads) * 10) / 10;
  return {ko:st.ko, en:st.en, body:st.body, adult, kAge:ageKorean(), mAge:m,
          cm, cmKo, heads, headsKo:`약 ${heads}등신`, legHeads, upperHeads,
          cmEn: `about ${cm} cm`, headsEn:`about ${heads} heads tall`};
}
/* 예전 이름 — 화면 힌트에서 쓰던 것 */
function ageBand(){ const a = ageSpec();
  return {ko:a.ko, en:a.en, intl:`${a.mAge}`, heads:a.headsEn, cm:a.cmEn, body:a.body}; }

     왜 하필 그 둘인지 근거가 없고 가운데 두 장비는 통째로 무시됐다. */
  const base = String(state.heroName||'').trim()

            || '히어로';
  const name = `${base} 완전체`;
  const kicker = got.map(g => displayGearName(g)).join(' · ') || '장비 4개가 하나로 맞물린 형태';
  const en =

${got.map((g,i)=>`${i+1}. ${g.slotEn || 'equipment'}: ${gearVisual(g)}. LOCATION: ${isPhotoOptic(g) && !noGlasses() && !wearsGlasses() ? 'automatically decided after the independent eyewear inspection; do not assume any face-mounted object yet' : (gearHome(g) || 'the place named by the equipment')}`).join('\n')}

  {id:'fluorescence', icon:'💡', name:'형광 물질 관찰하기',
   gear:'형광 발광 라인',
   en:'seam lines painted in fluorescent pigment along the suit, lit up in vivid cyan-green wherever the beam of the small ultraviolet emitter mounted on the collar falls across them, and reading as ordinary matte paint everywhere the beam is not falling. Nothing on this suit is self-luminous and nothing glows on its own — the pigment only answers the UV beam',
   materials:['형광펜','일반 색연필 (비교용)','흰 복사용지','형광 증백제가 적은 종이 (재생지·갱지·화선지) — 비교용, 이게 있으면 결과가 훨씬 또렷합니다','일반 손전등 또는 방 전등','자외선(블랙라이트) 손전등 — 365nm이 가장 좋고, 흔한 395nm도 됩니다','가루 세제 조금 (형광 증백제 확인용)','불을 완전히 끌 수 있는 방'],
   steps:['종이 한 장에 형광펜으로, 그 옆에 일반 색연필로 같은 그림을 그린다.','일반 전등을 켠 채로 두 그림을 본다. 둘 다 제 색으로 보인다.','불을 완전히 끄고 캄캄한 상태에서 본다. 형광펜 그림도 하나도 안 보이는지 확인한다.','자외선 손전등을 비춘다. 형광펜은 환하게 빛나고, 색연필은 오히려 어둡게 남는다.','흰 종이의 빈 곳에도 비춰 본다. 종이 자체가 푸르스름하게 빛난다.','같은 그림을 재생지·갱지에도 그려 비춰 본다. 종이가 덜 빛나서 형광펜이 훨씬 도드라진다.','가루 세제를 조금 덜어 비춰 본다. 종이와 같은 이유로 빛난다.','자외선을 끄는 순간 빛이 즉시 사라지는지 본다. 남아서 빛나면 그건 형광이 아니다.'],
   principle:'형광 물질은 <b>자외선처럼 파장이 짧은 빛</b>을 흡수한 뒤, 그 에너지를 눈에 보이는 빛으로 바꿔 내보냅니다. 흡수한 에너지의 일부를 열로 잃기 때문에, 나오는 빛은 들어간 빛보다 파장이 더 깁니다(<b>스토크스 이동</b>). 그래서 자외선을 쬐면 어두운 방에서도 그 부분이 유난히 밝게 빛나 보입니다.<br><br><b>가장 헷갈리는 것 — 형광은 야광이 아닙니다.</b> 형광 물질은 스스로 빛을 만들지 않고, <b>받은 빛의 파장을 바꿔 되돌려 줄 뿐</b>입니다. 그래서 <b>비추던 빛을 끄면 형광도 그 순간 함께 꺼집니다</b>(1억분의 1초, 즉 수 나노초 안에). 불을 완전히 끄면 형광펜 그림도 하나도 안 보이는 것이 이 때문입니다. 반대로 야광 별 스티커처럼 불을 끄고도 한참 빛나는 것은 형광이 아니라 <b>인광</b>이고, 이쪽은 받은 에너지를 잠시 가둬 두었다가 천천히 내보냅니다.<br><br>또 하나. <b>흰 종이도 함께 푸르스름하게 빛납니다.</b> 종이를 더 하얘 보이게 하려고 넣은 <b>형광 증백제</b>가 똑같은 일을 하기 때문입니다(자외선 320~410nm를 흡수해 파란빛 420~550nm로 내보냅니다). 세탁 세제도 같은 이유로 빛납니다. 자외선 아래에서 빛나는 것이 형광펜뿐이라고 생각하기 쉬운데 그렇지 않습니다.<br><br><b>실험이 잘 안 될 때 — 종이를 바꿔 보세요.</b> 복사용지에는 형광 증백제가 특히 많이 들어 있어서, 종이가 너무 환하게 빛나면 형광펜이 묻혀 대비가 약해집니다. <b>재생지·갱지·화선지</b>처럼 증백제가 적은 종이에 그리면 종이는 어둡게 남고 형광펜만 도드라져 훨씬 또렷합니다. 두 종이를 나란히 놓고 비추면 <b>종이도 형광 물질이다</b>와 <b>형광펜은 종이보다 밝다</b>를 한 번에 보여 줄 수 있습니다.<br><br>참고로 <b>노란 형광펜이 종이보다 밝아 보이는 이유</b>는 2가지입니다. 자외선까지 보태 내보내는 것이 첫째이고, 형광펜이 내보내는 연둣빛(약 520~560nm)이 <b>사람 눈이 가장 예민한 파장대</b>라 같은 에너지라도 훨씬 밝게 느껴지는 것이 둘째입니다. 종이의 증백제가 내보내는 파란빛(약 440nm)은 눈이 덜 예민한 쪽입니다.<br><br><b>손전등에서 보이는 보라색은 자외선이 아닙니다.</b> 자외선은 눈에 보이지 않습니다. 흔히 파는 395nm 블랙라이트는 자외선과 함께 보라색 가시광선이 상당히 새어 나와서 그 빛이 보이는 것입니다. 365nm 짜리를 쓰면 새어 나오는 빛이 훨씬 적어 형광이 더 또렷하게 보입니다.',
   safety:'자외선 손전등을 눈에 직접 비추거나 친구 얼굴에 비추지 마세요. 오래 켜 두지 말고 필요할 때만 잠깐 켭니다. 실험에 쓴 세제 가루는 만진 뒤 손을 씻고, 절대 입에 넣지 않습니다.',
   check:{q:'형광펜은 일반 전등 아래에서도 잘 보입니다. 그런데 자외선을 비추면 흰 종이보다도 더 밝아 보입니다. 왜 그럴까요?',
     options:['눈에 안 보이는 자외선까지 흡수해 보이는 빛으로 바꿔 더 내보내서','자외선이 형광펜 색을 더 진하게 물들여서','자외선이 눈을 예민하게 만들어 밝게 느껴져서'],
     answer:0,
     explain:'받은 빛의 파장을 바꿔 되돌려 주기 때문입니다. 보통 물체는 빛을 받아 일부만 되비추므로 종이보다 밝을 수 없습니다. 그런데 형광 물질은 눈에 보이지 않는 자외선까지 흡수해 보이는 빛으로 바꿔 내보내기 때문에, 원래 보이던 빛에 그만큼이 더해져 종이보다 밝아 보입니다. 지폐의 위조 방지 무늬, 흰옷을 더 하얗게 보이게 하는 세제도 같은 원리입니다.'}}
 ]},
