<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#f8f1ed; color:#342d2a;
    word-break:keep-all; overflow-wrap:break-word; }
  .app { width:100%; max-width:1240px; margin:0 auto; padding:8px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .head { text-align:center; }
  h1 { font-size:clamp(15px,1.7vw,20px); margin:0; }
  .sub { font-size:11.5px; color:#806b61; margin:3px 0 0; }
  .mid { display:flex; flex-direction:column; gap:8px; }
  .card { background:#fff; border-radius:12px; padding:9px 10px; box-shadow:0 3px 12px rgba(99,68,54,.1); }
  .stage { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .cv { position:relative; background:#fcf8f5; border-radius:8px; overflow:hidden; }
  .cv canvas { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
  #sceneBox { height:clamp(200px,58vw,430px); }
  #graphBox { height:112px; }
  .legend { display:flex; flex-wrap:wrap; gap:3px 14px; font-size:10.5px; color:#806b61; font-weight:600; margin:0 2px; }
  .legend i { display:inline-block; vertical-align:middle; margin-right:5px; }
  .lg-line { width:20px; border-top:2px dashed #c0876f; }
  .lg-dot { width:8px; height:8px; border-radius:50%; background:rgba(135,90,73,.5); }
  .lg-ghost { width:10px; height:10px; border-radius:50%; border:1.5px dashed #e5484d; }
  .cap { font-size:11px; font-weight:800; color:#4e3d36; margin:2px 3px 0; }
  .status { font-size:12.5px; font-weight:700; color:#875a49; min-height:2.9em; line-height:1.45; margin:0 2px;
    display:flex; align-items:center; }

  .side { display:flex; flex-direction:column; gap:8px; min-width:0; }
  .gl { font-size:10.5px; font-weight:800; color:#806b61; letter-spacing:.2px; margin:0 1px 5px; }
  .angle { display:flex; align-items:baseline; justify-content:space-between; }
  .angle b { font-size:26px; color:#875a49; font-variant-numeric:tabular-nums; }
  .angle span { font-size:11px; color:#806b61; font-weight:600; }
  input[type=range] { width:100%; accent-color:#875a49; height:22px; margin:2px 0 4px; }
  .presetRow { display:flex; gap:4px; }
  .preset { flex:1; padding:6px 2px; font-size:11.5px; font-weight:700; border:1px solid #e4d8d1; background:#fcf8f5;
    color:#58483f; border-radius:7px; cursor:pointer; min-height:30px; }
  .preset.active { background:#875a49; color:#fff; border-color:#875a49; }
  .ctrlRow { display:flex; gap:7px; }
  .slow { width:100%; margin-top:7px; min-height:32px; }
  .ctrlBtn { flex:1; padding:10px 6px; font-size:13.5px; font-weight:800; border:none; border-radius:9px; cursor:pointer; color:#fff; min-height:40px; }
  .play { background:#1eaf6b; } .pause { background:#e0912a; } .reset { background:#8394ab; flex:0 0 38%; }
  .readout { font-size:12px; line-height:1.85; }
  .readout .row { display:flex; justify-content:space-between; gap:10px; }
  .readout b { color:#875a49; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:11.5px; }
  th, td { padding:4px 2px; text-align:center; white-space:nowrap; overflow:hidden; border-bottom:1px solid #f0e6e0; }
  th { font-size:10.5px; color:#806b61; font-weight:800; }
  td { font-variant-numeric:tabular-nums; font-weight:700; }
  td.empty { color:#cdbfb7; font-weight:400; }
  .recHead { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
  .recHead .gl { margin:0; }
  .mini { border:1px solid #e4d8d1; background:#fcf8f5; color:#806b61; font-size:10.5px; font-weight:700; border-radius:6px;
    padding:3px 8px; cursor:pointer; }

  /* 넓은 화면: 스크롤 없이 한 화면 */
  @media (min-width:820px) and (min-height:520px){
    html, body { height:100%; overflow:hidden; }
    .app { height:100vh; height:100dvh; }
    .mid { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) clamp(250px,24vw,300px); }
    .stage { min-height:0; }
    #sceneBox { height:auto; flex:1 1 0; min-height:150px; }
    .side { min-height:0; overflow:hidden; }
    .side .grow { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
    .side .grow .tbl { flex:1 1 0; min-height:0; }
    .side .grow table { height:100%; }
  }
  /* 폰·패드 가로(낮은 화면): 실험 옆에 조작 칸, 조작 칸만 스크롤 */
  @media (orientation:landscape) and (max-height:519px){
    html, body { height:100%; overflow:hidden; }
    .app { height:100vh; height:100dvh; padding:6px; gap:5px; }
    .sub { display:none; }
    h1 { font-size:13px; }
    .mid { flex:1; min-height:0; display:grid; gap:6px; grid-template-columns:minmax(0,1.7fr) minmax(200px,1fr); }
    .stage { min-height:0; padding:6px; gap:4px; }
    #sceneBox { height:auto; flex:1 1 0; min-height:80px; }
    #graphBox { height:56px; }
    .cap, .legend .wide { display:none; }
    .legend { font-size:9.5px; gap:2px 9px; }
    .status { min-height:0; font-size:10.5px; line-height:1.3; }
    .side { min-height:0; overflow-y:auto; overscroll-behavior:contain; gap:6px; }
    .card { padding:7px 8px; }
  }
  /* 아주 낮은 화면(뷰어 안의 작은 폰 가로): 그래프를 접어 실험 장면을 살린다 */
  @media (orientation:landscape) and (max-height:240px){
    #graphBox, .legend { display:none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>갈릴레오의 빗면 사고 실험</h1>
    <p class="sub">마찰과 공기 저항이 없고 공의 회전은 무시합니다(g = 9.8 m/s²). 오른쪽 빗면의 경사각을 바꾸며 공이 어디까지 가는지 관찰해 보세요.</p>
  </div>

  <div class="mid" id="mid">
    <div class="card stage">
      <div class="cv" id="sceneBox"><canvas id="scene" aria-label="두 빗면과 공"></canvas></div>
      <div class="legend">
        <span class="wide"><i class="lg-line"></i>공을 놓은 높이 0.50 m</span>
        <span><i class="lg-dot"></i>0.1초마다 찍은 위치(최고점까지)</span>
        <span class="wide"><i class="lg-ghost"></i>최고점</span>
        <span class="wide">아래 눈금 한 칸: 0.5 m</span>
      </div>
      <div class="status" id="status"></div>
      <div class="cap">속력 – 시간 그래프 <span style="font-weight:600;color:#806b61">· 속력은 방향 없이 빠르기만 나타냅니다</span></div>
      <div class="cv" id="graphBox"><canvas id="graph" aria-label="속력 시간 그래프"></canvas></div>
    </div>

    <div class="side" id="side">
      <div class="card">
        <div class="gl">오른쪽 빗면의 경사각</div>
        <div class="angle"><b id="angVal">30°</b><span id="angHint">0°는 수평면</span></div>
        <input type="range" id="ang" min="0" max="60" step="1" value="30" aria-label="오른쪽 빗면의 경사각">
        <div class="presetRow" id="presets">
          <button class="preset" data-a="60">60°</button>
          <button class="preset" data-a="30">30°</button>
          <button class="preset" data-a="15">15°</button>
          <button class="preset" data-a="5">5°</button>
          <button class="preset" data-a="0">0°</button>
        </div>
      </div>

      <div class="card">
        <div class="ctrlRow">
          <button class="ctrlBtn play" id="go">▶ 공 놓기</button>
          <button class="ctrlBtn reset" id="again">↻ 다시</button>
        </div>
        <button class="preset slow" id="slow" aria-pressed="false">🐢 느리게 보기 (4배 느리게)</button>
      </div>

      <div class="card">
        <div class="gl">공의 운동</div>
        <div class="readout">
          <div class="row"><span>시간</span><b id="rT">0.00 s</b></div>
          <div class="row"><span>속력</span><b id="rV">0.00 m/s</b></div>
          <div class="row"><span>높이</span><b id="rH">0.50 m</b></div>
          <div class="row"><span>이동 거리</span><b id="rX">0.00 m</b></div>
        </div>
      </div>

      <div class="card grow">
        <div class="recHead"><div class="gl">경사각별 기록</div><button class="mini" id="clear">기록 지우기</button></div>
        <div class="tbl"><table>
          <colgroup><col style="width:24%"><col style="width:36%"><col style="width:40%"></colgroup>
          <thead><tr><th>경사각</th><th>최고점 높이</th><th>이동 거리</th></tr></thead>
          <tbody id="rec"></tbody>
        </table></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ===== 물리 모형 (PHYS-BEGIN) =====
   마찰 없는 면 위의 공(회전은 무시한 질점 모형). pos(s)는 공 중심이 지나는 길이고, 높이는 중심 높이다.
   길을 길이 s로 매개화하고 접선 가속도 a = -g·sin(φ(s)) 를 쓴다.
   왼쪽 빗면(30°) → 둥근 이음 → 오른쪽 빗면(θ). 가운데에 수평 구간은 없다(B = 0). θ = 0이면 오른쪽이 수평면이다.
   속도 베를레 적분으로 역학적 에너지 오차를 작게 유지한다. 면은 중심 길에서 HB만큼 아래에 나란히 그린다. */
var G = 9.8, H = 0.5, AL = 30*Math.PI/180, R = 0.2, B = 0, DT = 1/600, HB = 0.045;   // HB: 공의 반지름
function makeTrack(thDeg){
  var th = thDeg*Math.PI/180;
  var L1 = (H - R*(1-Math.cos(AL)))/Math.sin(AL);
  var s1 = L1, s2 = s1 + R*AL, s3 = s2 + B, s4 = s3 + R*th;
  var x0 = -(L1*Math.cos(AL) + R*Math.sin(AL));
  var xr = B + R*Math.sin(th), yr = R*(1-Math.cos(th));
  return {
    th:th, s1:s1, s2:s2, s3:s3, s4:s4, x0:x0, xr:xr, yr:yr,
    phi:function(s){
      if (s < s1) return -AL;
      if (s < s2) return -AL + (s-s1)/R;
      if (s < s3) return 0;
      if (s < s4) return (s-s3)/R;
      return th;
    },
    pos:function(s){
      var p, u;
      if (s < s1) return {x:x0 + s*Math.cos(AL), y:H - s*Math.sin(AL)};
      if (s < s2){ p = -AL + (s-s1)/R; return {x:R*Math.sin(p), y:R - R*Math.cos(p)}; }
      if (s < s3) return {x:s-s2, y:0};
      if (s < s4){ p = (s-s3)/R; return {x:B + R*Math.sin(p), y:R - R*Math.cos(p)}; }
      u = s - s4; return {x:xr + u*Math.cos(th), y:yr + u*Math.sin(th)};
    },
    surf:function(s){ var q = this.pos(s), f = this.phi(s); return {x:q.x + Math.sin(f)*HB, y:q.y - Math.cos(f)*HB}; }
  };
}
function stepBall(tr, st){
  var a = -G*Math.sin(tr.phi(st.s));
  var sN = st.s + st.v*DT + 0.5*a*DT*DT;
  var aN = -G*Math.sin(tr.phi(sN));
  st.v = st.v + 0.5*(a+aN)*DT;
  st.d += Math.abs(sN - st.s);
  st.s = sN;
  st.t += DT;
}
/* ===== (PHYS-END) ===== */

var r2 = function(x){ return (x<0?-1:1)*Math.round(Math.abs(x)*100)/100; };
var f2 = function(x){ var v = r2(x); if (v === 0) v = 0; return v.toFixed(2); };
var $ = function(id){ return document.getElementById(id); };

var thDeg = 30, tr = makeTrack(thDeg);
var st, running, started, turned, turnS, flatDone, dots, nextDot, samples, nextSamp, sampGap, prevV;
var records = [];            // {a, h, d, flat}
var MAXREC = 5;
var camX = 0, acc = 0, last = 0, slow = false;

function resetBall(){
  st = {s:0, v:0, t:0, d:0}; running = false; started = false; turned = false; turnS = null;
  dots = []; nextDot = 0; flatDone = false; samples = [[0,0,1]]; sampGap = 1/60; nextSamp = sampGap; prevV = 0; acc = 0;
  camX = camHome();
  $('go').textContent = '▶ 공 놓기'; $('go').className = 'ctrlBtn play';
  setStatus(); readout(); drawAll();
}
function setAngle(a){
  thDeg = Math.max(0, Math.min(60, Math.round(a)));
  tr = makeTrack(thDeg);
  $('ang').value = thDeg; $('angVal').textContent = thDeg + '°';
  var bs = $('presets').children;
  for (var i=0;i<bs.length;i++) bs[i].classList.toggle('active', +bs[i].getAttribute('data-a') === thDeg);
  resetBall();
}
function setStatus(){
  var m;
  if (!started) m = '‘공 놓기’를 누르면 공이 높이 ' + f2(H) + ' m에서 내려갑니다.';
  else if (thDeg === 0 && flatDone) m = '수평면에서 속력이 ' + f2(Math.abs(st.v)) + ' m/s로 변하지 않습니다. 이렇게 속력과 방향이 일정한 운동이 등속 직선 운동입니다.';
  else if (thDeg === 0) m = '오른쪽에 올라갈 빗면이 없습니다. 수평면에서 점 사이의 간격과 속력이 어떻게 되는지 지켜보세요.';
  else if (!turned) m = '공이 오른쪽 빗면을 얼마나 높이, 얼마나 멀리 올라가는지 보세요.';
  else {
    var p = tr.pos(turnS);
    m = (f2(p.y) === f2(H) ? '공이 처음과 같은 높이 ' : '공이 높이 ') + f2(p.y) + ' m까지 올라갔다가 되돌아옵니다. 놓은 곳부터 최고점까지 이동 거리는 ' + f2(turnS) + ' m입니다.';
  }
  $('status').textContent = m;
}
function readout(){
  var p = tr.pos(st.s);
  $('rT').textContent = f2(st.t) + ' s';
  $('rV').textContent = f2(Math.abs(st.v)) + ' m/s';
  $('rH').textContent = f2(p.y) + ' m';
  $('rX').textContent = f2(st.d) + ' m';
}
function addRecord(rec){
  records = records.filter(function(r){ return r.a !== rec.a; });
  records.push(rec);
  if (records.length > MAXREC) records.shift();
  drawRecords();
}
function drawRecords(){
  var rows = records.slice().sort(function(a,b){ return b.a - a.a; }), html = '';
  for (var i=0;i<MAXREC;i++){
    var r = rows[i];
    if (!r) html += '<tr><td class="empty">·</td><td class="empty">·</td><td class="empty">·</td></tr>';
    else if (r.flat) html += '<tr><td>0°</td><td>없음</td><td>계속 이동</td></tr>';
    else html += '<tr><td>' + r.a + '°</td><td>' + f2(r.h) + ' m</td><td>' + f2(r.d) + ' m</td></tr>';
  }
  $('rec').innerHTML = html;
}

function advance(){
  prevV = st.v;
  var sOld = st.s;
  stepBall(tr, st);
  if (!turned && thDeg > 0 && prevV > 0 && st.v <= 0 && sOld > tr.s3){
    turned = true; turnS = sOld + (st.s - sOld)*prevV/(prevV - st.v);
    var p = tr.pos(turnS); addRecord({a:thDeg, h:p.y, d:turnS, flat:false});
    samples.push([st.t, 0, 1]); setStatus();
  } else if (prevV !== 0 && (prevV > 0) !== (st.v > 0)) samples.push([st.t, 0, 1]);
  if (!flatDone && thDeg === 0 && st.s >= tr.s3 + 3){
    flatDone = true; addRecord({a:0, flat:true}); setStatus();
  }
  if (st.t + 1e-9 >= nextDot){
    if (thDeg === 0 || !turned){ dots.push(st.s); if (dots.length > 320) dots.shift(); }
    nextDot += 0.1;
  }
  if (st.t + 1e-9 >= nextSamp){
    samples.push([st.t, Math.abs(st.v), 0]); nextSamp += sampGap;
    if (samples.length > 3000){
      var keep = []; for (var i=0;i<samples.length;i++) if (samples[i][2] || i%2 === 0) keep.push(samples[i]);
      samples = keep; sampGap *= 2;
    }
  }
}

/* ===== 그리기 ===== */
var scene = $('scene'), graph = $('graph');
var sc = {w:300,h:200,dpr:1}, gr = {w:300,h:100,dpr:1};
function fit(c){
  var r = c.parentElement.getBoundingClientRect();
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var w = Math.max(1, r.width), h = Math.max(1, r.height);
  c.width = Math.max(1, Math.round(w*dpr)); c.height = Math.max(1, Math.round(h*dpr));
  return {w:w, h:h, dpr:dpr};
}
var START_PAD = 0.16;
function ground(){ return sc.h < 150 ? 28 : 52; }
function ppm(){ return Math.max(20, Math.min((sc.h - ground() - (sc.h < 150 ? 12 : 24))/(H + 0.1), sc.w/2.7)); }
function camHome(){ return tr.surf(-START_PAD).x - 0.12; }

function drawScene(){
  var c = scene.getContext('2d'), W = sc.w, Hc = sc.h, k = ppm(), yg = Hc - ground();
  var viewW = W/k, home = camHome();
  var p = tr.pos(st.s);
  if (p.x > camX + 0.68*viewW) camX = p.x - 0.68*viewW;
  if (p.x < camX + 0.28*viewW) camX = Math.max(home, p.x - 0.28*viewW);
  var X = function(x){ return (x - camX)*k; }, Y = function(y){ return yg - y*k; };
  c.setTransform(sc.dpr,0,0,sc.dpr,0,0);
  c.clearRect(0,0,W,Hc);

  // 면(중심 길에서 HB만큼 아래) 표본점
  var ss = [-START_PAD], i, n = 14;
  for (i=0;i<=n;i++) ss.push(tr.s1 + (tr.s2-tr.s1)*i/n);
  if (tr.s4 > tr.s3) for (i=0;i<=n;i++) ss.push(tr.s3 + (tr.s4-tr.s3)*i/n); else ss.push(tr.s3);
  var far = camX + viewW + 0.5;
  ss.push(tr.s4 + Math.max(0.5, (far - tr.xr)/Math.cos(tr.th)));
  var pts = ss.map(function(s){ return tr.surf(s); });

  // 몸체
  c.beginPath(); c.moveTo(X(pts[0].x), Y(pts[0].y));
  for (i=1;i<pts.length;i++) c.lineTo(X(pts[i].x), Y(pts[i].y));
  c.lineTo(X(pts[pts.length-1].x), Hc+2); c.lineTo(X(pts[0].x), Hc+2); c.closePath();
  c.fillStyle = '#eaddd5'; c.fill();
  c.strokeStyle = '#d3c1b7'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(X(pts[0].x), Y(pts[0].y)); c.lineTo(X(pts[0].x), Hc); c.stroke();

  // 경사각 표시(몸체 안쪽)
  var ra = Math.min(0.2*k, 60), q;
  c.strokeStyle = '#a58b7f'; c.lineWidth = 1; c.fillStyle = '#6b564c';
  c.font = '700 11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (k >= 140){
  q = tr.surf(tr.s1);                                   // 왼쪽 빗면 30°
  c.beginPath(); c.moveTo(X(q.x), Y(q.y)); c.lineTo(X(q.x) - ra*1.7, Y(q.y)); c.stroke();
  c.beginPath(); c.arc(X(q.x), Y(q.y), ra, Math.PI, Math.PI + AL); c.stroke();
  c.fillText('30°', X(q.x) - (ra+17)*Math.cos(AL/2), Y(q.y) - (ra+17)*Math.sin(AL/2));
  if (thDeg > 0){                                       // 오른쪽 빗면 θ
    q = tr.surf(tr.s4);
    var ax = X(q.x), ay = Y(q.y);
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + ra*1.7, ay); c.stroke();
    if (thDeg >= 15){
      c.beginPath(); c.arc(ax, ay, ra, -tr.th, 0); c.stroke();
      c.fillText(thDeg + '°', ax + (ra+17)*Math.cos(tr.th/2), ay - (ra+17)*Math.sin(tr.th/2));
    } else c.fillText(thDeg + '°', ax + ra*0.85, ay + 13);
  }
  }

  // 면
  c.beginPath(); c.moveTo(X(pts[0].x), Y(pts[0].y));
  for (i=1;i<pts.length;i++) c.lineTo(X(pts[i].x), Y(pts[i].y));
  c.strokeStyle = '#875a49'; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke();

  // 길이 눈금(한 칸 0.5 m)
  c.strokeStyle = '#a58b7f'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(Math.max(0, X(pts[0].x)), Hc-8); c.lineTo(W, Hc-8); c.stroke();
  for (var m = Math.ceil(Math.max(camX, pts[0].x)*2)/2; m <= camX + viewW + 0.5; m += 0.5){
    c.beginPath(); c.moveTo(X(m), Hc-8); c.lineTo(X(m), Hc-15); c.stroke();
  }

  // 공을 놓은 높이
  c.setLineDash([6,5]); c.strokeStyle = '#c0876f'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(0, Y(H)); c.lineTo(W, Y(H)); c.stroke(); c.setLineDash([]);

  // 0.1초 자국(공 중심)
  c.fillStyle = 'rgba(135,90,73,.5)';
  var rd = Math.max(2, Math.min(4, HB*k*0.3));
  for (i=0;i<dots.length;i++){
    var d = tr.pos(dots[i]), dx = X(d.x); if (dx < -10 || dx > W+10) continue;
    c.beginPath(); c.arc(dx, Y(d.y), rd, 0, Math.PI*2); c.fill();
  }
  var ball = function(s, ghost){
    var o = tr.pos(s), r = HB*k, bx = X(o.x), by = Y(o.y);
    if (ghost){
      c.setLineDash([4,3]); c.strokeStyle = '#e5484d'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(bx, by, r, 0, Math.PI*2); c.stroke(); c.setLineDash([]);
    } else {
      c.beginPath(); c.arc(bx, by, r, 0, Math.PI*2); c.fillStyle = '#e5484d'; c.fill();
      c.beginPath(); c.arc(bx - r*0.3, by - r*0.3, r*0.28, 0, Math.PI*2); c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();
    }
  };
  if (turnS !== null) ball(turnS, true);   // 최고점
  ball(st.s, false);                       // 공
}

function niceStep(span){
  var steps = [1,2,5,10,20,50,100,200,500,1000];
  for (var i=0;i<steps.length;i++) if (span/steps[i] <= 8) return steps[i];
  return 2000;
}
function drawGraph(){
  var c = graph.getContext('2d'), W = gr.w, Hh = gr.h;
  c.setTransform(gr.dpr,0,0,gr.dpr,0,0); c.clearRect(0,0,W,Hh);
  var L = 28, Rm = 28, T = 18, Bm = 18, pw = W-L-Rm, ph = Hh-T-Bm;
  if (pw < 20 || ph < 20) return;
  var tmax = Math.max(4, Math.ceil(st.t + 0.001)), vmax = 4;
  var X = function(t){ return L + pw*t/tmax; }, Y = function(v){ return T + ph*(1 - v/vmax); };
  c.font = '10px sans-serif'; c.lineWidth = 1;
  c.textAlign = 'right'; c.textBaseline = 'middle';
  var vs = ph < 50 ? 2 : 1;
  for (var v=0; v<=vmax; v+=vs){
    c.strokeStyle = v===0 ? '#a58b7f' : '#efe5df'; c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(L+pw, Y(v)); c.stroke();
    c.fillStyle = '#806b61'; c.fillText(String(v), L-5, Y(v));
  }
  c.strokeStyle = '#a58b7f'; c.beginPath(); c.moveTo(L, T); c.lineTo(L, T+ph); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'top';
  var ts = niceStep(tmax);
  for (var t=0; t<=tmax; t+=ts){
    c.strokeStyle = '#a58b7f'; c.beginPath(); c.moveTo(X(t), T+ph); c.lineTo(X(t), T+ph+3); c.stroke();
    c.fillStyle = '#806b61'; c.fillText(String(t), X(t), T+ph+5);
  }
  c.fillStyle = '#806b61'; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText('(m/s)', 3, 7);
  c.textAlign = 'right'; c.textBaseline = 'top'; c.fillText('(s)', W-3, T+ph+5);
  c.beginPath();
  for (var i=0;i<samples.length;i++){
    var sx = X(samples[i][0]), sy = Y(samples[i][1]);
    if (i) c.lineTo(sx, sy); else c.moveTo(sx, sy);
  }
  c.lineTo(X(st.t), Y(Math.abs(st.v)));
  c.strokeStyle = '#e5484d'; c.lineWidth = 2; c.lineJoin = 'round'; c.stroke();
  c.beginPath(); c.arc(X(st.t), Y(Math.abs(st.v)), 3, 0, Math.PI*2); c.fillStyle = '#e5484d'; c.fill();
}
function drawAll(){ drawScene(); drawGraph(); }
function resize(){ sc = fit(scene); gr = fit(graph); drawAll(); }

function frame(now){
  var dt = Math.min(0.05, (now - last)/1000); last = now;
  if (running){
    acc += slow ? dt*0.25 : dt;
    while (acc >= DT){ advance(); acc -= DT; }
    readout(); drawAll();
  }
  requestAnimationFrame(frame);
}

/* ===== 조작 ===== */
function toggleRun(){
  if (!started){ started = true; running = true; dots.push(0); nextDot = 0.1; setStatus(); }
  else running = !running;
  $('go').textContent = running ? '⏸ 일시 정지' : '▶ 계속';
  $('go').className = 'ctrlBtn ' + (running ? 'pause' : 'play');
}
$('go').addEventListener('click', toggleRun);
$('again').addEventListener('click', resetBall);
$('slow').addEventListener('click', function(){
  slow = !slow; this.classList.toggle('active', slow); this.setAttribute('aria-pressed', slow ? 'true' : 'false');
});
$('ang').addEventListener('input', function(){ setAngle(+this.value); });
$('presets').addEventListener('click', function(e){
  var a = e.target && e.target.getAttribute && e.target.getAttribute('data-a');
  if (a !== null && a !== undefined) setAngle(+a);
});
$('clear').addEventListener('click', function(){ records = []; drawRecords(); });
document.addEventListener('keydown', function(e){
  if (e.target && /^(INPUT|BUTTON|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === ' '){ e.preventDefault(); toggleRun(); }
  else if (e.key === 'r' || e.key === 'R' || e.key === 'ㄱ') resetBall();
});

sc = fit(scene); gr = fit(graph);
drawRecords(); setAngle(30);
if (window.ResizeObserver){ var ro = new ResizeObserver(resize); ro.observe($('sceneBox')); ro.observe($('graphBox')); }
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
requestAnimationFrame(function(now){ last = now; requestAnimationFrame(frame); });
})();
</script>
