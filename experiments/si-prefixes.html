<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SI 단위 접두어 탐험 — 통합과학1 · 과학의 기초</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1e2430; --sub:#5b6472; --line:#e6e9ef; --soft:#f5f7fa;
    --point:#3b6cf0;
    --c-tera:#d94a2b; --c-giga:#e8792e; --c-mega:#e09b23; --c-kilo:#b0a423;
    --c-base:#5f9e50; --c-milli:#3fb3a4; --c-micro:#3a95d9; --c-nano:#4a6fe3; --c-pico:#7a52d1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    /* 위 첨자(10⁻⁹의 ⁻⁹ 같은 글자)는 '맑은 고딕'에 글리프가 없다. 그래서 그 글자만
       브라우저가 다른 글꼴로 대신 그려 버려, 바로 옆 숫자와 굵기·크기가 달라 보였다.
       위 첨자를 전부 갖고 있는 Segoe UI를 한글 글꼴보다 앞에 두면 숫자와 위 첨자가
       같은 글꼴로 나온다. 한글은 Segoe UI에 없으니 자연스럽게 뒤의 '맑은 고딕'으로
       넘어간다 — 순서를 바꾸면 위 첨자가 다시 어긋나므로 그대로 둘 것. */
    font-family:'Pretendard','Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
    background:var(--soft); color:var(--ink); line-height:1.55; font-size:16px;
    display:flex; flex-direction:column;
    word-break:keep-all; overflow-wrap:break-word;   /* 한글 어절 중간에서 줄바꿈 금지 */
  }
  sup{font-size:.62em; vertical-align:super;}
  .num{overflow-wrap:anywhere;}                      /* 긴 숫자만 자리에서 줄바꿈 허용 */

  /* ───── 상단: 제목 + 탭 메뉴 ───── */
  header{background:#fff; border-bottom:1px solid var(--line); padding:14px 20px 0; flex:none;}
  .hRow{max-width:1080px; margin:0 auto;}
  .hTitle{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .hTitle h1{font-size:1.25rem; font-weight:800; letter-spacing:-.01em;}
  .hTitle .sub{color:var(--sub); font-size:.85rem; font-weight:600;}
  .tabs{display:flex; gap:4px; margin-top:10px;}
  .tabs button{
    font-family:inherit; font-size:.98rem; font-weight:700; cursor:pointer;
    border:none; background:none; color:var(--sub);
    padding:10px 18px 12px; border-radius:12px 12px 0 0; position:relative; transition:.15s;
  }
  .tabs button:hover{color:var(--ink); background:var(--soft);}
  .tabs button.on{color:var(--point); background:var(--soft);}
  .tabs button.on::after{
    content:""; position:absolute; left:14px; right:14px; bottom:6px; height:3px;
    border-radius:99px; background:var(--point);
  }

  main{flex:1; overflow-y:auto; padding:18px 20px 30px;}
  .panel{max-width:1080px; margin:0 auto; display:none; animation:fade .18s ease-out;}
  .panel.on{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ═══ 탭1: 접두어 탐험 ═══ */
  .strip{display:flex; gap:6px; margin-bottom:14px;}
  .strip button{
    flex:1; min-width:0; cursor:pointer; font-family:inherit;
    background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:9px 2px 7px; text-align:center; transition:.13s;
  }
  .strip button .sym{display:block; font-weight:800; font-size:1.15rem; line-height:1.2;}
  .strip button .ko{display:block; font-size:.72rem; color:var(--sub); white-space:nowrap;}
  .strip button .pw{display:block; font-size:.78rem; font-weight:700; color:var(--sub); white-space:nowrap;}
  .strip button:hover{transform:translateY(-2px);}
  .strip button.on{color:#fff; border-color:transparent; transform:translateY(-3px); box-shadow:0 6px 14px rgba(0,0,0,.14);}
  .strip button.on .ko, .strip button.on .pw{color:rgba(255,255,255,.9);}
  .stripEnds{display:flex; justify-content:space-between; color:var(--sub); font-size:.8rem; font-weight:700; margin:-8px 2px 12px;}

  .detail{
    background:#fff; border:1px solid var(--line); border-radius:18px;
    border-top:6px solid var(--pc,#888); padding:20px 22px;
  }
  .dHead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px;}
  .dHead .symBig{
    width:54px; height:54px; flex:none; border-radius:14px; background:var(--pc);
    color:#fff; font-size:1.6rem; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .dHead .nm{font-size:1.45rem; font-weight:800;}
  .dHead .en{color:var(--sub); font-weight:600;}
  .dHead .pow{font-size:1.35rem; font-weight:800; color:var(--pc);}
  .dHead .mult{
    background:var(--soft); border:1px solid var(--line); border-radius:999px;
    padding:4px 14px; font-size:.9rem; font-weight:700;
  }
  .dGrid{display:grid; grid-template-columns:250px 1fr; gap:16px; margin-top:14px;}
  .dReal{
    background:var(--soft); border:1px solid var(--line); border-radius:14px;
    padding:16px; text-align:center; display:flex; flex-direction:column; justify-content:center; gap:10px;
  }
  .dReal svg{width:110px; height:110px; margin:0 auto;}
  .dReal .rt{font-size:.9rem;}
  .dReal .rt b{color:var(--pc);}
  .dExs{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start;}
  .dEx{
    display:flex; gap:12px; align-items:center; background:var(--soft);
    border:1px solid var(--line); border-radius:12px; padding:11px 13px;
  }
  .dEx .ico{
    width:48px; height:48px; flex:none; border-radius:11px; background:#fff;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .dEx .ico svg{width:36px; height:36px;}
  .dEx .txt{font-size:.88rem; line-height:1.42;}
  .dEx .txt b{display:block; font-size:.92rem;}
  .tip{
    margin-top:14px; border-radius:14px; padding:14px 18px;
    background:#fffaec; border:1.5px solid #f0d78a;
    display:flex; gap:12px; align-items:flex-start;
  }
  .tip .tico{flex:none; font-size:1.3rem; margin-top:1px;}
  .tip .tt{font-size:.95rem;}
  .tip .tt .known{font-weight:800;}
  .tip .tt .so{color:#8a6d1a; font-weight:800;}
  .metaphor{
    margin-top:10px; border-radius:14px; padding:12px 18px; font-size:.93rem;
    background:linear-gradient(90deg, color-mix(in srgb, var(--pc) 9%, #fff), #fff);
    border:1px solid var(--line);
  }
  .metaphor b{color:var(--pc);}

  /* ═══ 탭2: 변환 계산기 ═══ */
  .calc{background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px;}
  .calcRow{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;}
  .calcRow .field{display:flex; flex-direction:column; gap:6px;}
  .calcRow label{font-size:.82rem; font-weight:700; color:var(--sub);}
  .calcRow input, .calcRow select{
    font-family:inherit; font-size:1.1rem; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:12px; background:#fff; color:var(--ink); outline:none;
  }
  /* 펼쳐진 목록의 항목(option)은 글꼴을 따로 상속받지 않는 브라우저가 있어서
     명시해 준다. 이게 없으면 닫힌 상태와 펼친 상태의 글꼴이 서로 다르게 보인다. */
  select, select option{ font-family:inherit; }
  .calcRow input{width:190px;}
  .calcRow input:focus, .calcRow select:focus{border-color:var(--point);}
  .calcErr{color:#c62828; font-weight:600; margin-top:10px; display:none;}
  .calcMain{
    margin-top:16px; background:var(--soft); border:2px solid var(--point); border-radius:14px;
    padding:15px 18px; font-size:1.05rem;
  }
  .calcMain b{font-size:1.2rem; color:var(--point);}
  .calcMain .sci{color:var(--sub); font-size:.92rem; margin-top:3px;}
  .calcTable{margin-top:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:9px;}
  .calcTable .cell{
    background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 13px;
    font-size:.9rem; border-left-width:6px;
  }
  .calcTable .cell .pfx{font-weight:800;}
  .calcTable .cell .val{display:block; margin-top:1px;}
  .calcTable .cell .sci{color:var(--sub); font-size:.82rem;}

  /* ═══ 탭3: 스피드 퀴즈 ═══ */
  .quizWrap{background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; max-width:760px; margin:0 auto;}
  .qStart{text-align:center; padding:30px 10px;}
  .qStart h3{font-size:1.4rem; font-weight:800; margin-bottom:10px;}
  .qStart p{color:var(--sub); margin-bottom:22px;}
  .bigBtn{
    font-family:inherit; font-size:1.1rem; font-weight:800; cursor:pointer;
    background:var(--point); color:#fff; border:none; border-radius:999px; padding:14px 40px;
    box-shadow:0 6px 16px rgba(59,108,240,.3); transition:.15s;
  }
  .bigBtn:hover{transform:translateY(-2px);}
  .qTop{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:800;}
  .qTop .qNo{color:var(--sub); font-size:.95rem;}
  .qTop .qTimer{font-size:1.25rem; font-variant-numeric:tabular-nums;}
  .qTop .qTimer.hurry{color:#d84545; animation:blink .5s infinite alternate;}
  @keyframes blink{from{opacity:1;} to{opacity:.35;}}
  .tBar{height:10px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:20px;}
  .tBar .fill{height:100%; border-radius:99px; background:linear-gradient(90deg,#3b6cf0,#39c0a8); transition:width .1s linear;}
  .tBar .fill.hurry{background:linear-gradient(90deg,#e8792e,#d84545);}
  .qQ{font-size:1.2rem; font-weight:800; margin-bottom:16px; min-height:3em;}
  .qOpts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .qOpts button{
    font-family:inherit; font-size:1.05rem; font-weight:600; text-align:left; cursor:pointer;
    padding:14px 16px; border:1.5px solid var(--line); background:#fff; border-radius:12px; transition:.13s;
  }
  .qOpts button:hover:not(:disabled){border-color:var(--point); transform:translateY(-1px);}
  .qOpts button.correct{background:#e6f6e9; border-color:#2e9e46; font-weight:800;}
  .qOpts button.wrong{background:#fdecec; border-color:#d84545;}
  .qFb{margin-top:14px; font-size:.95rem; font-weight:600; min-height:2.4em;}
  .qFb.ok{color:#22803a;} .qFb.no{color:#c62828;}
  .qEnd{text-align:center; padding:24px 10px;}
  .qEnd .score{font-size:2.2rem; font-weight:800; color:var(--point); margin:8px 0 2px;}
  .qEnd .msg{color:var(--sub); margin-bottom:22px;}

  @media (max-width:760px){
    body{font-size:15px;}
    .strip{flex-wrap:wrap;}
    .strip button{flex:1 1 calc(20% - 6px);}
    .dGrid{grid-template-columns:1fr;}
    .dExs{grid-template-columns:1fr;}
    .dReal svg{width:84px; height:84px;}
    .calcRow input{width:100%;}
    .calcRow .field{flex:1 1 100%;}
    .qOpts{grid-template-columns:1fr;}
    .tabs{gap:2px;}
    .tabs button{padding:8px 8px 10px; font-size:.85rem; white-space:nowrap;}
  }
</style>
</head>
<body>

<header>
  <div class="hRow">
    <div class="hTitle">
      <h1>SI 단위 접두어 탐험</h1>
      <span class="sub">테라(10<sup>12</sup>)부터 피코(10<sup>−12</sup>)까지</span>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="explore" class="on">🔍 접두어 탐험</button>
      <button data-tab="calc">🔄 단위 변환</button>
      <button data-tab="quiz">⏱️ 스피드 퀴즈</button>
    </div>
  </div>
</header>

<main>
  <div class="panel on" id="panel-explore">
    <div class="strip" id="strip"></div>
    <div class="stripEnds"><span>◀ 크다 (×1조)</span><span>작다 (÷1조) ▶</span></div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="panel" id="panel-calc">
    <div class="calc">
      <div class="calcRow">
        <div class="field">
          <label for="calcVal">값</label>
          <input type="text" id="calcVal" value="1500" maxlength="16" inputmode="decimal" autocomplete="off">
        </div>
        <div class="field">
          <label for="calcFrom">접두어</label>
          <select id="calcFrom"></select>
        </div>
        <div class="field">
          <label for="calcUnit">기준 단위</label>
          <select id="calcUnit">
            <option value="m">m (미터 · 길이)</option>
            <option value="g">g (그램 · 질량)</option>
            <option value="s">s (초 · 시간)</option>
            <option value="L">L (리터 · 부피)</option>
            <option value="B">B (바이트 · 정보)</option>
          </select>
        </div>
      </div>
      <div class="calcErr" id="calcErr">숫자만 입력해 주세요. (예: 1500, 0.75, -3.2)</div>
      <div class="calcMain" id="calcMain"></div>
      <div class="calcTable" id="calcTable"></div>
    </div>
  </div>

  <div class="panel" id="panel-quiz">
    <div class="quizWrap" id="quizWrap"></div>
  </div>
</main>

<script>
"use strict";
/* ══════════ 위첨자 표기 (^ 사용 안 함) ══════════ */
const SUPC = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"};
const supTxt = n => String(n).split("").map(c=>SUPC[c]||c).join("");
const supHtml = n => `10<sup>${String(n).replace("-","−")}</sup>`;

/* ══════════ 데이터 ══════════ */
const PREFIXES = [
  {ko:"테라", en:"tera",  sym:"T", exp:12,  color:"var(--c-tera)",  mult:"1조 배"},
  {ko:"기가", en:"giga",  sym:"G", exp:9,   color:"var(--c-giga)",  mult:"10억 배"},
  {ko:"메가", en:"mega",  sym:"M", exp:6,   color:"var(--c-mega)",  mult:"100만 배"},
  {ko:"킬로", en:"kilo",  sym:"k", exp:3,   color:"var(--c-kilo)",  mult:"1000배"},
  {ko:"기준", en:"base",  sym:"1", exp:0,   color:"var(--c-base)",  mult:"1 (기준)"},
  {ko:"밀리", en:"milli", sym:"m", exp:-3,  color:"var(--c-milli)", mult:"1000분의 1"},
  {ko:"마이크로", en:"micro", sym:"μ", exp:-6, color:"var(--c-micro)", mult:"100만분의 1"},
  {ko:"나노", en:"nano",  sym:"n", exp:-9,  color:"var(--c-nano)",  mult:"10억분의 1"},
  {ko:"피코", en:"pico",  sym:"p", exp:-12, color:"var(--c-pico)",  mult:"1조분의 1"},
];
const byExp = e => PREFIXES.find(p=>p.exp===e);

/* ══════════ SVG 아이콘 (모든 예시가 그림으로 표시됨) ══════════ */
const SVG = {
  ssd:`<svg viewBox="0 0 100 100"><rect x="12" y="24" width="76" height="52" rx="10" fill="#39445c"/><rect x="20" y="32" width="26" height="20" rx="4" fill="#3b6cf0"/><g fill="#7a8bb5"><rect x="54" y="32" width="12" height="9" rx="2"/><rect x="70" y="32" width="12" height="9" rx="2"/><rect x="54" y="45" width="12" height="9" rx="2"/><rect x="70" y="45" width="12" height="9" rx="2"/></g><rect x="20" y="60" width="62" height="8" rx="4" fill="#a3b2d6"/><g fill="#e0c53a"><rect x="26" y="76" width="5" height="8"/><rect x="35" y="76" width="5" height="8"/><rect x="44" y="76" width="5" height="8"/><rect x="53" y="76" width="5" height="8"/><rect x="62" y="76" width="5" height="8"/><rect x="71" y="76" width="5" height="8"/></g></svg>`,
  server:`<svg viewBox="0 0 100 100"><rect x="20" y="8" width="60" height="84" rx="8" fill="#39445c"/><rect x="28" y="18" width="44" height="13" rx="4" fill="#7a8bb5"/><rect x="28" y="37" width="44" height="13" rx="4" fill="#7a8bb5"/><rect x="28" y="56" width="44" height="13" rx="4" fill="#7a8bb5"/><circle cx="35" cy="24.5" r="3" fill="#5cf08a"/><circle cx="35" cy="43.5" r="3" fill="#5cf08a"/><circle cx="35" cy="62.5" r="3" fill="#f6a821"/><rect x="30" y="76" width="40" height="7" rx="3.5" fill="#a3b2d6"/></svg>`,
  play:`<svg viewBox="0 0 100 100"><rect x="10" y="24" width="80" height="54" rx="14" fill="#d94a2b"/><polygon points="42,38 42,64 66,51" fill="#fff"/></svg>`,
  wifi:`<svg viewBox="0 0 100 100"><g fill="none" stroke="#3b6cf0" stroke-width="8" stroke-linecap="round"><path d="M18 50 a45 45 0 0 1 64 0"/><path d="M32 66 a26 26 0 0 1 36 0"/></g><circle cx="50" cy="82" r="8" fill="#3b6cf0"/></svg>`,
  ram:`<svg viewBox="0 0 100 100"><rect x="14" y="26" width="72" height="46" rx="6" fill="#2f9e6e"/><rect x="24" y="36" width="22" height="26" rx="3" fill="#1d6b49"/><rect x="54" y="36" width="22" height="26" rx="3" fill="#1d6b49"/><g fill="#e0c53a"><rect x="18" y="72" width="7" height="13"/><rect x="30" y="72" width="7" height="13"/><rect x="42" y="72" width="7" height="13"/><rect x="54" y="72" width="7" height="13"/><rect x="66" y="72" width="7" height="13"/><rect x="78" y="72" width="6" height="13"/></g></svg>`,
  antenna:`<svg viewBox="0 0 100 100"><polygon points="45,44 55,44 63,92 37,92" fill="#7a8bb5"/><circle cx="50" cy="34" r="8" fill="#e8792e"/><g fill="none" stroke="#e8792e" stroke-width="6" stroke-linecap="round"><path d="M31 18 a24 24 0 0 0 0 32"/><path d="M69 18 a24 24 0 0 1 0 32"/></g></svg>`,
  camera:`<svg viewBox="0 0 100 100"><rect x="10" y="30" width="80" height="50" rx="10" fill="#39445c"/><rect x="36" y="20" width="28" height="14" rx="5" fill="#39445c"/><circle cx="50" cy="55" r="17" fill="#a3b2d6"/><circle cx="50" cy="55" r="9" fill="#3b6cf0"/><circle cx="79" cy="40" r="4" fill="#f6a821"/></svg>`,
  file:`<svg viewBox="0 0 100 100"><path d="M26 8 h34 l16 16 v68 h-50 z" fill="#eef2fb" stroke="#7a8bb5" stroke-width="4"/><path d="M60 8 v16 h16" fill="none" stroke="#7a8bb5" stroke-width="4"/><circle cx="42" cy="50" r="6" fill="#f6a821"/><path d="M32 76 l12 -15 8 8 8 -11 10 18 z" fill="#5f9e6e"/></svg>`,
  plant:`<svg viewBox="0 0 100 100"><path d="M14 92 L22 40 h14 L44 92 z" fill="#a3b2d6"/><path d="M56 92 L62 52 h12 L82 92 z" fill="#7a8bb5"/><polygon points="58,8 44,42 54,42 46,72 68,34 57,34 64,8" fill="#f6a821"/></svg>`,
  scale:`<svg viewBox="0 0 100 100"><rect x="12" y="56" width="76" height="30" rx="9" fill="#3b6cf0"/><path d="M30 56 a20 20 0 0 1 40 0 z" fill="#eef2fb"/><line x1="50" y1="54" x2="60" y2="42" stroke="#d94a2b" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="55" r="4" fill="#39445c"/></svg>`,
  road:`<svg viewBox="0 0 100 100"><rect x="0" y="70" width="100" height="30" fill="#5f9e6e"/><polygon points="38,8 62,8 86,92 14,92" fill="#5b6472"/><line x1="50" y1="12" x2="50" y2="90" stroke="#fff" stroke-width="5" stroke-dasharray="10 12"/></svg>`,

/* ══════════ 탭 전환 ══════════ */
const tabs = document.getElementById("tabs");
tabs.addEventListener("click", e=>{
  const btn = e.target.closest("button"); if(!btn) return;
  [...tabs.children].forEach(b=>b.classList.toggle("on", b===btn));
  document.querySelectorAll(".panel").forEach(p=>
    p.classList.toggle("on", p.id === "panel-"+btn.dataset.tab));
  if(btn.dataset.tab !== "quiz") stopTimer();
});

/* ══════════ 탭1: 접두어 탐험 ══════════ */
const strip = document.getElementById("strip");
const detail = document.getElementById("detail");

PREFIXES.forEach(p=>{
  const b = document.createElement("button");
  b.dataset.exp = p.exp;
  b.innerHTML = `<span class="sym">${p.sym}</span><span class="ko">${p.ko}</span><span class="pw">10${supTxt(p.exp)}</span>`;
  b.addEventListener("click", ()=>showPrefix(p.exp));
  strip.appendChild(b);
});

function showPrefix(exp){
  const p = byExp(exp);
  const d = DETAIL[exp];
  [...strip.children].forEach(btn=>{
    const on = +btn.dataset.exp === exp;
    btn.classList.toggle("on", on);
    btn.style.background = on ? p.color : "";
  });
  detail.style.setProperty("--pc", p.color);

  const head = exp===0
    ? `<div class="symBig">1</div><span class="nm">기준 단위</span><span class="en">base unit — m,&nbsp;g,&nbsp;s,&nbsp;L …</span><span class="pow">= ${supHtml(0)} =&nbsp;1</span>`
    : `<div class="symBig">${p.sym}</div><span class="nm">${p.ko}</span><span class="en">${p.en}</span><span class="pow">= ${supHtml(exp)}</span><span class="mult">기준의 ${p.mult}</span>`;

  detail.innerHTML =
    `<div class="dHead">${head}</div>` +
    `<div class="dGrid">` +
      `<div class="dReal">${SVG[d.icon]}<div class="rt">${d.real}</div></div>` +
      `<div class="dExs">` +
        d.exs.map(([ic,t,txt])=>`<div class="dEx"><div class="ico">${SVG[ic]}</div><div class="txt"><b>${t}</b>${txt}</div></div>`).join("") +
      `</div>` +
    `</div>` +
    `<div class="tip"><div class="tico">💡</div><div class="tt">` +
      `<span class="known">이미 알고 있는 것 — ${d.tip.known}.</span><br>` +
      `<span class="so">그러니까 → </span>${d.tip.so}` +
    `</div></div>` +
    `<div class="metaphor"><b>감 잡기</b> · ${d.meta}</div>`;
}
showPrefix(-9);

/* ══════════ 탭2: 변환 계산기 (문자열 자리이동 → 오차 없음) ══════════ */
const calcVal = document.getElementById("calcVal");
const calcFrom = document.getElementById("calcFrom");
const calcUnit = document.getElementById("calcUnit");
const calcErr = document.getElementById("calcErr");
const calcMain = document.getElementById("calcMain");
const calcTable = document.getElementById("calcTable");

PREFIXES.forEach(p=>{
  const o = document.createElement("option");
  o.value = p.exp;
  o.textContent = p.exp===0 ? "기준 단위" : `${p.ko} ${p.sym} = 10${supTxt(p.exp)}`;
  calcFrom.appendChild(o);
});
calcFrom.value = "-9";

function parseDec(str){
  let m = /^\s*(-?)(\d+)(?:\.(\d+))?\s*$/.exec(str);
  if(m) return normDec(m[1]==="-", m[2]+(m[3]||""), -(m[3]||"").length);
  m = /^\s*(-?)\.(\d+)\s*$/.exec(str);
  if(m) return normDec(m[1]==="-", m[2], -m[2].length);
  return null;
}
function normDec(neg, digits, exp){
  digits = digits.replace(/^0+/, "");
  if(digits === "") return {neg:false, digits:"0", exp:0, zero:true};
  const tz = digits.match(/0+$/);
  if(tz){ digits = digits.slice(0, -tz[0].length); exp += tz[0].length; }
  return {neg, digits, exp, zero:false};
}
function decToPlain(d){
  if(d.zero) return "0";
  let s;
  if(d.exp >= 0){
    s = (d.digits + "0".repeat(d.exp)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }else{
    const k = -d.exp;
    if(k < d.digits.length){
      let ip = d.digits.slice(0, d.digits.length-k).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      s = ip + "." + d.digits.slice(d.digits.length-k);
    }else{
      s = "0." + "0".repeat(k - d.digits.length) + d.digits;
    }
  }
  return (d.neg?"−":"") + s;
}
function decToSci(d){
  if(d.zero) return "0";
  const n = d.digits.length - 1 + d.exp;
  let mant = d.digits[0] + (d.digits.length>1 ? "."+d.digits.slice(1,7) : "");
  if(d.digits.length>7) mant += "…";
  return `${d.neg?"−":""}${mant}&nbsp;×&nbsp;${supHtml(n)}`;
}
function convert(){
  const parsed = parseDec(calcVal.value);
  if(!parsed){
    calcErr.style.display = "block";
    calcMain.innerHTML = ""; calcTable.innerHTML = "";
    return;
  }
  calcErr.style.display = "none";
  const fromExp = parseInt(calcFrom.value, 10);
  const unit = calcUnit.value;
  const fromPfx = byExp(fromExp);

  calcMain.innerHTML =
    `<b class="num">${decToPlain(parsed)}&nbsp;${fromExp===0?"":fromPfx.sym}${unit}</b> 은(는)…` +
    `<div class="sci num">=&nbsp;${decToSci(parsed)}&nbsp;${fromExp===0?"":fromPfx.sym}${unit}` +
    ` = 기준 단위로 ${decToSci({...parsed, exp:parsed.exp+fromExp})}&nbsp;${unit}</div>`;

  /* 모든 접두어를 같은 형식(일반 숫자 + 지수 표기)으로 통일해서 표시 */
  calcTable.innerHTML = "";
  PREFIXES.forEach(p=>{
    const shifted = {...parsed, exp: parsed.exp + fromExp - p.exp};
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.borderLeftColor = p.color;
    const symTxt = p.exp===0 ? unit : p.sym+unit;
    cell.innerHTML =
      `<span class="pfx" style="color:${p.color}">${p.exp===0?"기준":p.ko} (${symTxt})</span>` +
      `<span class="val num"><b>${decToPlain(shifted)}</b>&nbsp;${symTxt}</span>` +
      `<span class="sci num">=&nbsp;${decToSci(shifted)}&nbsp;${symTxt}</span>`;
    if(p.exp===fromExp){ cell.style.background="#eef3ff"; }
    calcTable.appendChild(cell);
  });
}
["input","change"].forEach(ev=>{
  calcVal.addEventListener(ev, convert);
  calcFrom.addEventListener(ev, convert);
  calcUnit.addEventListener(ev, convert);
});
convert();

/* ══════════ 탭3: 스피드 퀴즈 (문제 은행에서 매번 랜덤 출제) ══════════ */
const QUIZ_POOL = [
  {q:"1&nbsp;km는 몇 m일까?", opts:["10&nbsp;m","100&nbsp;m","1000&nbsp;m","10,000&nbsp;m"], ans:2,
   fb:"킬로(k) =&nbsp;1000배 =&nbsp;10³. 그래서 1&nbsp;km =&nbsp;1000&nbsp;m."},
  {q:"우유 1&nbsp;L =&nbsp;1000&nbsp;mL. 그렇다면 밀리(m)가 뜻하는 것은?", opts:["10³ (1000배)","10⁻³ (1000분의 1)","10⁻⁶ (100만분의 1)","10⁻⁹ (10억분의 1)"], ans:1,
   fb:"1&nbsp;mL는 1&nbsp;L의 1000분의 1이므로 밀리 =&nbsp;10⁻³."},
  {q:"휴대폰 데이터 1&nbsp;GB는 몇 MB일까?", opts:["100&nbsp;MB","1000&nbsp;MB","10,000&nbsp;MB","100만&nbsp;MB"], ans:1,
   fb:"기가(10⁹)는 메가(10⁶)의 1000배. 1&nbsp;GB =&nbsp;1000&nbsp;MB."},
  {q:"머리카락 굵기는 약&nbsp;80&nbsp;μm. 이것을 nm로 바꾸면?", opts:["800&nbsp;nm","8,000&nbsp;nm","80,000&nbsp;nm","800,000&nbsp;nm"], ans:2,
   fb:"1&nbsp;μm =&nbsp;1000&nbsp;nm이므로 80&nbsp;μm =&nbsp;80,000&nbsp;nm."},
  {q:"10⁻⁹(10억분의 1)을 뜻하는 접두어는?", opts:["밀리 m","마이크로 μ","나노 n","피코 p"], ans:2,
   fb:"나노(n) =&nbsp;10⁻⁹. 밀리는 10⁻³, 마이크로는 10⁻⁶."},
  {q:"코로나바이러스의 지름은 약&nbsp;100 ___. 빈칸에 알맞은 단위는?", opts:["mm","μm","nm","pm"], ans:2,
   fb:"바이러스는 약&nbsp;100&nbsp;nm. 세균(μm 크기)보다 훨씬 작아요."},
  {q:"2500&nbsp;m를 km로 바꾸면?", opts:["0.25&nbsp;km","2.5&nbsp;km","25&nbsp;km","250&nbsp;km"], ans:1,
   fb:"1000&nbsp;m =&nbsp;1&nbsp;km이므로 2500&nbsp;÷&nbsp;1000 =&nbsp;2.5&nbsp;km."},
  {q:"SSD 1&nbsp;TB =&nbsp;1000 ___. 빈칸은?", opts:["MB","GB","kB","PB"], ans:1,
   fb:"테라(10¹²)는 기가(10⁹)의 1000배. 1&nbsp;TB =&nbsp;1000&nbsp;GB."},
  {q:"메가(M)가 뜻하는 것은?", opts:["1000배","100만 배 (10⁶)","10억 배 (10⁹)","100만분의 1"], ans:1,
   fb:"메가(M) =&nbsp;10⁶ =&nbsp;100만 배. 12&nbsp;MP 카메라 =&nbsp;1200만 화소."},
  {q:"1&nbsp;kg은 몇 g일까?", opts:["10&nbsp;g","100&nbsp;g","1000&nbsp;g","10,000&nbsp;g"], ans:2,
   fb:"킬로(k) =&nbsp;1000배이므로 1&nbsp;kg =&nbsp;1000&nbsp;g."},
  {q:"타이레놀 1정 =&nbsp;500&nbsp;mg. 이것을 g으로 바꾸면?", opts:["0.05&nbsp;g","0.5&nbsp;g","5&nbsp;g","50&nbsp;g"], ans:1,
   fb:"1000&nbsp;mg =&nbsp;1&nbsp;g이므로 500&nbsp;mg =&nbsp;0.5&nbsp;g."},
  {q:"적혈구의 지름은 약&nbsp;7~8 ___. 빈칸에 알맞은 단위는?", opts:["mm","μm","nm","pm"], ans:1,
   fb:"적혈구는 약&nbsp;7~8&nbsp;μm — 머리카락 단면에 약&nbsp;10개가 들어가는 크기."},
  {q:"DNA 이중나선의 폭은 약&nbsp;2 ___. 빈칸은?", opts:["mm","μm","nm","pm"], ans:2,
   fb:"DNA 폭은 약&nbsp;2&nbsp;nm. 나노 세계의 대표 주자예요."},
  {q:"초미세먼지 PM2.5는 지름 2.5 ___ 이하의 먼지. 빈칸은?", opts:["mm","μm","nm","cm"], ans:1,
   fb:"PM2.5 = 지름 2.5&nbsp;μm 이하. 적혈구(7~8&nbsp;μm)보다도 작아요."},
  {q:"1&nbsp;μm는 1&nbsp;m의 몇분의 1일까?", opts:["1000분의 1","1만분의 1","100만분의 1","10억분의 1"], ans:2,
   fb:"마이크로(μ) =&nbsp;10⁻⁶ =&nbsp;100만분의 1."},
  {q:"테라(T)는 기가(G)의 몇 배일까?", opts:["10배","100배","1000배","100만 배"], ans:2,
   fb:"접두어는 한 칸에 1000배씩. 10⁹&nbsp;×&nbsp;1000 =&nbsp;10¹²."},
  {q:"1&nbsp;ms(밀리초)는 얼마나 짧은 시간일까?", opts:["10분의 1초","100분의 1초","1000분의 1초","100만분의 1초"], ans:2,
   fb:"밀리(m) =&nbsp;10⁻³이므로 1&nbsp;ms =&nbsp;1000분의 1초."},
  {q:"3.5&nbsp;km는 몇 m일까?", opts:["35&nbsp;m","350&nbsp;m","3500&nbsp;m","35,000&nbsp;m"], ans:2,
   fb:"1&nbsp;km =&nbsp;1000&nbsp;m이므로 3.5&nbsp;×&nbsp;1000 =&nbsp;3500&nbsp;m."},
  {q:"0.007&nbsp;m를 mm로 바꾸면?", opts:["0.7&nbsp;mm","7&nbsp;mm","70&nbsp;mm","700&nbsp;mm"], ans:1,
   fb:"1&nbsp;m =&nbsp;1000&nbsp;mm이므로 0.007&nbsp;×&nbsp;1000 =&nbsp;7&nbsp;mm."},
  {q:"수소 원자의 지름은 약&nbsp;100 ___. 빈칸은?", opts:["μm","nm","pm","mm"], ans:2,
   fb:"수소 원자는 약&nbsp;100&nbsp;pm =&nbsp;0.1&nbsp;nm. 원자의 세계는 피코 규모예요."},
  {q:"와이파이 주파수 2.4&nbsp;GHz — 전파가 1초에 몇 번 진동할까?", opts:["240만 번","2400만 번","2억 4000만 번","24억 번"], ans:3,
   fb:"기가(G) =&nbsp;10⁹이므로 2.4&nbsp;GHz =&nbsp;24억&nbsp;Hz."},
  {q:"접두어를 큰 것부터 순서대로 나열하면?", opts:["T → G → M → k","G → T → k → M","M → G → T → k","k → M → G → T"], ans:0,
   fb:"테라(10¹²) → 기가(10⁹) → 메가(10⁶) → 킬로(10³) 순서."},
];
/* 한 번에 출제되는 문항 수 */
const QUIZ_COUNT = 8;
const TIME_LIMIT = 15;
const quizWrap = document.getElementById("quizWrap");
let quizSet, qIdx, qCorrect, timerId, qLocked;

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* 풀에서 랜덤으로 뽑고, 보기 순서도 섞는다 */
function drawQuiz(){
  return shuffle(QUIZ_POOL).slice(0, QUIZ_COUNT).map(item=>{
    const order = shuffle([0,1,2,3].slice(0, item.opts.length));
    return {
      q:item.q, fb:item.fb,
      opts:order.map(i=>item.opts[i]),
      ans:order.indexOf(item.ans),
    };
  });
}

function quizStart(){
  quizWrap.innerHTML =
    `<div class="qStart">
      <h3>⏱️ 스피드 퀴즈</h3>
      <p>문제 은행 ${QUIZ_POOL.length}문제 중 <b>${QUIZ_COUNT}문제</b>가 랜덤으로 출제됩니다.<br>문항당 <b>${TIME_LIMIT}초</b> 제한 — 시간 안에 못 고르면 오답!</p>
      <button class="bigBtn" id="qGo">시작하기</button>
    </div>`;
  document.getElementById("qGo").addEventListener("click", ()=>{
    quizSet = drawQuiz();
    qIdx = 0; qCorrect = 0;
    showQuestion();
  });
}
function showQuestion(){
  stopTimer();
  qLocked = false;
  const item = quizSet[qIdx];
  quizWrap.innerHTML =
    `<div class="qTop">
      <span class="qNo">문제 ${qIdx+1} / ${quizSet.length} · 맞힌 개수 ${qCorrect}</span>
      <span class="qTimer" id="qTimer">${TIME_LIMIT}초</span>
    </div>
    <div class="tBar"><div class="fill" id="tFill" style="width:100%"></div></div>
    <div class="qQ">${item.q}</div>
    <div class="qOpts" id="qOpts"></div>
    <div class="qFb" id="qFb"></div>`;
  const opts = document.getElementById("qOpts");
  item.opts.forEach((op, oi)=>{
    const b = document.createElement("button");
    b.innerHTML = `${["①","②","③","④"][oi]} ${op}`;
    b.addEventListener("click", ()=>answer(oi));
    opts.appendChild(b);
  });
  const t0 = Date.now();
  timerId = setInterval(()=>{
    const remain = Math.max(0, TIME_LIMIT - (Date.now()-t0)/1000);
    const timer = document.getElementById("qTimer");
    const fill = document.getElementById("tFill");
    if(!timer || !fill){ stopTimer(); return; }
    timer.textContent = Math.ceil(remain) + "초";
    fill.style.width = (remain/TIME_LIMIT*100) + "%";
    const hurry = remain <= 5;
    timer.classList.toggle("hurry", hurry);
    fill.classList.toggle("hurry", hurry);
    if(remain <= 0) answer(-1);
  }, 100);
}
function answer(oi){
  if(qLocked) return;
  qLocked = true;
  stopTimer();
  const item = quizSet[qIdx];
  const opts = document.getElementById("qOpts");
  const fb = document.getElementById("qFb");
  [...opts.children].forEach(b=>b.disabled = true);
  opts.children[item.ans].classList.add("correct");
  if(oi === item.ans){
    qCorrect++;
    fb.className = "qFb ok";
    fb.innerHTML = "⭕ 정답! " + item.fb;
  }else if(oi === -1){
    fb.className = "qFb no";
    fb.innerHTML = "⏰ 시간 초과! " + item.fb;
  }else{
    opts.children[oi].classList.add("wrong");
    fb.className = "qFb no";
    fb.innerHTML = "❌ 아쉬워요. " + item.fb;
  }
  setTimeout(()=>{
    qIdx++;
    if(qIdx < quizSet.length) showQuestion();
    else quizEnd();
  }, 2200);
}
function quizEnd(){
  const perfect = qCorrect === quizSet.length;
  quizWrap.innerHTML =
    `<div class="qEnd">
      <div>최종 결과</div>
      <div class="score">${qCorrect} / ${quizSet.length}</div>
      <div class="msg">${perfect ? "🎉 완벽해요! 접두어 마스터!" : qCorrect >= quizSet.length*0.6 ? "👍 잘했어요! 다시 하면 새로운 문제가 나와요." : "💪 탐험 탭에서 TIP을 다시 보고 도전!"}</div>
      <button class="bigBtn" id="qRetry">다시 도전 (새 문제)</button>
    </div>`;
  document.getElementById("qRetry").addEventListener("click", quizStart);
}
quizStart();
</script>
