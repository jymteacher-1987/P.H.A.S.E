<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자유낙하 vs 수평 투사 비교 실험</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:#eef3fb; color:#1f2d3d; display:flex; flex-direction:column; align-items:center;
    word-break:keep-all; overflow-wrap:break-word; }
  h1 { font-size:clamp(15px,1.7vw,20px); margin:6px 0 6px; text-align:center; }

  .stageRow { display:flex; gap:10px; justify-content:center; align-items:stretch; flex-wrap:wrap;
    width:100%; max-width:980px; padding:0 12px; margin:0 auto; }
  .stage { flex:1 1 300px; min-width:260px; }
  @media (max-width:520px){
    .stage { flex:1 1 100%; min-width:0; }
    .grp { padding:9px 10px; }
    h1 { font-size:16px; }
  }
  .card { background:#fff; border-radius:12px; padding:8px; box-shadow:0 3px 12px rgba(40,70,120,.12); }
  .cap { font-size:11px; font-weight:800; color:#33465e; margin:0 3px 4px; }
  canvas { display:block; background:#f2f7ff; border-radius:8px; width:100%; height:auto; }

  .controls { display:flex; gap:10px; justify-content:center; align-items:stretch; flex-wrap:wrap;
    width:100%; max-width:980px; padding:10px 12px; margin:0 auto; }
  .grp { background:#fff; border-radius:12px; padding:9px 11px; box-shadow:0 3px 12px rgba(40,70,120,.12); }
  .g1 { flex:1 1 300px; } .g2 { flex:1 1 285px; } .g3 { flex:1 1 215px; }
  .gl { font-size:10.5px; font-weight:800; color:#7086a3; letter-spacing:.2px; margin:8px 1px 4px; }
  .gl:first-child { margin-top:0; }
  .ctrlRow { display:flex; gap:7px; }
  .ctrlBtn { flex:1; padding:8px 6px; font-size:13px; font-weight:800; border:none; border-radius:9px; cursor:pointer; color:#fff; }
  .play { background:#1eaf6b; } .pause { background:#e0912a; } .reset { background:#8394ab; }
  .modeRow { display:flex; gap:5px; flex-wrap:wrap; }
  .modeBtn { flex:1 1 auto; padding:6px 5px; font-size:11.5px; font-weight:700; border:2px solid #cfdaeb;
    background:#f3f7fd; color:#3a4c66; border-radius:8px; cursor:pointer; transition:.15s; min-width:54px; }
  .modeBtn.active { background:#2f6df0; border-color:#2f6df0; color:#fff; }
  .chk { display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:2px 2px; cursor:pointer; }
  .chk input { width:14px; height:14px; accent-color:#2f6df0; }
  .sw { width:12px; height:4px; border-radius:2px; display:inline-block; }
  .hintTiny { font-size:10px; color:#7086a3; margin-top:5px; line-height:1.4; }
  .hintTiny b { color:#2f6df0; }
  .field { margin-bottom:5px; }
  .field label { display:flex; justify-content:space-between; font-size:11px; margin-bottom:1px; font-weight:600; }
  .field label span { color:#2f6df0; font-weight:800; }
  input[type=range] { width:100%; accent-color:#2f6df0; height:14px; margin:0; }
  .presetRow { display:flex; gap:4px; margin-top:3px; }
  .preset { flex:1; padding:4px 3px; font-size:10.5px; font-weight:700; border:1px solid #cfdaeb; background:#f3f7fd; color:#3a4c66; border-radius:6px; cursor:pointer; }
  .preset.active { background:#2f6df0; color:#fff; border-color:#2f6df0; }
  .readout { font-size:11.5px; line-height:1.7; }
  .readout .row { display:flex; justify-content:space-between; gap:12px; }
  .readout b { color:#2f6df0; }
  .dotA { color:#e5484d; } .dotB { color:#0e9bb0; }
  .land { color:#e0912a; font-weight:800; }
</style>
</head>
<body>
  <h1>자유낙하 vs 수평으로 던진 물체</h1>

  <!-- 위: 시뮬레이션 + 그래프 나란히 -->
  <div class="stageRow">
    <div class="card stage">
      <div class="cap">관찰</div>
      <canvas id="cv" width="440" height="300"></canvas>
    </div>
    <div class="card stage">
      <div class="cap">그래프 <span style="font-weight:600;color:#7086a3;">— 마우스를 올리면 접선·기울기</span></div>
      <canvas id="gcv" width="440" height="300" style="cursor:crosshair; touch-action:none;"></canvas>
    </div>
  </div>

  <!-- 아래: 조작/선택/수치 -->
  <div class="controls">
    <div class="grp g1">
      <div class="gl">재생</div>
      <div class="ctrlRow">
        <button class="ctrlBtn play" id="playBtn">▶ 시작</button>
        <button class="ctrlBtn reset" id="resetBtn">↻ 초기화</button>
      </div>
      <div class="gl">관찰 방식</div>
      <div class="modeRow">
        <button class="modeBtn active" data-mode="real">실제 속도</button>
        <button class="modeBtn" data-mode="slow">슬로우</button>
        <button class="modeBtn" data-mode="strobe">다중 섬광</button>
      </div>
      <div class="gl">변인 조절 <span style="font-weight:600;color:#9aa8bd;">(높이 40m, g = 9.8 m/s<sup>2</sup> 고정)</span></div>
      <div class="field">
        <label>수평 초기속도 v₀ <span id="v0Val">6.0 m/s</span></label>
        <input type="range" id="v0" min="1" max="14" step="0.5" value="6">
      </div>
      <div class="field">
        <label>섬광 간격 Δt <span id="dtVal">0.20 s</span></label>
        <input type="range" id="dt" min="0.1" max="0.6" step="0.05" value="0.2">
      </div>
    </div>

    <div class="grp g2">
      <div class="gl">그래프 종류</div>
      <div class="modeRow">
        <button class="modeBtn active" data-g="pos">위치-시간</button>
        <button class="modeBtn" data-g="vel">속도-시간</button>
      </div>
      <div class="gl">표시 곡선</div>
      <label class="chk"><input type="checkbox" id="c_fy" checked><span class="sw" style="background:#e5484d"></span>자유낙하 (수직 y)</label>
      <label class="chk"><input type="checkbox" id="c_py" checked><span class="sw" style="background:#e08a1e"></span>수평투사 (수직 y)</label>
      <label class="chk"><input type="checkbox" id="c_px" checked><span class="sw" style="background:#0e9bb0"></span>수평투사 (수평 x)</label>
      <div class="hintTiny"><b>위치-시간 그래프</b>의 기울기는 속도를, <b>속도-시간 그래프</b>의 기울기는 가속도를 뜻합니다. 자유낙하와 수평투사의 수직(y) 운동은 완전히 같아서 두 곡선이 서로 겹칩니다.</div>
    </div>

    <div class="grp g3">
      <div class="gl">수치</div>
      <div class="readout">
        <div class="row"><span>경과 시간</span><b id="tOut">0.00 s</b></div>
        <div class="row"><span class="dotA">● 자유낙하</span><span>수평 <b>0</b> · 수직 <b id="yAOut">0.0</b> m</span></div>
        <div class="row"><span class="dotB">● 수평 투사</span><span>수평 <b id="xOut">0.0</b> · 수직 <b id="yBOut">0.0</b> m</span></div>
        <div class="row"><span>수직 거리(두 공 같음)</span><b id="yOut">0.0 m</b></div>
        <div class="row"><span>착지 예상</span><b id="landOut">— s</b></div>
        <div id="landMsg" style="text-align:center;margin-top:4px;"></div>
      </div>
    </div>
  </div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); const W=cv.width,H=cv.height;
const gcv=document.getElementById('gcv'), gtx=gcv.getContext('2d'); const GW=gcv.width,GH=gcv.height;

const margin={left:40,right:22,top:32,bottom:42};
const plotW=W-margin.left-margin.right, plotH=H-margin.top-margin.bottom;

let state={ mode:'real', v0:6, h:40, dt:0.2, g:9.8, t:0, playing:false, finished:false,
  lastFrame:null, graph:'pos', hoverT:null, curves:{fy:true,py:true,px:true} };

const fallT=()=>Math.sqrt(2*state.h/state.g);
const OX=margin.left+22;                          // 출발점 x
const availW=()=>(margin.left+plotW)-OX-6;
const S=()=>plotH/state.h;                        // 가로·세로 동일 축척(실제 1:1 비율) · 지면은 화면 맨 아래
const pyOf=ym=>margin.top+ym*S();
function posA(ym){ return [OX, pyOf(ym)]; }
function posB(xm,ym){ return [OX+xm*S(), pyOf(ym)]; }

// ===== 관찰 =====
function drawBG(){
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#eaf2ff'; ctx.fillRect(0,0,W,H);
  const gy=pyOf(state.h);
  ctx.fillStyle=state.finished?'rgba(224,145,42,.22)':'#f7e3bf'; ctx.fillRect(margin.left,gy,plotW,H-gy-2);
  ctx.strokeStyle=state.finished?'#e0912a':'#c9a978'; ctx.lineWidth=state.finished?4:2;
  ctx.beginPath(); ctx.moveTo(margin.left,gy); ctx.lineTo(margin.left+plotW,gy); ctx.stroke();
  ctx.fillStyle='#8aa0bd'; ctx.font='12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('출발 높이',margin.left+4,margin.top-12);
  ctx.fillText('지면',margin.left+4,Math.min(gy+16,H-6));
}
function ballData(t){ const y=Math.min(0.5*state.g*t*t,state.h); const xB=state.v0*t; return {A:posA(y),B:posB(xB,y),xB,y}; }
function drawBall(px,py,color){ ctx.beginPath(); ctx.arc(px,py,10,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.stroke(); }
function drawStrobe(tNow){
  const T=fallT(), tEnd=Math.min(tNow,T);
  const N=Math.floor(tEnd/state.dt+1e-9);
  for(let k=0;k<=N;k++){ const tk=k*state.dt; const d=ballData(tk);
    ctx.strokeStyle='rgba(120,150,200,.38)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(margin.left,d.A[1]); ctx.lineTo(margin.left+plotW,d.A[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d.B[0],margin.top+16); ctx.lineTo(d.B[0],pyOf(state.h)); ctx.stroke(); ctx.setLineDash([]);
    const a=0.28+0.62*(tk/(T||1));
    drawBall(d.A[0],d.A[1],`rgba(229,72,77,${a})`); drawBall(d.B[0],d.B[1],`rgba(14,155,176,${a})`); }
  // 착지 순간(비등간격) 공은 제외 → 재생 중 현재 공만 표시, 끝나면 등간격 잔상만 남김
  if(!state.finished){ const c=ballData(tEnd); drawBall(c.A[0],c.A[1],'#e5484d'); drawBall(c.B[0],c.B[1],'#0e9bb0'); }
  if(N>=1){
    ctx.fillStyle='#2f6df0'; ctx.font='11px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='top';
    ctx.fillText('수평 간격 일정', margin.left+plotW, margin.top-13);
  }
}
function renderSim(){
  drawBG(); const T=fallT(), tc=Math.min(state.t,T);
  if(state.mode==='strobe'){ drawStrobe(state.t); }
  else{
    ctx.strokeStyle='rgba(14,155,176,.28)'; ctx.lineWidth=2; ctx.beginPath();
    for(let tt=0;tt<=tc;tt+=0.02){const q=ballData(tt); tt===0?ctx.moveTo(q.B[0],q.B[1]):ctx.lineTo(q.B[0],q.B[1]);} ctx.stroke();
    ctx.strokeStyle='rgba(229,72,77,.28)'; ctx.beginPath();
    for(let tt=0;tt<=tc;tt+=0.02){const q=ballData(tt); tt===0?ctx.moveTo(q.A[0],q.A[1]):ctx.lineTo(q.A[0],q.A[1]);} ctx.stroke();
    const d=ballData(tc); drawBall(d.A[0],d.A[1],'#e5484d'); drawBall(d.B[0],d.B[1],'#0e9bb0');
  }
  updateReadout();
}

// ===== 그래프 =====
const gm={l:50,r:20,t:14,b:36};
const gpW=GW-gm.l-gm.r, gpH=GH-gm.t-gm.b;
function curveDefs(){
  if(state.graph==='pos') return [
    {key:'fy',label:'자유낙하 y',color:'#e5484d',dash:[],val:t=>0.5*state.g*t*t, slope:t=>state.g*t},
    {key:'py',label:'수평투사 y',color:'#e08a1e',dash:[7,5],val:t=>0.5*state.g*t*t, slope:t=>state.g*t},
    {key:'px',label:'수평투사 x',color:'#0e9bb0',dash:[],val:t=>state.v0*t, slope:t=>state.v0},
  ];
  return [
    {key:'fy',label:'자유낙하 v_y',color:'#e5484d',dash:[],val:t=>state.g*t, slope:t=>state.g},
    {key:'py',label:'수평투사 v_y',color:'#e08a1e',dash:[7,5],val:t=>state.g*t, slope:t=>state.g},
    {key:'px',label:'수평투사 v_x',color:'#0e9bb0',dash:[],val:t=>state.v0, slope:t=>0},
  ];
}
function niceStep(x){ if(!(x>0))return 1; const e=Math.floor(Math.log10(x)), f=x/Math.pow(10,e);
  const nf=f<1.5?1:f<3?2:f<7?5:10; return nf*Math.pow(10,e); }
function drawGraph(){
  gtx.clearRect(0,0,GW,GH); gtx.fillStyle='#f7fafe'; gtx.fillRect(0,0,GW,GH);
  const T=fallT(), tc=Math.min(state.t,T);
  const defs=curveDefs().filter(d=>state.curves[d.key]);
  const unit=state.graph==='pos'?'m':'m/s';
  const slopeUnit=state.graph==='pos'?'m/s':'m/s²';
  const slopeName=state.graph==='pos'?'속도':'가속도';
  let rawMax=0.0001; curveDefs().forEach(d=>{ rawMax=Math.max(rawMax,d.val(T)); }); // 체크와 무관하게 축 고정
  const stepY=niceStep(rawMax/4), top=Math.ceil(rawMax/stepY-1e-6)*stepY, nY=Math.max(1,Math.round(top/stepY));
  const decY=stepY<1?1:0;
  const gx=t=>gm.l+(t/T)*gpW, gy=v=>gm.t+gpH-(v/top)*gpH;
  gtx.strokeStyle='#e3ebf5'; gtx.lineWidth=1; gtx.font='11px sans-serif'; gtx.fillStyle='#8194ad';
  gtx.textAlign='right'; gtx.textBaseline='middle';
  for(let i=0;i<=nY;i++){ const v=stepY*i, yy=gy(v);
    gtx.beginPath(); gtx.moveTo(gm.l,yy); gtx.lineTo(gm.l+gpW,yy); gtx.stroke();
    if(i>0) gtx.fillText(v.toFixed(decY),gm.l-6,yy); }
  const stepT=niceStep(T/4), decT=stepT<1?1:0;
  gtx.textAlign='center'; gtx.textBaseline='top';
  gtx.fillText('0',gx(0),gm.t+gpH+6);
  for(let t=stepT;t<=T+1e-9;t+=stepT){ gtx.fillText(t.toFixed(decT),gx(t),gm.t+gpH+6); }
  gtx.fillStyle='#5a6b83'; gtx.textAlign='center'; gtx.textBaseline='top';
  gtx.fillText('시간(s)',gm.l+gpW/2,gm.t+gpH+22);
  gtx.save(); gtx.translate(12,gm.t+gpH/2); gtx.rotate(-Math.PI/2); gtx.textAlign='center'; gtx.textBaseline='middle';
  gtx.fillText(state.graph==='pos'?'위치('+unit+')':'속도('+unit+')',0,0); gtx.restore();
  defs.forEach(d=>{
    gtx.strokeStyle=d.color; gtx.lineWidth=2.6; gtx.setLineDash(d.dash); gtx.beginPath();
    for(let t=0;t<=tc+1e-9;t+=T/300){ const xx=gx(t),yy=gy(d.val(t)); t===0?gtx.moveTo(xx,yy):gtx.lineTo(xx,yy);} gtx.stroke();
    gtx.setLineDash([]);
    if(tc>0){ gtx.fillStyle=d.color; gtx.beginPath(); gtx.arc(gx(tc),gy(d.val(tc)),4.5,0,Math.PI*2); gtx.fill(); }
  });
  if(state.hoverT!=null && defs.length && tc>0.03){
    const ht=Math.max(0,Math.min(state.hoverT,tc));
    gtx.strokeStyle='#9aa8bd'; gtx.lineWidth=1; gtx.setLineDash([3,3]);
    gtx.beginPath(); gtx.moveTo(gx(ht),gm.t); gtx.lineTo(gx(ht),gm.t+gpH); gtx.stroke(); gtx.setLineDash([]);
    const lines=[];
    defs.forEach(d=>{
      const v0v=d.val(ht), m=d.slope(ht), span=T*0.34;
      const p1=[gx(ht-span),gy(v0v+m*(-span))], p2=[gx(ht+span),gy(v0v+m*(span))];
      gtx.strokeStyle=d.color; gtx.lineWidth=1.6; gtx.setLineDash([6,4]);
      gtx.beginPath(); gtx.moveTo(p1[0],p1[1]); gtx.lineTo(p2[0],p2[1]); gtx.stroke(); gtx.setLineDash([]);
      gtx.fillStyle=d.color; gtx.beginPath(); gtx.arc(gx(ht),gy(v0v),4,0,Math.PI*2); gtx.fill();
      lines.push({c:d.color,txt:`${d.label}: 기울기 ${m.toFixed(1)} = ${slopeName} ${m.toFixed(1)} ${slopeUnit}`});
    });
    gtx.font='11px sans-serif';
    let bw=0; lines.forEach(l=>bw=Math.max(bw,gtx.measureText(l.txt).width)); bw+=26;
    const bh=lines.length*17+12;
    let bx=gx(ht)+10; if(bx+bw>GW-6) bx=gx(ht)-bw-10; bx=Math.max(4,bx);
    const by=gm.t+2;
    gtx.fillStyle='rgba(255,255,255,.96)'; gtx.strokeStyle='#cdd8e8'; gtx.lineWidth=1;
    roundRect(gtx,bx,by,bw,bh,7); gtx.fill(); gtx.stroke();
    gtx.textBaseline='middle';
    lines.forEach((l,i)=>{ const yy=by+12+i*17; gtx.fillStyle=l.c; gtx.fillRect(bx+8,yy-3,10,6);
      gtx.fillStyle='#33465e'; gtx.textAlign='left'; gtx.fillText(l.txt,bx+22,yy); });
    gtx.fillStyle='#8194ad'; gtx.textAlign='center'; gtx.textBaseline='bottom';
    gtx.fillText('t = '+ht.toFixed(2)+' s',gx(ht),gm.t+gpH-4);
  }
}
function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function render(){ renderSim(); drawGraph(); }

function updateReadout(){
  const T=fallT(), tc=Math.min(state.t,T), y=Math.min(0.5*state.g*tc*tc,state.h);
  document.getElementById('tOut').textContent=tc.toFixed(2)+' s';
  document.getElementById('xOut').textContent=(state.v0*tc).toFixed(1);
  document.getElementById('yAOut').textContent=y.toFixed(1);
  document.getElementById('yBOut').textContent=y.toFixed(1);
  document.getElementById('yOut').textContent=y.toFixed(1)+' m';
  document.getElementById('landOut').textContent=T.toFixed(2)+' s';
  document.getElementById('landMsg').innerHTML=state.finished?'<span class="land">★ 두 공 동시 착지!</span>':'';
}

function loop(ts){
  if(!state.playing)return;
  if(state.lastFrame==null)state.lastFrame=ts;
  const dtReal=(ts-state.lastFrame)/1000; state.lastFrame=ts;
  state.t += dtReal*(state.mode==='slow'?0.25:1.0);
  const T=fallT();
  if(state.t>=T){ state.t=T; state.finished=true; state.playing=false; setPlayBtn(false); }
  render();
  if(state.playing) requestAnimationFrame(loop);
}
function setPlayBtn(p){ const b=document.getElementById('playBtn');
  if(p){b.textContent='❚❚ 일시정지';b.className='ctrlBtn pause';}
  else{b.textContent=state.finished?'▶ 다시':'▶ 시작';b.className='ctrlBtn play';} }
document.getElementById('playBtn').onclick=()=>{
  if(state.finished){state.t=0;state.finished=false;}
  state.playing=!state.playing; setPlayBtn(state.playing);
  if(state.playing){state.lastFrame=null; requestAnimationFrame(loop);} };
document.getElementById('resetBtn').onclick=()=>{
  state.playing=false;state.finished=false;state.t=0;state.lastFrame=null;state.hoverT=null;setPlayBtn(false);render(); };

document.querySelectorAll('.modeBtn[data-mode]').forEach(b=>{ b.onclick=()=>{
  document.querySelectorAll('.modeBtn[data-mode]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  state.mode=b.dataset.mode; render(); };});
document.querySelectorAll('.modeBtn[data-g]').forEach(b=>{ b.onclick=()=>{
  document.querySelectorAll('.modeBtn[data-g]').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  state.graph=b.dataset.g; render(); };});
['fy','py','px'].forEach(k=>{ document.getElementById('c_'+k).onchange=e=>{ state.curves[k]=e.target.checked; drawGraph(); }; });

function bind(id,key,fmt){ const el=document.getElementById(id);
  el.oninput=()=>{ state[key]=parseFloat(el.value); document.getElementById(id+'Val').textContent=fmt(state[key]);
    if(!state.playing){state.t=0;state.finished=false;state.hoverT=null;setPlayBtn(false);} render(); }; }
bind('v0','v0',v=>v.toFixed(1)+' m/s'); bind('dt','dt',v=>v.toFixed(2)+' s');

function hoverMove(e){
  const r=gcv.getBoundingClientRect(); const sx=GW/r.width;
  const cxp=((e.touches?e.touches[0].clientX:e.clientX)-r.left)*sx;
  if(cxp<gm.l||cxp>gm.l+gpW){ if(state.hoverT!=null){state.hoverT=null; if(!state.playing)drawGraph();} return; }
  state.hoverT=(cxp-gm.l)/gpW*fallT(); if(!state.playing) drawGraph();
}
gcv.addEventListener('mousemove',hoverMove);
gcv.addEventListener('mouseleave',()=>{ state.hoverT=null; if(!state.playing)drawGraph(); });
gcv.addEventListener('touchmove',e=>{e.preventDefault();hoverMove(e);},{passive:false});
gcv.addEventListener('touchend',()=>{ state.hoverT=null; if(!state.playing)drawGraph(); });

// v₀ 최대 20 m/s (1:1 비율에서 오른쪽 끝 근처까지 도달)
(function(){ const mx=20;
  const s=document.getElementById('v0'); s.max=mx;
  if(state.v0>mx){ state.v0=mx; s.value=mx; document.getElementById('v0Val').textContent=mx.toFixed(1)+' m/s'; }
})();

render();
</script>
</body>
