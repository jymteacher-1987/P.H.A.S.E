    // Keep these here so the single-file bundle remains portable.

      'grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr));'
    );

      'border-radius:16px; padding:24px; display:flex;',
      'border-radius:16px; padding:clamp(16px,4vw,24px); min-width:0; display:flex;'

    replaceTemplateAll(
      'display:flex; justify-content:space-between; align-items:baseline',

    );
    replaceTemplateAll(
      'border-radius:12px; height:300px; overflow:hidden;',
      'border-radius:12px; height:clamp(230px,70vw,300px); overflow:hidden;'
    );
    replaceTemplateAll(
      'width:170px; height:170px; border-radius:50%;',
      'width:clamp(120px,43vw,170px); height:clamp(120px,43vw,170px); border-radius:50%;'

      'grid-template-columns:64px 1fr 44px; align-items:center; gap:12px',
      'grid-template-columns:clamp(48px,14vw,64px) minmax(0,1fr) clamp(32px,10vw,44px); align-items:center; gap:clamp(6px,2.5vw,12px)'

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where

    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        UUID_SHAPE.test(d.__bundler_page) &&

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head><script defer src=\"../assets/js/visit-entry.js?v=visits-20260909\"><\/script>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"82b0f165-dfc6-47f5-9b28-c2ce05e8c7e5\"><\/script>\n\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>\n\n<\/style>\n<style>\nbody { margin:0; background:#101418; font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif; word-break:keep-all; overflow-wrap:break-word; }\np { text-wrap: pretty; }\n\n/* 좁은 화면(폰)에서 값 표시 박스가 원 위에 겹치던 문제 수정.\n   원은 원래 자리(무대 위에서 150px 기준)에 그대로 두고 무대만 아래로 늘려,\n   생긴 여백에 값 박스를 가로 전체로 깐다.\n   원의 top을 150px로 고정하는 이유: 원래 top:50%라서 무대 높이를 키우면\n   원도 같이 내려와 다시 겹친다. 또 hover 판정(stageHits)이 무대 위에서부터의\n   고정 px를 쓰므로, 원의 실제 위치는 절대 바뀌면 안 된다. */\n@media (max-width: 620px) {\n  .mix-stage { height: 368px !important; }\n  .mix-circle { top: 150px !important; }\n  .mix-readout { left: 8px !important; right: 8px !important; bottom: 8px !important; padding: 7px 10px !important; }\n}\n\na { color:#7fc4ff; } a:hover { color:#b3dcff; }\ninput[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; outline:none; cursor:pointer; }\ninput[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid rgba(0,0,0,0.25); box-shadow:0 1px 4px rgba(0,0,0,0.4); }\n<\/style>\n<\/helmet>\n<div style=\"min-height:100vh; padding:36px 28px 48px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:28px; color:#e8edf2\">\n  <div style=\"text-align:center; display:flex; flex-direction:column; gap:8px\">\n    <div style=\"font-size:13px; letter-spacing:3px; color:#8fa3b5; font-weight:600\">과학 실험 · 색의 합성<\/div>\n    <h1 style=\"margin:0; font-size:34px; font-weight:700\">빛의 3원색 vs 색의 3원색(물감)<\/h1>\n    <p style=\"margin:0; font-size:15px; color:#a9b8c6; max-width:640px\">슬라이더로 세기를 조절하며 색이 어떻게 합성되는지 비교해 보세요.\n      빛은 <strong style=\"color:#fff\">섞을수록 밝아지고(가산 혼합)<\/strong>, 물감은 <strong style=\"color:#fff\">섞을수록 어두워집니다(감산 혼합)<\/strong>.<\/p>\n  <\/div>\n\n  <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(420px, 1fr)); gap:24px; width:100%; max-width:1180px\">\n\n    <!-- 빛의 합성 -->\n    <div style=\"background:#181e26; border:1px solid #2a3442; border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:18px\">\n      <div style=\"display:flex; justify-content:space-between; align-items:baseline\">\n        <h2 style=\"margin:0; font-size:20px; font-weight:700\">빛의 합성 <span style=\"font-size:13px; font-weight:500; color:#8fa3b5\">— 가산 혼합 (R·G·B)<\/span><\/h2>\n        <span style=\"font-size:12px; color:#6f8296\">어두운 스크린에 빛을 비춤<\/span>\n      <\/div>\n      <div class=\"mix-stage\" ref=\"{{ lightRef }}\" sc-camel-on-mouse-move=\"{{ lightMove }}\" sc-camel-on-mouse-leave=\"{{ lightLeave }}\" style=\"position:relative; background:#000; border-radius:12px; height:300px; overflow:hidden; border:1px solid #232c38; cursor:crosshair\">\n        <sc-if value=\"{{ lightTip }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute; left:{{ lightTipX }}px; top:{{ lightTipY }}px; transform:translate(14px,-34px); pointer-events:none; z-index:5; background:rgba(10,14,18,0.92); border:1px solid #3a4759; border-radius:6px; padding:5px 9px; display:flex; align-items:center; gap:7px\"><span style=\"width:15px; height:15px; border-radius:4px; border:1px solid rgba(255,255,255,0.35); background:{{ lightTipColor }}\"><\/span><span style=\"font-size:12.5px; font-weight:600; color:#fff; white-space:nowrap\">{{ lightTipName }}<\/span><\/div><\/sc-if>\n        <div class=\"mix-circle\" style=\"position:absolute; left:50%; top:50%; width:170px; height:170px; border-radius:50%; transform:translate(-78%,-72%); mix-blend-mode:screen; background:{{ redCircle }}\"><\/div>\n        <div class=\"mix-circle\" style=\"position:absolute; left:50%; top:50%; width:170px; height:170px; border-radius:50%; transform:translate(-22%,-72%); mix-blend-mode:screen; background:{{ greenCircle }}\"><\/div>\n        <div class=\"mix-circle\" style=\"position:absolute; left:50%; top:50%; width:170px; height:170px; border-radius:50%; transform:translate(-50%,-28%); mix-blend-mode:screen; background:{{ blueCircle }}\"><\/div>\n        <div class=\"mix-readout\" style=\"position:absolute; left:12px; bottom:12px; background:rgba(10,14,18,0.75); border:1px solid #2a3442; border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:10px\">\n          <div style=\"width:26px; height:26px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background:{{ lightMix }}\"><\/div>\n          <div style=\"display:flex; flex-direction:column\">\n            <span style=\"font-size:14px; font-weight:600\">{{ lightName }}<\/span>\n            <sc-if value=\"{{ showValues }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11px; color:#8fa3b5; font-family:monospace\">{{ lightRgbText }}<\/span><\/sc-if>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; flex-direction:column; gap:12px\">\n        <div style=\"display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:12px\">\n          <span style=\"font-size:14px; font-weight:600; color:#ff6b6b\">빨강 R<\/span>\n          <input type=\"range\" min=\"0\" max=\"255\" value=\"{{ r }}\" sc-camel-on-input=\"{{ setR }}\" style=\"width:100%; background:linear-gradient(90deg,#1a0000,#ff0000)\">\n          <span style=\"font-size:13px; font-family:monospace; color:#a9b8c6; text-align:right\">{{ r }}<\/span>\n        <\/div>\n        <div style=\"display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:12px\">\n          <span style=\"font-size:14px; font-weight:600; color:#63d471\">초록 G<\/span>\n          <input type=\"range\" min=\"0\" max=\"255\" value=\"{{ g }}\" sc-camel-on-input=\"{{ setG }}\" style=\"width:100%; background:linear-gradient(90deg,#001a00,#00ff00)\">\n          <span style=\"font-size:13px; font-family:monospace; color:#a9b8c6; text-align:right\">{{ g }}<\/span>\n        <\/div>\n        <div style=\"display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:12px\">\n          <span style=\"font-size:14px; font-weight:600; color:#6b9bff\">파랑 B<\/span>\n          <input type=\"range\" min=\"0\" max=\"255\" value=\"{{ b }}\" sc-camel-on-input=\"{{ setB }}\" style=\"width:100%; background:linear-gradient(90deg,#00001a,#0000ff)\">\n          <span style=\"font-size:13px; font-family:monospace; color:#a9b8c6; text-align:right\">{{ b }}<\/span>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n        <sc-for list=\"{{ lightPresets }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ p.apply }}\" style=\"display:flex; align-items:center; gap:7px; background:#212a36; border:1px solid #33404f; color:#dbe4ec; border-radius:999px; padding:6px 12px 6px 7px; font-size:13px; font-family:inherit; cursor:pointer\" style-hover=\"background:#2a3544\">\n            <span style=\"width:16px; height:16px; border-radius:50%; border:1px solid rgba(255,255,255,0.25); background:{{ p.swatch }}\"><\/span>{{ p.label }}\n          <\/button>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n\n    <!-- 물감의 혼합 -->\n    <div style=\"background:#f4f1ea; border:1px solid #e0dacc; border-radius:16px; padding:24px; display:flex; flex-direction:column; gap:18px; color:#33302a\">\n      <div style=\"display:flex; justify-content:space-between; align-items:baseline\">\n        <h2 style=\"margin:0; font-size:20px; font-weight:700\">물감의 혼합 <span style=\"font-size:13px; font-weight:500; color:#8a8271\">— 감산 혼합 (C·M·Y)<\/span><\/h2>\n        <span style=\"font-size:12px; color:#9a9280\">흰 종이 위에 물감을 섞음<\/span>\n      <\/div>\n      <div class=\"mix-stage\" ref=\"{{ paintRef }}\" sc-camel-on-mouse-move=\"{{ paintMove }}\" sc-camel-on-mouse-leave=\"{{ paintLeave }}\" style=\"position:relative; background:#ffffff; border-radius:12px; height:300px; overflow:hidden; border:1px solid #e5dfd2; cursor:crosshair\">\n        <sc-if value=\"{{ paintTip }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:absolute; left:{{ paintTipX }}px; top:{{ paintTipY }}px; transform:translate(14px,-34px); pointer-events:none; z-index:5; background:rgba(255,255,255,0.96); border:1px solid #d8d0bf; border-radius:6px; padding:5px 9px; display:flex; align-items:center; gap:7px\"><span style=\"width:15px; height:15px; border-radius:4px; border:1px solid rgba(0,0,0,0.2); background:{{ paintTipColor }}\"><\/span><span style=\"font-size:12.5px; font-weight:600; color:#33302a; white-space:nowrap\">{{ paintTipName }}<\/span><\/div><\/sc-if>\n        <div class=\"mix-circle\" style=\"position:absolute; left:50%; top:50%; width:170px; height:170px; border-radius:50%; transform:translate(-78%,-72%); mix-blend-mode:multiply; background:{{ cyanCircle }}\"><\/div>\n        <div class=\"mix-circle\" style=\"position:absolute; left:50%; top:50%; width:170px; height:170px; border-radius:50%; transform:translate(-22%,-72%); mix-blend-mode:multiply; background:{{ magentaCircle }}\"><\/div>\n        <div class=\"mix-circle\" style=\"position:absolute; left:50%; top:50%; width:170px; height:170px; border-radius:50%; transform:translate(-50%,-28%); mix-blend-mode:multiply; background:{{ yellowCircle }}\"><\/div>\n        <div class=\"mix-readout\" style=\"position:absolute; left:12px; bottom:12px; background:rgba(255,255,255,0.85); border:1px solid #e0dacc; border-radius:8px; padding:8px 12px; display:flex; align-items:center; gap:10px\">\n          <div style=\"width:26px; height:26px; border-radius:6px; border:1px solid rgba(0,0,0,0.15); background:{{ paintMix }}\"><\/div>\n          <div style=\"display:flex; flex-direction:column\">\n            <span style=\"font-size:14px; font-weight:600\">{{ paintName }}<\/span>\n            <sc-if value=\"{{ showValues }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11px; color:#8a8271; font-family:monospace\">{{ paintRgbText }}<\/span><\/sc-if>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; flex-direction:column; gap:12px\">\n        <div style=\"display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:12px\">\n          <span style=\"font-size:14px; font-weight:600; color:#0097a7\">청록 C<\/span>\n          <input type=\"range\" min=\"0\" max=\"255\" value=\"{{ c }}\" sc-camel-on-input=\"{{ setC }}\" style=\"width:100%; background:linear-gradient(90deg,#ffffff,#009dc4); border:1px solid #ddd\">\n          <span style=\"font-size:13px; font-family:monospace; color:#8a8271; text-align:right\">{{ c }}<\/span>\n        <\/div>\n        <div style=\"display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:12px\">\n          <span style=\"font-size:14px; font-weight:600; color:#c2185b\">자홍 M<\/span>\n          <input type=\"range\" min=\"0\" max=\"255\" value=\"{{ m }}\" sc-camel-on-input=\"{{ setM }}\" style=\"width:100%; background:linear-gradient(90deg,#ffffff,#ce007c); border:1px solid #ddd\">\n          <span style=\"font-size:13px; font-family:monospace; color:#8a8271; text-align:right\">{{ m }}<\/span>\n        <\/div>\n        <div style=\"display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:12px\">\n          <span style=\"font-size:14px; font-weight:600; color:#b8a000\">노랑 Y<\/span>\n          <input type=\"range\" min=\"0\" max=\"255\" value=\"{{ y }}\" sc-camel-on-input=\"{{ setY }}\" style=\"width:100%; background:linear-gradient(90deg,#ffffff,#f7d800); border:1px solid #ddd\">\n          <span style=\"font-size:13px; font-family:monospace; color:#8a8271; text-align:right\">{{ y }}<\/span>\n        <\/div>\n      <\/div>\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n        <sc-for list=\"{{ paintPresets }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ p.apply }}\" style=\"display:flex; align-items:center; gap:7px; background:#fff; border:1px solid #d8d0bf; color:#4a453b; border-radius:999px; padding:6px 12px 6px 7px; font-size:13px; font-family:inherit; cursor:pointer\" style-hover=\"background:#efe9dd\">\n            <span style=\"width:16px; height:16px; border-radius:50%; border:1px solid rgba(0,0,0,0.15); background:{{ p.swatch }}\"><\/span>{{ p.label }}\n          <\/button>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div style=\"max-width:1180px; width:100%; background:#181e26; border:1px solid #2a3442; border-radius:16px; padding:20px 24px; display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px\">\n    <div style=\"display:flex; flex-direction:column; gap:6px\">\n      <span style=\"font-size:14px; font-weight:700; color:#7fc4ff\">💡 빛의 3원색 (R, G, B)<\/span>\n      <p style=\"margin:0; font-size:13.5px; color:#a9b8c6; line-height:1.6\">빛은 섞을수록 밝아져요. 빨강+초록=노랑, 초록+파랑=청록, 빨강+파랑=자홍, 세 가지를 모두 최대로 섞으면 <strong style=\"color:#fff\">백색광<\/strong>이 됩니다. TV·스마트폰 화면이 이 원리를 사용해요.<\/p>\n    <\/div>\n    <div style=\"display:flex; flex-direction:column; gap:6px\">\n      <span style=\"font-size:14px; font-weight:700; color:#ffd27f\">🎨 색의 3원색 — 물감 (C, M, Y)<\/span>\n      <p style=\"margin:0; font-size:13.5px; color:#a9b8c6; line-height:1.6\">물감은 빛을 흡수해서 색이 보여요. 섞을수록 흡수하는 빛이 많아져 어두워지고, 세 가지를 모두 섞으면 <strong style=\"color:#fff\">검정에 가까운 색<\/strong>이 됩니다. 완전한 검정이 안 나오기 때문에 컬러 프린터는 검정 잉크를 따로 씁니다.<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showValues&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;표시 옵션&quot;}}\">\nclass Component extends DCLogic {\n  state = { r: 255, g: 255, b: 255, c: 255, m: 255, y: 255, lightTip: null, paintTip: null };\n  static PIG = { c: [0,130,170], m: [180,0,100], y: [230,190,0] };\n  // 실제 물감은 보색 파장을 100% 흡수하지 못해, 셋을 다 섞어도 완전한 검정이 아니라\n  // 아주 어두운 무채색이 남는다. 이 값이 그 \"남는 반사광\"이다.\n  // (그래서 컬러 프린터는 검정 잉크 K를 따로 쓴다.) 0으로 되돌리면 순수 검정이 되어\n  // 화면 설명(\"검정에 가까운 색\")과 어긋나므로 되돌리지 말 것.\n  static RESIDUAL = [34, 31, 31];\n  nameOf(r, g, b, paint) {\n    const R = r / 255, G = g / 255, B = b / 255;\n    const mx = Math.max(R, G, B), mn = Math.min(R, G, B), d = mx - mn;\n    const l = (mx + mn) / 2;\n    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));\n    let h = 0;\n    if (d > 0) {\n      if (mx === R) h = 60 * (((G - B) / d) % 6);\n      else if (mx === G) h = 60 * ((B - R) / d + 2);\n      else h = 60 * ((R - G) / d + 4);\n      if (h < 0) h += 360;\n    }\n    if (s < 0.09) {\n      if (l > 0.93) return paint ? '흰색 (안 섞음)' : '백색광 (하양)';\n      if (l < 0.05) return paint ? '검정' : '검정 (빛 없음)';\n      if (paint && l < 0.18) return '검정에 가까운 색';\n      if (l > 0.7) return '밝은 회색';\n      if (l < 0.25) return '어두운 회색';\n      return '회색';\n    }\n    let base;\n    if (h < 13) base = '빨강'; else if (h < 40) base = '주황'; else if (h < 62) base = '노랑';\n    else if (h < 85) base = '연두'; else if (h < 140) base = '초록'; else if (h < 196) base = '청록';\n    else if (h < 252) base = '파랑'; else if (h < 290) base = '보라'; else if (h < 330) base = '자홍';\n    else if (h < 348) base = '자주'; else base = '빨강';\n    if (base === '주황' && l < 0.38) base = '갈색';\n    if (base === '노랑' && l < 0.35) base = '올리브색';\n    if (base === '파랑' && l < 0.28) base = '남색';\n    if ((base === '빨강' || base === '자주' || base === '자홍') && l > 0.72) base = '분홍';\n    const special = base === '갈색' || base === '남색' || base === '올리브색';\n    let mod = '';\n    if (special) { if (l < 0.15) mod = '어두운 '; }\n    else if (l > 0.85) mod = '연한 ';\n    else if (l > 0.62) mod = s > 0.6 ? '밝은 ' : '흐린 ';\n    else if (l > 0.32) mod = s > 0.75 ? '선명한 ' : '탁한 ';\n    else if (l > 0.15) mod = s > 0.75 ? '진한 ' : '어두운 ';\n    else mod = '어두운 ';\n    return mod + base;\n  }\n  circleRGB(val, pig) {\n    const t = Math.pow(val / 255, 0.3);\n    return pig.map(p => Math.round(255 - t * (255 - p)));\n  }\n  paintMixRGB(c, m, y) {\n    const cc = this.circleRGB(c, Component.PIG.c), mc = this.circleRGB(m, Component.PIG.m), yc = this.circleRGB(y, Component.PIG.y);\n    // 이상적인 감산 혼합값(0~255)을 RESIDUAL~255 구간으로 옮겨 담는다.\n    // 흰 종이(255)는 그대로 흰색, 다 섞으면 RESIDUAL(검정에 가까운 색)이 된다.\n    return [0, 1, 2].map(i => {\n      const ideal = cc[i] * mc[i] * yc[i] / 65025, res = Component.RESIDUAL[i];\n      return Math.round(res + ideal * (255 - res) / 255);\n    });\n  }\n  stageHits(e, el) {\n    const rect = el.getBoundingClientRect();\n    const x = e.clientX - rect.left, y = e.clientY - rect.top;\n    const cx = rect.width / 2;\n    const centers = [[cx - 47.6, 112.6], [cx + 47.6, 112.6], [cx, 187.4]];\n    return { x, y, inside: centers.map(p => (x - p[0]) * (x - p[0]) + (y - p[1]) * (y - p[1]) <= 7225) };\n  }\n  lightRef = el => { this.lightEl = el; };\n  paintRef = el => { this.paintEl = el; };\n  lightLeave = () => this.setState({ lightTip: null });\n  paintLeave = () => this.setState({ paintTip: null });\n  lightMove = e => {\n    if (!this.lightEl) return;\n    const { x, y, inside } = this.stageHits(e, this.lightEl);\n    const { r, g, b } = this.state;\n    const cr = inside[0] ? r : 0, cg = inside[1] ? g : 0, cb = inside[2] ? b : 0;\n    const on = inside.some(v => v);\n    this.setState({ lightTip: { x, y, color: `rgb(${cr},${cg},${cb})`, name: on ? this.nameOf(cr, cg, cb) : '스크린 (빛 없음)' } });\n  };\n  paintMove = e => {\n    if (!this.paintEl) return;\n    const { x, y, inside } = this.stageHits(e, this.paintEl);\n    const { c, m, y: yy } = this.state;\n    const cols = e }),\n      setY: e => this.setState({ y: +e.target.value }),\n      redCircle: `rgb(${r},0,0)`,\n      greenCircle: `rgb(0,${g},0)`,\n      blueCircle: `rgb(0,0,${b})`,\n      lightMix: `rgb(${r},${g},${b})`,\n      lightName: this.nameOf(r, g, b),\n      lightRgbText: `R ${r} · G ${g} · B ${b}`,\n      cyanCircle: `rgb(${cc[0]},${cc[1]},${cc[2]})`,\n      magentaCircle: `rgb(${mc[0]},${mc[1]},${mc[2]})`,\n      yellowCircle: `rgb(${yc[0]},${yc[1]},${yc[2]})`,\n      paintMix: `rgb(${pr},${pg},${pb})`,\n      paintName: this.nameOf(pr, pg, pb, true),\n      paintRgbText: `C ${c} · M ${m} · Y ${y}`,\n      lightMove: this.lightMove, lightLeave: this.lightLeave, lightRef: this.lightRef,\n      paintMove: this.paintMove, paintLeave: this.paintLeave, paintRef: this.paintRef,\n      lightTip: this.state.lightTip,\n      lightTipX: this.state.lightTip ? this.state.lightTip.x : 0,\n      lightTipY: this.state.lightTip ? this.state.lightTip.y : 0,\n      lightTipColor: this.state.lightTip ? this.state.lightTip.color : '#000',\n      lightTipName: this.state.lightTip ? this.state.lightTip.name : '',\n      paintTip: this.state.paintTip,\n      paintTipX: this.state.paintTip ? this.state.paintTip.x : 0,\n      paintTipY: this.state.paintTip ? this.state.paintTip.y : 0,\n      paintTipColor: this.state.paintTip ? this.state.paintTip.color : '#fff',\n      paintTipName: this.state.paintTip ? this.state.paintTip.name : ''\n    };\n  }\n}\n<\/script>\n\n<\/body><\/html>"
