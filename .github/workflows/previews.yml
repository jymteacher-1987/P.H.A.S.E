name: Update activity previews

on:
  push:
    branches: [main]
    paths:
      - 'experiments/**'
      - 'plays/**'
      - 'data/experiments.json'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/previews.yml'
  workflow_dispatch:
    inputs:
      force:
        description: '모든 대표 장면을 다시 촬영'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: activity-previews
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Install Korean fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Capture changed scenes
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then npm run previews -- --force; else npm run previews; fi
          npm run previews:check
          npm test
      - name: Save Safari test failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-small-screen-failures
          path: .preview-tmp/safari/
          if-no-files-found: ignore
      - name: Save images and cache versions
        id: save
        run: |
          git add assets/previews index.html lab.html view.html admin-k7f3x9q2.html
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer source commit is queued; leave its previews to the next run.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update representative activity screenshots'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not start the usual branch-based Pages build.
      - name: Publish saved previews on GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
