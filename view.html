<!-- index.html / lab.html과 완전히 같은 상단바 구조를 쓴다.
     페이지를 오갈 때 바 높이와 "가상 물리 실험실" 글자 위치가 바뀌지 않게
     하려는 것이므로, 여기만 다른 바로 바꾸지 말 것. -->
<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="dot"></span> 가상 물리 실험실</a>
    <!-- 버튼과 영역 태그를 한 묶음으로 오른쪽에 붙인다. 버튼이 바 가운데
         혼자 떠 있으면 덩그러니 보인다는 조T 의견. 영역명 길이가 제각각이어도
         버튼이 좌우로 움직이지 않도록, 태그 너비를 고정해 둔다(style.css 참고). -->
    <div class="nav-right">
      <a class="nav-btn" data-viewer-return href="lab.html">실험실로</a>
      <span class="cat-tag" id="expCat"></span>
    </div>
  </div>
</nav>
<div class="viewer-frame-wrap">
  <div class="viewer-tools">
    <a class="viewer-app-back" data-viewer-return href="lab.html" aria-label="실험 목록으로 돌아가기" title="실험 목록으로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"/></svg>
    </a>
    <button class="viewer-note-toggle" id="viewerNoteToggle" type="button" aria-controls="viewerNotePanel" aria-expanded="false" hidden>실험 길잡이</button>
  </div>
  <aside class="viewer-note-panel" id="viewerNotePanel" aria-labelledby="viewerNoteTitle" hidden>
    <div class="viewer-note-heading">
      <h2 id="viewerNoteTitle" tabindex="-1">실험 길잡이</h2>
      <button id="viewerNoteClose" type="button" aria-label="길잡이 닫기">×</button>
    </div>
    <dl>
      <div><dt>생각해 볼 질문</dt><dd id="viewerNoteQuestion"></dd></div>
      <div><dt>관찰 포인트</dt><dd id="viewerNoteFocus"></dd></div>
    </dl>
  </aside>
  <!-- allow="camera": 과학 놀이(히어로 만들기)는 iframe 안에서 카메라를 연다.
       같은 출처라 기본값으로도 열리지만, 정책이 바뀌어도 막히지 않게 명시해 둔다. -->
  <iframe id="expFrame" class="viewer-frame" title="실험 화면" allow="camera; fullscreen" allowfullscreen></iframe>
  <section id="viewerFeedback" class="viewer-feedback" aria-labelledby="viewerFeedbackTitle" hidden>
    <div class="viewer-feedback-card">
      <h1 id="viewerFeedbackTitle" tabindex="-1">실험을 찾을 수 없어요</h1>
      <p id="viewerFeedbackText">주소가 달라졌거나 더 이상 제공하지 않는 활동일 수 있어요. 실험실에서 다시 찾아보세요.</p>
      <a class="nav-btn" data-viewer-return href="lab.html">실험실로 돌아가기</a>
    </div>
  </section>
</div>
